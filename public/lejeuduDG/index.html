<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Le Jeu du DG : cinq écoles en ligne à diriger de 2026 à 2030.">
<title>Le Jeu du DG</title>
<style>
/* Layout: série politique — en-tête + bandeau d'épisodes, jauges collantes, carte d'épisode à cadre doré, panneau budget. Thème unique sombre, choisi délibérément. */
:root{
  --bg:#0b1020; --card:#111831; --card2:#0f1730; --line:#232d4a; --line2:#1e2740;
  --fg:#eef2fb; --cream:#f4f1e8; --muted:#9aa4c8; --muted2:#6b7498;
  --gold:#c9a24a; --gold-dark:#a5843a; --gold-ink:#1a1408; --gold-hi:#e8c15a;
  --red:#c22020; --rose:#ff6b7a; --green:#7ee0a0; --green-deep:#2f8f46; --green-bg:#13291d; --green-line:#2f8f46;
  --orange:#f0a24b; --cyan:#3ec8d6; --blue:#7fa3e6; --violet:#b48be6;
  --serif:Georgia,"Times New Roman",serif;
  --sans:Marianne,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg) radial-gradient(ellipse 60% 40% at 50% 30%,#141c3a 0%,transparent 70%);background-attachment:fixed;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:var(--serif);font-weight:900;letter-spacing:-.02em;color:var(--cream)}
.kicker{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mbtn{background:var(--gold);color:var(--gold-ink);border:1px solid var(--gold-dark);border-radius:8px;font-weight:800;padding:11px 22px;box-shadow:0 2px 0 var(--gold-dark)}
.mbtn:hover{background:var(--gold-hi)}
.mbtn:disabled{background:#1b2440;color:#55608a;border-color:#1b2440;box-shadow:none;cursor:not-allowed}
.sbtn{background:#141c36;color:var(--fg);border:1px solid var(--line);border-radius:8px;font-weight:700;padding:11px 18px}
.sbtn:hover{border-color:var(--gold)}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.rbtn{background:var(--red);color:#fff;border:0;border-radius:8px;font-weight:800;padding:11px 22px}
.hidden{display:none!important}

.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:24px}
.panel{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:28px;max-width:680px;width:100%;display:grid;gap:14px}
.panel.wide{max-width:800px}
.panel .title{font-size:28px;text-align:center}
.flag{display:flex;justify-content:center;margin-bottom:4px} .flag img{width:72px;height:72px}
.tlogo img{width:96px;height:96px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.tile b{display:block;color:var(--fg);margin-bottom:3px;font-size:13.5px}
.tile.rose{border-left-color:var(--rose)} .tile.violet{border-left-color:var(--violet)} .tile.green{border-left-color:var(--green)} .tile.cyan{border-left-color:var(--cyan)}
.avatar{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a3f6a,#1a1f3d);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:40px;flex:none;box-shadow:0 0 0 3px #0b1020}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar.sm{width:56px;height:56px;font-size:26px;border-width:2px}
.speech{display:flex;gap:16px;align-items:flex-start}
.speech p{margin-bottom:8px;font-size:14.5px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;color:var(--fg)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--green);background:#0f2a1a}
.opt:disabled{opacity:.5;cursor:default}
.opt:disabled.sel{opacity:1}
.badge{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--gold);color:var(--gold-ink);vertical-align:middle;margin-left:6px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#1b2440;color:var(--muted);margin:2px 2px 0 0}
.chip.pos{background:#13291d;color:var(--green)} .chip.neg{background:#2e1420;color:var(--rose)} .chip.cap{background:#2a2410;color:var(--gold-hi)}
label.lab{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg);font:inherit;font-size:15px}
input[type=text]:focus{outline:none;border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prof{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;display:grid;gap:6px;justify-items:center;color:var(--muted);font-size:12.5px}
.prof b{color:var(--fg);font-size:13.5px}
.prof .ic{font-size:30px}
.prof.sel{border-color:var(--gold);background:#1a1a2e}
.credit{text-align:center;font-size:10px;color:var(--muted2)}

.titlecard{position:fixed;inset:0;background:var(--bg) radial-gradient(ellipse 40% 30% at 50% 45%,#182448,transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;animation:fadein .6s}
.titlecard .big{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6vw,56px);color:#e01b22;text-shadow:0 0 30px rgba(224,27,34,.5);letter-spacing:.02em;text-align:center;padding-inline:16px}
.titlecard .rule{width:280px;max-width:60vw;height:2px;background:#e01b22}
.titlecard .sub{font-size:14px;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;font-weight:700}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.resbox.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.96);box-shadow:0 0 0 0 rgba(126,224,160,.6)}100%{transform:none;box-shadow:0 0 0 18px rgba(126,224,160,0)}}
@media (prefers-reduced-motion:reduce){.confetti,.resbox.pop{animation:none;display:none}}

.game{max-width:1480px;margin:0 auto;display:grid;gap:14px;padding-top:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;flex:none} .brand .logo img{width:100%;height:100%;display:block}
.brand .t{font-size:13px;font-weight:900;letter-spacing:.14em;color:var(--gold)}
.brand .s{font-size:11px;color:var(--muted)}
.pill{background:#16203c;border:1px solid var(--cyan);color:var(--cyan);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:10px}
.pill.warn{border-color:var(--orange);color:var(--orange)} .pill.bad{border-color:var(--rose);color:var(--rose)}
.icons{display:flex;gap:6px}
.icons button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:#141c36;font-size:15px}
.episodes{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;display:grid;gap:1px;opacity:.55;position:relative}
.ep .m{font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .n{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .ic{font-size:14px}
.ep .st{position:absolute;right:6px;top:5px;font-size:10px;color:var(--muted2)}
.ep.done{opacity:.8} .ep.done .st{color:var(--green)}
.ep.on{opacity:1;border-color:var(--gold);background:linear-gradient(160deg,#3a2d12,#241a08)} .ep.on .m,.ep.on .n{color:var(--gold)} .ep.on .st{color:var(--gold)}
.gauges{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;background:var(--bg);padding-block:6px}
.gauge{background:var(--card);border:.8px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;transition:box-shadow .3s}
.gauge .l{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge .l .gi{font-size:14px;vertical-align:-1px;margin-right:2px}
.gauge .v{font-size:19px;font-weight:900;color:var(--cream);white-space:nowrap;margin:2px 0 4px}
.gauge .v small{font-size:11px;font-weight:700;color:var(--muted)}
.gauge .bar{height:5px;border-radius:3px;background:#1b2440;overflow:hidden}
.gauge .bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
.gauge .v .pv{font-size:12px;font-weight:800;margin-left:6px}
.gauge .v .pv.up{color:var(--green)} .gauge .v .pv.dn{color:var(--rose)}
.gauge .bar{position:relative} .gauge .bar em{position:absolute;top:0;height:100%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px)}
.gauge.has-pv{border-color:var(--gold)}
.gauge.flash{box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(201,162,74,.5)}
.gauge.c-ca{border-color:var(--gold-dark)}
.c-rev i{background:var(--cyan)} .c-res i{background:var(--rose)} .c-cash i{background:var(--orange)} .c-rate i{background:var(--cyan)} .c-ca i{background:var(--gold)} .c-etu i{background:#4ade80} .c-com i{background:var(--blue)} .c-cse i{background:var(--violet)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:24px;z-index:40;display:grid;gap:6px;pointer-events:none;width:260px}
.toast{background:var(--card);border:1.5px solid var(--green);border-radius:10px;padding:6px 14px;text-align:left;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toast 3.2s forwards;min-width:200px}
.toast.neg{border-color:var(--rose)}
.toast b{display:block;font-size:16px;color:var(--green)} .toast.neg b{color:var(--rose)}
.toast small{font-size:11px;color:var(--muted)}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.scene{background:var(--card2);border:1.5px solid var(--gold);border-radius:14px;padding:18px 18px 16px;display:grid;gap:12px;position:relative;overflow:hidden}
.scene .k{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.scene h2{font-size:24px}
.scene .tag{font-style:italic;color:var(--muted);font-family:var(--serif);font-weight:400;font-size:13.5px}
.ticker{margin-inline:-18px;background:var(--red);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;overflow:hidden;height:30px}
.ticker .d{background:#fff;color:var(--red);font-size:10px;font-weight:900;padding:2px 8px;border-radius:4px;margin:0 10px 0 16px;flex:none;letter-spacing:.06em}
.ticker .tk{white-space:nowrap;flex:1;overflow:hidden}
.ticker .tk span{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker .tk span{animation:none;padding-left:0}}
.dlg{display:flex;gap:14px;align-items:flex-start}
.dlg .who>b{display:block;font-size:15px} .dlg .who>small{color:var(--muted);font-size:12px;display:block;margin-bottom:6px}
.dlg .who p{font-size:14.5px;max-width:110ch}
.prompt{color:var(--gold);font-weight:700;font-size:13.5px}
.note{background:#101a33;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--fg)}
.note .h{color:var(--blue);font-weight:700;margin-bottom:4px}
.note ul{margin:6px 0 0 16px;padding:0;color:var(--muted)} .note li{margin:2px 0}
.resbox{background:#0f2a1a;border:1px solid var(--green-line);border-radius:10px;padding:12px 14px}
.resbox.bad{background:#2a0f14;border-color:#b33a3a} .resbox.neu{background:#1a1a2e;border-color:var(--line)}
.resbox b{display:block;font-size:15px;margin-bottom:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}

.hint{font-size:12px;color:var(--muted)}
.cat .tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center} .cat .tabs .tab{padding:6px 12px;border-radius:999px;font-size:12.5px;background:var(--card2);border:1px solid var(--line);color:var(--fg)} .cat .tabs .tab.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.cath{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.cath i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mrows{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--card);border:.8px solid #2a3458;border-radius:8px;padding:7px 12px;font-size:13px;position:relative;cursor:pointer}
.mrow:hover{border-color:var(--gold)}
.mrow.sel{border-color:var(--green);background:#0f2a1a}
.mrow.off{opacity:.45;cursor:not-allowed}
.mrow.fou{border-color:#6b2a3a;background:linear-gradient(90deg,#1c1020,var(--card))}
.mrow.fou .cap{color:var(--rose)}
.mrow input{width:14px;height:14px;margin:0;accent-color:var(--green)}
.mrow .amt{font-weight:800;font-size:12.5px;white-space:nowrap}
.mrow .amt.pos{color:var(--green-deep)} .mrow .amt.neg{color:var(--rose)} .mrow .amt.zero{color:var(--muted2)}
.mrow .cap{font-size:11px;font-weight:800;color:var(--gold-hi);white-space:nowrap;min-width:52px;text-align:right}
.mrow .cap.gain{color:var(--green)}
.mrow .tip{display:none;position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);background:#1b2440;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;white-space:normal;width:max-content;max-width:min(360px,80vw);z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.5);color:var(--fg)}
.mrow:hover .tip,.mrow:focus-within .tip{display:block}
.mrow .tip .d{color:var(--muted);display:block;margin-bottom:3px}
.mrow .mfx{display:none;grid-column:1/-1;font-size:11.5px;padding-top:4px;border-top:1px dashed var(--line)} .mrow .mfx .d{display:block;color:var(--muted);margin:2px 0}
@media (hover:none),(max-width:720px){.mrow .tip{display:none!important} .mrow .mfx{display:block}}
.capbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#2a2410;border:1px solid var(--gold-dark);border-radius:10px;padding:8px 14px;font-size:13px}
.capbar b{color:var(--gold-hi);font-size:16px}
.capbar.over{background:#2a0f14;border-color:#b33a3a} .capbar.over b{color:var(--rose)}
.budget{background:var(--card2);border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.budget .bh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px}
.btiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btile{border-radius:10px;padding:12px;text-align:center}
.btile .l{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.btile .v{font-size:22px;font-weight:900;margin:2px 0}
.btile .s{font-size:10px;color:var(--muted)}
.btile.g{background:var(--green-bg)} .btile.g .l,.btile.g .v{color:var(--green)}
.btile.o{background:#2a2410} .btile.o .l,.btile.o .v{color:var(--gold-hi)}
.btile.b{background:var(--card);border:1px solid var(--blue)} .btile.b .l,.btile.b .v{color:var(--blue)}
.btile.c{background:var(--card);border:1px solid var(--gold-dark)} .btile.c .l,.btile.c .v{color:var(--gold)}
.blines{background:var(--card);border-radius:10px;padding:8px 12px;font-size:12.5px;display:grid;gap:3px}
.blines div{display:flex;justify-content:space-between;gap:10px}
.blines .tot{font-weight:700;border-top:1px solid var(--line);padding-top:5px;margin-top:3px}
.proj{font-size:13px;color:var(--muted)} .proj b{font-size:20px;color:var(--cream);margin-left:6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:100px;border-bottom:1px solid var(--line);padding-top:18px}
.hist div{background:var(--blue);min-height:2px;position:relative;font-size:10px;text-align:center;border-radius:3px 3px 0 0}
.hist div.neg{background:var(--rose)} .hist div.pos{background:#4ade80}
.hist div span{position:absolute;left:0;right:0;top:-17px;font-weight:700;color:var(--fg)}
.hist div em{position:absolute;left:0;right:0;bottom:-18px;font-style:normal;color:var(--muted)}

/* plan médias */
.media{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mch{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.mch .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mch .h b{font-size:14px} .mch .h span{font-size:11px;color:var(--muted)}
.mch .d{font-size:12px;color:var(--muted)}
.mch .stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:baseline}
.mch .stats b{color:var(--fg)}
.mch .amt{font-size:18px;font-weight:900;color:var(--gold-hi)}
.mch.warn{border-color:var(--rose)}
.mtot{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.overlay{position:fixed;inset:0;background:rgba(5,8,18,.75);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:#151a2e;border:1.5px solid var(--green);border-radius:14px;padding:26px 28px;max-width:460px;width:100%;text-align:center;display:grid;gap:8px;justify-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.bad{border-color:var(--rose)} .modal.gold{border-color:var(--gold);text-align:left;justify-items:stretch}
.modal .ic{font-size:36px}
.modal .ml{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modal .mt{font-size:15px;color:var(--fg);max-width:40ch}
.modal .eff{font-weight:800;color:var(--green);font-size:14px} .modal.bad .eff{color:var(--rose)}
.modal .ms{font-size:11px;color:var(--muted)}
.modal h3{font-family:var(--serif);font-size:22px;color:var(--cream)}
.modal .mf{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:6px}
.modal .lnk{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 0}

@media (max-width:1100px){.gauges{grid-template-columns:repeat(4,minmax(0,1fr))}.episodes{grid-template-columns:repeat(6,minmax(0,1fr))}.btiles{grid-template-columns:1fr 1fr}}
@media (max-width:720px){
 .gauges{display:flex;overflow-x:auto;gap:6px;padding-block:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .gauges::-webkit-scrollbar{display:none}

// ---------- État ----------
let S;
function newGame(sc){
  applyScenario(sc!==undefined?sc:(S&&S.sc!==undefined?S.sc:0));
  S={screen:'intro',sc:SCENARIOS.indexOf(SC),pid:(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})),name:'',profile:null,year:2026,yi:0,phase:0,g:{ca:55,etu:55,com:50,cse:50},students:BASE.students,price:BASE.price,
     media:Object.fromEntries(Object.entries(MEDIA).map(([k,v])=>[k,v.base])),mediaMod:{},
     rev:0,cost:0,churn:0,stuMult:1,staff:BASE.staff,debt:BASE.debt,cash:BASE.cash,rate:BASE.rate,active:[],pending:[],flags:{},
     used:{env:[],aud:[],amd:[],evt:[]},history:[],lastResult:{pct:SC.start,rev:SC.ca0,res:Math.round(SC.ca0*SC.start/100)},lastNew:4200,yearFx:{stuY:1,revY:0,once:0},target:SC.target,mode:null,sub:0,tmp:null,over:null,tuto:0,decided:false,log:[]};
  S.g={ca:55,etu:55,com:50,cse:50}; S.lastNew=inscriptions().total;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n));
const kE=n=>(n>=0?'+':'−')+fmt(Math.abs(n))+' k€';
const mE=n=>(n>=0?'+':'−')+(Math.abs(n)/1000).toFixed(1).replace('.',',')+' M€';
const pct=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(1).replace('.',',')+' %';
const GN={ca:'Capital',etu:'Étudiants',com:'Commerciaux',cse:'CSE'};
const GI={ca:'⚡',etu:'💚',com:'💙',cse:'💜'};
const mkTotal=()=>Object.values(S.media).reduce((a,b)=>a+b,0);
function pick(pool,key){
  const avail=pool.map((x,i)=>i).filter(i=>!S.used[key].includes(i));
  const src=avail.length?avail:pool.map((x,i)=>i);
  const i=src[Math.floor(Math.random()*src.length)];
  S.used[key].push(i); return i;
}
function pickEvent(kind){
  const ws=EVENTS.map((e,i)=>(S.used.evt.includes(i)||(kind==='pos'&&!e.pos)||(kind==='neg'&&e.pos)||(e.fx&&e.fx.media&&Object.keys(e.fx.media).some(k=>!MEDIA[k])))?0:e.w(S));
  let tot=ws.reduce((a,b)=>a+b,0); if(tot<=0){S.used.evt=[];return pickEvent(kind);}
  let r=Math.random()*tot;
  for(let i=0;i<EVENTS.length;i++){r-=ws[i]; if(r<=0){S.used.evt.push(i);return i;}}
  return 0;
}
function apply(fx,label){
  if(!fx) return;
  if(fx.g) for(const k in fx.g){S.g[k]=clamp(S.g[k]+fx.g[k],0,100); toast(fx.g[k],GN[k],label);}
  if(fx.cap){S.g.ca=clamp(S.g.ca+fx.cap,0,100); toast(fx.cap,'Capital',label);}
  if(fx.rev) S.rev+=fx.rev; if(fx.cost) S.cost+=fx.cost;
  if(fx.mk){const t=mkTotal(); const f=Math.max(0.2,(t+fx.mk)/t); for(const k in S.media) S.media[k]=Math.round(S.media[k]*f);}
  if(fx.price){ if(!(S.mode==='univ'&&fx.price>0)) S.price=Math.round(S.price*(1+fx.price/100)); }
  if(fx.stu) S.stuMult=clamp(S.stuMult*fx.stu,0.4,1.6); if(fx.churn) S.churn+=fx.churn; if(fx.hc) S.staff+=fx.hc;
  if(fx.once){S.cash+=fx.once; S.yearFx.once+=fx.once;} if(fx.debt!==undefined){ if(fx.debt===0) S.debt=0; else S.debt+=fx.debt; }
  if(fx.rate) S.rate=clamp(S.rate+fx.rate,0.01,0.15);
  if(fx.stuY) S.yearFx.stuY*=fx.stuY; if(fx.revY) S.yearFx.revY+=fx.revY;
  if(fx.media) for(const k in fx.media) if(MEDIA[k]) S.mediaMod[k]=(S.mediaMod[k]||1)*fx.media[k];
  if(fx.flag) S.flags[fx.flag]=true; if(fx.mode) S.mode=fx.mode;
  renderGauges();
}
function toast(v,name,label){
  if(!v) return;
  const k=Object.keys(GN).find(x=>GN[x]===name); const ic=k?GI[k]:'';
  const t=document.createElement('div'); t.className='toast'+(v<0?' neg':'');
  t.innerHTML=`<b>${v>0?'+':'−'}${Math.abs(v)} ${ic} ${name}</b><small>${label||''}</small>`;
  const box=document.getElementById('toasts'); while(box.children.length>=4) box.firstChild.remove(); box.appendChild(t); setTimeout(()=>t.remove(),3300);
}
function chips(fx){
  if(!fx) return '';
  const out=[];
  if(fx.cap) out.push([(fx.cap>0?'+':'−')+Math.abs(fx.cap)+' ⚡ capital',fx.cap>0,'cap']);
  if(fx.rev) out.push(['Recettes '+kE(fx.rev)+'/an',fx.rev>0]);
  if(fx.cost) out.push(['Coûts '+kE(fx.cost)+'/an',fx.cost<0]);
  if(fx.mk) out.push(['Médias '+kE(fx.mk)+'/an',fx.mk<0]);
  if(fx.price) out.push(['Prix '+pct(fx.price),fx.price>0]);
  if(fx.stu) out.push(['Inscriptions '+pct((fx.stu-1)*100),fx.stu>1]);
  if(fx.stuY) out.push(['Inscriptions cette année '+pct((fx.stuY-1)*100),fx.stuY>1]);
  if(fx.churn) out.push(['Abandons '+(fx.churn>0?'+':'')+fx.churn+' pts',fx.churn<0]);
  if(fx.once) out.push(['Trésorerie '+kE(fx.once),fx.once>0]);
  if(fx.revY) out.push(['CA cette année '+kE(fx.revY),fx.revY>0]);
  if(fx.hc) out.push(['Effectifs '+(fx.hc>0?'+':'')+fx.hc,fx.hc>0]);
  if(fx.rate) out.push(['Taux '+(fx.rate>0?'+':'')+(fx.rate*100).toFixed(1)+' pt',fx.rate<0]);
  if(fx.media) for(const k in fx.media) if(MEDIA[k]) out.push([MEDIA[k].n+' : coût par '+SC.lead1+' '+pct((fx.media[k]-1)*100),fx.media[k]<1]);
  if(fx.g) for(const k in fx.g) out.push([(fx.g[k]>0?'+':'−')+Math.abs(fx.g[k])+' '+GI[k]+' '+GN[k],fx.g[k]>0]);
  return out.map(([t,p,c])=>`<span class="chip ${c||(p?'pos':'neg')}">${t}</span>`).join('');
}
function lecture(m){
  const parts=[]; const tu=S.students*S.price/1000;
  if(m.rev) parts.push(`rapporte ${kE(m.rev)}/an de recettes nouvelles`);
  if(m.price) parts.push(m.price>0?`${pct(m.price)} sur les frais : ${kE(tu*m.price/100)}/an sur les étudiants en place, mais des abandons en plus et des ventes plus dures`:`${pct(m.price)} sur les frais : ${kE(tu*m.price/100)}/an de manque à gagner, compensé seulement si les inscriptions suivent`);
  if(m.cost) parts.push(m.cost<0?`économise ${kE(-m.cost)}/an de charges`:`coûte ${kE(m.cost)}/an de charges`);
  if(m.mk) parts.push(m.mk>0?`ajoute ${kE(m.mk)}/an de médias, donc des leads en plus`:`retire ${kE(-m.mk)}/an de médias, donc des leads en moins`);
  if(m.stu) parts.push(`${m.stu>1?'+':''}${Math.round((m.stu-1)*100)} % d'inscriptions chaque année`);
  if(m.churn) parts.push(m.churn<0?`${-m.churn} points d'abandons en moins : chaque étudiant retenu, c'est ${fmt(S.price)} € de plus`:`${m.churn} points d'abandons en plus`);
  if(m.once) parts.push(m.once>0?`apporte ${kE(m.once)} de trésorerie immédiate`:`coûte ${kE(-m.once)} de trésorerie immédiate`);
  if(m.hc) parts.push(m.hc<0?`${-m.hc} postes supprimés`:`${m.hc} recrutements`);
  if(m.debt) parts.push(`${kE(m.debt)} de dette en plus`);
  const who=[]; if(m.g){ if(m.g.etu<0) who.push('les étudiants'); if(m.g.com<0) who.push('les commerciaux'); if(m.g.cse<0) who.push('le CSE'); }
  const cap=m.cap>0?`Rapporte ${m.cap} points de capital.`:`Coûte ${-m.cap} points de capital${who.length?' et mécontente '+who.join(', '):''}.`;
  return 'Lecture : '+(parts.length?parts.join(' ; '):'pas d\'effet financier direct')+'. '+cap;
}
function yearly(m){ const tu=S.students*S.price/1000; return (m.rev||0)-(m.cost||0)-(m.mk||0)+(m.price?tu*m.price/100:0)-(m.churn?tu*m.churn/100*(1+(m.price||0)/100):0)+(m.stu?(m.stu-1)*4200*S.price/1000:0); }

// ---------- Médias et inscriptions ----------
function channelCalc(k,budget){
  const c=MEDIA[k]; const cpl=c.cpl*(S.mediaMod[k]||1);
  const baseLeads=c.base*1000/c.cpl;
  const raw=budget*1000/cpl;
  const leads=raw>0?Math.round(baseLeads*Math.pow(raw/baseLeads,0.62)):0;
  const comF=0.6+0.8*(S.g.com/100);
  const ins=Math.round(leads*c.conv*(c.per||1)*comF*S.stuMult);
  return {leads,ins,cpl,cpi:ins?Math.round(budget*1000/ins):0};
}
function inscriptions(){
  const out={}; let tot=0,leads=0,churnExtra=0;
  for(const k in MEDIA){const r=channelCalc(k,S.media[k]); out[k]=r; tot+=r.ins; leads+=r.leads; churnExtra+=r.ins*MEDIA[k].churn;}
  const repF=0.7+0.6*(S.g.etu/100);
  const organic=Math.round(BASE.organic*repF*S.stuMult);
  // Saturation du marché : au-delà de 12 000 étudiants, chaque inscription coûte plus cher (marché fini)
  const over=Math.max(0,S.students-BASE.students)/SC.sat; const sat=clamp(1-Math.pow(over,1.5)+(S.students<BASE.students?(BASE.students-S.students)/BASE.students*0.3:0),0.15,1.2);
  return {channels:out,organic,total:Math.round((tot+organic)*S.yearFx.stuY*sat),leads,churnExtra:tot?churnExtra/tot:0,sat};
}

// ---------- Simulation annuelle ----------
function simulate(){
  const g=S.g;
  const ins=inscriptions(); const newS=ins.total;
  const churn=clamp(SC.churn+(50-g.etu)/100*0.3+S.churn/100+ins.churnExtra/100,0.08,0.75);
  const left=Math.round(S.students*churn);
  const students=Math.max(0,S.students-left+newS);
  const tuition=students*S.price/1000;
  const revCap=4000*SC.scale; const revEff=S.rev>revCap?revCap+(S.rev-revCap)*0.5:S.rev; // rendements décroissants des recettes annexes
  const revenue=tuition+revEff+S.yearFx.revY;
  const payroll=BASE.payrollOther+BASE.payrollCom;
  const overdraft=Math.max(0,-S.cash);
  const interest=(S.debt+overdraft)*S.rate;
  const scaleCost=Math.max(0,students-BASE.students)*S.price*(SC.varc||0.55)/1000; // encadrement, support et plateforme pour les étudiants supplémentaires
  const costs=payroll+mkTotal()+BASE.platform+BASE.other+S.cost+interest+scaleCost;
  // Effet Norgeat : une fois sur deux, une provision mystérieuse reprise au dernier moment (comptable, sans impact sur la trésorerie)
  const norg=Math.random()<0.5?Math.round(revenue*(Math.random()<0.6?0.001+Math.random()*0.005:0.03+Math.random()*0.05)):0;
  const res=revenue-costs+norg; const pc=revenue>0?res/revenue*100:-100;
  const y={year:S.year,newS,ins,left,churn,students,revenue,costs,interest,res,pct:pc,once:S.yearFx.once,cashBefore:S.cash,media:{...S.media},payroll,mediaK:mkTotal(),platform:BASE.platform,other:BASE.other,measures:S.cost,scaleCost,tuition,revEff,revY:S.yearFx.revY};
  y.norgeat=norg; S.cash+=res-norg; y.cash=S.cash;
  const prev=S.lastResult;
  let dca=clamp((pc-prev.pct)*0.8,-8,8)+(pc>=S.target?5:pc>=0?3:-3);
  if(S.mode==='fonds'&&pc<0) dca-=6;
  if(S.mode==='edtech'&&students<S.students*1.10) dca-=8;
  if(S.mode==='edtech'&&students>=S.students*1.10) dca+=4;
  y.dca=Math.round(dca);
  g.ca=clamp(g.ca+dca,0,100);
  g.etu=clamp(g.etu+(50-g.etu)*0.15+(churn<SC.churn+0.02?3:-2),0,100);
  const dcom=clamp((newS-S.lastNew)/S.lastNew*30,-8,8); g.com=clamp(g.com+dcom,0,100);
  g.cse=clamp(g.cse+(50-g.cse)*0.15+(pc<-5?-2:(pc>3?3:0)),0,100);
  if(S.rate>0.045&&S.cash>0) S.rate=Math.max(0.03,S.rate-0.005);
  if(S.cash<0) S.rate=clamp(S.rate+0.01,0.01,0.15);
  S.students=students; S.lastNew=newS; S.lastResult={pct:pc,rev:revenue,res}; S.history.push(y);
  S.yearFx={stuY:1,revY:0,once:0}; S.mediaMod={};
  return y;
}
function projected(){
  const pend=S.pending.map(i=>MEASURES[i]);
  const extra=pend.reduce((a,m)=>a+yearly(m),0);
  const rc=4000*SC.scale; const rev=S.students*S.price/1000+(S.rev>rc?rc+(S.rev-rc)*0.5:S.rev)+S.yearFx.revY;
  const costs=BASE.payrollOther+BASE.payrollCom+mkTotal()+BASE.platform+BASE.other+S.cost+(S.debt+Math.max(0,-S.cash))*S.rate+Math.max(0,S.students-BASE.students)*S.price*(SC.varc||0.55)/1000;
  const revX=pend.reduce((a,m)=>a+(m.rev||0)+(m.price?S.students*S.price*m.price/100/1000:0)+(m.stu?(m.stu-1)*4200*SC.scale*S.price/1000:0),0);
  const res=rev-costs+extra; return {res,pct:rev>0?res/rev*100:-100,extra,rev:rev+revX};
}
function capCost(ids){ return ids.map(i=>MEASURES[i]).reduce((a,m)=>a+Math.min(0,m.cap||0),0); }
function checkOver(){
  if(S.g.ca<=0) return N.president+" vous a retiré sa confiance. Le conseil vous révoque et un cabinet de redressement prend la direction.";
  if(S.cash<SC.bank) return "La "+N.banque+" a coupé la ligne de crédit. "+N.ecole+" dépose le bilan.";
  if(S.g.cse<=0) return "Grève illimitée. Après six semaines sans cours, le conseil vous a remplacé·e.";
  if(S.g.etu<=0) return "Hémorragie d'étudiants et plainte collective. "+N.ecole+" perd son habilitation.";
  return null;
}

function localScores(){ try{return JSON.parse(localStorage.getItem('bde-hof')||'[]');}catch(e){return [];} }
function postScore(type,extra){
  const row={partie_id:S.pid,type,dg:S.name,profil:SC.name+' · '+(S.profile!==null?PROFILES[S.profile][1]:''),annee:S.year,resultat_pct:+S.lastResult.pct.toFixed(2),capital:Math.round(S.g.ca),etudiants:S.students,tresorerie_k:Math.round(S.cash),mesures:S.active.length,saison:type==='saison'?S.yi+1:null,...extra};

  try{fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)}).catch(()=>{});}catch(e){}

async function fetchScores(type,annee){
  try{const r=await fetch(API+'?type='+type+(annee?'&annee='+annee:''),{cache:'no-store'}); if(r.ok){const j=await r.json(); if(!j.offline&&!j.error) return {rows:j.rows,online:true};}}catch(e){}
  const rows=localScores().filter(x=>x.type===type&&(!annee||x.annee===annee)).sort((a,b)=>b.resultat_pct-a.resultat_pct||(b.capital||0)-(a.capital||0));
  return {rows,online:false};
}

function renderTuto(){
  const TUTO=TUTO_T(); const [t,d,k]=TUTO[S.tuto]; flashGauge(k);
  modal(`<div class="kicker">Découverte · ${S.tuto+1}/${TUTO.length}</div><h3>${t}</h3><p class="mt" style="max-width:none">${d}</p><div class="mf"><button class="lnk" id="tp">Passer</button><button class="mbtn" id="tn">Suivant ▸</button></div>`,'gold');
  document.getElementById('tp').onclick=()=>{S.tuto=99;closeModal();renderPhase();};
  document.getElementById('tn').onclick=()=>{S.tuto++;closeModal();if(S.tuto<TUTO.length)renderTuto();else renderPhase();};
  renderPhase(true);
}
function renderBudget(){
  const pend=S.pending.map(i=>MEASURES[i]); const act=S.active.map(i=>MEASURES[i]);
  const all=[...act,...pend];
  const rec=all.reduce((a,m)=>a+(m.rev||0)+(m.price?Math.max(0,S.students*S.price*m.price/100/1000):0)+(m.stu&&m.stu>1?(m.stu-1)*4200*S.price/1000:0),0);
  const eco=all.reduce((a,m)=>a+Math.max(0,-(m.cost||0)-(m.mk||0)),0);
  const dep=all.reduce((a,m)=>a+Math.max(0,(m.cost||0)+(m.mk||0))+(m.price&&m.price<0?Math.abs(S.students*S.price*m.price/100/1000):0),0);
  const once=pend.reduce((a,m)=>a+(m.once||0),0);
  const cap=capCost(S.pending); const capGain=pend.reduce((a,m)=>a+Math.max(0,m.cap||0),0);
  const pj=projected(); const ins=inscriptions();
  $('#budget').innerHTML=`<div class="bh"><span>📒 Votre plan en cours — ${all.length} mesure${all.length>1?'s':''}${pend.length?` <span class="muted">(dont ${pend.length} à voter)</span>`:''}</span><span class="muted" style="font-weight:400;font-size:12px">${all.length?'':'Aucune mesure retenue.'}</span></div>
   <div class="btiles"><div class="btile g"><div class="l">Recettes nouvelles</div><div class="v num">${(rec/1000).toFixed(1).replace('.',',')}</div><div class="s">M€ · par an</div></div>
   <div class="btile o"><div class="l">Économies</div><div class="v num">${(eco/1000).toFixed(1).replace('.',',')}</div><div class="s">M€ · par an</div></div>
   <div class="btile b"><div class="l">Effort net</div><div class="v num">${((rec+eco-dep)/1000).toFixed(1).replace('.',',')}</div><div class="s">M€ d'amélioration du résultat</div></div>
   <div class="btile c"><div class="l">Capital engagé</div><div class="v num">${cap}${capGain?` <span style="font-size:14px;color:var(--green)">+${capGain}</span>`:''}</div><div class="s">sur ${Math.round(S.g.ca)} pts disponibles</div></div></div>
   <div class="blines"><div><span>Dépenses nouvelles engagées</span><span class="num" style="color:var(--rose)">${kE(-dep)}</span></div><div><span>Budget ${SC.mediaWord} ${S.year}</span><span class="num">${fmt(mkTotal())} k€ · ${fmt(ins.leads)} ${SC.leadWord} · ${fmt(ins.total)} inscriptions attendues</span></div><div><span>Mouvements de trésorerie immédiats (mesures à voter)</span><span class="num">${kE(once)}</span></div><div class="tot"><span>Résultat projeté pour ${S.year}</span><span class="num" style="color:${pj.pct<0?'var(--rose)':'var(--green)'}">${mE(pj.res)} · ${pct(pj.pct)}</span></div></div>
   <div class="proj">Cible <b class="num">+${S.target} %</b>${SC.growth?` <span style="margin-left:12px">CA cible 2030 <b class="num" style="font-size:15px">${(SC.caTarget/1000).toFixed(0)} M€</b></span>`:''} <span style="margin-left:12px">Frais annuels <b class="num" style="font-size:15px">${fmt(S.price)} €</b></span> <span style="margin-left:12px">${SC.unit.charAt(0).toUpperCase()+SC.unit.slice(1)} <b class="num" style="font-size:15px">${fmt(S.students)}</b></span></div>`;
}

function sceneShell(body,opts){
  const e=EPISODES[S.phase]; opts=opts||{};
  const hl=headlines(); const tk=hl.concat(hl).join(' • ');
  $('#scene').innerHTML=`<div class="k"><div><div class="kicker">Saison ${S.yi+1} · Exercice ${S.year} · Épisode ${S.phase+1}</div><h2 class="serif">${e[0]} — ${opts.title||e[1]}</h2></div></div>
   ${opts.tag?`<div class="tag">« ${opts.tag} »</div>`:''}
   <div class="ticker"><span class="d">● DIRECT</span><div class="tk"><span>${tk} • </span></div></div>
   <div id="body">${body}</div>
   <div class="foot"><button class="sbtn" disabled>↩ Retour</button><button class="mbtn" id="nextBtn" ${opts.ready?'':'disabled'}>▶ Épisode suivant</button></div>`;
  $('#nextBtn').addEventListener('click',()=>{ if(opts.onNext) opts.onNext(); else nextPhase(); });
}
function dlg(ic,who,role,text){ return `<div class="dlg"><div class="avatar sm">${ic}</div><div class="who"><b>${who}</b><small>${role}</small><p>${text}</p></div></div>`; }
function ready(){ const b=$('#nextBtn'); if(b) b.disabled=false; S.decided=true; save(); }
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('div'); c.className='confetti'; const cols=['#c9a24a','#7ee0a0','#7fa3e6','#b48be6','#ff6b7a','#eef2fb'];
  for(let i=0;i<70;i++){const k=document.createElement('i'); k.style.left=Math.random()*100+'%'; k.style.background=cols[i%cols.length]; k.style.animationDelay=(Math.random()*.8)+'s'; k.style.animationDuration=(2+Math.random()*1.2)+'s'; c.appendChild(k);}
  document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
}
function nextPhase(){ S.phase++; S.sub=0; S.tmp=null; S.decided=false; renderGame(); }
function choices(container,list,after,label){
  const box=document.createElement('div'); box.className='opts';
  list.forEach(([l,fx,out,sub])=>{
    const b=btn(`${l}${sub?`<small>${sub}</small>`:''}${(typeof fx!=='function'&&fx)?`<small>${chips(scf(fx))}</small>`:''}`,()=>{
      const f=scf(typeof fx==='function'?fx():fx); apply(f,label);
      box.querySelectorAll('button').forEach(x=>{x.disabled=true;}); b.classList.add('sel');
      const r=document.createElement('div'); r.className='resbox'+(f&&f.g&&Object.values(f.g).some(v=>v<0)&&!Object.values(f.g).some(v=>v>0)?' bad':'');
      r.innerHTML=`<b>${(f&&f.txt)||out}</b>${typeof fx==='function'?chips(f):''}`;
      box.after(r); renderBudget(); if(after) after(); else ready();
    },'opt'); box.appendChild(b);
  });
  container.appendChild(box);
}

function renderPhase(silent){
  switch(S.phase){
    case 0: return phCadrage();
    case 1: return phMesures();
    case 2: return phMedias();
    case 3: return phEnveloppes();
    case 4: return phGardiens();
    case 5: return phAudition();
    case 6: return phVote();
    case 7: return phEvent(silent);
    case 8: return phResultats();
    case 9: return phShow();
    case 10: return phBilan();
  }
}

function phCadrage(){
  const first=S.yi===0; const lr=S.lastResult;
  if(false&&S.year===2028&&S.sub===0){ // rachat en cours de partie désactivé
    sceneShell(dlg(PRES,N.president,N.presidentRole+' · cède ses parts',SHAREHOLDER.t)+`<div class="prompt">Qui doit racheter ${N.ecole} ?</div><div id="c"></div>`,{title:'Changement d\'actionnaire',tag:N.president+' vend. La suite de la série se joue maintenant.',onNext:()=>{S.sub=1;renderGame();}});
    choices($('#c'),SHAREHOLDER.c.map(([ic,l,sub,fx])=>[ic+' '+l,fx,'Le conseil suit votre avis. Les règles changent dès cette année.',sub]),()=>{ if(S.mode==='univ') S.target=8; ready(); },'Rachat de l\'école');
    return;
  }
  const quote=first?`« Le conseil vous donne cinq exercices. Fin 2030, je veux un résultat net de +${SC.target} % du chiffre d\'affaires${SC.growth?' et un chiffre d\'affaires de '+(SC.caTarget/1000).toFixed(0)+' M€ (×'+SC.growth.toString().replace('.',',')+')':''}. Ni scandale, ni grève, ni exode des ${SC.unit}. Bonne chance. »`
    :(S.g.ca<35?'« Je ne cache pas mon inquiétude. Cette année est celle de la dernière chance. »':S.g.ca>65?'« Le conseil renouvelle sa confiance. Continuez. »':'« Le conseil attend des résultats mesurables cette année. »');
  const extra=[S.cash<0?'La trésorerie est négative : les agios pèsent et la '+N.banque+' surveille chaque mouvement.':'',S.mode==='edtech'?'Le groupe edtech rappelle son exigence : +10 % d\'étudiants cette année.':'',S.mode==='fonds'?'Le fonds rappelle qu\'une année en perte ne sera pas tolérée.':'',S.mode==='univ'?'L\'université rappelle le gel des frais de scolarité.':''].filter(Boolean);
  const speaker=S.mode?['🕴️','Le nouvel actionnaire','Président du conseil']:[PRES,N.president,N.presidentRole+' · vous reçoit dans son bureau'];
  const body=dlg(speaker[0],speaker[1],speaker[2],(first?`« Bonjour ${S.name}. ${N.daf}, notre DAF, vous a remis les comptes 2025 : ${(SC.ca0/1000).toFixed(0)} M€ de chiffre d'affaires, ${fmt(BASE.students)} ${SC.unit}, ${BASE.staff} salariés dont ${BASE.com} commerciaux, et un résultat de <b style="color:${SC.start<0?'var(--rose)':'var(--green)'}">${pct(SC.start)}</b>. ${SC.pitch} »<br>`:`« Résultat ${S.year-1} : <b style="color:${lr.pct<0?'var(--rose)':'var(--green)'}">${pct(lr.pct)}</b>. ${lr.pct>=S.target?'L\'objectif est atteint, il s\'agit de le tenir.':`Il reste ${(S.target-lr.pct).toFixed(1).replace('.',',')} points à gagner avant fin 2030.`} »<br>`)+quote)+
   (extra.length?`<div class="note">${extra.map(x=>`<div>${x}</div>`).join('')}</div>`:'')+
   `<div class="prompt">Votre discours de prise de fonction — fixez le cap :</div><div id="c"></div>`;
  sceneShell(body,{title:first?'Mission : Impossible':'La lettre du conseil',tag:first?(SC.start<0?'On vous confie une école qui perd '+fmt(-SC.ca0*SC.start/100/12*1000)+' € par mois. ':'On vous confie '+SC.name+'. ')+N.president+' attend un cap, les équipes guettent vos premiers mots.':'Nouvelle saison, mêmes contraintes. Le conseil a relu les comptes.'});
  choices($('#c'),[
    ["« La rigueur : je tiendrai les coûts. »",{g:{ca:3,cse:-2}},"Cap fixé. "+N.president+" approuve, le CSE prend note."],
    ["« La qualité : je miserai sur les étudiants. »",{g:{etu:3,ca:-1}},"Cap fixé. Les étudiants apprécient, le conseil attend les chiffres."],
    ["« La croissance : je relancerai les ventes. »",{g:{com:3,ca:-1}},"Cap fixé. Les commerciaux applaudissent."]],()=>{
      if(S.prime&&S.prime.year===S.year){ready();return;}
      const d=document.createElement('div'); d.innerHTML=`<div class="prompt" style="margin-top:10px">${N.cse}, secrétaire du CSE, vous interpelle : « Et la prime de participation, cette année ? »</div><div id="c2"></div>`; $('#c').after(d);
      choices($('#c2'),[
        ["« Oui, pour tous, quoi qu'il arrive. »",()=>{S.prime={year:S.year,promise:'oui'};return {g:{cse:9,com:5}};},"Promesse faite. Elle sera vérifiée au show de fin d'année : environ 450 k€ à sortir.","Engagement ferme, vérifié en décembre."],
        ["« Oui, si l'école revient à l'équilibre. »",()=>{S.prime={year:S.year,promise:'cond'};return {g:{cse:3,com:2}};},"Une promesse conditionnelle. Les équipes retiennent surtout le « oui ».","Versée seulement si le résultat est positif."],
        ["« Non. Pas cette année. »",()=>{S.prime={year:S.year,promise:'non'};return {g:{cse:-6,com:-3,ca:2}};},"Le CSE encaisse. Au moins, personne ne sera déçu en décembre.","Clair, et impopulaire."]],null,'Prime de participation');
    },'Discours de cadrage');
}

function phMesures(){
  if(!S.offer) S.offer={};
  if(!S.offer[S.year]){
    const pool=MEASURES.filter(m=>!S.active.includes(m.id)&&!(S.mode==='univ'&&m.price>0));
    const take=(cat,n)=>{const l=pool.filter(m=>m.cat===cat).sort(()=>Math.random()-0.5);return l.slice(0,n).map(m=>m.id);};
    const Q=[[4,4,3,1],[5,5,4,1],[6,6,4,2],[7,6,5,2],[7,6,5,2]][Math.min(S.yi,4)];
    S.offer[S.year]=[...take('rec',Q[0]),...take('dep',Q[1]),...take('str',Q[2]),...take('fou',Q[3])];
    const ann=MEASURES.find(m=>m.flag==='annualisation');
    if(S.yi===0&&ann&&!S.active.includes(ann.id)&&!S.offer[S.year].includes(ann.id)){const deps=S.offer[S.year].filter(i=>MEASURES[i].cat==='dep');S.offer[S.year][S.offer[S.year].indexOf(deps[deps.length-1])]=ann.id;}
  }
  const avail=S.offer[S.year].map(i=>MEASURES[i]).filter(m=>!S.active.includes(m.id));
  const cats=[['rec','Recettes nouvelles','var(--green)'],['dep','Économies et coupes','var(--gold)'],['str','Réformes de structure','var(--violet)'],['fou','Coups de poker — effets massifs, capital massif','var(--rose)']];
  const body=dlg(DAF,N.daf,N.dafRole,`« Dessinons l'esquisse du plan : voici les ${avail.length} mesures instruites par mes équipes cette année ; d'autres seront prêtes l'an prochain. Retenez-en autant que votre capital le permet, ou aucune. Chaque mesure consomme du capital auprès de ${N.president} ; vous ne pouvez pas engager plus de capital que vous n'en avez. Une mesure adoptée reste en vigueur les années suivantes. »`)+
   `<div class="note"><div class="h">📗 Note de ${N.daf} — la mécanique des comptes de ${N.ecole}</div>Sans mesure nouvelle, le résultat ${S.year} serait de <b style="color:${projected().pct<0?'var(--rose)':'var(--green)'}">${pct(projected().pct)}</b>${SC.growth?`, pour un chiffre d'affaires cible de ${(SC.caTarget/1000).toFixed(0)} M€ en 2030`:''}. Trois moteurs :<ul><li><b>Les abandons.</b> ${Math.round(SC.churn*100)} % des ${SC.unit} ne vont pas au bout : chaque départ est un chiffre d'affaires perdu.</li><li><b>La masse salariale.</b> ${BASE.staff} salariés et ${((BASE.payrollOther+BASE.payrollCom)/1000).toFixed(1).replace('.',',')} M€ de salaires pour ${(SC.ca0/1000).toFixed(0)} M€ de chiffre d'affaires.</li><li><b>${BASE.debt?'La dette.':'La trésorerie.'}</b> ${BASE.debt?(BASE.debt/1000).toFixed(1).replace('.',',')+' M€ à '+(S.rate*100).toFixed(1).replace('.',',')+' % ; chaque euro de découvert coûte plus cher.':'Pas de dette, mais la banque coupe à '+mE(SC.bank)+' de découvert.'}</li></ul></div>
   <div class="hint">💡 À droite de chaque mesure : son <b>effet estimé sur le résultat annuel (k€)</b> et son <b>coût en capital</b>. Survolez une mesure (ou lisez la ligne sous chaque mesure sur mobile) pour sa lecture détaillée et ses effets sur les étudiants, les commerciaux et le CSE.</div>
   <div class="capbar" id="capbar"></div>
   <div id="cat"></div><div class="hint" id="tally"></div>`;
  sceneShell(body,{title:'Il faut sauver l\'école',tag:'Seul·e face à la page blanche du plan. Chaque ligne cochée fera un mécontent, et un titre dans la presse.'});
  const draw=()=>{
    const used=-capCost(S.pending); const avail_cap=Math.round(S.g.ca);
    $('#cat').innerHTML=cats.map(([k,n,col])=>`<div class="cath"><i style="background:${col}"></i>${n}</div><div class="mrows">${avail.filter(m=>m.cat===k).map(m=>{const y=yearly(m);const sel=S.pending.includes(m.id);const c=m.cap||0;const off=!sel&&(c<0&&used-c>avail_cap);return `<label class="mrow ${sel?'sel':''} ${off?'off':''} ${m.cat==='fou'?'fou':''}"><input type="checkbox" data-id="${m.id}" ${sel?'checked':''} ${off?'disabled':''}><span>${m.n}</span><span class="cap ${c>0?'gain':''}">${c>0?'+':''}${c} ⚡</span><span class="amt num ${y>50?'pos':y<-50?'neg':'zero'}">${y>50||y<-50?kE(y):'±0'}</span><span class="tip"><span class="d">${m.d}</span>${chips({g:m.g,once:m.once,hc:m.hc,churn:m.churn,rate:m.rate})||'<span class="chip">Aucun effet sur les jauges</span>'}<span class="d" style="margin-top:4px;color:var(--gold-hi)">${lecture(m)}</span></span><span class="mfx"><span class="d">${m.d}</span>${chips({g:m.g,once:m.once,hc:m.hc,churn:m.churn,rate:m.rate})}<span class="d" style="color:var(--gold-hi)">${lecture(m)}</span></span></label>`;}).join('')}</div>`).join('');
    $('#cat').querySelectorAll('input').forEach(i=>i.addEventListener('change',e=>{const id=+e.target.dataset.id; if(e.target.checked) S.pending.push(id); else S.pending=S.pending.filter(x=>x!==id); draw(); renderBudget(); renderGauges(); save();}));
    const cb=$('#capbar'); cb.className='capbar'+(used>avail_cap?' over':''); cb.innerHTML=`<span>⚡ Capital engagé par les mesures cochées</span><span><b>${used}</b> / ${avail_cap} pts disponibles</span>`;
    $('#tally').innerHTML=`<b>${S.pending.length}</b> mesure${S.pending.length>1?'s':''} retenue${S.pending.length>1?'s':''}. ${S.pending.length?'Elles seront soumises au vote du conseil en juillet ; le capital sera débité à l\'adoption.':'Vous pouvez aussi continuer sans nouvelle mesure.'}`;
    ready();
  };
  draw();
}

function phMedias(){
  const body=dlg('👩‍🎨',N.mkt,SC.mediaWord==='commercial'?'Directrice du développement':'Directrice marketing',`« Voici le ${SC.mediaTitle.toLowerCase()} ${S.year}. Chaque canal a son coût par ${SC.lead1} et sa qualité ; ce sont les commerciaux de ${N.com} qui transforment, et leur moral (${Math.round(S.g.com)} %) joue autant que le budget. Les rendements sont décroissants : doubler un canal ne double pas ses leads. »`)+
   `<div class="media" id="media"></div><div class="mtot" id="mtot"></div><div class="hint">Le budget ${SC.mediaWord} est une charge de l'exercice : il pèse sur le résultat et la trésorerie. Le bouche-à-oreille et les anciens apportent en plus environ ${fmt(inscriptions().organic)} inscriptions sans dépense.</div>`;
  sceneShell(body,{title:'Le '+SC.mediaTitle.toLowerCase(),tag:'Des '+SC.leadWord+', encore des '+SC.leadWord+'. Et des commerciaux pour les transformer.',ready:true});
  const draw=()=>{
    const ins=inscriptions();
    $('#media').innerHTML=Object.keys(MEDIA).map(k=>{const c=MEDIA[k];const r=ins.channels[k];const mod=S.mediaMod[k]||1;return `<div class="mch ${mod>1.2?'warn':''}"><div class="h"><b>${c.ic} ${c.n}</b><span>coût par ${SC.lead1} ${fmt(r.cpl)} € · transformation ${Math.round(c.conv*100)} %${c.per?` · ${c.per} ${SC.unit} par contrat`:''}${c.churn?` · abandons +${c.churn} pt`:''}</span></div><div class="d">${c.d}${mod!==1?` <b style="color:${mod>1?'var(--rose)':'var(--green)'}">Cette année : coût par ${SC.lead1} ${pct((mod-1)*100)}.</b>`:''}</div>
      <input type="range" id="r-${k}" min="0" max="${Math.round(3000*SC.scale/50)*50||300}" step="${SC.scale<0.5?10:50}" value="${S.media[k]}" data-k="${k}"><div class="stats"><span class="amt num">${fmt(S.media[k])} k€</span><span>${SC.leadWord.charAt(0).toUpperCase()+SC.leadWord.slice(1)} <b class="num">${fmt(r.leads)}</b></span><span>Inscriptions <b class="num">${fmt(r.ins)}</b></span><span>Coût par inscrit <b class="num">${r.cpi?fmt(r.cpi)+' €':'–'}</b></span></div></div>`;}).join('');
    $('#media').querySelectorAll('input[type=range]').forEach(r=>r.addEventListener('input',e=>{S.media[e.target.dataset.k]=+e.target.value;draw();renderBudget();save();}));
    const tot=mkTotal();
    $('#mtot').innerHTML=`<div class="btile o"><div class="l">Budget ${SC.mediaWord}</div><div class="v num">${(tot/1000).toFixed(2).replace('.',',')}</div><div class="s">M€ · ${pct((tot/BASE.marketing-1)*100)} vs 2025</div></div><div class="btile b"><div class="l">${SC.leadWord} attendus</div><div class="v num">${fmt(ins.leads)}</div><div class="s">tous canaux</div></div><div class="btile g"><div class="l">Inscriptions attendues</div><div class="v num">${fmt(ins.total)}</div><div class="s">dont ${fmt(ins.organic)} organiques</div></div><div class="btile c"><div class="l">Coût moyen par inscrit</div><div class="v num">${fmt(tot*1000/Math.max(1,ins.total-ins.organic))}</div><div class="s">€ · frais annuels ${fmt(S.price)} €</div></div>`;
  };
  draw();
}

function phEnveloppes(){
  if(S.sub===0&&!S.tmp){ S.tmp={list:[pick(ENVELOPPES,'env'),pick(ENVELOPPES,'env')],spring:pickEvent(),springDone:false}; }
  if(!S.tmp.springDone){ const ev=EVENTS[S.tmp.spring]; const fx=eventFx(ev); S.tmp.springFx=fx; sceneShell(`<div class="resbox ${isBad(fx)?'bad':''}"><b>${ev.ic} ${ev.n}</b>${ev.t}${fx.txt?`<div style="margin-top:4px">${fx.txt}</div>`:''}<div>${chips(fx)}</div></div>`,{title:'Imprévu de printemps',tag:'Les directeurs attendent à la porte. Mais d\'abord, une nouvelle.'}); eventModal(ev,fx,'Imprévu de printemps',()=>{S.tmp.springDone=true;save();renderBudget();renderGame();}); return; }
  const e=ENVELOPPES[S.tmp.list[S.sub]];
  sceneShell(dlg(e.ic,e.who,e.role,e.ask)+`<div class="prompt">Arbitrage ${S.sub+1}/2 :</div><div id="c"></div>`,{title:'La guerre des enveloppes',tag:'Chaque directeur défend son budget, menace de partir, et ira voir '+N.president+' si vous dites non.',onNext:()=>{S.sub++; if(S.sub>=2) nextPhase(); else {S.decided=false;renderGame();}}});
  choices($('#c'),e.c.map(([l,fx,out])=>[l,fx,out]),null,e.who);
}

function phGardiens(){
  const items=[];
  if(S.cash<-2000) items.push(["🧾","Le commissaire aux comptes ("+N.cac+")","déclenche une procédure d'alerte : la continuité d'exploitation n'est plus assurée sans mesures fortes.",{g:{ca:-5,cse:-3}}]);
  else if(S.cash<0) items.push(["🧾","Le commissaire aux comptes ("+N.cac+")","signale une trésorerie négative et demande un plan de financement.",{g:{ca:-2}}]);

function boardVotes(chance,pend){
  const sum=k=>pend.reduce((a,m)=>a+((m.g&&m.g[k])||0),0);
  const cap=capCost(S.pending); const pj=projected(); const delta=pj.pct-S.lastResult.pct;
  const amd=S.tmp.amd||{}; const once=pend.reduce((a,m)=>a+(m.once||0),0);
  const pres=S.mode?['Le nouvel actionnaire','Président du conseil']:[N.president,N.presidentRole];
  const methode=pend.some(m=>/Audit|qualité|Plan stratégique/i.test(m.n));
  const members=[
   {who:pres[0],role:pres[1],mod:(S.g.ca-50)*0.5,p:S.g.ca>=60?'Fait confiance à la direction.':'Soutient le plan, par devoir plus que par conviction.',c:S.g.ca<40?'Ne fait plus confiance à la direction.':'Attend un plan plus convaincant.'},
   {who:N.adminEtu,role:'Représentant des étudiants',mod:sum('etu')*1.2,p:sum('etu')>0?'Le plan améliore la vie étudiante.':'Le plan épargne les étudiants.',c:sum('etu')<0?'Le plan fait payer les étudiants.':'N\'y voit rien pour les étudiants.'},
   {who:N.adminEns,role:'Représente les enseignants',mod:sum('cse')*1.0,p:sum('cse')>0?'Les équipes y gagnent.':'Les équipes sont préservées.',c:sum('cse')<0?'Les équipes trinquent.':'Rien pour les équipes dans ce plan.'},
   {who:N.actionnaire,role:'Actionnaire minoritaire',mod:delta*2-(S.cash<0?8:0),p:'Le résultat projeté s\'améliore.',c:delta<2?'Pas assez d\'effet sur le résultat.':'Doute des chiffres annoncés.'},
   SC.founder?{who:N.adminIndep,role:'Fondatrice historique · au conseil',mod:sum('etu')*1.5+(pend.some(m=>/tutorat|tuteurs|qualité|cours|alumni/i.test(m.n))?10:0),p:sum('etu')>0?'Le plan respecte les étudiants et la pédagogie.':'Rien ne trahit l\'école qu\'elle a fondée.',c:sum('etu')<0?'« Ce n\'est pas pour ça que j\'ai créé cette école. »':'Attend plus de pédagogie dans ce plan.'}
   :{who:N.adminIndep,role:'Administratrice indépendante',mod:-pend.length*1.5-cap*0.2+(methode?12:0),p:methode?'Salue la transparence et la méthode.':'Plan raisonnable dans son périmètre.',c:pend.length>5?'Trop de chantiers à la fois.':'Manque de méthode et d\'indicateurs.'},
   {who:N.daf,role:'DAF et actionnaire',mod:delta*1.5+(S.cash<-1000?-10:S.cash>0?5:0)+(pend.length>6?-6:0),p:delta>2?'Les comptes y gagnent, il signe.':'Un plan qu\'il peut financer.',c:S.cash<-1000?'Ne sait pas comment financer le plan.':'Les chiffres ne tiennent pas à ses yeux.'},
   {who:N.banquier,role:'Censeur · '+N.banque,mod:(S.cash<-2000?-15:S.cash<0?-5:5)+once/200,p:'La trésorerie reste sous contrôle.',c:S.cash<-2000?'La trésorerie est hors des clauses du prêt.':once<-1000?'S\'inquiète des sorties de trésorerie immédiates.':'Juge le plan trop risqué pour la banque.'},
  ];
  const list=members.map(m=>{const a=amd[m.who]; const am=a===true?20:a===false?-25:0; const pr=clamp(chance+m.mod+am,5,95); const pour=Math.random()*100<pr;
    const why=a===true?'A obtenu son amendement.'+(pour?'':' Mais '+m.c.charAt(0).toLowerCase()+m.c.slice(1)):a===false?(pour?'Vote pour malgré le rejet de son amendement.':'Son amendement a été rejeté.'):(pour?m.p:m.c);
    return {who:m.who,role:m.role,pour,why};});
  const pour=list.filter(v=>v.pour).length, contre=list.length-pour; const tie=pour===contre;
  return {list,pour,contre,tie,ok:pour>contre||(tie&&list[0].pour)};
}
function phVote(){
  if(S.sub<2){
    if(S.sub===0&&!S.tmp) S.tmp={list:[pick(AMENDEMENTS,'amd'),pick(AMENDEMENTS,'amd')],bonus:0,amd:{}};
    const a=AMENDEMENTS[S.tmp.list[S.sub]];
    sceneShell(dlg(a.ic,a.who,a.role+' · dépose un amendement',a.ask)+`<div class="prompt">Amendement ${S.sub+1}/2 :</div><div id="c"></div>`,{title:'La grande bidouille',tag:'Avant le vote, chacun négocie sa ligne. Rejeter un amendement, c\'est perdre une voix.',onNext:()=>{S.sub++;S.decided=false;renderGame();}});
    choices($('#c'),[["✓ Accepter l'amendement",()=>{S.tmp.bonus+=12;S.tmp.amd[a.who]=true;return a.y;},"L'amendement est intégré au plan."],["✗ Rejeter l'amendement",()=>{S.tmp.bonus-=5;S.tmp.amd[a.who]=false;return a.n;},"Rejeté. Son auteur s'en souviendra au moment du vote."]],null,a.who);
    return;
  }
  const pend=S.pending.map(i=>MEASURES[i]);
  const cap=capCost(S.pending);
  // Chance d'adoption : base 70, + confiance du conseil (capital), + amendements, − ambition du plan (capital engagé, nombre de mesures), + crédibilité (résultat projeté)
  const pj=projected(); const credib=clamp((pj.pct-S.lastResult.pct)*0.6,-6,10);
  const parts={base:70,conf:Math.round((S.g.ca-50)*0.6),amd:S.tmp.bonus,poids:Math.round(cap*0.4-pend.length*1.5),cred:Math.round(credib)};
  const chance=pend.length?clamp(parts.base+parts.conf+parts.amd+parts.poids+parts.cred,8,95):97;
  if(S.sub===2){
    sceneShell(dlg(PRES,S.mode?'Le président du conseil':N.president,N.presidentRole+' · ouvre le vote',`« ${pend.length?`Le plan comporte ${pend.length} mesure${pend.length>1?'s':''}, pour ${-cap} points de capital.`:'Aucune nouvelle mesure n\'est soumise.'} Le conseil se prononce à main levée. »`)+
     `<div class="tw"><table><tr><th>Mesure</th><th>Effet annuel</th><th>Capital</th><th>Étudiants</th><th>CSE</th></tr>${pend.map(m=>`<tr><td>${m.n}</td><td class="num">${kE(yearly(m))}</td><td class="num" style="color:var(--gold-hi)">${m.cap>0?'+':''}${m.cap||0}</td><td class="num">${(m.g&&m.g.etu)||0}</td><td class="num">${(m.g&&m.g.cse)||0}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Aucune mesure</td></tr>'}</table></div>
     <div class="note">Chance d'adoption estimée : <b style="font-size:18px;color:var(--gold)">${Math.round(chance)} %</b> <span class="muted">(base 70, confiance du conseil ${parts.conf>=0?'+':''}${parts.conf}, amendements ${parts.amd>=0?'+':''}${parts.amd}, ambition du plan ${parts.poids}, crédibilité ${parts.cred>=0?'+':''}${parts.cred})</span></div><div id="c" style="display:flex;justify-content:center"></div>`,{title:'Le vote du conseil',tag:'La grande bidouille se termine. Le conseil tranche.'});
    $('#c').appendChild(btn('🗳️ Appeler au vote',()=>{S.sub=3;S.tmp.votes=boardVotes(chance,pend);renderGame();}));
    return;
  }
  const V=S.tmp.votes||{list:[],ok:false}; const ok=V.ok||S.tmp.forced;
  const votesHtml=V.list.length?`<div class="tw"><table><tr><th>Administrateur</th><th>Vote</th><th>Motif</th></tr>${V.list.map(v=>`<tr><td><b>${v.who}</b><br><span class="muted" style="font-size:11px">${v.role}</span></td><td style="color:${v.pour?'var(--green)':'var(--rose)'};white-space:nowrap"><b>${v.pour?'✓ Pour':'✗ Contre'}</b></td><td style="text-align:left;color:var(--muted)">${v.why}</td></tr>`).join('')}<tr><td colspan="3" style="text-align:left"><b>${V.pour} pour · ${V.contre} contre</b>${V.tie?' · égalité : la voix du président tranche':''}</td></tr></table></div>`:'';
  if(ok){
    if(!S.decided){ pend.forEach(m=>{(S.log=S.log||[]).push({y:S.year,kind:'mesure',n:m.n,eff:Math.round(yearly(m)),cap:m.cap||0,heart:m.g?Object.values(m.g).reduce((a,b)=>a+b,0):0}); apply({cap:m.cap,g:m.g,rev:m.rev,cost:m.cost,mk:m.mk,price:m.price,stu:m.stu,churn:m.churn,hc:m.hc,once:m.once,debt:m.debt,rate:m.rate,flag:m.flag},m.n); S.active.push(m.id);}); S.pending=[]; S.decided=true; save(); renderBudget(); renderGauges(); }
    if(!S.tmp.forced&&!S.tmp.party){S.tmp.party=true;confetti();}
    sceneShell(votesHtml+`<div class="resbox ${S.tmp.forced?'bad':'pop'}"><b>${S.tmp.forced?'Plan imposé':'Plan adopté'}</b>${S.tmp.forced?'Vous avez usé de votre pouvoir de direction. Le plan s\'applique, mais le conseil et le CSE s\'en souviendront.':'Le conseil adopte le plan. Les mesures entrent en vigueur immédiatement et le capital est débité.'}</div>`,{title:S.tmp.forced?'Le passage en force':'Le plan est adopté',tag:'Les mesures entrent en vigueur. Reste à les faire vivre.',ready:true});
    return;
  }
  const worst=pend.slice().sort((a,b)=>(a.cap||0)-(b.cap||0))[0];
  sceneShell(votesHtml+`<div class="resbox bad"><b>Le plan est rejeté</b>Le vote est perdu. Deux issues : passer en force, ou retirer la mesure la plus coûteuse en capital et refaire voter.</div><div id="c"></div>`,{title:'Le plan est rejeté',tag:'Le conseil a dit non. Vous avez une nuit pour trouver une issue.'});
  const box=document.createElement('div'); box.className='opts';
  box.appendChild(btn(`Passer en force<small>Le plan s'applique intégralement.</small><small>${chips({g:{ca:-15,cse:-6}})}</small>`,()=>{apply({g:{ca:-15,cse:-6}},'Passage en force');S.tmp.forced=true;renderGame();},'opt'));
  if(worst) box.appendChild(btn(`Retirer « ${worst.n} » et refaire voter<small>Le plan amputé est adopté.</small><small>${chips({g:{ca:-2}})}</small>`,()=>{S.pending=S.pending.filter(i=>i!==worst.id);apply({g:{ca:-2}},'Retrait d\'une mesure');S.tmp.forced=true;renderGame();},'opt'));
  $('#c').appendChild(box);
}

}

function phShow(){
  const lr=S.lastResult; const prev=S.history.length>1?S.history[S.history.length-2].pct:-20; const better=lr.pct>prev;
  const layoffs=S.active.some(id=>(MEASURES[id].hc||0)<=-20);
  const c=[
   ["Transparence brutale",{cost:150,g:better?{cse:6,com:3,ca:3}:{cse:-4,com:-2,ca:2}},better?"Les équipes apprécient d'être traitées en adultes. "+N.president+" aussi.":"Dire la vérité quand elle est mauvaise ne rend pas populaire. Mais personne ne vous accuse de mentir.","Les vrais chiffres, les vraies raisons, ce qui vient."],
   ["Célébration et récompenses",{cost:400,g:lr.pct>=0?{cse:10,com:10,ca:-2}:{cse:-6,com:-3,ca:-4}},lr.pct>=0?"La soirée est réussie, le moral remonte.":"Faire la fête sur une année en perte sonne faux. "+N.president+" trouve la facture déplacée.","Trophées, vidéo rétrospective, DJ et prime de fin d'année."],
   ["Le discours de vision",{cost:150,g:{ca:5,com:5,cse:layoffs?-5:-1}},layoffs?"Les commerciaux applaudissent. Les équipes qui viennent de perdre des collègues trouvent cela déconnecté.":"Les commerciaux applaudissent. Le reste écoute poliment.","L'IA, l'international, "+N.ecole+" en 2030. Peu de chiffres, beaucoup d'ambition."],
   ["Annuler le show",{g:{cse:-10,com:-8,ca:1}},"Le mail est lu en silence. Le show de fin d'année était l'un des rares moments où "+N.ecole+" se voyait comme une seule équipe.","Économiser 150 k€ et envoyer un e-mail."]];
  const P=S.prime&&S.prime.year===S.year?S.prime:null; const primeK=Math.round(S.staff*1.1);
  let primeHtml='';
  if(P&&!P.resolved){
    if(P.promise==='cond'){ P.resolved=true; if(lr.pct>=0){apply({_abs:true,once:-primeK,g:{cse:8,com:4}},'Prime de participation'); primeHtml=`<div class="resbox"><b>💶 Prime de participation versée</b>L'école est à l'équilibre : la prime promise est versée, ${fmt(primeK)} k€.${chips({once:-primeK,g:{cse:8,com:4}})}</div>`;} else {apply({g:{cse:-4}},'Prime de participation'); primeHtml=`<div class="resbox bad"><b>💶 Pas de prime cette année</b>L'école reste en perte : la condition n'est pas remplie. Les équipes l'avaient compris, sans l'accepter.${chips({g:{cse:-4}})}</div>`;} }
    else if(P.promise==='non'){ P.resolved=true; primeHtml=`<div class="resbox neu"><b>💶 Pas de prime, comme annoncé</b>Personne n'attendait rien. Personne n'applaudit non plus.</div>`; }
  }
  if(P&&P.promise==='oui'&&!P.resolved){
    sceneShell(dlg('🎤',N.comm,'Directeur de la communication · coulisses de la scène',`« Avant de monter sur scène : vous aviez promis une prime de participation à tous en janvier. Elle coûte ${fmt(primeK)} k€. ${S.cash<-3000?'La trésorerie est dans le rouge vif.':''} On la verse ? »`)+`<div class="prompt">La promesse de janvier :</div><div id="c"></div>`,{title:'Le grand show de fin d\'année',tag:'Une scène, des projecteurs, 400 salariés. Et une promesse à tenir.'});
    choices($('#c'),[["Verser la prime à tous",{_abs:true,once:-primeK,g:{cse:10,com:6,ca:-2}},"Promesse tenue. La salle le saura avant même que vous ne parliez."],["Ne pas la verser",{g:{cse:-18,com:-10,ca:-5}},"Promesse trahie. Le show commence dans un silence glacial, et le CSE prépare un tract."]],()=>{P.resolved=true;save();renderGame();},'Prime de participation');
    return;
  }
  sceneShell(primeHtml+dlg('🎤',N.comm,'Directeur de la communication · coulisses de la scène',`« 400 salariés sont connectés, 200 dans la salle, ${N.president} au premier rang. ${better?'Les résultats s\'améliorent.':'Les résultats n\'ont pas progressé.'} ${layoffs?'Des postes ont été supprimés cette année.':''} Qu'allez-vous leur dire ? »`)+`<div class="prompt">Votre show de fin d'année :</div><div id="c"></div>`,{title:'Le grand show de fin d\'année',tag:'Une scène, des projecteurs, 400 salariés. Le moment de vérité de l\'année.'});
  choices($('#c'),c,null,'Grand show');
}

function phBilan(){
  const over=checkOver(); if(over){S.over={lost:true,why:over};return render();}
  if(S.yi>=YEARS.length-1){S.over={lost:false};return render();}
  sceneShell(histHtml()+`<p class="muted" style="margin-top:22px">${S.g.ca<30?N.president+' vous accorde un sursis.':S.lastResult.pct>=S.target?N.president+' vous félicite. Il faudra confirmer.':'Le conseil attend la suite.'} Il reste ${YEARS.length-1-S.yi} exercice${YEARS.length-1-S.yi>1?'s':''} avant la fin de 2030.</p>`,{title:'Fin de saison '+(S.yi+1),tag:'Précédemment dans Le Jeu du DG…',ready:true,onNext:()=>{S.yi++;S.year=YEARS[S.yi];S.phase=0;S.sub=0;S.tmp=null;S.decided=false;S.screen='title';render();}});
  $('#nextBtn').innerHTML='▶ Saison '+(S.yi+2)+' · Exercice '+(S.year+1);
}
function histHtml(){
  const cells=YEARS.map((y,i)=>{const h=S.history[i]; if(!h) return `<div style="height:2px;background:var(--line)"><em>${y}</em></div>`; const v=clamp(Math.abs(h.pct),0,30); return `<div class="${h.pct<0?'neg':'pos'}" style="height:${v/30*70+4}px"><span>${pct(h.pct)}</span><em>${y}</em></div>`;}).join('');
  return `<div class="hist">${cells}</div>`;
}
function bilanHtml(){
  const L=S.log||[]; const mes=L.filter(x=>x.kind==='mesure'); const ev=L.filter(x=>x.kind==='imprévu');
  const top=mes.slice().sort((a,b)=>b.eff-a.eff).slice(0,3);
  const costly=mes.slice().filter(x=>x.heart<-10).sort((a,b)=>a.heart-b.heart).slice(0,2);
  const worst=ev.filter(x=>x.bad).sort((a,b)=>(a.eff+a.heart*50)-(b.eff+b.heart*50)).slice(0,2);
  const best=ev.filter(x=>!x.bad).sort((a,b)=>(b.eff+b.heart*50)-(a.eff+a.heart*50)).slice(0,1);
  const h0=S.history[0], hN=S.history[S.history.length-1];
  const lines=[];
  if(top.length) lines.push(`<b>Les décisions qui ont fait la différence :</b> ${top.map(x=>`${x.n} (${x.y}, ${kE(x.eff)}/an)`).join(' · ')}.`);
  if(costly.length) lines.push(`<b>Celles qui ont coûté cher en cœurs :</b> ${costly.map(x=>`${x.n} (${x.heart} au total)`).join(' · ')}.`);
  if(worst.length) lines.push(`<b>Les coups durs :</b> ${worst.map(x=>`${x.n} (${x.y})`).join(' · ')}.`);
  if(best.length) lines.push(`<b>Le coup de chance :</b> ${best[0].n} (${best[0].y}).`);
  if(h0&&hN) lines.push(`<b>Les abandons</b> sont passés de ${Math.round(h0.churn*100)} % à ${Math.round(hN.churn*100)} % ; <b>les inscriptions</b> de ${fmt(h0.newS)} à ${fmt(hN.newS)} par an ; <b>le coût par inscrit</b> de ${fmt(h0.mediaK*1000/Math.max(1,h0.newS-h0.ins.organic))} € à ${fmt(hN.mediaK*1000/Math.max(1,hN.newS-hN.ins.organic))} €.`);
  const lesson=S.g.ca<25?'Vous avez fini à court de capital : le conseil ne suivait plus. Garder une réserve de capital, c\'est garder la main.':S.g.cse<30?'Le climat social a été sacrifié : les économies ont tenu, pas les équipes.':S.g.etu<35?'Les étudiants ont payé le redressement : abandons élevés, bouche-à-oreille en berne.':hN&&hN.pct>=S.target?'Un redressement équilibré : les comptes, les équipes et les étudiants ont tenu ensemble.':'Les comptes ont progressé, mais pas assez vite : les premières années pèsent le plus, chaque mesure prise tôt rapporte cinq fois.';
  lines.push(`<b>La leçon :</b> ${lesson}`);
  return `<div class="note" style="text-align:left"><div class="h">📘 Ce que cette partie raconte</div>${lines.map(l=>`<p style="margin:4px 0">${l}</p>`).join('')}</div>`;
}
function renderFinal(){
  const lr=S.lastResult; let verdict,text,cls;
  const grown=!SC.growth||lr.rev>=SC.caTarget;
  const statut=S.over.lost?'perdu':(lr.pct>=S.target&&grown)?'objectif':lr.pct>=0?'equilibre':'manque';
  if(!S.over.posted){S.over.posted=true;postScore('partie',{statut});}
  if(S.over.lost){verdict="Fin de série";text=S.over.why;cls='bad';}
  else if(lr.pct>=S.target&&grown){verdict="Objectif atteint";text=`Fin 2030, ${N.ecole} affiche ${pct(lr.pct)} de résultat net, ${(lr.rev/1000).toFixed(1).replace('.',',')} M€ de chiffre d'affaires, ${fmt(S.students)} ${SC.unit} et ${fmt(S.staff)} salariés. Dix ans plus tard, les anciens élèves se souviennent ${S.g.etu>60?'d\'une école qui a tenu ses promesses.':'surtout des années de rigueur.'}`;cls='';}
  else if(lr.pct>=0){verdict="Demi-succès";text=lr.pct>=S.target?`${N.ecole} tient ${pct(lr.pct)} de résultat, mais le chiffre d'affaires (${(lr.rev/1000).toFixed(1).replace('.',',')} M€) reste loin des ${(SC.caTarget/1000).toFixed(0)} M€ demandés. Rentable, pas assez ambitieux.`:`${N.ecole} est rentable (${pct(lr.pct)}) mais loin des +${S.target} % demandés. Le conseil vous garde, sans enthousiasme.`;cls='neu';}
  else{verdict="Objectif manqué";text=`Toujours en perte (${pct(lr.pct)}) fin 2030. ${N.president} ne renouvelle pas votre mandat.`;cls='bad';}
  app().innerHTML=`<div class="center"><div class="panel wide">
    <div class="kicker" style="text-align:center">Fin 2030 · Générique de fin</div>
    <h1 class="serif title" style="color:${cls==='bad'?'var(--rose)':cls==='neu'?'var(--gold)':'var(--green)'}">${verdict}</h1>
    <p style="text-align:center;font-size:15px">${text}</p>
    ${histHtml()}
    <div class="tw" style="margin-top:20px"><table><tr><th>Indicateur</th><th>2025</th><th>Fin de série</th></tr>
    <tr><td>Résultat net</td><td class="num">${pct(SC.start)}</td><td class="num">${pct(lr.pct)}</td></tr><tr><td>Chiffre d'affaires</td><td class="num">${(SC.ca0/1000).toFixed(1).replace('.',',')} M€</td><td class="num">${(lr.rev/1000).toFixed(1).replace('.',',')} M€${SC.growth?' <span class="muted">(cible '+(SC.caTarget/1000).toFixed(0)+')</span>':''}</td></tr><tr><td>Capital</td><td class="num">–</td><td class="num">${Math.round(S.g.ca)} pts</td></tr><tr><td>${SC.unit.charAt(0).toUpperCase()+SC.unit.slice(1)}</td><td class="num">${fmt(BASE.students)}</td><td class="num">${fmt(S.students)}</td></tr><tr><td>Salariés</td><td class="num">${BASE.staff}</td><td class="num">${fmt(S.staff)}</td></tr><tr><td>Frais annuels</td><td class="num">${fmt(BASE.price)} €</td><td class="num">${fmt(S.price)} €</td></tr><tr><td>Budget ${SC.mediaWord}</td><td class="num">${(BASE.marketing/1000).toFixed(1).replace('.',',')} M€</td><td class="num">${(mkTotal()/1000).toFixed(1).replace('.',',')} M€</td></tr><tr><td>Trésorerie</td><td class="num">${mE(BASE.cash)}</td><td class="num">${mE(S.cash)}</td></tr><tr><td>Mesures adoptées</td><td>–</td><td class="num">${S.active.length}</td></tr></table></div>
    ${bilanHtml()}
    <p class="hint">Mesures en vigueur : ${S.active.map(i=>MEASURES[i].n).join(' · ')||'aucune'}.</p>
    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap" id="b"></div></div></div>`;
  $('#b').appendChild(btn('↺ Rejouer la série',()=>{newGame(S.sc);S.screen='intro';render();}));
  $('#b').appendChild(btn('🏆 Hall of Fame',()=>{S.hofBack='final';S.screen='hof';render();},'sbtn'));
  $('#b').appendChild(btn('📣 Partager mon score',()=>shareScore(verdict),'sbtn'));
}
function shareScore(verdict){
  const lr=S.lastResult;
  const txt=`${S.name} · Le Jeu du DG (${N.ecole}) · ${verdict} : résultat net ${pct(lr.pct)} et ${(lr.rev/1000).toFixed(1).replace('.',',')} M€ de CA fin 2030, ${fmt(S.students)} ${SC.unit}, capital ${Math.round(S.g.ca)} pts. À vous de faire mieux : ecolesenligne.fr/lejeuduDG`;
  // image PNG
  const cv=document.createElement('canvas'); cv.width=1200; cv.height=630; const x=cv.getContext('2d');
  x.fillStyle='#0b1020'; x.fillRect(0,0,1200,630); x.strokeStyle='#c9a24a'; x.lineWidth=6; x.strokeRect(30,30,1140,570);
  x.fillStyle='#c9a24a'; x.font='bold 22px system-ui,sans-serif'; x.textAlign='center'; x.fillText((N.ecole+' · SAISONS 2026-2030').toUpperCase(),600,110);
  x.fillStyle='#f4f1e8'; x.font='900 64px Georgia,serif'; x.fillText('LE JEU DU DG',600,190);
  x.fillStyle='#eef2fb'; x.font='bold 40px system-ui,sans-serif'; x.fillText(S.name,600,280);
  x.fillStyle=lr.pct>=S.target?'#7ee0a0':lr.pct>=0?'#e8c15a':'#ff6b7a'; x.font='900 96px system-ui,sans-serif'; x.fillText(pct(lr.pct),600,400);
  x.fillStyle='#9aa4c8'; x.font='28px system-ui,sans-serif'; x.fillText(verdict+' · '+(lr.rev/1000).toFixed(1).replace('.',',')+' M€ de CA · '+fmt(S.students)+' '+SC.unit+' · capital '+Math.round(S.g.ca)+' pts',600,460);
  x.fillStyle='#c9a24a'; x.font='bold 26px system-ui,sans-serif'; x.fillText('ecolesenligne.fr/lejeuduDG',600,560);
  const url=cv.toDataURL('image/png');
  modal(`<h3>Partager mon score</h3><img src="${url}" alt="" style="width:100%;border-radius:8px;border:1px solid var(--line)"><textarea id="sh" readonly style="width:100%;height:84px;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px">${txt}</textarea><div class="mf"><button class="lnk" id="mc">Fermer</button><span style="display:flex;gap:8px"><a class="sbtn" href="${url}" download="le-jeu-du-dg-${S.name.replace(/\W+/g,'-')}.png" style="text-decoration:none">⬇ Image</a><button class="mbtn" id="cp">Copier le texte</button></span></div>`,'gold');
  document.getElementById('cp').onclick=()=>{const t=document.getElementById('sh'); t.select(); try{navigator.clipboard.writeText(txt).then(()=>{document.getElementById('cp').textContent='Copié ✓';}).catch(()=>{document.execCommand('copy');document.getElementById('cp').textContent='Copié ✓';});}catch(e){document.execCommand('copy');}};
}

// ---------- Démarrage ----------
function start(data){
  let loaded=null;
  if(data&&data.S) loaded=data.S;
  else { try{const s=localStorage.getItem('bde-save'); if(s) loaded=JSON.parse(s);}catch(e){} }
  applyScenario(loaded&&loaded.sc!==undefined?loaded.sc:0);
  if(loaded&&loaded.screen&&loaded.g&&loaded.used&&loaded.media&&loaded.sc!==undefined) S=loaded; else newGame(0);
  if(!S.pid){const t=S; newGame(); t.pid=S.pid; S=t;}
  if(S.screen==='title') S.screen='game';
  if(S.screen==='scenario'||S.screen==='profile') S.screen='intro';
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
