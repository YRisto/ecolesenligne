<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Le Jeu du DG : cinq écoles en ligne à diriger de 2026 à 2030.">
<title>Le Jeu du DG</title>
<style>
/* Layout: série politique — en-tête + bandeau d'épisodes, jauges collantes, carte d'épisode à cadre doré, panneau budget. Thème unique sombre, choisi délibérément. */
:root{
  --bg:#0f1631; --card:#172146; --card2:#141d3e; --line:#2e3a64; --line2:#26305a;
  --fg:#eef2fb; --cream:#f4f1e8; --muted:#b6bfe0; --muted2:#8b94ba;
  --gold:#c9a24a; --gold-dark:#a5843a; --gold-ink:#1a1408; --gold-hi:#e8c15a;
  --red:#c22020; --rose:#ff6b7a; --green:#7ee0a0; --green-deep:#2f8f46; --green-bg:#13291d; --green-line:#2f8f46;
  --orange:#f0a24b; --cyan:#3ec8d6; --blue:#7fa3e6; --violet:#b48be6;
  --serif:Georgia,"Times New Roman",serif;
  --sans:Marianne,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg) radial-gradient(ellipse 60% 40% at 50% 30%,#1e2a58 0%,transparent 70%);background-attachment:fixed;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:var(--serif);font-weight:900;letter-spacing:-.02em;color:var(--cream)}
.kicker{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mbtn{background:var(--gold);color:var(--gold-ink);border:1px solid var(--gold-dark);border-radius:8px;font-weight:800;padding:11px 22px;box-shadow:0 2px 0 var(--gold-dark)}
.mbtn:hover{background:var(--gold-hi)}
.mbtn:disabled{background:#1b2440;color:#55608a;border-color:#1b2440;box-shadow:none;cursor:not-allowed}
.sbtn{background:#141c36;color:var(--fg);border:1px solid var(--line);border-radius:8px;font-weight:700;padding:11px 18px}
.sbtn:hover{border-color:var(--gold)}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bdg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;display:grid;gap:4px;justify-items:center}
.bdg .ic{font-size:34px;line-height:1;width:96px;height:96px;display:block} .bdg .ic svg{width:96px;height:96px;display:block} .bdg.lock .ic{position:relative} .bdg.lock .ic::after{content:'🔒';position:absolute;right:-4px;bottom:-4px;font-size:22px;filter:none} .bdg b{font-size:13px;color:var(--fg)} .bdg small{font-size:11px;color:var(--muted);line-height:1.35} .bdg em{font-size:10px;color:var(--gold);font-style:normal}
.bdg.lock{opacity:.5} .bdg.lock svg{filter:grayscale(1) brightness(.7)} .bdg.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,162,74,.35) inset}
.toast.badge{border-color:var(--gold)} .toast.badge b,.toast.badge small{text-transform:none;letter-spacing:0} .toast.badge b{color:var(--gold-hi)}
.rbtn{background:var(--red);color:#fff;border:0;border-radius:8px;font-weight:800;padding:11px 22px}
.hidden{display:none!important}

.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:24px}
.panel{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:28px;max-width:680px;width:100%;display:grid;gap:14px}
.panel.wide{max-width:800px}
.panel .title{font-size:28px;text-align:center}
.flag{display:flex;justify-content:center;margin-bottom:4px} .flag img{width:72px;height:72px}
.tlogo img{width:96px;height:96px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.tile b{display:block;color:var(--fg);margin-bottom:3px;font-size:13.5px}
.tile.rose{border-left-color:var(--rose)} .tile.violet{border-left-color:var(--violet)} .tile.green{border-left-color:var(--green)} .tile.cyan{border-left-color:var(--cyan)}
.avatar{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a3f6a,#1a1f3d);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:40px;flex:none;box-shadow:0 0 0 3px #0b1020}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar.sm{width:56px;height:56px;font-size:26px;border-width:2px}
.speech{display:flex;gap:16px;align-items:flex-start}
.speech p{margin-bottom:8px;font-size:14.5px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;color:var(--fg)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--green);background:#0f2a1a}
.opt:disabled{opacity:.5;cursor:default}
.opt:disabled.sel{opacity:1}
.badge{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--gold);color:var(--gold-ink);vertical-align:middle;margin-left:6px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#1b2440;color:var(--muted);margin:2px 2px 0 0}
.chip.pos{background:#13291d;color:var(--green)} .chip.neg{background:#2e1420;color:var(--rose)} .chip.cap{background:#2a2410;color:var(--gold-hi)}
label.lab{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg);font:inherit;font-size:15px}
input[type=text]:focus{outline:none;border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prof{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;display:grid;gap:6px;justify-items:center;color:var(--muted);font-size:12.5px}
.prof b{color:var(--fg);font-size:13.5px}
.prof .ic{font-size:30px}
.prof.sel{border-color:var(--gold);background:#1a1a2e}
.credit{text-align:center;font-size:10px;color:var(--muted2)}

.titlecard{position:fixed;inset:0;background:var(--bg) radial-gradient(ellipse 40% 30% at 50% 45%,#182448,transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;animation:fadein .6s}
.titlecard .big{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6vw,56px);color:#e01b22;text-shadow:0 0 30px rgba(224,27,34,.5);letter-spacing:.02em;text-align:center;padding-inline:16px}
.titlecard .rule{width:280px;max-width:60vw;height:2px;background:#e01b22}
.titlecard .sub{font-size:14px;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;font-weight:700}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.resbox.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.96);box-shadow:0 0 0 0 rgba(126,224,160,.6)}100%{transform:none;box-shadow:0 0 0 18px rgba(126,224,160,0)}}
@media (prefers-reduced-motion:reduce){.confetti,.resbox.pop{animation:none;display:none}}

.game{max-width:1480px;margin:0 auto;display:grid;gap:14px;padding-top:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;flex:none} .brand .logo img{width:100%;height:100%;display:block}
.brand .t{font-size:13px;font-weight:900;letter-spacing:.14em;color:var(--gold)}
.brand .s{font-size:11px;color:var(--muted)}
.pill{background:#16203c;border:1px solid var(--cyan);color:var(--cyan);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:10px}
.pill.warn{border-color:var(--orange);color:var(--orange)} .pill.bad{border-color:var(--rose);color:var(--rose)}
.icons{display:flex;gap:6px}
.icons button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:#141c36;font-size:15px}
.episodes{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;display:grid;gap:1px;opacity:.55;position:relative}
.ep .m{font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .n{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .ic{font-size:14px}
.ep .st{position:absolute;right:6px;top:5px;font-size:10px;color:var(--muted2)}
.ep.done{opacity:.8} .ep.done .st{color:var(--green)}
.ep.on{opacity:1;border-color:var(--gold);background:linear-gradient(160deg,#3a2d12,#241a08)} .ep.on .m,.ep.on .n{color:var(--gold)} .ep.on .st{color:var(--gold)}
.gauges{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;background:var(--bg);padding-block:6px}
.gauge{background:var(--card);border:.8px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;transition:box-shadow .3s}
.gauge .l{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge .l .gi{font-size:14px;vertical-align:-1px;margin-right:2px}
.gauge .v{font-size:19px;font-weight:900;color:var(--cream);white-space:nowrap;margin:2px 0 4px}
.gauge .v small{font-size:11px;font-weight:700;color:var(--muted)}
.gauge .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,107,122,.38) 0 var(--z,0%),#243058 var(--z,0%));overflow:hidden}
.gauge .bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
.gauge .v .pv{font-size:12px;font-weight:800;margin-left:6px}
.gauge .v .pv.up{color:var(--green)} .gauge .v .pv.dn{color:var(--rose)}
.gauge .bar{position:relative} .gauge .bar em{position:absolute;top:0;height:100%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px)}
.gauge.has-pv{border-color:var(--gold)}
.gauge.flash{box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(201,162,74,.5)}
.gauge.c-ca{border-color:var(--gold-dark)}
.c-rev i{background:var(--cyan)} .c-res i{background:var(--rose)} .c-cash i{background:var(--orange)} .c-rate i{background:var(--cyan)} .c-ca i{background:var(--gold)} .c-etu i{background:#4ade80} .c-com i{background:var(--blue)} .c-cse i{background:var(--violet)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:24px;z-index:40;display:grid;gap:6px;pointer-events:none;width:260px}
.toast{background:var(--card);border:1.5px solid var(--green);border-radius:10px;padding:6px 14px;text-align:left;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toast 3.2s forwards;min-width:200px}
.toast.neg{border-color:var(--rose)}
.toast b{display:block;font-size:16px;color:var(--green)} .toast.neg b{color:var(--rose)}
.toast small{font-size:11px;color:var(--muted)}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.scene{background:var(--card2);border:1.5px solid var(--gold);border-radius:14px;padding:18px 18px 16px;display:grid;gap:12px;position:relative;overflow:hidden}
.scene .k{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.scene h2{font-size:24px}
.scene .tag{font-style:italic;color:var(--muted);font-family:var(--serif);font-weight:400;font-size:13.5px}
.ticker{margin-inline:-18px;background:var(--red);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;overflow:hidden;height:30px}
.ticker .d{background:#fff;color:var(--red);font-size:10px;font-weight:900;padding:2px 8px;border-radius:4px;margin:0 10px 0 16px;flex:none;letter-spacing:.06em}
.ticker .tk{white-space:nowrap;flex:1;overflow:hidden}
.ticker .tk span{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker .tk span{animation:none;padding-left:0}}
.dlg{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start} .dlg .avatar{grid-row:1/3} .dlg .who,.dlg .body{grid-column:2;min-width:0}
.dlg .who>b{display:block;font-size:15px} .dlg .who>small{color:var(--muted);font-size:12px;display:block;margin-bottom:6px}
.dlg .body p{font-size:14.5px;max-width:110ch}
.prompt{color:var(--gold);font-weight:700;font-size:13.5px}
.note{background:#16204a;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--fg)}
.note .h{color:var(--blue);font-weight:700;margin-bottom:4px}
.note ul{margin:6px 0 0 16px;padding:0;color:var(--muted)} .note li{margin:2px 0}
.resbox{background:#0f2a1a;border:1px solid var(--green-line);border-radius:10px;padding:12px 14px}
.resbox.bad{background:#2a0f14;border-color:#b33a3a} .resbox.neu{background:#1a1a2e;border-color:var(--line)}
.resbox b{display:block;font-size:15px;margin-bottom:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}

.hint{font-size:12px;color:var(--muted)}
.cat .tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center} .cat .tabs .tab{padding:6px 12px;border-radius:999px;font-size:12.5px;background:var(--card2);border:1px solid var(--line);color:var(--fg)} .cat .tabs .tab.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.cath{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.cath i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mrows{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))}
.mrow>span:nth-of-type(1){display:flex;align-items:center;gap:8px;min-width:0} .mrow>span:nth-of-type(1)::after{content:'';flex:1;min-width:12px;border-bottom:1px dotted #3a4570;transform:translateY(4px)}
@media (max-width:720px){.mrow>span:nth-of-type(1)::after{display:none} .mrow>span:nth-of-type(1){grid-column:2/-1} .mrow{row-gap:4px}}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--card);border:.8px solid #2a3458;border-radius:8px;padding:7px 12px;font-size:13px;position:relative;cursor:pointer}
.mrow:hover{border-color:var(--gold)}
.mrow.sel{border-color:var(--green);background:#0f2a1a}
.mrow.off{opacity:.45;cursor:not-allowed}
.mrow.fou{border-color:#6b2a3a;background:linear-gradient(90deg,#1c1020,var(--card))}
.mrow.fou .cap{color:var(--rose)}
.mrow input{width:14px;height:14px;margin:0;accent-color:var(--green)}
.mrow .amt{font-weight:800;font-size:12.5px;white-space:nowrap}
.mrow .amt.pos{color:var(--green-deep)} .mrow .amt.neg{color:var(--rose)} .mrow .amt.zero{color:var(--muted2)}
.mrow .cap{font-size:11px;font-weight:800;color:var(--gold-hi);white-space:nowrap;min-width:52px;text-align:right}
.mrow .cap.gain{color:var(--green)}
.mrow .tip{display:none;position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);background:#1b2440;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;white-space:normal;width:max-content;max-width:min(360px,80vw);z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.5);color:var(--fg)}
.mrow:hover .tip,.mrow:focus-within .tip{display:block}
.mrow .tip .d{color:var(--muted);display:block;margin-bottom:3px}
.mrow .mfx{display:none;grid-column:1/-1;font-size:11.5px;padding-top:4px;border-top:1px dashed var(--line)} .mrow .mfx .d{display:block;color:var(--muted);margin:2px 0}
@media (hover:none),(max-width:720px){.mrow .tip{display:none!important} .mrow .mfx{display:block}}
.capbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#2a2410;border:1px solid var(--gold-dark);border-radius:10px;padding:8px 14px;font-size:13px}
.capbar b{color:var(--gold-hi);font-size:16px}
.capbar.over{background:#2a0f14;border-color:#b33a3a} .capbar.over b{color:var(--rose)}
.budget{background:var(--card2);border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.budget .bh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px}
.btiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btile{border-radius:10px;padding:12px;text-align:center}
.btile .l{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.btile .v{font-size:22px;font-weight:900;margin:2px 0}
.btile .s{font-size:10px;color:var(--muted)}
.btile.g{background:var(--green-bg)} .btile.g .l,.btile.g .v{color:var(--green)}
.btile.o{background:#2a2410} .btile.o .l,.btile.o .v{color:var(--gold-hi)}
.btile.b{background:var(--card);border:1px solid var(--blue)} .btile.b .l,.btile.b .v{color:var(--blue)}
.btile.c{background:var(--card);border:1px solid var(--gold-dark)} .btile.c .l,.btile.c .v{color:var(--gold)}
.blines{background:var(--card);border-radius:10px;padding:8px 12px;font-size:12.5px;display:grid;gap:3px}
.blines div{display:flex;justify-content:space-between;gap:10px}
.blines .tot{font-weight:700;border-top:1px solid var(--line);padding-top:5px;margin-top:3px}
.proj{font-size:13px;color:var(--muted)} .proj b{font-size:20px;color:var(--cream);margin-left:6px}
.tw{overflow-x:auto;max-width:100%;min-width:0}
#scene,#scene>*{min-width:0}
.vt .sm{display:none}
@media (max-width:720px){.vt .lg{display:none}.vt .sm{display:inline}.vt th,.vt td{padding:7px 4px;font-size:12.5px}.vt td:first-child{width:52%}.vt th{font-size:14px}}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:100px;border-bottom:1px solid var(--line);padding-top:18px}
.hist div{background:var(--blue);min-height:2px;position:relative;font-size:10px;text-align:center;border-radius:3px 3px 0 0}
.hist div.neg{background:var(--rose)} .hist div.pos{background:#4ade80}
.hist div span{position:absolute;left:0;right:0;top:-17px;font-weight:700;color:var(--fg)}
.hist div em{position:absolute;left:0;right:0;bottom:-18px;font-style:normal;color:var(--muted)}

/* plan médias */
.media{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mch{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.mch .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mch .h b{font-size:14px} .mch .h span{font-size:11px;color:var(--muted)}
.mch .d{font-size:12px;color:var(--muted)}
.mch .stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:baseline}
.mch .stats b{color:var(--fg)}
.mch .amt{font-size:18px;font-weight:900;color:var(--gold-hi)}
.mch.warn{border-color:var(--rose)}
.mtot{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.overlay{position:fixed;inset:0;background:rgba(5,8,18,.75);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:#151a2e;border:1.5px solid var(--green);border-radius:14px;padding:26px 28px;max-width:460px;width:100%;text-align:center;display:grid;gap:8px;justify-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.bad{border-color:var(--rose)} .modal.gold{border-color:var(--gold);text-align:left;justify-items:stretch}
.modal .ic{font-size:36px} .modal .ic svg{width:96px;height:96px}
.modal .ml{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modal .mt{font-size:15px;color:var(--fg);max-width:40ch}
.modal .eff{font-weight:800;color:var(--green);font-size:14px} .modal.bad .eff{color:var(--rose)}
.modal .ms{font-size:11px;color:var(--muted)}
.modal h3{font-family:var(--serif);font-size:22px;color:var(--cream)}
.modal .mf{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:6px}
.modal .lnk{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 0}


/* Jauges : écart depuis le début de l'épisode, flash de variation */
.gauge .v{overflow:hidden;text-overflow:ellipsis}
.gauge .dl{font-size:11px;font-weight:900;margin-left:6px;padding:1px 6px;border-radius:999px;vertical-align:2px}
.gauge .dl.up{color:#0d2a18;background:var(--green)} .gauge .dl.dn{color:#3a0b12;background:var(--rose)}
.gauge.fl-up{animation:flup 1.2s ease-out} .gauge.fl-dn{animation:fldn 1.2s ease-out}
@keyframes flup{0%{box-shadow:0 0 0 2px var(--green),0 0 22px rgba(126,224,160,.55)}100%{box-shadow:none}}
@keyframes fldn{0%{box-shadow:0 0 0 2px var(--rose),0 0 22px rgba(255,107,122,.55)}100%{box-shadow:none}}
/* Transition entre épisodes */
.scene{animation:scenein .45s ease-out}
@keyframes scenein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* Résultats : révélation des comptes */
.reveal{display:grid;gap:8px;background:linear-gradient(160deg,var(--sc-bg,#16204a),#0f1631);border:1px solid var(--sc-line,var(--line));border-radius:14px;padding:16px 18px}
.reveal .rv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;opacity:0;transform:translateY(8px);animation:rvin .5s ease-out forwards}
.reveal .rv span{color:var(--muted);font-size:14px} .reveal .rv b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.reveal .rv.big{border-top:1px dashed var(--line);padding-top:10px} .reveal .rv.big span{color:var(--fg);font-weight:800;font-size:16px} .reveal .rv.big b{font-size:clamp(30px,7vw,44px)}
.reveal .verdict{justify-content:center;font-weight:800;font-size:15px;text-align:center}
.reveal .att{height:8px;border-radius:4px;background:#243058;overflow:hidden;opacity:0;animation:rvin .5s ease-out forwards} .reveal .att i{display:block;height:100%;width:0;border-radius:4px;transition:width 1.2s ease-out}
@keyframes rvin{to{opacity:1;transform:none}}
details.det>summary{cursor:pointer;list-style:none;display:inline-block;background:#1b2550;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;color:var(--fg)} details.det>summary::-webkit-details-marker{display:none}
details.det[open]>summary{margin-bottom:10px} details.det{display:grid;gap:10px}
/* Carte-titre de saison */
.titlecard .tsc{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:clamp(20px,4vw,30px);font-weight:900;color:var(--sc-hi,var(--gold-hi));opacity:0;animation:rvin .6s .5s ease-out forwards;transform:translateY(8px)}
.titlecard .tsc .ic{font-size:1.4em}
.titlecard .tlogo{animation:tpop .7s ease-out}
.titlecard .big{animation:tbig 1s ease-out}
.titlecard .rule{transform-origin:center;animation:trule .9s .3s ease-out both}
.titlecard .sub{opacity:0;animation:rvin .6s 1s ease-out forwards;transform:translateY(8px)}
.titlecard .year{font-family:var(--serif);font-size:clamp(40px,10vw,84px);font-weight:900;color:var(--cream);letter-spacing:.06em;opacity:0;animation:tyear .9s 1.3s ease-out forwards}
.titlecard::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);transform:translateX(-100%);animation:tsweep 1.6s .2s ease-in-out}
@keyframes tpop{0%{transform:scale(.4) rotate(-20deg);opacity:0}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}
@keyframes tbig{0%{letter-spacing:.5em;opacity:0}100%{letter-spacing:.02em;opacity:1}}
@keyframes trule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tyear{0%{opacity:0;transform:scale(1.4);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes tsweep{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.scene,.reveal .rv,.reveal .att,.titlecard *,.titlecard::after,.gauge.fl-up,.gauge.fl-dn{animation:none!important;opacity:1!important;transform:none!important}}

/* Dialogues en bulles successives */
.dlg .body .msg{background:#1c2752;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;margin:0 0 6px;width:fit-content;max-width:min(100%,72ch);opacity:0;transform:translateY(6px);animation:msgin .35s ease-out forwards}
.dlg .body .msg .kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchips span{background:#0f1631;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap} .kchips span.neg{color:var(--rose);border-color:rgba(255,107,122,.5)} .kchips span.pos{color:var(--green);border-color:rgba(126,224,160,.5)}
.dlg .body .typing{display:flex;gap:4px;height:22px;align-items:center;padding:0 12px;overflow:hidden;animation:typ .3s .35s forwards}
.dlg .body .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot .9s infinite} .dlg .body .typing i:nth-child(2){animation-delay:.15s} .dlg .body .typing i:nth-child(3){animation-delay:.3s}
.dlg .body details.more>summary{cursor:pointer;color:var(--sc-hi,var(--gold));font-weight:700;font-size:13px;margin:2px 0 6px;list-style:none} .dlg .body details.more>summary::-webkit-details-marker{display:none} .dlg .body details.more .msg{animation:none;opacity:1;transform:none}
@keyframes msgin{to{opacity:1;transform:none}} @keyframes typ{to{height:0;opacity:0}} @keyframes dot{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}
.dlg .avatar{animation:avpop .5s ease-out}
@keyframes avpop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
/* Lettre de mission */
.mandate{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .3s;cursor:pointer}
.mandate.out{transition:opacity .4s;opacity:0}
.letter{position:relative;background:#f6f1e3;color:#1a1f3d;width:min(440px,94vw);padding:26px 28px 34px;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:rotate(-1.2deg);font-family:var(--serif);animation:letterin .5s ease-out}
.letter .lh{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b6250;font-weight:800}
.letter h3{margin:6px 0 12px;font-size:24px} .letter p{margin:6px 0;font-size:15px} .letter .pres{margin-top:14px;font-style:italic;color:#4a4a5a}
.letter .sig{font-family:"Segoe Script","Brush Script MT","Snell Roundhand","Apple Chancery",cursive;font-size:clamp(28px,7vw,38px);color:#1b2a6b;white-space:nowrap;clip-path:inset(0 100% 0 0);animation:write 1.1s .45s ease-out forwards;padding:4px 0}
.letter .stamp{position:absolute;right:18px;bottom:16px;border:3px solid var(--sc,#c22020);color:var(--sc,#c22020);border-radius:8px;padding:6px 10px;font-family:var(--sans);font-weight:900;font-size:15px;line-height:1.1;text-align:center;letter-spacing:.06em;transform:rotate(-14deg) scale(2.4);opacity:0;animation:stamp .3s 1.65s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}} @keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:.92}} @keyframes letterin{from{transform:rotate(-6deg) translateY(30px);opacity:0}}
/* Couleur de l'école qui inonde l'écran */
.flood{position:fixed;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%) scale(0);z-index:70;pointer-events:none;animation:flood .55s ease-in forwards}
.flood.out{transition:opacity .45s;opacity:0}
@keyframes flood{to{transform:translate(-50%,-50%) scale(200)}}
/* Démarrage des jauges */
.gauges.boot .gauge{animation:gboot .45s both} .gauges.boot .bar i{animation:gbar 1s .35s both}
.gauges.boot .gauge:nth-child(2){animation-delay:.07s}.gauges.boot .gauge:nth-child(3){animation-delay:.14s}.gauges.boot .gauge:nth-child(4){animation-delay:.21s}.gauges.boot .gauge:nth-child(5){animation-delay:.28s}.gauges.boot .gauge:nth-child(6){animation-delay:.35s}.gauges.boot .gauge:nth-child(7){animation-delay:.42s}.gauges.boot .gauge:nth-child(8){animation-delay:.49s}
@keyframes gboot{from{opacity:0;transform:translateY(-8px) scale(.96)}} @keyframes gbar{from{width:0}}
/* Cœurs et éclairs qui volent vers les jauges */
.fly{position:fixed;z-index:80;pointer-events:none;font-size:22px;transform:translate(-50%,-50%)}
.gauge.hit{animation:ghit .35s} .gauge.shake{animation:gshake .4s}
@keyframes ghit{50%{transform:scale(1.05)}} @keyframes gshake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
/* Révélation en attente tant que le bloc n'est pas visible */
.reveal.wait .rv,.reveal.wait .att{animation-play-state:paused}
@media (hover:none),(max-width:720px){.mrow .mfx .d{display:none} .mrow.sel .mfx .d{display:block}}
@media (prefers-reduced-motion:reduce){.dlg .body .msg{animation:none;opacity:1;transform:none}.dlg .body .typing{display:none}.letter .sig{clip-path:none;animation:none}.letter .stamp{animation:none;opacity:.92;transform:rotate(-14deg)}.flood,.gauges.boot *,.dlg .avatar{animation:none!important}}

/* ── Bouquet final du show de fin d'année ── */
.sfx{position:fixed;inset:0;z-index:60;background:#05070f;color:#eef2fb;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;animation:sfxin .4s ease both}
.sfx.out{animation:sfxout .5s ease forwards}
@keyframes sfxin{from{opacity:0}to{opacity:1}} @keyframes sfxout{to{opacity:0}}
.sfx .skip{position:absolute;right:14px;bottom:12px;font-size:11px;color:#8a93b0;letter-spacing:.08em;text-transform:uppercase}
.sfx .stage{position:relative;width:min(92vw,720px);text-align:center}
.sfx .spot{position:absolute;left:50%;top:-40vh;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 65%);transform:translate(-50%,0);animation:spot 1.2s ease-out forwards;pointer-events:none}
@keyframes spot{to{top:8vh}}
.sfx .num{font-size:clamp(28px,7vw,64px);font-weight:900;line-height:1.1;margin:6px 0;opacity:0;animation:drop .5s cubic-bezier(.2,1.4,.4,1) forwards}
.sfx .num small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a93b0}
@keyframes drop{from{opacity:0;transform:translateY(-60px) scale(1.3)}to{opacity:1;transform:none}}
.sfx.quake{animation:quake .5s linear}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-4px)}80%{transform:translate(4px,3px)}}
.sfx .live{display:inline-flex;gap:6px;align-items:center;background:#fff;color:#1d2b64;font-weight:900;font-size:12px;padding:3px 10px;border-radius:999px;letter-spacing:.1em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.sfx .type{font-family:Georgia,serif;font-size:clamp(20px,3.6vw,32px);line-height:1.4;min-height:3em;margin-top:22px}
.sfx .type i{display:inline-block;width:2px;height:1em;background:#eef2fb;vertical-align:-0.15em;animation:blink .8s steps(2) infinite}
.sfx .faces{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:min(92vw,520px);margin:0 auto}
.sfx .faces b{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;opacity:0;animation:pop .35s ease forwards;transition:transform .3s,background .3s}
.sfx .faces b.flip{transform:rotateY(180deg)} .sfx .faces b.flip span{transform:rotateY(180deg);display:block}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1}}
.sfx .cap{font-family:Georgia,serif;font-size:clamp(18px,3vw,28px);margin-top:24px;opacity:0;animation:pop .5s ease 2.4s forwards}
.sfx.strobe{background:#000}
.sfx .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .5s steps(1) 5;pointer-events:none}
@keyframes flash{0%{opacity:.85}20%{opacity:0}}
.gauges.party .gauge{animation:party .5s ease-in-out 6}
@keyframes party{50%{transform:scale(1.06)}}
.sfx .cups{display:flex;gap:min(5vw,40px);justify-content:center;align-items:flex-end}
.sfx .cup{opacity:0;transform:translateY(60vh);animation:rise .9s cubic-bezier(.2,1.2,.4,1) forwards;position:relative;flex:1;max-width:200px}
.sfx .cup .ic{font-size:clamp(44px,10vw,84px);display:block;filter:drop-shadow(0 0 18px rgba(255,210,90,.6))}
.sfx .cup.grey .ic{filter:grayscale(1) opacity(.5)} .sfx .cup.grey .halo{display:none}
.sfx .cup .t{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#c9a24a;margin-top:6px}.sfx .cup .n{font-weight:800;font-size:13px}
.sfx .cup .halo{position:absolute;left:50%;top:30%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,rgba(255,210,90,0),rgba(255,210,90,.35),rgba(255,210,90,0) 30%);animation:spin 2.5s linear infinite;z-index:-1}
@keyframes rise{to{opacity:1;transform:none}} @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.sfx .clap{font-size:40px;margin-top:20px;animation:clap .5s ease-in-out 4}
@keyframes clap{50%{transform:scale(1.2) rotate(-8deg)}}
.sfx .ball{position:absolute;left:50%;top:-30vh;width:min(28vw,150px);height:min(28vw,150px);border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#fff 0,#dfe6ff 12%,#8a93b0 40%,#3a4260 70%),repeating-conic-gradient(rgba(255,255,255,.25) 0 6deg,rgba(0,0,0,.25) 6deg 12deg);background-blend-mode:overlay;box-shadow:0 0 60px rgba(255,255,255,.35);animation:balldown 4s ease-in-out forwards}
.sfx .ball:before{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:40vh;background:#8a93b0;transform:translateX(-50%)}
@keyframes balldown{0%{top:-30vh}25%{top:6vh}80%{top:6vh}100%{top:-30vh}}
.sfx .beam{position:absolute;width:26vmin;height:26vmin;border-radius:50%;filter:blur(18px);opacity:.7;animation:beam 1.6s ease-in-out infinite alternate;mix-blend-mode:screen;pointer-events:none}
@keyframes beam{from{transform:translate(-30vw,-20vh) scale(.8)}to{transform:translate(30vw,25vh) scale(1.3)}}
.sfx .line{position:relative;height:3px;background:#2a3458;margin:40px auto 0;width:min(84vw,600px)}
.sfx .line i{position:absolute;left:0;top:0;height:100%;width:0;background:#c9a24a;animation:grow 2.4s linear forwards}
@keyframes grow{to{width:100%}}
.sfx .yr{position:absolute;top:-34px;transform:translateX(-50%);font-weight:900;font-size:clamp(14px,3vw,22px);opacity:.25;animation:lit .3s ease forwards}
@keyframes lit{to{opacity:1;color:#ffd76a;text-shadow:0 0 18px rgba(255,210,90,.6)}}
.sfx .cloud{position:relative;height:30vh;margin-top:50px}
.sfx .cloud span{position:absolute;font-weight:800;opacity:0;animation:floatw 2.6s ease-out forwards;white-space:nowrap}
@keyframes floatw{0%{opacity:0;transform:translateY(30px) scale(.8)}20%{opacity:1}100%{opacity:.9;transform:translateY(-40px) scale(1.1)}}
.sfx .map{display:grid;gap:3px;width:min(92vw,560px);margin:0 auto}
.sfx .map i{aspect-ratio:1;border-radius:50%;background:#1b2340;opacity:.5;transition:background .4s,opacity .4s,transform .4s}
.sfx .map i.on{background:#ffd76a;opacity:1;transform:scale(1.25);box-shadow:0 0 8px rgba(255,210,90,.7)}
.sfx .map i.off{background:#5a1f2a;opacity:1;transform:none;box-shadow:none}
.sfx .slide{width:min(92vw,640px);aspect-ratio:16/9;background:#fff;color:#111;border-radius:6px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:left;padding:5%;animation:slidein .5s ease both;margin:0 auto}
.sfx .slide h2{font-family:Georgia,serif;font-size:clamp(20px,4vw,36px);margin:0 0 4px;color:#111} .sfx .slide p{color:#666;font-size:12px;margin:0}
.sfx .slide svg{position:absolute;left:0;bottom:0;width:100%;height:70%;overflow:visible}
.sfx .slide path{stroke:#e0552f;stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.8s ease-out .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes slidein{from{opacity:0;transform:translateX(40px)}}
.sfx .slide.q{display:flex;align-items:center;justify-content:center} .sfx .slide.q h2{font-size:clamp(28px,6vw,54px)}
.sfx .mail{width:min(92vw,560px);background:#f7f7f9;color:#222;border-radius:10px;overflow:hidden;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.6);font-size:14px;margin:0 auto}
.sfx .mail .bar{background:#e4e5ea;padding:8px 12px;font-size:12px;color:#666;display:flex;gap:6px;align-items:center} .sfx .mail .bar i{width:10px;height:10px;border-radius:50%;background:#ccc;display:inline-block}
.sfx .mail .f{padding:6px 14px;border-bottom:1px solid #e4e5ea;color:#555;font-size:13px} .sfx .mail .b{padding:14px;min-height:7em;white-space:pre-wrap;line-height:1.5}

.sfx .mail .send.hit{animation:pressed .25s ease}
@keyframes pressed{50%{transform:scale(.92);background:#1c47a8}}
.sfx .cur{position:absolute;font-size:26px;transition:left 1.1s ease-in-out,top 1.1s ease-in-out;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.sfx .read{padding:10px 14px;font-size:13px;color:#555;border-top:1px solid #e4e5ea;background:#fff} .sfx .read b{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){.sfx,.sfx *{animation-duration:.01s!important;transition:none!important}}

/* ── Écran d'accueil ── */
.hero{text-align:center;display:grid;gap:8px}
.hero .punch{font-family:var(--serif);font-weight:900;font-size:clamp(27px,5.4vw,44px);line-height:1.04;letter-spacing:-.02em;color:var(--cream);margin:4px 0 0}
.hero .punch em{font-style:normal;color:var(--gold-hi);text-shadow:0 0 24px rgba(232,193,90,.35)}
.hero .sub{color:var(--muted);font-size:14px;max-width:52ch;margin:0 auto}
.pitch{display:flex;gap:12px;align-items:center;justify-content:center;text-align:left;margin-top:4px}
.pitch .avatar{width:62px;height:62px}
.pitch blockquote{margin:0;font-family:var(--serif);font-size:clamp(14px,2.2vw,16px);line-height:1.4;color:var(--cream);font-weight:400;max-width:60ch}
.pitch blockquote small{display:block;font-family:inherit;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px;font-family:system-ui,sans-serif}
.stats{display:flex;justify-content:center;gap:clamp(14px,4vw,34px);flex-wrap:wrap;margin:6px 0 2px}
.stats div{text-align:center;min-width:60px} .stats b{display:block;font-size:24px;font-weight:900;color:var(--gold-hi);font-variant-numeric:tabular-nums;line-height:1} .stats small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.schools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.schools span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;background:var(--card2);white-space:nowrap} .schools span i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor} .schools span small{font-weight:400;color:var(--muted)}
.rules{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)} .rules span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.cta{font-size:17px;padding:14px 30px;animation:ctapulse 1.8s infinite}
@keyframes ctapulse{0%{box-shadow:0 0 0 0 rgba(201,162,74,.55)}70%{box-shadow:0 0 0 14px rgba(201,162,74,0)}100%{box-shadow:0 0 0 0 rgba(201,162,74,0)}}
.played{font-size:12px;color:var(--muted);text-align:center;min-height:1em} .played b{color:var(--cream)}
@media (max-width:720px){.pitch{flex-direction:column;text-align:center} .hero .punch{font-size:30px}}
/* Note du DAF, version légère */
.daf{background:#16204a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:grid;gap:8px}
.daf .h{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.04em}
.daf .big{font-size:15px} .daf .big b{font-size:20px}
.daf .k3{display:flex;gap:6px;flex-wrap:wrap} .daf .k3 span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted)} .daf .k3 b{color:var(--fg)}
.daf details summary{cursor:pointer;list-style:none;font-size:12px;color:var(--sc-hi,var(--gold));font-weight:700} .daf details summary::-webkit-details-marker{display:none} .daf details ul{margin:6px 0 0 16px;padding:0;color:var(--muted);font-size:12.5px} .daf details li{margin:2px 0}

/* ── Ouverture : étincelles, onde de choc, titre qui claque ── */
.sparks{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.sparks i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px var(--gold-hi);opacity:0;animation:sparkup 2.6s ease-out forwards}
@keyframes sparkup{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-95vh) scale(1.4)}}
.panel.open{animation:panelin .6s ease-out both}
@keyframes panelin{from{opacity:0;transform:scale(.96)}}
.open .flag{position:relative} .open .flag img{animation:logoslam .7s cubic-bezier(.2,1.6,.4,1) .2s both}
@keyframes logoslam{from{transform:scale(2.4);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.open .flag::after{content:'';position:absolute;left:50%;top:50%;width:72px;height:72px;border:3px solid var(--gold-hi);border-radius:50%;transform:translate(-50%,-50%) scale(1);opacity:0;animation:ring .9s ease-out .55s}
@keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(7)}}
.open .punch .w{display:inline-block;opacity:0;animation:slam .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes slam{from{opacity:0;transform:scale(2.6) translateY(-10px);filter:blur(4px)}60%{filter:none}to{opacity:1;transform:none}}
.open .kicker,.open .sub,.open .speech,.open .tiles,.open #b,.open .played,.open .credit{opacity:0;animation:rvin .6s ease-out both}
.open .kicker{animation-delay:.9s} .open .sub{animation-delay:3.3s} .open .speech{animation-delay:3.6s} .open .tiles{animation-delay:3.9s} .open #b{animation-delay:4.2s} .open .played,.open .credit{animation-delay:4.5s}
body.quake{animation:quake .4s linear}
@media (prefers-reduced-motion:reduce){.sparks{display:none} .open *,.panel.open{animation:none!important;opacity:1!important}}

@media (max-width:720px){
 .gauges.boot .gauge{animation-duration:.9s} .gauges.boot .bar i{animation-duration:1.8s;animation-delay:.6s}
 .gauges.boot .gauge:nth-child(2){animation-delay:.18s}.gauges.boot .gauge:nth-child(3){animation-delay:.36s}.gauges.boot .gauge:nth-child(4){animation-delay:.54s}.gauges.boot .gauge:nth-child(5){animation-delay:.72s}.gauges.boot .gauge:nth-child(6){animation-delay:.9s}.gauges.boot .gauge:nth-child(7){animation-delay:1.08s}.gauges.boot .gauge:nth-child(8){animation-delay:1.26s}
 .fly{font-size:30px}
 .flood{animation-duration:.9s}
 .letter .sig{animation-duration:1.6s;animation-delay:.6s} .letter .stamp{animation-delay:2.4s}
}
.floodname{position:fixed;inset:0;z-index:71;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-family:var(--serif);font-weight:900;font-size:clamp(26px,7vw,48px);text-align:center;padding:16px;pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.35);animation:fnin .5s ease-out both}
.floodname .ic{font-size:1.6em} .floodname small{font-family:var(--sans);font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;opacity:.85}
.floodname.out{transition:opacity .4s;opacity:0}
@keyframes fnin{from{opacity:0;transform:scale(.85)}}

/* ── Animations des imprévus ── */
.sfx .evcap{position:absolute;left:0;right:0;bottom:12%;text-align:center;padding:0 18px;opacity:0;animation:pop .5s ease forwards}
.sfx .evcap small{display:block;font:700 11px var(--sans);letter-spacing:.25em;text-transform:uppercase;color:#8a93b0;margin-bottom:6px}
.sfx .evcap b{font-family:var(--serif);font-size:clamp(19px,4.2vw,30px);line-height:1.25;display:block;max-width:26ch;margin:0 auto}
.sfx .evcap.bad b{color:#ff8a96} .sfx .evcap.good b{color:#9df0b8}
/* 1 panne */
.sfx.glitch{background:#000}
.sfx .gl{font:900 clamp(48px,14vw,120px)/1 var(--sans);letter-spacing:.04em;color:#fff;position:relative;animation:glj .18s steps(2) infinite}
.sfx .gl:before,.sfx .gl:after{content:attr(data-t);position:absolute;inset:0}
.sfx .gl:before{color:#ff2d55;transform:translate(-4px,1px);clip-path:inset(0 0 55% 0);mix-blend-mode:screen}
.sfx .gl:after{color:#2de1ff;transform:translate(4px,-1px);clip-path:inset(50% 0 0 0);mix-blend-mode:screen}
@keyframes glj{0%{transform:none}50%{transform:translate(3px,-2px) skewX(-6deg)}100%{transform:translate(-2px,1px)}}
.sfx .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px);pointer-events:none}
.sfx .errwin{position:absolute;background:#d9dde8;color:#222;border-radius:4px;font:12px var(--sans);width:min(60vw,220px);box-shadow:0 8px 20px rgba(0,0,0,.6);opacity:0;animation:pop .2s ease forwards}
.sfx .errwin b{display:block;background:#2a62d8;color:#fff;padding:3px 8px;font-size:11px} .sfx .errwin span{display:block;padding:8px}
.sfx.off .stage{animation:crt .5s ease-in forwards}
@keyframes crt{60%{transform:scaleY(.02);filter:brightness(3)}100%{transform:scale(0,.01);opacity:0}}
/* 2 tampon */
.sfx .paper{width:min(84vw,380px);aspect-ratio:3/4;background:#f6f1e3;margin:0 auto;border-radius:4px;padding:8% 9%;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.6);position:relative;animation:letterin .6s ease-out both;color:#1a1f3d}
.sfx .paper h4{font:900 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;margin:0 0 12px;color:#6b6250}
.sfx .paper i{display:block;height:7px;background:#d8d0bc;border-radius:3px;margin:9px 0}
.sfx .bigstamp{position:absolute;left:50%;top:48%;border:5px solid #c22020;color:#c22020;font:900 clamp(22px,6vw,34px)/1.05 var(--sans);padding:8px 14px;border-radius:10px;letter-spacing:.06em;transform:translate(-50%,-50%) rotate(-16deg) scale(3);opacity:0;animation:bstamp .28s cubic-bezier(.3,1.6,.5,1) 1.2s forwards;white-space:nowrap;background:rgba(246,241,227,.6)}
@keyframes bstamp{to{transform:translate(-50%,-50%) rotate(-16deg) scale(1);opacity:.9}}
/* 3 la une */
.sfx .news{width:min(86vw,420px);background:#ece8dc;color:#111;margin:0 auto;padding:16px 18px 22px;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.7);animation:spinin 1.3s cubic-bezier(.2,.8,.3,1) both}
@keyframes spinin{from{transform:rotate(-1080deg) scale(0)}}
.sfx .news .mast{font:900 clamp(20px,5vw,30px)/1 var(--serif);text-align:center;border-bottom:3px double #111;padding-bottom:6px;margin-bottom:4px}
.sfx .news .date{font:10px var(--sans);text-align:center;color:#555;border-bottom:1px solid #111;padding-bottom:4px;margin-bottom:10px;letter-spacing:.1em;text-transform:uppercase}
.sfx .news h3{font:900 clamp(18px,4.6vw,26px)/1.12 var(--serif);margin:0 0 10px;color:#111}
.sfx .news .cols{columns:2;column-gap:12px} .sfx .news .cols i{display:block;height:5px;background:#bdb7a6;margin:6px 0;border-radius:2px}
/* 4 argent qui s'envole */
.sfx .bill{position:absolute;font-size:clamp(28px,7vw,46px);bottom:-60px;animation:billup 2.6s ease-in forwards}
@keyframes billup{to{transform:translate(var(--dx),-120vh) rotate(var(--r));opacity:.2}}
.sfx .drop{font:900 clamp(40px,11vw,86px)/1 var(--sans);font-variant-numeric:tabular-nums}
/* 5 pancartes */
.sfx .signs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:620px;margin:0 auto}
.sfx .sign{background:#f4efe0;color:#b01e2e;font:900 clamp(14px,3.6vw,20px)/1.1 var(--sans);padding:12px 14px;border-radius:4px;box-shadow:0 6px 0 #6b4a2a;position:relative;transform:translateY(80vh);animation:signup .6s cubic-bezier(.2,1.3,.4,1) forwards,bob .7s ease-in-out infinite alternate}
.sfx .sign:after{content:'';position:absolute;left:50%;top:100%;width:6px;height:46px;background:#6b4a2a;transform:translateX(-50%)}
@keyframes signup{to{transform:none}} @keyframes bob{to{margin-top:-10px}}
/* 6 alerte */
.sfx.alert{background:radial-gradient(circle at 50% 50%,#2a0508,#05070f 70%)}
.sfx .siren{position:absolute;inset:-50%;background:conic-gradient(from 0deg,rgba(255,40,60,.0),rgba(255,40,60,.45) 20deg,rgba(255,40,60,0) 60deg,rgba(255,40,60,0) 180deg,rgba(255,40,60,.45) 200deg,rgba(255,40,60,0) 240deg);animation:sweep 1.1s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.sfx .alertw{font:900 clamp(40px,12vw,96px)/1 var(--sans);letter-spacing:.12em;color:#ff4d5e;text-shadow:0 0 30px rgba(255,40,60,.8);animation:blink .5s steps(2) infinite;position:relative}
.sfx .radar{width:min(60vw,240px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,77,94,.5);margin:24px auto 0;position:relative;background:repeating-radial-gradient(circle,transparent 0 28px,rgba(255,77,94,.18) 28px 30px)}
.sfx .radar b{position:absolute;width:12px;height:12px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 12px #ff4d5e;left:50%;top:50%;animation:blip 2.4s ease-in forwards}
@keyframes blip{from{transform:translate(-50%,-50%) translate(var(--x),var(--y))}to{transform:translate(-50%,-50%) translate(0,0) scale(1.6)}}
/* 7 buzz */
.sfx .camflash{position:absolute;width:40vmin;height:40vmin;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 60%);opacity:0;animation:camf .35s ease-out forwards}
@keyframes camf{30%{opacity:1}100%{opacity:0}}
.sfx .likes{font:900 clamp(44px,12vw,96px)/1 var(--sans);color:#fff;font-variant-numeric:tabular-nums}
.sfx .likes small{display:block;font-size:13px;letter-spacing:.2em;color:#9df0b8;text-transform:uppercase;margin-top:6px}
.sfx .heartup{position:absolute;bottom:-40px;font-size:clamp(22px,5vw,34px);animation:hup 2.4s ease-out forwards}
@keyframes hup{to{transform:translate(var(--dx),-110vh) scale(1.3);opacity:0}}
/* 8 contrat signé */
.sfx .contract{width:min(84vw,380px);background:#fff;color:#111;margin:0 auto;border-radius:6px;padding:20px 22px;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:letterin .5s ease-out both}
.sfx .contract h4{font:900 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px} .sfx .contract i{display:block;height:6px;background:#e3e3e8;border-radius:3px;margin:8px 0}
.sfx .contract svg{width:70%;height:60px;display:block;margin-top:10px} .sfx .contract path{stroke:#1b2a6b;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1s ease-out .6s forwards}
.sfx .coin{position:absolute;top:-60px;font-size:clamp(24px,6vw,38px);animation:coindown 1.4s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes coindown{to{transform:translateY(115vh) rotate(540deg)}}
.sfx .gain{font:900 clamp(36px,10vw,72px)/1 var(--sans);color:#7ee0a0;text-shadow:0 0 30px rgba(126,224,160,.5);margin-top:18px;font-variant-numeric:tabular-nums}
/* 9 médaille + feu d'artifice */
.sfx .medal{font-size:clamp(80px,22vw,160px);display:inline-block;transform-origin:50% 0;animation:swing 1.6s ease-out both;filter:drop-shadow(0 0 30px rgba(255,210,90,.6))}
@keyframes swing{0%{transform:translateY(-80vh) rotate(0)}40%{transform:none rotate(14deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.sfx .burst{position:absolute;width:6px;height:6px;border-radius:50%}
.sfx .burst i{position:absolute;left:0;top:0;width:5px;height:5px;border-radius:50%;background:inherit;animation:spark 1.1s ease-out forwards}
@keyframes spark{to{transform:rotate(var(--a)) translateX(var(--d));opacity:0}}
/* 10 coût du lead */
.sfx .cpl{width:min(86vw,460px);margin:0 auto;background:#0b1020;border:1px solid #2a3458;border-radius:12px;padding:16px;text-align:left}
.sfx .cpl .hd{display:flex;align-items:center;gap:10px;font:800 14px var(--sans)} .sfx .cpl .logo{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:900 18px var(--sans);color:#fff}
.sfx .cpl svg{width:100%;height:150px;display:block;margin-top:10px;overflow:visible} .sfx .cpl path{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s ease-out .3s forwards}
.sfx .cpl .pct{font:900 clamp(30px,8vw,52px)/1 var(--sans);margin-top:6px;opacity:0;animation:pop .4s ease 1.8s forwards}
@media (prefers-reduced-motion:reduce){.sfx .gl,.sfx .sign,.sfx .alertw{animation:none!important}}

/* ── Show v2 : rideau, micro, égaliseur, tapis rouge, disco, fusée, vols, criquet, réactions ── */
.sfx .curtain{position:absolute;top:0;bottom:0;width:51%;z-index:3;background:repeating-linear-gradient(90deg,#7a0f1c 0 18px,#a3172a 18px 30px,#7a0f1c 30px 44px);box-shadow:inset 0 -40px 60px rgba(0,0,0,.5);animation:curt 1.2s cubic-bezier(.7,0,.3,1) .35s forwards}
.sfx .curtain.l{left:0;--to:-100%} .sfx .curtain.r{right:0;--to:100%}
.sfx .curtain:after{content:'';position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(#c9a24a,#7a5a1a);box-shadow:0 6px 12px rgba(0,0,0,.5)}
@keyframes curt{to{transform:translateX(var(--to))}}
.sfx .mic{font-size:clamp(60px,16vw,110px);position:relative;display:inline-block;margin-bottom:6px}
.sfx .mic i{position:absolute;left:50%;top:40%;width:60px;height:60px;border:3px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%);animation:wave 1.6s ease-out infinite;opacity:0}
.sfx .mic i:nth-child(2){animation-delay:.5s}.sfx .mic i:nth-child(3){animation-delay:1s}
@keyframes wave{0%{opacity:.8;width:60px;height:60px}100%{opacity:0;width:300px;height:300px}}
.sfx .wbars{display:flex;gap:4px;justify-content:center;align-items:center;height:60px;margin-top:10px}
.sfx .wbars b{width:5px;border-radius:3px;background:#7fa3e6;height:10px;animation:wb .5s ease-in-out infinite alternate}
@keyframes wb{to{height:var(--h)}}
.sfx .meter{width:min(80vw,420px);height:16px;border-radius:8px;background:#1b2340;margin:16px auto 0;overflow:hidden;border:1px solid #2a3458}
.sfx .meter i{display:block;height:100%;width:0;transition:width 2.2s cubic-bezier(.2,.8,.3,1)}
.sfx .meter+small{display:block;margin-top:6px;font:700 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#8a93b0}
.sfx .eqz{position:absolute;left:0;right:0;bottom:0;height:45vh;display:flex;gap:3px;align-items:flex-end;padding:0 6px;opacity:.85;pointer-events:none}
.sfx .eqz b{flex:1;border-radius:3px 3px 0 0;height:10%;animation:eqb .35s ease-in-out infinite alternate}
@keyframes eqb{to{height:var(--h)}}
.sfx .pulse{animation:pulse .35s ease-in-out infinite alternate} @keyframes pulse{to{transform:scale(1.08)}}
.sfx .carpet{position:absolute;left:50%;bottom:0;width:120vw;height:46vh;transform:translateX(-50%);background:linear-gradient(#8e1426,#c21f37);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.9}
.sfx .spot2{position:absolute;bottom:-10vh;width:30vw;height:130vh;background:linear-gradient(to top,rgba(255,240,200,.35),rgba(255,240,200,0));clip-path:polygon(45% 100%,55% 100%,100% 0,0 0);transform-origin:50% 100%;animation:spotsw 2.2s ease-in-out infinite alternate;pointer-events:none}
@keyframes spotsw{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.sfx .ball2{position:absolute;left:50%;top:-30vh;width:min(34vw,170px);aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 22%),repeating-linear-gradient(0deg,#cfd6ea 0 9px,#5a6280 9px 11px),repeating-linear-gradient(90deg,#e8ecf8 0 9px,#4a5270 9px 11px);background-blend-mode:screen,multiply,normal;box-shadow:0 0 70px rgba(255,255,255,.45);animation:balldown 4.6s ease-in-out forwards,ballspin 1.2s linear infinite;z-index:2}
@keyframes ballspin{to{background-position:0 0,0 22px,22px 0}}
.sfx .ball2:before{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:40vh;background:#8a93b0;transform:translateX(-50%)}
.sfx .ldot{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;animation:ldot 2.2s linear infinite;opacity:.85}
@keyframes ldot{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sfx .rocket{position:absolute;top:-30px;left:0;font-size:34px;transform:translateX(-50%) rotate(45deg);animation:rk 2.4s linear forwards;filter:drop-shadow(0 0 12px rgba(255,160,60,.8))}
@keyframes rk{to{left:100%}}
.sfx .rocket.away{animation:rkaway 1s ease-in forwards} @keyframes rkaway{to{left:130%;top:-60vh}}
.sfx .mapw{position:relative;width:min(92vw,560px);margin:0 auto} .sfx .mapw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sfx .mapw path{fill:none;stroke:#ffd76a;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:4 3;opacity:0;animation:arc 1.2s ease-out forwards}
@keyframes arc{from{opacity:0;stroke-dashoffset:60}to{opacity:1;stroke-dashoffset:0}}
.sfx .cricket{position:absolute;top:24%;left:-10%;font-size:34px;animation:hop 3s linear forwards}
@keyframes hop{0%{left:-10%}10%{transform:translateY(-30px)}20%{transform:none}30%{transform:translateY(-30px)}40%{transform:none}50%{transform:translateY(-30px)}60%{transform:none}70%{transform:translateY(-30px)}80%{transform:none}100%{left:110%}}
.sfx .reacts{position:absolute;right:4vw;top:16vh;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.sfx .reacts span{background:#fff;color:#222;border-radius:14px 14px 4px 14px;padding:6px 12px;font:600 13px var(--sans);box-shadow:0 6px 18px rgba(0,0,0,.5);opacity:0;animation:pop .3s ease forwards}

/* ── Imprévus, série 2 ── */
.sfx .mx{position:absolute;top:-40%;font:700 15px/1.05 ui-monospace,Menlo,monospace;color:#3cff8f;text-shadow:0 0 8px #3cff8f;writing-mode:vertical-rl;opacity:.55;animation:mxf linear infinite;white-space:nowrap}

/* ── Transition entre épisodes ── */

/* ── Accessibilité ── */

/* Couleur propre à chaque scénario : bandeau DIRECT, cadres, onglet d'épisode, carte-titre, encadrés, halo du fond */
html[data-sc=xyn]{--sc:#1f3a93;--sc-hi:#7b97f2;--sc-line:#3352c0;--sc-bg:#0f1a3d;--sc-glow:#152558}

html[data-sc=cnf]{--sc:#1673cc;--sc-hi:#6cb8ff;--sc-line:#2489e8;--sc-bg:#0e2238;--sc-glow:#0f2d50}
html[data-sc=minuit]{--sc:#5b21b6;--sc-hi:#b794f6;--sc-line:#7c3aed;--sc-bg:#1d1036;--sc-glow:#2a1450}
html[data-sc=orbitale]{--sc:#0e7490;--sc-hi:#67d4ea;--sc-line:#0891b2;--sc-bg:#0a2530;--sc-glow:#0c3340}
html[data-sc=paysans]{--sc:#854d0e;--sc-hi:#e6b05a;--sc-line:#a16207;--sc-bg:#2a1c08;--sc-glow:#3a270b}
html[data-sc=hippocampus]{--sc:#1f8a52;--sc-hi:#66d89b;--sc-line:#2aa463;--sc-bg:#0f2a1e;--sc-glow:#10382a}
html[data-sc] body{background:var(--bg) radial-gradient(ellipse 60% 40% at 50% 30%,var(--sc-glow) 0%,transparent 70%);background-attachment:fixed}
html[data-sc] .ticker{background:var(--sc)} html[data-sc] .ticker .d{color:var(--sc)}
html[data-sc] .scene,html[data-sc] .budget{border-color:var(--sc-line)}
html[data-sc] .scene{box-shadow:inset 0 3px 0 var(--sc-line)}
html[data-sc] .scene>.k .kicker{color:var(--sc-hi)}
html[data-sc] .ep.on{border-color:var(--sc-hi);background:linear-gradient(160deg,var(--sc-bg),#0b1020)} html[data-sc] .ep.on .m,html[data-sc] .ep.on .n,html[data-sc] .ep.on .st{color:var(--sc-hi)}
html[data-sc] .note{background:var(--sc-bg);border-color:var(--sc-line)}
html[data-sc] .avatar{border-color:var(--sc-line)}
html[data-sc] .brand .t{color:var(--sc-hi)}
html[data-sc] .titlecard{background:var(--bg) radial-gradient(ellipse 40% 30% at 50% 45%,var(--sc-glow),transparent 70%)}
html[data-sc] .titlecard .big{color:var(--sc-hi);text-shadow:0 0 30px var(--sc)} html[data-sc] .titlecard .rule{background:var(--sc-hi)}
/* Écrans d'ordinateur : tout est agrandi (texte, jauges, boutons) pour lire sans zoomer */

@media (min-width:1700px){html{zoom:1.32}}

@media (max-width:720px){
 .gauges{display:flex;overflow-x:auto;gap:6px;padding-block:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

 .gauge{flex:0 0 auto;width:118px;padding:5px 8px;border-radius:8px}
 .gauge .l{font-size:8px;letter-spacing:.06em} .gauge .v{font-size:13px;margin:1px 0 3px} .gauge .v small{display:none} .gauge .v .pv{display:block;font-size:10px;margin-left:0;line-height:1.1} .gauge .bar{height:3px}
 .episodes{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none} .episodes::-webkit-scrollbar{display:none} .ep{flex:0 0 auto;width:104px}.tiles,.profiles,.btiles,.media,.mtot{grid-template-columns:1fr}.panel{padding:18px}.scene{padding:14px}.ticker{margin-inline:-14px}.scene h2{font-size:20px}.toasts{left:auto;right:12px;width:200px;bottom:12px;gap:4px} .toast{padding:4px 10px;min-width:0} .toast b{font-size:13px} .toast small{font-size:10px}.mrow{grid-template-columns:auto 1fr auto}.mrow .cap{grid-column:2;text-align:left}
 .dlg{gap:2px 10px;align-items:center} .dlg .avatar{grid-row:1} .dlg .avatar.sm{width:44px;height:44px;font-size:20px} .dlg .who>small{margin-bottom:0} .dlg .body{grid-column:1/-1;margin-top:8px} .dlg .body .msg{max-width:100%}
 .speech{flex-direction:column;align-items:center;gap:8px} .speech .avatar{width:64px;height:64px}}

  radial-gradient(ellipse 55% 40% at 50% 46%,color-mix(in srgb,var(--sc-line,#3352c0) 70%,transparent),transparent 72%),
  radial-gradient(ellipse 90% 60% at 50% 115%,color-mix(in srgb,var(--sc-line,#3352c0) 85%,transparent),transparent 70%),
  linear-gradient(170deg,color-mix(in srgb,var(--sc,#1f3a93) 55%,#05070f) 0%,#070a16 42%,#070a16 58%,color-mix(in srgb,var(--sc,#1f3a93) 75%,#05070f) 100%)}
.epcard::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);transform:translateX(-100%);animation:tsweep 1.4s .15s ease-in-out;pointer-events:none}

/* ── Grand final ── */
.sfx.fin{background:#03050c}
.fin .rays2{position:absolute;left:50%;top:44%;width:180vmax;height:180vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,215,106,.22) 0 7deg,transparent 7deg 18deg);animation:spin3 14s linear infinite;opacity:0;animation-name:spin3,fadeup;animation-duration:14s,1.2s;animation-iteration-count:infinite,1;animation-fill-mode:none,forwards;animation-delay:0s,.6s}
@keyframes spin3{to{transform:translate(-50%,-50%) rotate(360deg)}} @keyframes fadeup{to{opacity:1}}
.fin .bigtro{font-size:clamp(110px,32vw,220px);line-height:1;display:inline-block;filter:drop-shadow(0 0 40px rgba(255,210,90,.9));animation:trorise 1.4s cubic-bezier(.2,1.3,.4,1) .4s both}
@keyframes trorise{from{transform:translateY(70vh) scale(.4) rotate(-20deg)}to{transform:none}}
.fin .ttl{font-family:var(--serif);font-weight:900;font-size:clamp(34px,9vw,72px);letter-spacing:.02em;line-height:1;margin:16px 0 6px;opacity:0;animation:slam .6s cubic-bezier(.2,1.3,.4,1) forwards}
.fin .who{font-size:clamp(18px,4.5vw,26px);font-weight:800;opacity:0;animation:rvin .6s ease-out forwards}
.fin .big{font:900 clamp(40px,11vw,86px)/1 var(--sans);font-variant-numeric:tabular-nums;margin-top:14px;opacity:0;animation:pop .4s ease forwards}
.fin .sub{color:rgba(255,255,255,.8);font-size:15px;margin-top:10px;opacity:0;animation:rvin .6s ease-out forwards;max-width:34ch;margin-inline:auto}
.fin .crowd{position:absolute;left:0;right:0;bottom:0;height:16vh;display:flex;justify-content:space-around;align-items:flex-end;font-size:clamp(26px,7vw,44px)}
.fin .crowd span{animation:cheer .5s ease-in-out infinite alternate}
@keyframes cheer{to{transform:translateY(-16px)}}
.fin .fw{position:absolute;width:6px;height:6px}
.fin .fw i{position:absolute;left:0;top:0;width:6px;height:6px;border-radius:50%;background:inherit;box-shadow:0 0 8px currentColor;animation:spark 1.3s ease-out forwards}
.fin .rain{position:absolute;top:-40px;font-size:24px;animation:coindown 2.2s linear forwards}
/* demi-succès : champagne */
.fin .bottle{font-size:clamp(90px,26vw,170px);display:inline-block;transform-origin:50% 90%;animation:shakeb .12s linear 6 .3s,tilt .5s ease 1.1s forwards}
@keyframes shakeb{50%{transform:rotate(8deg)}} @keyframes tilt{to{transform:rotate(-24deg)}}
.fin .cork{position:absolute;left:50%;top:38%;font-size:30px;opacity:0;animation:cork 1.1s cubic-bezier(.2,.8,.4,1) 1.1s forwards}
@keyframes cork{0%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(26vw,-46vh) rotate(720deg)}}
.fin .foam{position:absolute;left:46%;top:40%;width:10px;height:10px;border-radius:50%;background:#fff6d0;opacity:0;animation:foam 1.4s ease-out forwards}
@keyframes foam{0%{opacity:.9;transform:none}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2.2)}}
/* objectif manqué : le carton */
.fin .box{position:relative;width:min(70vw,300px);height:150px;margin:0 auto;background:linear-gradient(#b98a52,#8f6537);border-radius:4px 4px 10px 10px;box-shadow:inset 0 10px 0 rgba(0,0,0,.18),0 20px 40px rgba(0,0,0,.6)}
.fin .box::before{content:'EFFETS PERSONNELS';position:absolute;left:0;right:0;bottom:40%;text-align:center;font:900 14px var(--sans);letter-spacing:.2em;color:rgba(0,0,0,.45)}
.fin .item{position:absolute;bottom:60%;font-size:38px;opacity:0;animation:drop2 .5s ease-in forwards}
@keyframes drop2{from{opacity:1;transform:translateY(-60vh) rotate(-30deg)}to{opacity:1;transform:none}}
.fin .dim{position:absolute;inset:0;background:#000;opacity:0;animation:dim 3s ease 3s forwards;pointer-events:none}
@keyframes dim{to{opacity:.55}}
/* révocation : le marteau */
.fin .gavel{font-size:clamp(100px,28vw,180px);display:inline-block;transform-origin:80% 80%;animation:gavel 1.2s cubic-bezier(.6,0,.4,1) .3s both}
@keyframes gavel{0%{transform:rotate(-70deg) translateY(-30px)}55%{transform:rotate(-70deg) translateY(-30px)}70%{transform:rotate(15deg)}80%{transform:rotate(0)}100%{transform:rotate(0)}}
.fin .stampbig{display:inline-block;border:8px solid #e0252f;color:#e0252f;font:900 clamp(36px,11vw,84px)/1 var(--sans);padding:10px 22px;border-radius:14px;letter-spacing:.06em;transform:rotate(-12deg) scale(3);opacity:0;animation:bstamp2 .3s cubic-bezier(.3,1.6,.5,1) 1.5s forwards;background:rgba(224,37,47,.08);margin-top:20px}
@keyframes bstamp2{to{transform:rotate(-12deg) scale(1);opacity:1}}
.fin .crack{position:absolute;inset:0;pointer-events:none;opacity:0;animation:pop .1s linear 1.55s forwards}
.fin .crack svg{width:100%;height:100%} .fin .crack path{stroke:rgba(255,255,255,.75);stroke-width:2;fill:none}
/* faillite : liquidation */
.fin .tape{position:absolute;left:-20%;right:-20%;height:56px;background:repeating-linear-gradient(45deg,#f2c600 0 34px,#111 34px 68px);display:flex;align-items:center;justify-content:center;font:900 22px var(--sans);letter-spacing:.3em;color:#111;box-shadow:0 8px 20px rgba(0,0,0,.6);transform:translateX(-120%) rotate(var(--r));animation:tape .5s ease-out forwards}
.fin .tape span{background:#f2c600;padding:2px 12px}
@keyframes tape{to{transform:translateX(0) rotate(var(--r))}}
.fin .sign2{font:900 clamp(26px,7.5vw,54px)/1 var(--serif);letter-spacing:.04em;display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.fin .sign2 span{display:inline-block;animation:letterfall 1s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes letterfall{to{transform:translateY(80vh) rotate(var(--r));opacity:.2}}
/* grève : la foule */
.fin .banner{display:inline-block;background:#f4efe0;color:#b01e2e;font:900 clamp(22px,6.5vw,46px)/1.1 var(--sans);padding:16px 24px;border-radius:6px;box-shadow:0 10px 0 #6b4a2a;animation:signup .8s cubic-bezier(.2,1.3,.4,1) .3s both,bob .6s ease-in-out infinite alternate 1.1s;transform:translateY(80vh)}
.fin .march{position:absolute;left:0;right:0;bottom:6vh;height:16vh;overflow:hidden}
.fin .march span{position:absolute;bottom:0;font-size:clamp(28px,7vw,42px);animation:marchx 4.5s linear forwards}
@keyframes marchx{from{transform:translateX(-12vw)}to{transform:translateX(112vw)}}
/* exode */
.fin .door2{position:absolute;right:8%;bottom:10vh;width:90px;height:150px;background:#2a1a10;border:5px solid #6b4a2a;border-radius:4px 4px 0 0;box-shadow:inset 0 0 0 1000px rgba(255,220,140,.12)}
.fin .door2::after{content:'SORTIE';position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#1f6b3a;color:#fff;font:900 11px var(--sans);padding:2px 6px;border-radius:3px}
.fin .leaver{position:absolute;bottom:10vh;left:-10%;font-size:32px;animation:leave 2.4s linear forwards;transform:scaleX(-1)}
@keyframes leave{80%{opacity:1}to{left:84%;opacity:0}}
@media (prefers-reduced-motion:reduce){.fin *{animation:none!important;opacity:1!important;transform:none!important}}
</style>

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const mE=n=>(n>=0?'+':'−')+(Math.abs(n)/1000).toFixed(1).replace('.',',')+' M€';
