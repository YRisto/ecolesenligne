  const avail=pool.map((x,i)=>i).filter(i=>!S.used[key].includes(i));
  const src=avail.length?avail:pool.map((x,i)=>i);
  const i=src[Math.floor(Math.random()*src.length)];
  S.used[key].push(i); return i;
}
function pickEvent(){
  const ws=EVENTS.map((e,i)=>S.used.evt.includes(i)?0:e.w(S));
  let tot=ws.reduce((a,b)=>a+b,0); if(tot<=0){S.used.evt=[];return pickEvent();}
  let r=Math.random()*tot;
  for(let i=0;i<EVENTS.length;i++){r-=ws[i]; if(r<=0){S.used.evt.push(i);return i;}}
  return 0;
}
function apply(fx,label){
  if(!fx) return;
  if(fx.g) for(const k in fx.g){S.g[k]=clamp(S.g[k]+fx.g[k],0,100); toast(fx.g[k],GN[k],label);}
  if(fx.rev) S.rev+=fx.rev; if(fx.cost) S.cost+=fx.cost; if(fx.mk) S.marketing=Math.max(500,S.marketing+fx.mk);
  if(fx.price){ if(!(S.mode==='univ'&&fx.price>0)) S.price=Math.round(S.price*(1+fx.price/100)); }
  if(fx.stu) S.stuMult*=fx.stu; if(fx.churn) S.churn+=fx.churn; if(fx.hc) S.staff+=fx.hc;
  if(fx.once){S.cash+=fx.once; S.yearFx.once+=fx.once;} if(fx.debt!==undefined){ if(fx.debt===0) S.debt=0; else S.debt+=fx.debt; }
  if(fx.rate) S.rate=clamp(S.rate+fx.rate,0.01,0.15);
  if(fx.stuY) S.yearFx.stuY*=fx.stuY; if(fx.revY) S.yearFx.revY+=fx.revY;
  if(fx.flag) S.flags[fx.flag]=true; if(fx.mode) S.mode=fx.mode;
  renderGauges();
}
function toast(v,name,label){
  if(!v) return;
  const t=document.createElement('div'); t.className='toast'+(v<0?' neg':'');
  t.innerHTML=`<b>${v>0?'+':'−'}${Math.abs(v)} ${name}</b><small>${label||''}</small>`;
  const box=document.getElementById('toasts'); while(box.children.length>=4) box.firstChild.remove(); box.appendChild(t); setTimeout(()=>t.remove(),3300);
}
function chips(fx){
  if(!fx) return '';
  const out=[];
  if(fx.rev) out.push(['Recettes '+kE(fx.rev)+'/an',fx.rev>0]);
  if(fx.cost) out.push(['Coûts '+kE(fx.cost)+'/an',fx.cost<0]);
  if(fx.mk) out.push(['Marketing '+kE(fx.mk)+'/an',fx.mk<0]);
  if(fx.price) out.push(['Prix '+pct(fx.price),fx.price>0]);
  if(fx.stu) out.push(['Inscriptions '+pct((fx.stu-1)*100),fx.stu>1]);
  if(fx.stuY) out.push(['Inscriptions cette année '+pct((fx.stuY-1)*100),fx.stuY>1]);
  if(fx.churn) out.push(['Abandons '+(fx.churn>0?'+':'')+fx.churn+' pts',fx.churn<0]);
  if(fx.once) out.push(['Trésorerie '+kE(fx.once),fx.once>0]);
  if(fx.revY) out.push(['CA cette année '+kE(fx.revY),fx.revY>0]);
  if(fx.hc) out.push(['Effectifs '+(fx.hc>0?'+':'')+fx.hc,fx.hc>0]);
  if(fx.rate) out.push(['Taux '+(fx.rate>0?'+':'')+(fx.rate*100).toFixed(1)+' pt',fx.rate<0]);
  if(fx.g) for(const k in fx.g) out.push([GN[k]+' '+(fx.g[k]>0?'+':'')+fx.g[k],fx.g[k]>0]);
  return out.map(([t,p])=>`<span class="chip ${p?'pos':'neg'}">${t}</span>`).join('');
}
// effet annuel d'une mesure sur le résultat (k€)
function yearly(m){ return (m.rev||0)-(m.cost||0)-(m.mk||0)+(m.price?S.students*S.price*m.price/100/1000:0)+(m.stu?(m.stu-1)*4200*S.price/1000:0); }

// ---------- Simulation annuelle ----------
function simulate(){
  const g=S.g;
  const mkF=Math.pow(S.marketing/BASE.marketing,0.5);
  const comF=0.6+0.8*(g.com/100);
  const priceF=Math.pow(S.price/BASE.price,-0.9);
  const repF=0.7+0.6*(g.etu/100);
  const newS=Math.round(BASE.newBase*S.stuMult*mkF*comF*priceF*repF*S.yearFx.stuY);
  const churn=clamp(0.35+(50-g.etu)/100*0.3+S.churn/100,0.08,0.75);
  const left=Math.round(S.students*churn);
  const students=Math.max(0,S.students-left+newS);
  const tuition=students*S.price/1000;
  const revenue=tuition+S.rev+S.yearFx.revY;
  const payroll=BASE.payrollOther+BASE.payrollCom;
  const overdraft=Math.max(0,-S.cash);
  const interest=(S.debt+overdraft)*S.rate;
  const costs=payroll+S.marketing+BASE.platform+BASE.other+S.cost+interest;
  const res=revenue-costs; const pc=revenue>0?res/revenue*100:-100;
  const y={year:S.year,newS,left,churn,students,revenue,costs,interest,res,pct:pc,once:S.yearFx.once,cashBefore:S.cash};
  S.cash+=res; y.cash=S.cash;
  const prev=S.lastResult;
  let dca=clamp((pc-prev.pct)*0.8,-8,8)+(pc>=0?2:-3);
  if(S.mode==='fonds'&&pc<0) dca-=6;
  if(S.mode==='edtech'&&students<S.students*1.10) dca-=8;
  if(S.mode==='edtech'&&students>=S.students*1.10) dca+=4;
  g.ca=clamp(g.ca+dca,0,100);
  g.etu=clamp(g.etu+(50-g.etu)*0.15+(churn<0.35?3:-2),0,100);
  const dcom=clamp((newS-S.lastNew)/S.lastNew*30,-8,8); g.com=clamp(g.com+dcom,0,100);
  g.cse=clamp(g.cse+(50-g.cse)*0.15+(pc<-5?-3:(pc>3?2:0)),0,100);
  if(S.rate>0.045&&S.cash>0) S.rate=Math.max(0.03,S.rate-0.005);
  if(S.cash<0) S.rate=clamp(S.rate+0.01,0.01,0.15);
  S.students=students; S.lastNew=newS; S.lastResult={pct:pc,rev:revenue,res}; S.history.push(y);
  S.yearFx={stuY:1,revY:0,once:0};
  return y;
}
function projected(){
  // projection grossière du résultat avec les mesures en vigueur + en attente
  const pend=S.pending.map(i=>MEASURES[i]);
  const extra=pend.reduce((a,m)=>a+yearly(m),0);
  const rev=S.students*S.price/1000+S.rev+S.yearFx.revY;
  const costs=BASE.payrollOther+BASE.payrollCom+S.marketing+BASE.platform+BASE.other+S.cost+(S.debt+Math.max(0,-S.cash))*S.rate;
  const res=rev-costs+extra; return {res,pct:rev>0?res/rev*100:-100,extra};
}
function checkOver(){
  if(S.g.ca<=0) return "Le conseil d'administration vous a révoqué·e. Un cabinet de redressement prend la direction.";
  if(S.cash<-6000) return "La banque a coupé la ligne de crédit. L'école dépose le bilan.";
  if(S.g.cse<=0) return "Grève illimitée. Après six semaines sans cours, le CA vous a remplacé·e.";
  if(S.g.etu<=0) return "Hémorragie d'étudiants et plainte collective. L'école perd son habilitation.";
  return null;
}

function gaugeHtml(){
  const lr=S.lastResult; const pj=projected();
  const resW=clamp((lr.pct+20)/40*100,2,100);
  const cashW=clamp((S.cash+6000)/16000*100,2,100);
  const conj=S.cash<-2000?['bad','🔥 Trésorerie sous tension']:S.lastResult.pct<-5?['warn','😬 Comptes dans le rouge']:S.lastResult.pct<S.target?['','😐 Redressement en cours']:['','😀 Objectif en vue'];
  const G=(cls,ic,l,v,w,sub)=>`<div class="gauge ${cls}" data-g="${cls.slice(2)}"><div class="l">${ic} ${l}</div><div class="v num">${v}${sub?`<small> · ${sub}</small>`:''}</div><div class="bar"><i style="width:${w}%"></i></div></div>`;
  return {conj,html:
   G('c-res','📉','Résultat net',pct(lr.pct),resW,`cible +${S.target} %`)+
   G('c-cash','🏦','Trésorerie',mE(S.cash),cashW,`dette ${(S.debt/1000).toFixed(0)} M€`)+
   G('c-rate','📈','Taux · banque',(S.rate*100).toFixed(1).replace('.',',')+' %',clamp(100-S.rate*800,5,100),S.rate<0.045?'AA':S.rate<0.065?'BBB':'B')+
   G('c-ca','⚡','Conseil d\'admin.',Math.round(S.g.ca)+' pts',S.g.ca)+
   G('c-etu','🎓','Étudiants',Math.round(S.g.etu)+' %',S.g.etu,fmt(S.students))+
   G('c-com','💼','Commerciaux',Math.round(S.g.com)+' %',S.g.com)+
   G('c-cse','🤝','CSE · salariés',Math.round(S.g.cse)+' %',S.g.cse,fmt(S.staff))};
}

function phCadrage(){

  if(S.year===2028&&S.sub===0){
    sceneShell(dlg('👴','Le fondateur','Actionnaire majoritaire sortant',SHAREHOLDER.t)+`<div class="prompt">Qui doit racheter l'école ?</div><div id="c"></div>`,{title:'Changement d\'actionnaire',tag:'Le fondateur vend. La suite de la série se joue maintenant.',onNext:()=>{S.sub=1;renderGame();}});
    choices($('#c'),SHAREHOLDER.c.map(([ic,l,sub,fx])=>[ic+' '+l,fx,'Le CA suit votre avis. Les règles changent dès cette année.',sub]),()=>{ if(S.mode==='univ') S.target=3; ready(); },'Rachat de l\'école');
    return;
  }
  const quote=first?'« Le conseil d\'administration vous donne six exercices. À la rentrée 2032, nous voulons un résultat net de +10 % du chiffre d\'affaires. Ni scandale, ni grève, ni exode des étudiants. Bonne chance. »'
    :(S.g.ca<35?'« Nous ne cachons pas notre inquiétude. Cette année est celle de la dernière chance. »':S.g.ca>65?'« Le conseil renouvelle sa confiance. Continuez. »':'« Le conseil attend des résultats mesurables cette année. »');

  const body=dlg('👩‍⚖️','Présidente du conseil d\'administration','Vous reçoit dans son bureau',(first?`« Bonjour ${S.name}. Le DAF vous a remis les comptes 2025 : 30 M€ de chiffre d'affaires, 12 000 étudiants, 400 salariés dont 100 commerciaux, et une perte de 3,6 M€, soit <b style="color:var(--rose)">−12 % de résultat net</b>. La trésorerie tient deux mois. »<br>`:`« Résultat ${S.year-1} : <b style="color:${lr.pct<0?'var(--rose)':'var(--green)'}">${pct(lr.pct)}</b>. ${lr.pct>=S.target?'L\'objectif est atteint, il s\'agit de le tenir.':`Il reste ${(S.target-lr.pct).toFixed(1).replace('.',',')} points à gagner avant 2032.`} »<br>`)+quote)+
   (extra.length?`<div class="note">${extra.map(x=>`<div>${x}</div>`).join('')}</div>`:'')+
   `<div class="prompt">Votre discours de prise de fonction — fixez le cap :</div><div id="c"></div>`;
  sceneShell(body,{title:first?'Mission : Impossible':'La lettre du conseil',tag:first?'On vous confie une école qui perd 300 000 € par mois. Le CA attend un cap, les équipes guettent vos premiers mots.':'Nouvelle saison, mêmes contraintes. Le conseil a relu les comptes.'});
  choices($('#c'),[
    ["« La rigueur : je tiendrai les coûts. »",{g:{ca:3,cse:-2}},"Cap fixé. Le CA approuve, le CSE prend note."],
    ["« La qualité : je miserai sur les étudiants. »",{g:{etu:3,ca:-1}},"Cap fixé. Les étudiants apprécient, le CA attend les chiffres."],
    ["« La croissance : je relancerai les ventes. »",{g:{com:3,ca:-1}},"Cap fixé. Les commerciaux applaudissent."]],null,'Discours de cadrage');
}

function phMesures(){
  const avail=MEASURES.filter(m=>!S.active.includes(m.id)&&!(S.mode==='univ'&&m.price>0));
  const cats=[['rec','Recettes nouvelles','var(--green)'],['dep','Économies et coupes','var(--gold)'],['str','Réformes de structure','var(--violet)']];
  const body=dlg('🧮','Le DAF','Directeur administratif et financier',`« Dessinons l'esquisse du plan : les mesures que vous porterez au conseil. Jusqu'à ${MAXM} cette année. Une mesure adoptée reste en vigueur les années suivantes. »`)+
   `<div class="note"><div class="h">📗 Note du DAF — pourquoi l'école perd de l'argent</div>Sans mesure nouvelle, le résultat ${S.year} serait de <b style="color:var(--rose)">${pct(projected().pct)}</b>. Trois moteurs l'expliquent :<ul><li><b>Les abandons.</b> Un tiers des étudiants ne va pas au bout : chaque départ est un chiffre d'affaires perdu.</li><li><b>La masse salariale.</b> 400 salariés pour 30 M€, dont 100 commerciaux : le ratio est lourd pour une école en ligne.</li><li><b>La dette.</b> 9 M€ à ${(S.rate*100).toFixed(1).replace('.',',')} % ; chaque euro de découvert coûte plus cher.</li></ul></div>
   <div class="hint">💡 Le chiffre à droite est l'<b>effet estimé sur le résultat annuel, en k€</b>. Survolez une mesure pour voir son coût en capital, étudiants, commerciaux et CSE.</div>
   <div id="cat"></div><div class="hint" id="tally"></div>`;
  sceneShell(body,{title:'Il faut sauver l\'école',tag:'Seul·e face à la page blanche du plan. Chaque ligne cochée fera un mécontent, et un titre dans la presse.'});
  const draw=()=>{
    $('#cat').innerHTML=cats.map(([k,n,col])=>`<div class="cath"><i style="background:${col}"></i>${n}</div><div class="mrows">${avail.filter(m=>m.cat===k).map(m=>{const y=yearly(m);const sel=S.pending.includes(m.id);return `<label class="mrow ${sel?'sel':''}"><input type="checkbox" data-id="${m.id}" ${sel?'checked':''} ${(!sel&&S.pending.length>=MAXM)?'disabled':''}><span>${m.n}</span><span class="amt num ${y>50?'pos':y<-50?'neg':'zero'}">${y>50||y<-50?kE(y):'±0'}</span><span class="tip"><span class="d">${m.d}</span>${chips({...m,rev:undefined,cost:undefined,mk:undefined,price:undefined,stu:undefined})||'<span class="chip">Aucun effet sur les jauges</span>'}${m.once?chips({once:m.once}):''}</span></label>`;}).join('')}</div>`).join('');
    $('#cat').querySelectorAll('input').forEach(i=>i.addEventListener('change',e=>{const id=+e.target.dataset.id; if(e.target.checked) S.pending.push(id); else S.pending=S.pending.filter(x=>x!==id); draw(); renderBudget(); save();}));
    $('#tally').innerHTML=`<b>${S.pending.length}</b> / ${MAXM} mesures retenues. ${S.pending.length?'Elles seront soumises au vote du conseil en juillet.':'Vous pouvez aussi continuer sans nouvelle mesure.'}`;
    ready();
  };
  draw();
}

function phGardiens(){
  const items=[];
  if(S.cash<-2000) items.push(["🧾","Le commissaire aux comptes","déclenche une procédure d'alerte : la continuité d'exploitation n'est plus assurée sans mesures fortes.",{g:{ca:-5,cse:-3}}]);
  else if(S.cash<0) items.push(["🧾","Le commissaire aux comptes","signale une trésorerie négative et demande un plan de financement.",{g:{ca:-2}}]);
  else items.push(["🧾","Le commissaire aux comptes","certifie les comptes sans réserve.",{g:{ca:1}}]);
  if(S.cash<-3000) items.push(["🏦","La banque","invoque les clauses du prêt et relève le taux. Elle exige un plan de trésorerie mensuel.",{rate:0.01,g:{ca:-4}}]);
  else if(S.cash<0) items.push(["🏦","La banque","tolère le découvert, mais facture des agios.",{rate:0.005}]);
  else if(S.lastResult.pct>5) items.push(["🏦","La banque","salue le redressement et propose un taux révisé.",{rate:-0.005,g:{ca:2}}]);
  else items.push(["🏦","La banque","maintient ses conditions.",{}]);
  if(S.flags.risque_qualiopi) items.push(["🔎","L'auditeur Qualiopi","émet des non-conformités majeures. Sans correction, la certification sera retirée.",{g:{ca:-3,etu:-3}}]);
  else if(S.g.etu<35) items.push(["🔎","La commission pédagogique indépendante","alerte sur le taux d'abandon et la satisfaction. Son rapport est transmis au CA.",{g:{ca:-3,etu:-2}}]);
  else if(S.flags.qualite) items.push(["🔎","L'auditeur Qualiopi","renouvelle la certification et cite l'école en exemple.",{g:{ca:2,etu:2}}]);
  else items.push(["🔎","La commission pédagogique","rend un avis neutre : rien d'alarmant, rien de remarquable.",{}]);
  const cuts=S.pending.map(i=>MEASURES[i]).filter(m=>m.cat==='dep'&&(m.hc||0)<0).length;
  if(cuts>=2) items.push(["⚖️","L'inspection du travail","note l'accumulation de suppressions de postes et demande à être associée au calendrier.",{g:{cse:-3}}]);
  if(!S.decided){ items.forEach(i=>apply(i[3],i[1])); }
  sceneShell(`<p class="muted">Avant le vote, les contrôleurs extérieurs se prononcent sur la situation de l'école.</p><div class="opts">${items.map(i=>`<div class="resbox ${Object.values(i[3].g||{}).some(v=>v<0)||i[3].rate>0?'bad':Object.keys(i[3]).length?'':'neu'}"><b>${i[0]} ${i[1]}</b>${i[2]}<div>${chips(i[3])}</div></div>`).join('')}</div>`,{title:'Les gardiens',tag:'Commissaire aux comptes, banque, auditeurs : ils ne votent pas, mais le conseil les écoute.',ready:true});
  S.decided=true; save();
}

function phVote(){
  if(S.sub<2){
    if(S.sub===0&&!S.tmp) S.tmp={list:[pick(AMENDEMENTS,'amd'),pick(AMENDEMENTS,'amd')],bonus:0};
    const a=AMENDEMENTS[S.tmp.list[S.sub]];
    sceneShell(dlg(a.ic,a.who,'Dépose un amendement',a.ask)+`<div class="prompt">Amendement ${S.sub+1}/2 :</div><div id="c"></div>`,{title:'La grande bidouille',tag:'Avant le vote, chacun négocie sa ligne. Rejeter un amendement, c\'est perdre une voix.',onNext:()=>{S.sub++;S.decided=false;renderGame();}});
    choices($('#c'),[["✓ Accepter l'amendement",()=>{S.tmp.bonus+=12;return a.y;},"L'amendement est intégré au plan."],["✗ Rejeter l'amendement",()=>{S.tmp.bonus-=5;return a.n;},"Rejeté. Son auteur s'en souviendra au moment du vote."]],null,a.who);
    return;
  }
  const pend=S.pending.map(i=>MEASURES[i]);
  const polit=pend.reduce((a,m)=>a+Math.min(0,(m.g&&m.g.ca)||0)*2+Math.min(0,(m.g&&m.g.cse)||0)*0.5,0);
  const chance=clamp(S.g.ca+S.tmp.bonus+polit+(pend.length?-pend.length*2:30),5,97);
  if(S.sub===2){
    sceneShell(dlg('👩‍⚖️','Présidente du conseil d\'administration','Ouvre le vote',`« ${pend.length?`Le plan comporte ${pend.length} mesure${pend.length>1?'s':''}.`:'Aucune nouvelle mesure n\'est soumise.'} Le conseil se prononce à main levée. »`)+
     `<div class="tw"><table><tr><th>Mesure</th><th>Effet annuel</th><th>CA</th><th>CSE</th></tr>${pend.map(m=>`<tr><td>${m.n}</td><td class="num">${kE(yearly(m))}</td><td class="num">${(m.g&&m.g.ca)||0}</td><td class="num">${(m.g&&m.g.cse)||0}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucune mesure</td></tr>'}</table></div>
     <div class="note">Chance d'adoption estimée : <b style="font-size:18px;color:var(--gold)">${Math.round(chance)} %</b> <span class="muted">(capital CA ${Math.round(S.g.ca)}, amendements ${S.tmp.bonus>=0?'+':''}${S.tmp.bonus}, mesures contestées ${Math.round(polit)})</span></div><div id="c" style="display:flex;justify-content:center"></div>`,{title:'Le vote du conseil',tag:'La grande bidouille se termine. Le conseil tranche.'});
    $('#c').appendChild(btn('🗳️ Appeler au vote',()=>{S.sub=3;S.tmp.roll=Math.random()*100;renderGame();}));
    return;
  }
  const ok=S.tmp.roll<chance||S.tmp.forced;
  if(ok){
    if(!S.decided){ pend.forEach(m=>{apply({g:m.g,rev:m.rev,cost:m.cost,mk:m.mk,price:m.price,stu:m.stu,churn:m.churn,hc:m.hc,once:m.once,debt:m.debt,rate:m.rate,flag:m.flag},m.n); S.active.push(m.id);}); S.pending=[]; S.decided=true; save(); renderBudget(); }
    sceneShell(`<div class="resbox ${S.tmp.forced?'bad':''}"><b>${S.tmp.forced?'Plan imposé':'Plan adopté'}</b>${S.tmp.forced?'Vous avez usé de votre pouvoir de direction. Le plan s\'applique, mais le CA et le CSE s\'en souviendront.':'Le conseil adopte le plan. Les mesures entrent en vigueur immédiatement.'}</div>`,{title:S.tmp.forced?'Le passage en force':'Le plan est adopté',tag:'Les mesures entrent en vigueur. Reste à les faire vivre.',ready:true});
    return;
  }
  const worst=pend.slice().sort((a,b)=>((a.g&&a.g.ca)||0)-((b.g&&b.g.ca)||0))[0];
  sceneShell(`<div class="resbox bad"><b>Le plan est rejeté</b>Le vote est perdu. Deux issues : passer en force, ou retirer la mesure la plus contestée et refaire voter.</div><div id="c"></div>`,{title:'Le plan est rejeté',tag:'Le conseil a dit non. Vous avez une nuit pour trouver une issue.'});
  const box=document.createElement('div'); box.className='opts';
  box.appendChild(btn(`Passer en force<small>Le plan s'applique intégralement.</small><small>${chips({g:{ca:-15,cse:-6}})}</small>`,()=>{apply({g:{ca:-15,cse:-6}},'Passage en force');S.tmp.forced=true;renderGame();},'opt'));
  if(worst) box.appendChild(btn(`Retirer « ${worst.n} » et refaire voter<small>Le plan amputé est adopté.</small><small>${chips({g:{ca:-2}})}</small>`,()=>{S.pending=S.pending.filter(i=>i!==worst.id);apply({g:{ca:-2}},'Retrait d\'une mesure');S.tmp.forced=true;renderGame();},'opt'));
  $('#c').appendChild(box);
}

function phEvent(silent){
  if(S.tmp===null) S.tmp={e:pickEvent(),seen:false};
  const e=EVENTS[S.tmp.e];
  if(!S.decided){ const fx=typeof e.fx==='function'?e.fx(S):e.fx; S.tmp.fx=fx; }
  const fx=S.tmp.fx;
  const bad=(fx.g&&Object.values(fx.g).some(v=>v<0))||(fx.once&&fx.once<0)||(fx.stuY&&fx.stuY<1)||fx.rate>0||fx.revY<0||fx.cost>0;
  sceneShell(`<div class="resbox ${bad?'bad':''}"><b>${e.ic} ${e.n}</b>${e.t}${fx.txt?`<div style="margin-top:4px">${fx.txt}</div>`:''}<div>${chips(fx)}</div></div>`,{title:'L\'imprévu',tag:'Il y a toujours un imprévu. Il tombe toujours en septembre.',ready:S.decided});
  if(!S.decided&&!silent){
    modal(`<div class="ic">${e.ic}</div><div class="ml">Imprévu de la rentrée</div><div class="mt">${e.n}. ${e.t}</div><div class="eff">${fx.txt||''}</div><div>${chips(fx)}</div><div class="ms">Un aléa imprévu affecte l'exercice en cours.</div><div style="margin-top:8px"><button class="mbtn" id="ack">Prendre acte</button></div>`,bad?'bad':'');
    document.getElementById('ack').onclick=()=>{closeModal();apply(fx,e.n);S.decided=true;save();renderBudget();ready();};
  }
}

function phBilan(){
  const over=checkOver(); if(over){S.over={lost:true,why:over};return render();}
  if(S.yi>=YEARS.length-1){S.over={lost:false};return render();}
  sceneShell(histHtml()+`<p class="muted" style="margin-top:22px">${S.g.ca<30?'Le conseil d\'administration vous accorde un sursis.':S.lastResult.pct>=S.target?'Le conseil vous félicite. Il faudra confirmer.':'Le conseil attend la suite.'} Il reste ${YEARS.length-1-S.yi} exercice${YEARS.length-1-S.yi>1?'s':''} avant la rentrée 2032.</p>`,{title:'Fin de saison '+(S.yi+1),tag:'Précédemment dans La Bataille de l\'École…',ready:true,onNext:()=>{S.yi++;S.year=YEARS[S.yi];S.phase=0;S.sub=0;S.tmp=null;S.decided=false;S.screen='title';render();}});
  $('#nextBtn').innerHTML='▶ Saison '+(S.yi+2)+' · Exercice '+(S.year+1);
}
function histHtml(){
  const cells=YEARS.map((y,i)=>{const h=S.history[i]; if(!h) return `<div style="height:2px;background:var(--line)"><em>${y}</em></div>`; const v=clamp(Math.abs(h.pct),0,20); return `<div class="${h.pct<0?'neg':'pos'}" style="height:${v/20*70+4}px"><span>${pct(h.pct)}</span><em>${y}</em></div>`;}).join('');
  return `<div class="hist">${cells}</div>`;
}
function renderFinal(){
  const lr=S.lastResult; let verdict,text,cls;
  if(S.over.lost){verdict="Fin de série";text=S.over.why;cls='bad';}
  else if(lr.pct>=S.target){verdict="Objectif atteint";text=`À la rentrée 2032, l'école affiche ${pct(lr.pct)} de résultat net, ${fmt(S.students)} étudiants et ${fmt(S.staff)} salariés. Dix ans plus tard, les anciens élèves se souviennent ${S.g.etu>60?'d\'une école qui a tenu ses promesses.':'surtout des années de rigueur.'}`;cls='';}
  else if(lr.pct>=0){verdict="Demi-succès";text=`L'école est à l'équilibre (${pct(lr.pct)}) mais loin des +${S.target} % demandés. Le CA vous garde, sans enthousiasme.`;cls='neu';}
  else{verdict="Objectif manqué";text=`Toujours en perte (${pct(lr.pct)}) à la rentrée 2032. Le CA ne renouvelle pas votre mandat.`;cls='bad';}
  app().innerHTML=`<div class="center"><div class="panel wide">
    <div class="kicker" style="text-align:center">Rentrée 2032 · Générique de fin</div>
    <h1 class="serif title" style="color:${cls==='bad'?'var(--rose)':cls==='neu'?'var(--gold)':'var(--green)'}">${verdict}</h1>
    <p style="text-align:center;font-size:15px">${text}</p>
    ${histHtml()}
    <div class="tw" style="margin-top:20px"><table><tr><th>Indicateur</th><th>2025</th><th>Fin de série</th></tr>
    <tr><td>Résultat net</td><td class="num">−12,0 %</td><td class="num">${pct(lr.pct)}</td></tr><tr><td>Étudiants</td><td class="num">12 000</td><td class="num">${fmt(S.students)}</td></tr><tr><td>Salariés</td><td class="num">400</td><td class="num">${fmt(S.staff)}</td></tr><tr><td>Frais annuels</td><td class="num">2 500 €</td><td class="num">${fmt(S.price)} €</td></tr><tr><td>Trésorerie</td><td class="num">+0,5 M€</td><td class="num">${mE(S.cash)}</td></tr><tr><td>Mesures adoptées</td><td>–</td><td class="num">${S.active.length}</td></tr></table></div>
    <p class="hint">Mesures en vigueur : ${S.active.map(i=>MEASURES[i].n).join(' · ')||'aucune'}.</p>
    <div style="display:flex;justify-content:center" id="b"></div></div></div>`;
  $('#b').appendChild(btn('↺ Rejouer la série',()=>{newGame();render();}));
}

// ---------- Démarrage ----------
function start(data){
  let loaded=null;
  if(data&&data.S) loaded=data.S;
  else { try{const s=localStorage.getItem('bde-save'); if(s) loaded=JSON.parse(s);}catch(e){} }
  if(loaded&&loaded.screen&&loaded.g&&loaded.used) S=loaded; else newGame();
  if(S.screen==='title') S.screen='game';
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
