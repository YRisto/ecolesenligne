const mkTotal=()=>Object.values(S.media).reduce((a,b)=>a+b,0);
function pick(pool,key){
  const avail=pool.map((x,i)=>i).filter(i=>!S.used[key].includes(i));
  const src=avail.length?avail:pool.map((x,i)=>i);
  const i=src[Math.floor(Math.random()*src.length)];
  S.used[key].push(i); return i;
}
function pickEvent(kind){
  const ws=EVENTS.map((e,i)=>(S.used.evt.includes(i)||(e.grp&&S.used.evt.some(j=>EVENTS[j]&&EVENTS[j].grp===e.grp))||(kind==='pos'&&!e.pos)||(kind==='neg'&&e.pos)||(e.fx&&e.fx.media&&Object.keys(e.fx.media).some(k=>!MEDIA[k])))?0:e.w(S));
  let tot=ws.reduce((a,b)=>a+b,0); if(tot<=0){S.used.evt=[];return pickEvent(kind);}
  let r=Math.random()*tot;
  for(let i=0;i<EVENTS.length;i++){r-=ws[i]; if(r<=0){S.used.evt.push(i);return i;}}
  return 0;
}
function apply(fx,label){
  if(!fx) return;
  if(fx.g) for(const k in fx.g){S.g[k]=clamp(S.g[k]+fx.g[k],0,100); toast(fx.g[k],GN[k],label); if(S.g[k]>=100&&k!=='ca'&&typeof award==='function') award(k);}
  if(fx.cap){S.g.ca=clamp(S.g.ca+fx.cap,0,100); toast(fx.cap,'Capital',label);} if(typeof award==='function'){ if(S.g.ca>=90) award('cap'); if(S.g.ca<20) S.lowCap=true; }
  if(fx.rev) S.rev+=fx.rev; if(fx.cost) S.cost+=fx.cost;
  if(fx.mk){const t=mkTotal(); const f=Math.max(0.2,(t+fx.mk)/t); for(const k in S.media) S.media[k]=Math.round(S.media[k]*f);}
  if(fx.price){ if(!(S.mode==='univ'&&fx.price>0)) S.price=Math.round(S.price*(1+fx.price/100)); }
  if(fx.students) S.students=Math.max(0,S.students+fx.students); if(fx.stu) S.stuMult=clamp(S.stuMult*fx.stu,0.4,1.6); if(fx.churn) S.churn+=fx.churn; if(fx.hc){S.staff+=fx.hc; S.hcAdj=(S.hcAdj||0)+fx.hc;}
  if(fx.once){S.cash+=fx.once; S.yearFx.once+=fx.once;} if(fx.cashBack) S.cashBack=(S.cashBack||0)+fx.cashBack; if(fx.amortCut) S.amortCut=(S.amortCut||0)+fx.amortCut; if(fx.debt!==undefined){ if(fx.debt===0) S.debt=0; else S.debt+=fx.debt; }
  if(fx.rate) S.rate=clamp(S.rate+fx.rate,0.01,0.15);
  if(fx.stuY) S.yearFx.stuY*=fx.stuY; if(fx.revY) S.yearFx.revY+=fx.revY;
  if(fx.media) for(const k in fx.media) if(MEDIA[k]) S.mediaMod[k]=(S.mediaMod[k]||1)*fx.media[k];
  if(fx.flag){S.flags[fx.flag]=true; S.flagYear=S.flagYear||{}; if(!S.flagYear[fx.flag]) S.flagYear[fx.flag]=S.year;} if(fx.mode) S.mode=fx.mode;
  renderGauges();
}
let FLYQ=0;
function toast(v,name,label){
  if(!v) return;
  const k=Object.keys(GN).find(x=>GN[x]===name); const ic=k?GI[k]:'';
  label=tx(label); const t=document.createElement('div'); t.className='toast'+(v<0?' neg':'');
  t.innerHTML=`<b>${v>0?'+':'−'}${Math.abs(v)} ${ic} ${name}</b><small>${label||''}</small>`;
  const box=document.getElementById('toasts'); while(box.children.length>=4) box.firstChild.remove(); box.appendChild(t); setTimeout(()=>t.remove(),3300);
  if(k){ const now=Date.now(), wait=Math.max(0,FLYQ-now); FLYQ=now+wait+(MOB()?700:120); setTimeout(()=>flyTo(k,ic,v),30+wait); }
}
function chips(fx){
  if(!fx) return '';
  const out=[];
  if(fx.cap) out.push([(fx.cap>0?'+':'−')+Math.abs(fx.cap)+' ⚡ capital',fx.cap>0,'cap']);
  if(fx.students) out.push([(fx.students>0?'+':'−')+fmt(Math.abs(fx.students))+' '+SC.unit,fx.students>0]);
  if(fx.rev) out.push(['Recettes '+kE(fx.rev)+'/an',fx.rev>0]);
  if(fx.cost) out.push(['Coûts '+kE(fx.cost)+'/an',fx.cost<0]);
  if(fx.mk) out.push(['Budget '+SC.mediaWord+' '+kE(fx.mk)+'/an',fx.mk<0]);
  if(fx.price) out.push(['Prix '+pct(fx.price),fx.price>0]);
  if(fx.stu) out.push(['Inscriptions '+pct((fx.stu-1)*100),fx.stu>1]);
  if(fx.stuY) out.push(['Inscriptions cette année '+pct((fx.stuY-1)*100),fx.stuY>1]);
  if(fx.churn) out.push(['Abandons '+(fx.churn>0?'+':'')+fx.churn+' pts',fx.churn<0]);
  if(fx.cashBack) out.push(['Récupérés l\'an prochain '+kE(fx.cashBack),true]);
  if(fx.once) out.push(['Trésorerie '+kE(fx.once),fx.once>0]);
  if(fx.revY) out.push(['CA cette année '+kE(fx.revY),fx.revY>0]);
  if(fx.hc) out.push(['Effectifs '+(fx.hc>0?'+':'')+fx.hc,fx.hc>0]);
  if(fx.rate) out.push(['Taux '+(fx.rate>0?'+':'')+(fx.rate*100).toFixed(1)+' pt',fx.rate<0]);
  if(fx.media) for(const k in fx.media) if(MEDIA[k]) out.push([MEDIA[k].n+' : coût par '+SC.lead1+' '+pct((fx.media[k]-1)*100),fx.media[k]<1]);
  if(fx.g) for(const k in fx.g) out.push([(fx.g[k]>0?'+':'−')+Math.abs(fx.g[k])+' '+GI[k]+' '+GN[k],fx.g[k]>0]);
  return out.map(([t,p,c])=>`<span class="chip ${c||(p?'pos':'neg')}">${t}</span>`).join('');
}
function lecture(m){
  const parts=[]; const tu=S.students*S.price/1000;
  if(m.rev) parts.push(`rapporte ${kE(m.rev)}/an de recettes nouvelles`);
  if(m.price) parts.push(m.price>0?`${pct(m.price)} sur les frais : ${kE(tu*m.price/100)}/an sur les étudiants en place, mais des abandons en plus et des ventes plus dures`:`${pct(m.price)} sur les frais : ${kE(tu*m.price/100)}/an de manque à gagner, compensé seulement si les inscriptions suivent`);
  if(m.cost) parts.push(m.cost<0?`économise ${kE(-m.cost)}/an de charges`:`coûte ${kE(m.cost)}/an de charges`);
  if(m.mk) parts.push(m.mk>0?`ajoute ${kE(m.mk)}/an de médias, donc des leads en plus`:`retire ${kE(-m.mk)}/an de médias, donc des leads en moins`);
  if(m.stu) parts.push(`${m.stu>1?'+':''}${Math.round((m.stu-1)*100)} % d'inscriptions chaque année`);
  if(m.churn) parts.push(m.churn<0?`${-m.churn} points d'abandons en moins : chaque étudiant retenu, c'est ${fmt(S.price)} € de plus`:`${m.churn} points d'abandons en plus`);
  if(m.once) parts.push(m.once>0?`apporte ${kE(m.once)} de trésorerie immédiate`:`coûte ${kE(-m.once)} de trésorerie immédiate`);
  if(m.hc) parts.push(m.hc<0?`${-m.hc} postes supprimés`:`${m.hc} recrutements`);
  if(m.debt) parts.push(`${kE(m.debt)} de dette en plus`);
  const who=[]; if(m.g){ if(m.g.etu<0) who.push('les étudiants'); if(m.g.com<0) who.push('les commerciaux'); if(m.g.cse<0) who.push('le CSE'); }
  const cap=m.cap>0?`Rapporte ${m.cap} points de capital.`:`Coûte ${-m.cap} points de capital${who.length?' et mécontente '+who.join(', '):''}.`;
  return 'Lecture : '+(parts.length?parts.join(' ; '):'pas d\'effet financier direct')+'. '+cap;
}
function yearly(m){ // effet annuel moyen sur 3 ans : suit l'évolution des effectifs (abandons, inscriptions, prix, coûts d'encadrement)
  const direct=(m.rev||0)-(m.cost||0)-(m.mk||0);
  if(!m.price&&!m.stu&&!m.churn&&!m.mk) return direct;
  const varc=SC.varc||0.55, c0=clamp(SC.churn+(50-S.g.etu)/100*0.16+S.churn/100,Math.max(0.12,SC.churn*0.5),0.75), I0=S.lastNew||BASE.students*0.35, P0=S.price;
  const mt=Math.max(1,mkTotal()); const mkF=m.mk?1+(Math.pow(Math.max(0.2,1+m.mk/mt),0.62)-1)*0.8:1;
  const P1=P0*(1+(m.price||0)/100), c1=clamp(c0+(m.churn||0)/100,0.05,0.9), I1=I0*(m.stu||1)*mkF;
  let a=0,b=0,Na=S.students,Nb=S.students;
  for(let t=0;t<3;t++){ Nb=Nb*(1-c0)+I0; Na=Na*(1-c1)+I1; b+=Nb*P0-varc*P0*Math.max(0,Nb-BASE.students); a+=Na*P1-varc*P1*Math.max(0,Na-BASE.students); }
  return direct+(a-b)/3/1000; }

// ---------- Médias et inscriptions ----------
function marketSat(){ const over=Math.max(0,S.students-BASE.students)/SC.sat; return clamp(1-0.45*over*over+(S.students<BASE.students?(BASE.students-S.students)/BASE.students*0.3:0),0.5,1.2); } // à la cible de croissance (over=1), chaque inscription coûte ~2 fois plus
function channelCalc(k,budget){
  const c=MEDIA[k]; const cpl=c.cpl*(S.mediaMod[k]||1); const sat=marketSat()*S.yearFx.stuY;
  const baseLeads=c.base*1000/c.cpl;
  const raw=budget*1000/cpl;
  const leads=raw>0?Math.round(baseLeads*Math.pow(raw/baseLeads,0.62)):0;
  const comF=0.6+0.8*(S.g.com/100);
  const ins=Math.round(leads*c.conv*(c.per||1)*comF*S.stuMult*sat);
  return {leads,ins,cpl,cpi:ins?Math.round(budget*1000/ins):0};
}
function inscriptions(){
  const out={}; let tot=0,leads=0,churnExtra=0;
  for(const k in MEDIA){const r=channelCalc(k,S.media[k]); out[k]=r; tot+=r.ins; leads+=r.leads; churnExtra+=r.ins*MEDIA[k].churn;}
  const repF=0.7+0.6*(S.g.etu/100);
  const sat=marketSat();
  const organic=Math.round(BASE.organic*repF*S.stuMult*sat*S.yearFx.stuY);
  return {channels:out,organic,paid:tot,total:tot+organic,leads,churnExtra:tot?churnExtra/tot:0,sat};
}

// ---------- Simulation annuelle ----------
function norgPlan(){ // deux reprises positives sur deux saisons tirées parmi les 4 premières ; dotation négative en saison 4 si les deux positives sont tombées en saisons 1 et 2, sinon en saison 5
  if(S.norgPlan&&S.norgPlan.length===5) return S.norgPlan;
  const p=[null,null,null,null,null]; const idx=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,2).sort(); const big=Math.random()<.5?0:1;
  p[idx[0]]=big===0?'big':'small'; p[idx[1]]=big===0?'small':'big'; p[(idx[0]===0&&idx[1]===1)?3:4]='neg'; S.norgPlan=p; return p; }
function simulate(){
  const g=S.g;
  const ins=inscriptions(); const newS=ins.total;
  const churn=clamp(SC.churn+(50-g.etu)/100*0.16+S.churn/100+ins.churnExtra/100,Math.max(0.12,SC.churn*0.5),0.75);
  const left=Math.round(S.students*churn);
  let students=Math.max(0,S.students-left+newS); let refused=0;
  if(SC.maxGrow){ const capS=Math.round(Math.max(S.students,BASE.students)*(1+SC.maxGrow)); if(students>capS){ refused=students-capS; students=capS; } }
  const tuition=students*S.price/1000;
  const revCap=4000*SC.scale; const revEff=S.rev>revCap?revCap+(S.rev-revCap)*0.5:S.rev; // rendements décroissants des recettes annexes
  const revenue=tuition+revEff+S.yearFx.revY;
  const payroll=BASE.payrollOther+BASE.payrollCom;
  const overdraft=Math.max(0,-S.cash);
  const interest=(S.debt+overdraft)*S.rate;
  const scaleCost=Math.max(0,students-BASE.students)*S.price*(SC.varc||0.55)/1000; // encadrement, support et plateforme pour les étudiants supplémentaires
  const costs=payroll+mkTotal()+BASE.platform+BASE.other+S.cost+interest+scaleCost;
  // Effet Norgeat : une fois sur deux, une provision mystérieuse reprise au dernier moment (comptable, sans impact sur la trésorerie)
  const nb=SC.norgMax||0.08, NK=norgPlan()[S.yi]; const norg=NK==='small'?Math.round(revenue*(0.001+Math.random()*0.005)):NK==='big'?Math.round(revenue*(nb*0.375+Math.random()*nb*0.625)):NK==='neg'?-Math.round(revenue*(0.002+Math.random()*0.006)):0; // effet Norgeat : 3 fois par mandat (petit +, gros +, puis une dotation négative)
  const res=revenue-costs+norg; const pc=revenue>0?res/revenue*100:-100;
  const y={year:S.year,newS,refused,ins,left,churn,students,revenue,costs,interest,res,pct:pc,once:S.yearFx.once,cashBefore:S.cash,media:{...S.media},payroll,mediaK:mkTotal(),platform:BASE.platform,other:BASE.other,measures:S.cost,scaleCost,tuition,revEff,revY:S.yearFx.revY};
  y.norgeat=norg; S.cash+=res-norg; if(S.cashBackDue){S.cash+=S.cashBackDue; y.cashBack=S.cashBackDue; S.cashBackDue=0;} if(S.cashBack){S.cashBackDue=S.cashBack; S.cashBack=0;} if(SC.amort&&S.debt>0){const am=Math.min(S.debt,Math.max(0,SC.amort-(S.amortCut||0))); S.debt-=am; S.cash-=am; y.amort=am;} y.cash=S.cash;
  const prev=S.lastResult;
  let dca=clamp((pc-prev.pct)*0.8,-8,8)+(res>=SC.resTarget?5:pc>=0?3:-3); if(pc<0&&SC.lossPenalty) dca-=SC.lossPenalty; // investisseurs impatients : chaque année en perte coûte du capital
  if(S.mode==='fonds'&&pc<0) dca-=6;
  if(S.mode==='edtech'&&students<S.students*1.10) dca-=8;
  if(S.mode==='edtech'&&students>=S.students*1.10) dca+=4;
  y.dca=Math.round(dca);
  g.ca=clamp(g.ca+dca,0,100);
  g.etu=clamp(g.etu+(50-g.etu)*0.15+(churn<SC.churn+0.02?3:-2),0,100);
  const dcom=clamp((newS-S.lastNew)/S.lastNew*30,-8,8); g.com=clamp(g.com+dcom,0,100);
  g.cse=clamp(g.cse+(50-g.cse)*0.15+(pc<-5?-2:(pc>3?3:0)),0,100);
  if(S.rate>0.045&&S.cash>0) S.rate=Math.max(0.03,S.rate-0.005);
  if(S.cash<0) S.rate=clamp(S.rate+0.01,0.01,0.15);
  // Les effectifs suivent l'activité : encadrement, support et administration grandissent (un peu moins vite) avec le nombre d'étudiants, en plus des postes créés ou supprimés par vos décisions
  const staffBefore=S.staff; S.staff=Math.max(1,Math.round(BASE.staff*Math.pow(Math.max(students,1)/BASE.students,0.8))+(S.hcAdj||0)); y.staff=S.staff; y.staffDelta=S.staff-staffBefore;
  S.students=students; S.lastNew=newS; S.lastResult={pct:pc,rev:revenue,res}; S.history.push(y);
  S.yearFx={stuY:1,revY:0,once:0}; S.mediaMod={};
  return y;
}
function projected(){
  const pend=S.pending.map(i=>MEASURES[i]);
  const extra=pend.reduce((a,m)=>a+yearly(m),0);
  // Même mécanique que simulate() : abandons + nouvelles inscriptions du plan médias en cours
  const ins=inscriptions(); const churn=clamp(SC.churn+(50-S.g.etu)/100*0.16+S.churn/100+ins.churnExtra/100,Math.max(0.12,SC.churn*0.5),0.75);
  let students=Math.max(0,Math.round(S.students*(1-churn))+ins.total); if(SC.maxGrow) students=Math.min(students,Math.round(Math.max(S.students,BASE.students)*(1+SC.maxGrow)));
  const rc=4000*SC.scale; const rev=students*S.price/1000+(S.rev>rc?rc+(S.rev-rc)*0.5:S.rev)+S.yearFx.revY;
  const costs=BASE.payrollOther+BASE.payrollCom+mkTotal()+BASE.platform+BASE.other+S.cost+(S.debt+Math.max(0,-S.cash))*S.rate+Math.max(0,students-BASE.students)*S.price*(SC.varc||0.55)/1000;
  const revX=pend.reduce((a,m)=>a+(m.rev||0)+(m.price?S.students*S.price*m.price/100/1000:0)+(m.stu?(m.stu-1)*S.lastNew*S.price/1000:0),0);
  const res=rev-costs+extra; return {res,pct:rev>0?res/rev*100:-100,extra,rev:rev+revX};
}
function capCost(ids){ return ids.map(i=>MEASURES[i]).reduce((a,m)=>a+Math.min(0,m.cap||0),0); }
function checkOver(){
  if(S.g.ca<=0) return N.president+" n'a plus pu vous défendre devant le conseil, et il en est le premier désolé. Vous êtes révoqué·e ; un cabinet de redressement prend la direction.";
  if(SC.caMs&&S.history.length&&S.history[S.history.length-1].year===SC.caMs&&S.history[S.history.length-1].revenue<SC.caMsVal) return "Fin "+SC.caMs+", le chiffre d'affaires plafonne à "+(S.history[S.history.length-1].revenue/1000).toFixed(1).replace('.',',')+" M€. Le conseil avait fixé une étape à mi-parcours : "+(SC.caMsVal/1000).toFixed(0)+" M€. "+N.president+" ne peut plus vous couvrir ; un autre dirigeant reprend le plan de croissance.";
  if(SC.milestone&&S.year>=SC.milestone&&S.history.length&&S.history[S.history.length-1].year>=SC.milestone&&S.lastResult.pct<(SC.milestonePct||0)) return "Fin "+S.year+", "+N.ecole+(S.lastResult.pct<0?" perd encore trop d'argent (":" n'est pas assez rentable (")+pct(S.lastResult.pct)+"). Les investisseurs avaient fixé une condition : "+((SC.milestonePct||0)>0?"être rentable, au moins +"+SC.milestonePct+" % de marge":"être revenu près de l'équilibre")+". Ils ne remettent pas au pot et nomment un autre dirigeant.";
  if(S.cash<SC.bank) return "La "+N.banque+" a coupé la ligne de crédit. "+N.ecole+" dépose le bilan.";
  if(S.g.cse<=0) return "Grève illimitée. Après six semaines sans cours, le conseil vous a remplacé·e.";
  if(S.g.etu<=0) return "Hémorragie d'étudiants et plainte collective. "+N.ecole+" perd son habilitation.";
  return null;
}

function badges(){ try{return JSON.parse(localStorage.getItem('bde-badges')||'{}');}catch(e){return {};} }
function award(id){
  const B=badges(); if(B[id]) return; const b=BADGES.find(x=>x.id===id); if(!b) return;
  B[id]={date:new Date().toISOString().slice(0,10),dg:S.name||'',sc:SC?SC.name:'' }; try{localStorage.setItem('bde-badges',JSON.stringify(B));}catch(e){}
  if(S.name){ try{fetch('/api/jeudg/trophees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dg:S.name,trophee:id,scenario:SC?SC.name:''})}).catch(()=>{});}catch(e){} }
  (S.trophSession=S.trophSession||[]).push(id); const t=document.createElement('div'); t.className='toast badge'; t.innerHTML=`<b>🏅 Trophée débloqué : ${b.ic} ${b.n}</b><small>${b.d}</small><small style="opacity:.7">Touchez pour fermer · visible dans la Galerie des trophées</small>`; t.style.cursor='pointer'; t.addEventListener('click',()=>t.remove());
  const box=document.getElementById('toasts'); if(box){while(box.children.length>=4) box.firstChild.remove(); box.appendChild(t); setTimeout(()=>t.remove(),20000);}
}
function badgeSeason(y){ // appelé après la simulation de l'année
  award('first'); if(S.g.etu>=100) award('etu'); if(S.g.com>=100) award('com'); if(S.g.cse>=100) award('cse'); if(S.g.ca>=90) award('cap');
  if(y.norgeat>y.revenue*0.02) award('norgeat');
  const prev=S.history.length>1?S.history[S.history.length-2]:{pct:SC.start}; if(prev.pct<0&&y.pct>=0) award('turn');
  if(!(S.log||[]).some(x=>x.kind==='mesure'&&x.y===S.year)&&y.pct>=0) award('sober');
  if(S.g.ca<20) S.lowCap=true;
}
function badgeFinal(statut){
  const B=badges(); const done=B.done||{}; done[SC.id]={statut,date:new Date().toISOString().slice(0,10)}; B.done=done; try{localStorage.setItem('bde-badges',JSON.stringify(B));}catch(e){}
  if(!S.over.lost) award('five'); if(statut==='objectif'){ if(S.lowCap) award('phoenix'); if(!S.priceUp) award('sanshausse');} if(!S.over.lost&&!S.forcedOnce) award('compromis'); if(statut==='perdu') award('fired');
  const PERM=SCENARIOS.filter(c=>!c.weekly); if(PERM.every(c=>done[c.id])) award('tour'); if(PERM.every(c=>done[c.id]&&done[c.id].statut==='objectif')) award('slam');
}
function renderBadges(){
  const B=badges(); const n=BADGES.filter(b=>B[b.id]).length;
  app().innerHTML=`<div class="center"><div class="panel wide">
    <div class="kicker" style="text-align:center">Le Jeu du DG · Galerie des trophées</div>
    <h1 class="serif title">🏅 Vos trophées</h1>
    <p class="muted" style="text-align:center;margin-top:-6px">${n} trophée${n>1?'s':''} sur ${BADGES.length} débloqué${n>1?'s':''} sur cet appareil.</p>
    <p class="muted" style="text-align:center;margin-top:-10px;font-size:12px">Touchez un trophée pour voir les DG qui l'ont décroché.</p>
    <div class="bgrid">${BADGES.map(b=>{const u=B[b.id];return `<div class="bdg ${u?'on':'lock'}" data-id="${b.id}" style="cursor:pointer"><span class="ic">${BADGE_ART[b.id]||b.ic}</span><b>${b.n}</b><small>${b.d}</small><small class="cnt" data-cnt="${b.id}"></small>${u?`<em>${u.dg?u.dg+' · ':''}${u.sc||''}${u.date?' · '+u.date.split('-').reverse().join('/'):''}</em>`:''}</div>`;}).join('')}</div>
    <div style="display:flex;justify-content:center" id="b"></div></div></div>`;
  $('#b').appendChild(btn('↩ Retour',()=>{S.screen=S.hofBack||'intro';render();},'sbtn'));
  document.querySelectorAll('.bdg[data-id]').forEach(el=>el.addEventListener('click',()=>trophyHolders(el.dataset.id)));
  fetch('/api/jeudg/trophees',{cache:'no-store'}).then(r=>r.json()).then(j=>{ if(!j.counts) return; document.querySelectorAll('[data-cnt]').forEach(el=>{const c=j.counts[el.dataset.cnt]||0; el.textContent=c?`🧑‍💼 ${c} DG l'${c>1?'ont':'a'} décroché`:'Personne ne l\'a encore décroché';}); }).catch(()=>{});
}
function trophyHolders(id){
  const b=BADGES.find(x=>x.id===id); if(!b) return;
  modal(`<div class="ic" style="width:96px;height:96px;margin:0 auto">${BADGE_ART[id]||b.ic}</div><div class="ml">Trophée</div><div class="mt"><b>${b.n}</b><br><span class="muted">${b.d}</span></div><div class="tw" id="th" style="max-height:40vh;overflow:auto;text-align:left"><p class="muted" style="text-align:center">Chargement…</p></div><div style="margin-top:8px"><button class="mbtn" id="mc">Fermer</button></div>`,'gold');
  document.getElementById('mc').onclick=closeModal;
  fetch('/api/jeudg/trophees?id='+id,{cache:'no-store'}).then(r=>r.json()).then(j=>{ const box=document.getElementById('th'); if(!box) return; const rows=j.rows||[];
    if(!rows.length){box.innerHTML='<p class="muted" style="text-align:center">Personne ne l\'a encore décroché. À vous de jouer.</p>';return;}
    box.innerHTML=`<table><tr><th>#</th><th>DG</th><th>École</th><th>Date</th></tr>${rows.map((r,i)=>`<tr${r.dg===S.name?' style="color:var(--gold-hi)"':''}><td class="num">${i+1}</td><td><b>${String(r.dg).replace(/[<>&]/g,'')}</b></td><td class="muted">${String(r.scenario||'').replace(/[<>&]/g,'')}</td><td class="num">${(r.created_at||'').slice(0,10).split('-').reverse().join('/')}</td></tr>`).join('')}</table>`;
  }).catch(()=>{const box=document.getElementById('th'); if(box) box.innerHTML='<p class="muted" style="text-align:center">Serveur injoignable.</p>';});
}

  const r=n=>Math.round(n||0);
  return {v:2, scenario:SC.id, profil:S.profile, jauges:{etu:r(S.g.etu),com:r(S.g.com),cse:r(S.g.cse),capital:r(S.g.ca)},
    ecole:{etudiants:S.students,frais:S.price,salaries:S.staff,dette:r(S.debt),taux:S.rate,tresorerie:r(S.cash),recettes_annexes:r(S.rev),couts_mesures:r(S.cost),churn_mesures:S.churn,stuMult:+(S.stuMult||1).toFixed(3)},
    medias:{...S.media}, mesures:S.active.map(i=>MEASURES[i]&&MEASURES[i].n).filter(Boolean), flags:Object.keys(S.flags||{}),
    prime:S.prime?{annee:S.prime.year,promesse:S.prime.promise,resolue:!!S.prime.resolved}:null, primes_versees:S.primeN||0, plans_forces:!!S.forcedOnce, hausses_prix:!!S.priceUp,
    annees:(S.history||[]).map(y=>({annee:y.year,ca:r(y.revenue),couts:r(y.costs),resultat:r(y.res),inscriptions:y.newS,departs:y.left,abandons:+(y.churn||0).toFixed(3),etudiants:y.students,medias:r(y.mediaK),masse_salariale:r(y.payroll),interets:r(y.interest),tresorerie:r(y.cash),norgeat:r(y.norgeat),saturation:y.ins&&y.ins.sat!=null?+y.ins.sat.toFixed(2):null})),
    journal:(S.log||[]).map(x=>({annee:x.y,type:x.kind,nom:x.n,effet:x.eff,capital:x.cap,coeurs:x.heart,negatif:!!x.bad})),
    trophees:[...new Set(S.trophSession||[])], over:S.over?{perdu:!!S.over.lost,pourquoi:S.over.why||null}:null};
}
function postScore(type,extra){

async function fetchScores(type,annee,archive){

function money(k){ return Math.abs(k)>=1000?(k/1000).toFixed(1).replace('.',',').replace(',0','')+' M€':fmt(Math.round(k))+' k€'; }
function tx(t){ if(!t||!SC||typeof t!=='string') return t; const f=SC.scale, fs=BASE.staff/400, fe=BASE.students/12000;
  return t.replace(/\{k:([\d.]+)\}/g,(_,v)=>money(nice(+v*f))).replace(/\{M:([\d.]+)\}/g,(_,v)=>money(nice(+v*1000*f))).replace(/\{n:(\d+)\}/g,(_,v)=>fmt(scaleN(+v))).replace(/\{s:(\d+)\}/g,(_,v)=>fmt(nice(+v*fe))).replace(/\{com:(\d+)\}/g,(_,v)=>fmt(Math.max(1,Math.round(+v*BASE.com/100)))).replace(/\{p:([\d.]+)\}/g,(_,v)=>fmt(Math.round(((S&&S.price)||BASE.price)*+v/10)*10)+' €').replace(/\{mkk:(\d+)\}/g,(_,v)=>money(nice(+v*BASE.marketing/4500))).replace(/\{staff\}/g,fmt(BASE.staff)).replace(/\{comN\}/g,fmt(BASE.com)).replace(/\{ecole\}/g,N.ecole).replace(/\{medias\}/g,SC.mediaWord).replace(/\{leads\}/g,SC.leadWord).replace(/\b1 commerciaux\b/g,'1 commercial').replace(/\b1 ([a-zéè]{3,})s\b/g,'1 $1'); }
function bubbles(text){ // découpe un dialogue en messages courts (2 phrases max), sans casser le HTML
  const out=[]; String(text).split(/<br\s*\/?>/).forEach(ch=>{ ch=ch.trim(); if(!ch) return;
    if(/^«/.test(ch)&&/»$/.test(ch)) ch=ch.replace(/^«\s*/,'').replace(/\s*»$/,'');
    if(/<(?!\/?b[\s>])[a-z]/i.test(ch)){ out.push(ch); return; }
    const sents=ch.match(/[^.!?…]+(?:[.!?…]+|$)(?:\s*»)?\s*/g)||[ch]; let cur='',n=0;
    sents.forEach(x=>{ if(cur&&(n>=2||(cur+x).length>170)){ out.push(cur.trim()); cur=''; n=0; } cur+=x; n++; }); if(cur.trim()) out.push(cur.trim()); });
  return out; }
function dlg(ic,who,role,text){ const bs=bubbles(tx(text)); const m=(b,i)=>`<p class="msg" style="animation-delay:${(0.4+Math.min(i,3)*0.45).toFixed(2)}s">${b}</p>`;
  const vis=bs.length>4?bs.slice(0,3):bs, rest=bs.length>4?bs.slice(3):[];
  return `<div class="dlg"><div class="avatar sm">${ic}</div><div class="who"><b>${who}</b><small>${role}</small></div><div class="body"><p class="typing"><i></i><i></i><i></i></p>${vis.map(m).join('')}${rest.length?`<details class="more"><summary>Lire la suite ▸</summary>${rest.map(b=>`<p class="msg">${b}</p>`).join('')}</details>`:''}</div></div>`; }
function ready(){ const b=$('#nextBtn'); if(b) b.disabled=false; S.decided=true; save(); }
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('div'); c.className='confetti'; const cols=['#c9a24a','#7ee0a0','#7fa3e6','#b48be6','#ff6b7a','#eef2fb'];
  for(let i=0;i<70;i++){const k=document.createElement('i'); k.style.left=Math.random()*100+'%'; k.style.background=cols[i%cols.length]; k.style.animationDelay=(Math.random()*.8)+'s'; k.style.animationDuration=(2+Math.random()*1.2)+'s'; c.appendChild(k);}
  document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
}

function choices(container,list,after,label){
  const box=document.createElement('div'); box.className='opts';
  list.forEach(([l,fx,out,sub,pre])=>{ l=tx(l); out=tx(out); sub=tx(sub);
    const b=btn(`${l}${sub?`<small>${sub}</small>`:''}${(typeof fx!=='function'&&fx)?`<small>${chips(scf(fx))}</small>`:''}`,()=>{
      box.querySelectorAll('button').forEach(x=>{x.disabled=true;}); b.classList.add('sel');
      const go=()=>{ const f=scf(typeof fx==='function'?fx():fx); apply(f,label);
      const r=document.createElement('div'); r.className='resbox'+(f&&f.g&&Object.values(f.g).some(v=>v<0)&&!Object.values(f.g).some(v=>v>0)?' bad':'');
      r.innerHTML=`<b>${(f&&f.txt)||out}</b>${typeof fx==='function'?chips(f):''}`;
      box.after(r); renderBudget(); if(after) after(); else ready(); };
      if(pre) pre(go); else go();
    },'opt'); box.appendChild(b);
  });
  container.appendChild(box);
}

function maybeCallback(){
  if(document.getElementById('modal').innerHTML||document.querySelector('.sfx')) return false;
  if(S.phase<1||S.phase>6) return false; S.cbDone=S.cbDone||{}; if(S.cbYear===S.year+'-'+S.phase) return false;
  const fy=S.flagYear||{};
  const c=CALLBACKS.find(c=>S.flags[c.flag]&&!S.cbDone[c.id]&&fy[c.flag]&&fy[c.flag]<S.year&&(!c.when||c.when(S)));
  if(!c) return false;
  S.cbDone[c.id]=true; S.cbYear=S.year+'-'+S.phase; save();
  const fx=scf(c.fx);
  modal(`<div class="ic">${c.ic}</div><div class="ml">La suite de vos choix · ${c.who()}</div><div class="mt">${tx(c.t)}</div><div>${chips(fx)}</div><div class="ms">${c.role}</div><div style="margin-top:8px"><button class="mbtn" id="ack">Prendre acte</button></div>`,isBad(fx)?'bad':'');
  const b=document.getElementById('ack'); b.focus(); b.onclick=()=>{closeModal();(S.log=S.log||[]).push({y:S.year,kind:'suite',n:'Suite : '+c.id,eff:Math.round((fx.once||0)-(fx.cost||0)),cap:(fx.g&&fx.g.ca)||0,heart:0,bad:isBad(fx)});apply(fx,'La suite de vos choix');save();renderBudget();};
  return true;
}
function renderPhase(silent){
  if(!silent&&S.yi!==undefined&&!(S.tuto<TUTO_T().length&&S.yi===0&&S.phase===0)) setTimeout(()=>{ if(!maybeMinor()) setTimeout(maybeCallback,250); },350);
  switch(S.phase){
    case 0: return phCadrage();
    case 1: return phMesures();
    case 2: return phMedias();
    case 3: return phEnveloppes();
    case 4: return phGardiens();
    case 5: return phAudition();
    case 6: return phVote();
    case 7: return phEvent(silent);
    case 8: return phResultats();
    case 9: return phShow();
    case 10: return phBilan();
  }
}

function presidentMood(tagOnly){
  const lr=S.lastResult, prev=S.history.length>1?S.history[S.history.length-2]:null;
  const ok=lr.res>=SC.resTarget, onTrack=!SC.growth||SC.caReq===false||lr.rev>=SC.ca0+(SC.caTarget-SC.ca0)*S.yi/5;
  const up=prev?lr.res>prev.res:lr.res>SC.ca0*SC.start/100;
  const left=mE(SC.resTarget-lr.res).slice(1);
  let q,t;
  if(ok&&onTrack){q='« Objectif atteint, et avec de la marge. Le conseil est ravi, et je le suis aussi. Maintenant, on consolide : pas de relâchement, et gardez un œil sur les équipes, c\'est elles qui ont fait le travail. »';t='Nouvelle saison. Le conseil est satisfait, et '+N.president+' le dit volontiers.';}
  else if(ok&&!onTrack){q=`« Le résultat est là, bravo. Il manque l'autre moitié du mandat : ${(SC.caTarget/1000).toFixed(0)} M€ de chiffre d'affaires en 2030. Vous avez montré que vous saviez tenir les comptes ; montrez maintenant que vous savez faire grandir l'école. Cette année, on accélère. »`;t='Nouvelle saison. Rentable ; le conseil attend la croissance.';}
  else if(lr.pct<0&&S.g.ca<35){q='« Je serai franc : l\'école perd de l\'argent, le conseil s\'impatiente, et cette année est celle de la dernière chance. Je n\'ai pas misé sur vous par hasard, mais je ne pourrai pas vous défendre indéfiniment. Montrez-leur ce que vous valez. »';t='Nouvelle saison, sous pression. '+N.president+' y croit encore.';}
  else if(lr.pct<0){q=`« ${SC.start<0||S.yi>1?'Encore une année en perte.':'L\'école est passée dans le rouge.'} ${up?'La tendance est bonne, je le vois, et ça compte.':'Et sans amélioration, ce qui m\'inquiète davantage.'} Le conseil veut voir l'équilibre cette année : ${left} nous séparent de l'objectif. Je pense que c'est à votre portée. »`;t='Nouvelle saison. Le conseil attend l\'équilibre.';}
  else if(up){q=`« Belle progression. L'école est rentable, la courbe monte, et le conseil l'a remarqué. Il reste ${left} à aller chercher d'ici 2030 : gardons ce rythme${SC.growth&&!onTrack?', et remettons de l\'ambition sur le chiffre d\'affaires':''}. Bon travail. »`;t='Nouvelle saison. Le conseil est encourageant : la courbe va dans le bon sens.';}
  else{q=`« Rentable, c'est acquis. Mais on fait du surplace par rapport à l'an dernier, et je crois que vous valez mieux que ça. Il manque ${left} : il faut un coup d'accélérateur cette année. »`;t='Nouvelle saison. Le conseil veut voir la courbe repartir.';}
  if(S.cash<SC.bank*0.6&&!ok) q+=` « Et la trésorerie : ${N.banquier} m'a appelé, poliment, mais inquiet. Réglez ça en priorité. »`;
  if(!tagOnly&&FLAVOR[SC.id]) q+=' '+FLAVOR[SC.id];
  return tagOnly?t:q;
}

function buildOffer(){
  if(!S.offer) S.offer={};
  if(!S.offer[S.year]){
    const pool=MEASURES.filter(m=>!S.active.includes(m.id)&&(!m.sc||m.sc===SC.id));
    const take=(cat,n)=>{const l=pool.filter(m=>m.cat===cat).map(m=>[m,Math.random()-(SC.weekly&&m.sc?1:0)]).sort((x,y)=>x[1]-y[1]).map(x=>x[0]);return l.slice(0,n).map(m=>m.id);}; // défi de la semaine : ses mesures propres passent en premier
    const Q=[[2,3,1,2],[3,3,2,2],[4,4,2,2],[4,4,4,2],[4,4,4,2]][Math.min(S.yi,4)];
    S.offer[S.year]=[...take('rec',Q[0]),...take('dep',Q[1]),...take('str',Q[2]),...take('fou',Q[3])];
    const ann=MEASURES.find(m=>m.flag==='annualisation');
    if(S.yi===0&&ann&&!S.active.includes(ann.id)&&!S.offer[S.year].includes(ann.id)){const deps=S.offer[S.year].filter(i=>MEASURES[i].cat==='dep');S.offer[S.year][S.offer[S.year].indexOf(deps[deps.length-1])]=ann.id;}
    // Hippocampus : les investisseurs sont prêts à remettre au pot, la levée de fonds est toujours sur la table en saison 1
    const lev=MEASURES.find(m=>m.levee);
    if(S.yi===0&&SC.id==='hippocampus'&&lev&&!S.active.includes(lev.id)&&!S.offer[S.year].includes(lev.id)){const strs=S.offer[S.year].filter(i=>MEASURES[i].cat==='str'); if(strs.length) S.offer[S.year][S.offer[S.year].indexOf(strs[0])]=lev.id; else S.offer[S.year].push(lev.id);}
  }
}
function phMesures(){
  buildOffer();
  const avail=S.offer[S.year].map(i=>MEASURES[i]).filter(m=>!S.active.includes(m.id));
  const cats=[['rec','Recettes nouvelles','var(--green)'],['dep','Économies et coupes','var(--gold)'],['str','Réformes de structure','var(--violet)'],['fou','Coups de poker — effets massifs, capital massif','var(--rose)']];
  const body=`<div class="note" style="border-left:3px solid var(--sc-hi,var(--gold))"><div class="h">📋 ${avail.length} mesures sur la table cette année</div><p style="margin:4px 0">${S.yi===0?`Retenez-en autant que votre capital le permet, ou aucune. Chaque mesure consomme du capital auprès de ${N.president} et reste en vigueur les années suivantes.`:`Retenez-en autant que votre capital le permet, ou aucune.`}</p></div>`+
   `${S.yi>0?'<details class="det"><summary>📗 Sans mesure nouvelle, résultat '+S.year+' à '+mE(projected().res)+' · rappel de la mécanique ▸</summary>':''}<div class="daf"><div class="h">📗 Sans mesure nouvelle</div><div class="big">Résultat ${S.year} ≈ <b style="color:${projected().res<0?'var(--rose)':'var(--green)'}">${Math.abs(projected().res)<1000?kE(Math.round(projected().res)):mE(projected().res)}</b>${SC.growth?` <span class="muted">· cap CA 2030 : ${(SC.caTarget/1000).toFixed(0)} M€</span>`:''}</div><div class="k3"><span>🚪 <b>${Math.round(SC.churn*100)} %</b> d'abandons</span><span>👥 salaires = <b>${Math.round((BASE.payrollOther+BASE.payrollCom)/SC.ca0*100)} %</b> du CA</span><span>${BASE.debt?`🏦 dette <b>${(BASE.debt/1000).toFixed(1).replace('.',',')} M€</b> à ${(S.rate*100).toFixed(1).replace('.',',')} %`:`🏦 découvert max <b>${mE(SC.bank)}</b>`}</span></div>${S.yi===0?`<details><summary>Pourquoi ces trois chiffres ▸</summary><ul><li><b>Les abandons.</b> ${Math.round(SC.churn*100)} % des ${SC.unit} ne vont pas au bout : chaque départ est un chiffre d'affaires perdu.</li><li><b>La masse salariale.</b> ${BASE.staff} salariés et ${((BASE.payrollOther+BASE.payrollCom)/1000).toFixed(1).replace('.',',')} M€ de salaires pour ${(SC.ca0/1000).toFixed(0)} M€ de chiffre d'affaires.</li><li><b>${BASE.debt?'La dette.':'La trésorerie.'}</b> ${BASE.debt?'Chaque euro de découvert coûte plus cher.':'Pas de dette, mais la banque coupe à '+mE(SC.bank)+' de découvert.'}</li></ul></details>`:''}</div>${S.yi>0?'</details>':''}
   ${S.yi===0?`<div class="hint">💡 À droite de chaque mesure : <b>effet estimé sur le résultat (k€/an)</b> et <b>coût en capital</b>. Touchez une mesure pour le détail.</div>`:''}
   <div class="capbar" id="capbar"></div>
   <div id="cat"></div><div class="hint" id="tally"></div>`;
  const lr0=S.lastResult, nAct=S.active.length;
  const mt=S.yi===0?(SC.start<0?'Il faut sauver l\'école':'Le plan de la première année')
    :lr0.res>=SC.resTarget?'Tenir le cap'
    :lr0.pct<0?'Le plan de redressement, acte '+(S.yi+1)
    :S.yi>=3?'Les dernières cartes'
    :'Le plan '+S.year;
  const mtag=S.yi===0?'Seul·e face à la page blanche du plan. Chaque ligne cochée fera un mécontent, et aucune ne fera plaisir à tout le monde.'
    :lr0.res>=SC.resTarget?'L\'objectif est atteint : chaque nouvelle mesure doit consolider sans fragiliser. Le conseil regarde surtout ce que vous ne touchez pas.'
    :lr0.pct<0?`${nAct} mesure${nAct>1?'s':''} déjà en vigueur, et l\'école perd encore de l\'argent. Il faut choisir : couper plus, ou vendre mieux.`
    :S.yi>=3?`Il reste ${YEARS.length-S.yi} exercice${YEARS.length-S.yi>1?'s':''} pour aller chercher ${mE(SC.resTarget-lr0.res).slice(1)}. Chaque mesure adoptée tard rapporte moins.`
    :`${nAct} mesure${nAct>1?'s':''} en vigueur et une école rentable. Le plus dur commence : trouver la marge sans casser ce qui marche.`;
  sceneShell(body,{title:mt,tag:mtag});
  const draw=()=>{
    const used=-capCost(S.pending); const avail_cap=Math.round(S.g.ca);
    $('#cat').innerHTML=cats.map(([k,n,col])=>`<div class="cath"><i style="background:${col}"></i>${n}</div><div class="mrows">${avail.filter(m=>m.cat===k).map(m=>{const y=yearly(m);const thr=Math.max(1,Math.round(SC.ca0*0.0015));const sel=S.pending.includes(m.id);const c=m.cap||0;const off=!sel&&(c<0&&used-c>avail_cap);return `<label class="mrow ${sel?'sel':''} ${off?'off':''} ${m.cat==='fou'?'fou':''}"><input type="checkbox" data-id="${m.id}" ${sel?'checked':''} ${off?'disabled':''}><span>${tx(m.n)}</span><span class="cap ${c>0?'gain':''}">${c>0?'+':''}${c} ⚡</span><span class="amt num ${y>thr?'pos':y<-thr?'neg':'zero'}">${y>thr||y<-thr?kE(y):'±0'}</span><span class="tip"><span class="d">${tx(m.d)}</span>${chips({g:m.g,once:m.once,hc:m.hc,churn:m.churn,rate:m.rate})||'<span class="chip">Aucun effet sur les jauges</span>'}<span class="d" style="margin-top:4px;color:var(--gold-hi)">${lecture(m)}</span></span><span class="mfx"><span class="d">${tx(m.d)}</span>${chips({g:m.g,once:m.once,hc:m.hc,churn:m.churn,rate:m.rate})}<span class="d" style="color:var(--gold-hi)">${lecture(m)}</span></span></label>`;}).join('')}</div>`).join('');
    $('#cat').querySelectorAll('input').forEach(i=>i.addEventListener('change',e=>{const id=+e.target.dataset.id; if(e.target.checked) S.pending.push(id); else S.pending=S.pending.filter(x=>x!==id); draw(); renderBudget(); renderGauges(); save();}));
    const cb=$('#capbar'); cb.className='capbar'+(used>avail_cap?' over':''); cb.innerHTML=`<span>⚡ Capital engagé par les mesures cochées</span><span><b>${used}</b> / ${avail_cap} pts disponibles</span>`;
    $('#tally').innerHTML=`<b>${S.pending.length}</b> mesure${S.pending.length>1?'s':''} retenue${S.pending.length>1?'s':''}. ${S.pending.length?'Elles seront soumises au vote du conseil en juillet ; le capital sera débité à l\'adoption.':'Vous pouvez aussi continuer sans nouvelle mesure.'}`;
    ready();
  };
  draw();
}

function phGardiens(){
  const items=[];
  if(S.cash<SC.bank*0.2) items.push(["🧾","Le commissaire aux comptes ("+N.cac+")","déclenche une procédure d'alerte : la continuité d'exploitation n'est plus assurée sans mesures fortes.",{g:{ca:-5,cse:-3}}]);
  else if(S.cash<0) items.push(["🧾","Le commissaire aux comptes ("+N.cac+")","signale une trésorerie négative et demande un plan de financement.",{g:{ca:-2}}]);
  else items.push(["🧾","Le commissaire aux comptes ("+N.cac+")","certifie les comptes sans réserve.",{g:{ca:1}}]);
  if(S.cash<SC.bank*0.3) items.push(["🏦","La "+N.banque,"invoque les clauses du prêt et relève le taux. "+N.banquier+" exige un plan de trésorerie mensuel.",{rate:0.01,g:{ca:-4}}]);
  else if(S.cash<0) items.push(["🏦","La "+N.banque,"tolère le découvert, mais facture des agios.",{rate:0.005}]);
  else if(S.lastResult.pct>5) items.push(["🏦","La "+N.banque,"salue les résultats et propose un taux révisé.",{rate:-0.005,g:{ca:2}}]);
  else items.push(["🏦","La "+N.banque,"maintient ses conditions.",{}]);
  if(S.flags.risque_qualiopi) items.push(["🔎","L'auditeur Qualiopi ("+N.qualiopi+")","émet des non-conformités majeures. Sans correction, la certification sera retirée.",{g:{ca:-3,etu:-3}}]);
  else if(S.g.etu<35) items.push(["🔎","La commission pédagogique indépendante","alerte sur le taux d'abandon et la satisfaction. Son rapport est transmis au conseil.",{g:{ca:-3,etu:-2}}]);
  else if(S.flags.qualite) items.push(["🔎","L'auditeur Qualiopi ("+N.qualiopi+")","renouvelle la certification et cite "+N.ecole+" en exemple.",{g:{ca:2,etu:2}}]);
  else items.push(["🔎","La commission pédagogique","rend un avis neutre : rien d'alarmant, rien de remarquable.",{}]);
  const cuts=S.pending.map(i=>MEASURES[i]).filter(m=>m.cat==='dep'&&(m.hc||0)<0).length;
  if(cuts>=2) items.push(["⚖️","L'inspection du travail","note l'accumulation de suppressions de postes et demande à être associée au calendrier.",{g:{cse:-3}}]);
  if(!S.decided){ items.forEach(i=>apply(scf(i[3]),i[1])); }
  sceneShell(`<p class="muted">Avant le vote, les contrôleurs extérieurs se prononcent sur la situation de ${N.ecole}.</p><div class="opts">${items.map(i=>`<div class="resbox ${Object.values(i[3].g||{}).some(v=>v<0)||i[3].rate>0?'bad':Object.keys(i[3]).length?'':'neu'}"><b>${i[0]} ${i[1]}</b>${i[2]}<div>${chips(i[3])}</div></div>`).join('')}</div>`,{title:'Les gardiens',tag:'Commissaire aux comptes, banque, auditeurs : ils ne votent pas, mais le conseil les écoute.',ready:true});
  S.decided=true; save();
}

// Vote nominatif du conseil : chaque administrateur a sa grille de lecture
function boardVotes(chance,pend){
  const sum=k=>pend.reduce((a,m)=>a+((m.g&&m.g[k])||0),0);
  const cap=capCost(S.pending); const pj=projected(); const delta=pj.pct-S.lastResult.pct;
  const amd=S.tmp.amd||{}; const once=pend.reduce((a,m)=>a+(m.once||0),0);
  const pres=S.mode?['Le nouvel actionnaire','Président du conseil']:[N.president,N.presidentRole];
  const methode=pend.some(m=>/Audit|qualité|Plan stratégique/i.test(m.n));
  const members=[
   {who:pres[0],role:pres[1],mod:(S.g.ca-50)*0.5,p:S.g.ca>=60?'Fait confiance à la direction.':'Soutient le plan, par devoir plus que par conviction.',c:S.g.ca<40?'Ne fait plus confiance à la direction.':'Attend un plan plus convaincant.'},
   {who:N.adminEtu,role:'Représentant des étudiants',mod:sum('etu')*1.2,p:sum('etu')>0?'Le plan améliore la vie étudiante.':'Le plan épargne les étudiants.',c:sum('etu')<0?'Le plan fait payer les étudiants.':'N\'y voit rien pour les étudiants.'},
   {who:N.adminEns,role:'Représente les enseignants',mod:sum('cse')*1.0,p:sum('cse')>0?'Les équipes y gagnent.':'Les équipes sont préservées.',c:sum('cse')<0?'Les équipes trinquent.':'Rien pour les équipes dans ce plan.'},
   {who:N.actionnaire,role:'Actionnaire minoritaire',mod:delta*2-(S.cash<0?8:0),p:delta>0?'Le résultat projeté s\'améliore.':'Fait confiance à la direction.',c:delta<2?'Pas assez d\'effet sur le résultat.':'Doute des chiffres annoncés.'},
   SC.founder?{who:N.adminIndep,role:'Fondatrice historique · au conseil',mod:sum('etu')*1.5+pend.reduce((a,m)=>a+(m.founder||0),0)+(pend.some(m=>/tutorat|tuteurs|qualité|cours|alumni/i.test(m.n))?10:0),p:sum('etu')>0?'Le plan respecte les étudiants et la pédagogie.':'Rien ne trahit l\'école qu\'elle a fondée.',c:sum('etu')<0?'« Ce n\'est pas pour ça que j\'ai créé cette école. »':'Attend plus de pédagogie dans ce plan.'}
   :{who:N.adminIndep,role:'Administratrice indépendante',mod:-pend.length*1.5-cap*0.2+(methode?12:0),p:methode?'Salue la transparence et la méthode.':'Plan raisonnable dans son périmètre.',c:pend.length>5?'Trop de chantiers à la fois.':'Manque de méthode et d\'indicateurs.'},
   {who:N.daf,role:'DAF et actionnaire',mod:delta*1.5+(S.cash<SC.bank*0.1?-10:S.cash>0?5:0)+(pend.length>6?-6:0),p:delta>2?'Les comptes y gagnent, il signe.':'Un plan qu\'il peut financer.',c:S.cash<SC.bank*0.1?'Ne sait pas comment financer le plan.':'Les chiffres ne tiennent pas à ses yeux.'},
   {who:N.banquier,role:'Censeur · '+N.banque,mod:(S.cash<SC.bank*0.2?-15:S.cash<0?-5:5)+(S.flags.plan_treso?6:0)+once/(200*SC.scale),p:'La trésorerie reste sous contrôle.',c:S.cash<SC.bank*0.2?'La trésorerie est hors des clauses du prêt.':once<-1000?'S\'inquiète des sorties de trésorerie immédiates.':'Juge le plan trop risqué pour la banque.'},
  ];
  const list=members.map(m=>{const a=amd[m.who]; const am=a===true?20:a===false?-25:0; const pr=clamp(chance+m.mod+am,5,95); const pour=Math.random()*100<pr;
    const why=a===true?'A obtenu son amendement.'+(pour?'':' Mais '+m.c.charAt(0).toLowerCase()+m.c.slice(1)):a===false?(pour?'Vote pour malgré le rejet de son amendement.':'Son amendement a été rejeté.'):(pour?m.p:m.c);
    return {who:m.who,role:m.role,pour,why};});
  const pour=list.filter(v=>v.pour).length, contre=list.length-pour; const tie=pour===contre;
  return {list,pour,contre,tie,ok:pour>contre||(tie&&list[0].pour)};
}
function phVote(){
  if(S.sub<2){
    if(S.sub===0&&!S.tmp) S.tmp={list:[pick(AMENDEMENTS,'amd'),pick(AMENDEMENTS,'amd')],bonus:0,amd:{}};
    const a=AMENDEMENTS[S.tmp.list[S.sub]];
    sceneShell(dlg(a.ic,a.who,a.role+' · dépose un amendement',a.ask)+`<div class="prompt">Amendement ${S.sub+1}/2 :</div><div id="c"></div>`,{title:'La grande bidouille',tag:'Avant le vote, chacun négocie sa ligne. Rejeter un amendement, c\'est perdre une voix.',onNext:()=>{S.sub++;S.decided=false;renderGame();}});
    choices($('#c'),[["✓ Accepter l'amendement",()=>{S.tmp.bonus+=12;S.tmp.amd[a.who]=true;return a.y;},"L'amendement est intégré au plan."],["✗ Rejeter l'amendement",()=>{S.tmp.bonus-=5;S.tmp.amd[a.who]=false;return a.n;},"Rejeté. Son auteur s'en souviendra au moment du vote."]],null,a.who);
    return;
  }
  const pend=S.pending.map(i=>MEASURES[i]);
  const cap=capCost(S.pending);
  // Chance d'adoption : base 70, + confiance du conseil (capital), + amendements, − ambition du plan (capital engagé, nombre de mesures), + crédibilité (résultat projeté)
  const pj=projected(); const credib=clamp((pj.pct-S.lastResult.pct)*0.6,-6,10);
  const parts={base:70,conf:Math.round((S.g.ca-50)*0.6),amd:S.tmp.bonus,poids:Math.round(cap*0.4-pend.length*1.5),cred:Math.round(credib)};
  const chance=pend.length?clamp(parts.base+parts.conf+parts.amd+parts.poids+parts.cred,8,95):97;
  if(S.sub===2){
    sceneShell(dlg(PRES,S.mode?'Le président du conseil':N.president,N.presidentRole+' · ouvre le vote',`« ${pend.length?`Le plan comporte ${pend.length} mesure${pend.length>1?'s':''}, pour ${-cap} points de capital. Chacun a pu l'étudier.`:'Aucune nouvelle mesure n\'est soumise cette année : on garde le cap.'} Le conseil se prononce à main levée. »`)+
     `<div class="tw"><table class="vt"><tr><th>Mesure</th><th><span class="lg">Effet annuel</span><span class="sm">k€/an</span></th><th><span class="lg">Capital</span><span class="sm">⚡</span></th><th><span class="lg">${GN.etu}</span><span class="sm">💚</span></th><th><span class="lg">CSE</span><span class="sm">💜</span></th></tr>${pend.map(m=>`<tr><td>${m.n}</td><td class="num"><span class="lg">${kE(yearly(m))}</span><span class="sm">${(yearly(m)>=0?'+':'−')+fmt(Math.abs(yearly(m)))}</span></td><td class="num" style="color:var(--gold-hi)">${m.cap>0?'+':''}${m.cap||0}</td><td class="num">${(m.g&&m.g.etu)||0}</td><td class="num">${(m.g&&m.g.cse)||0}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Aucune mesure</td></tr>'}</table></div>
     <div class="note">Chance d'adoption estimée : <b style="font-size:18px;color:var(--gold)">${Math.round(chance)} %</b> <span class="muted">(base 70, confiance du conseil ${parts.conf>=0?'+':''}${parts.conf}, amendements ${parts.amd>=0?'+':''}${parts.amd}, ambition du plan ${parts.poids}, crédibilité ${parts.cred>=0?'+':''}${parts.cred})</span></div><div id="c" style="display:flex;justify-content:center"></div>`,{title:'Le vote du conseil',tag:'La grande bidouille se termine. Le conseil tranche.'});
    $('#c').appendChild(btn('🗳️ Appeler au vote',()=>{S.sub=3;S.tmp.votes=boardVotes(chance,pend);renderGame();}));

function waterfallHtml(y){ // d'où vient le résultat : résultat de l'an dernier → leviers → résultat de l'année

  const r0=prevY?prevY.res:Math.round(SC.ca0*SC.start/100);
  const items=[
    ['🎓 Ventes de formations ('+fmt(y.students)+' '+SC.unit+')',y.tuition-P.tuition],
    ['➕ Autres recettes',(y.revEff+(y.revY||0))-((P.revEff||0)+(P.revY||0))],

  let cum=r0; const steps=[[`Résultat ${S.year-1}`,r0,0,r0,true]]; list.forEach(([l,d])=>{ steps.push([l,d,cum,cum+d,false]); cum+=d; }); steps.push([`Résultat ${S.year}`,y.res,0,y.res,true]);
  const lo=Math.min(0,...steps.map(x=>Math.min(x[2],x[3]))), hi=Math.max(0,...steps.map(x=>Math.max(x[2],x[3]))), span=(hi-lo)||1, X=v=>(v-lo)/span*100;

    return `<div class="r${tot?' tot':''}"><span class="l">${l}</span><span class="tr"><span class="z" style="left:${X(0)}%"></span><i style="left:${x1}%;width:${w}%;background:${col}"></i></span><span class="v" style="color:${tot?'var(--fg)':col}">${tot?mE(v):kE(Math.round(v))}</span></div>`; }).join('')}<p class="hint" style="margin:8px 0 0">${why}</p></div>`; }

function bilanVerdict(){ // verdict de Bernard selon la trajectoire vers l'objectif, pas seulement le capital
  const lr=S.lastResult, r0=SC.ca0*SC.start/100, span=SC.resTarget-r0;
  const prog=span>0?(lr.res-r0)/span:1, exp=(S.yi+1)/YEARS.length, P=x=>Math.round(clamp(x,0,1.5)*100);
  const caLate=SC.growth&&SC.caReq!==false&&lr.rev<SC.ca0+(SC.caTarget-SC.ca0)*exp*0.8;
  let ic,col,msg;
  if(lr.res>=SC.resTarget){ ic='🏆';col='var(--green)';msg=`${N.president} vous félicite : l'objectif de résultat est déjà atteint. « Maintenant, il faut le tenir jusqu'en 2030. »`; }
  else if(prog>=exp+0.08){ ic='🚀';col='var(--green)';msg=`${N.president} est ravi : vous êtes en avance sur la trajectoire. « Continuez comme ça, le conseil commence à vous citer en exemple. »`; }
  else if(prog>=exp-0.06){ ic='✅';col='var(--green)';msg=`${N.president} est confiant : vous êtes dans les temps. « Pas de relâchement, mais on est sur la bonne route. »`; }
  else if(prog>0){ ic=S.g.ca<30?'⏳':'⚠️';col='var(--gold)';msg=S.g.ca<30?`Le conseil s'impatiente : l'école progresse, mais trop lentement, et votre capital est bas. ${N.president} vous défend encore. C'est un sursis.`:`${N.president} est inquiet : ça progresse, mais en retard sur la trajectoire. « Il va falloir accélérer l'an prochain. »`; }
  else { ic='🔥';col='var(--rose)';msg=S.g.ca<30?`L'école recule et le conseil gronde. ${N.president} obtient pour vous un dernier sursis, sans garantie pour la suite.`:`L'école a reculé par rapport à 2025. ${N.president} reste à vos côtés, mais le conseil attend un vrai redressement.`; }
  if(caLate&&lr.res<SC.resTarget) msg+=(prog>=exp-0.06?' Mais attention : le chiffre d\'affaires est en retard':' Et le chiffre d\'affaires est lui aussi en retard')+` sur l'objectif de ${(SC.caTarget/1000).toFixed(0)} M€.`;
  return `<div class="note" style="margin-top:18px;border-color:${col}"><div class="h" style="color:${col}">${ic} Le verdict de ${N.president}</div><p style="margin:4px 0 10px">${msg}</p>
    <div style="font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap"><span>Chemin parcouru vers ${tgt()} : <b style="color:${col}">${P(prog)} %</b></span><span>attendu fin ${S.year} : ${P(exp)} %</span></div>
    <div style="position:relative;height:8px;border-radius:4px;background:#1b2340;margin-top:5px"><i style="position:absolute;left:0;top:0;bottom:0;width:${clamp(prog,0,1)*100}%;background:${col};border-radius:4px"></i><i style="position:absolute;top:-4px;bottom:-4px;left:${exp*100}%;width:2px;background:#eef2fb"></i></div></div>`; }

function bilanHtml(){
  const L=S.log||[]; const mes=L.filter(x=>x.kind==='mesure'); const ev=L.filter(x=>x.kind==='imprévu');
  const top=mes.slice().sort((a,b)=>b.eff-a.eff).slice(0,3);
  const costly=mes.slice().filter(x=>x.heart<-10).sort((a,b)=>a.heart-b.heart).slice(0,2);
  const worst=ev.filter(x=>x.bad).sort((a,b)=>(a.eff+a.heart*50)-(b.eff+b.heart*50)).slice(0,2);
  const best=ev.filter(x=>!x.bad).sort((a,b)=>(b.eff+b.heart*50)-(a.eff+a.heart*50)).slice(0,1);
  const h0=S.history[0], hN=S.history[S.history.length-1];
  const lines=[];
  if(top.length) lines.push(`<b>Les décisions qui ont fait la différence :</b> ${top.map(x=>`${x.n} (${x.y}, ${kE(x.eff)}/an)`).join(' · ')}.`);
  if(costly.length) lines.push(`<b>Celles qui ont coûté cher en cœurs :</b> ${costly.map(x=>`${x.n} (${x.heart} au total)`).join(' · ')}.`);
  if(worst.length) lines.push(`<b>Les coups durs :</b> ${worst.map(x=>`${x.n} (${x.y})`).join(' · ')}.`);
  if(best.length) lines.push(`<b>Le coup de chance :</b> ${best[0].n} (${best[0].y}).`);
  if(h0&&hN) lines.push(`<b>En chiffres :</b> ${fmt(BASE.students)} ${SC.unit} en 2025, ${fmt(hN.students)} fin 2030 ; ${fmt(h0.newS)} inscriptions en 2026, ${fmt(hN.newS)} en 2030 ; taux d'abandon de ${Math.round(h0.churn*100)} % à ${Math.round(hN.churn*100)} % ; budget ${SC.mediaWord} de ${(h0.mediaK/1000).toFixed(1).replace('.',',')} M€ à ${(hN.mediaK/1000).toFixed(1).replace('.',',')} M€, soit ${fmt(h0.mediaK*1000/Math.max(1,h0.ins.paid||h0.newS))} € puis ${fmt(hN.mediaK*1000/Math.max(1,hN.ins.paid||hN.newS))} € par inscription payante${hN.ins.sat<0.9?' (marché saturé : chaque inscription coûte plus cher à mesure que l\'école grossit)':''}.`);
  const lesson=S.g.ca<25?'Vous avez fini à court de capital : le conseil ne suivait plus. Garder une réserve de capital, c\'est garder la main.':S.g.cse<30?'Le climat social a été sacrifié : les économies ont tenu, pas les équipes.':S.g.etu<35?'Les étudiants ont payé le redressement : abandons élevés, bouche-à-oreille en berne.':hN&&hN.res>=SC.resTarget?'Un redressement équilibré : les comptes, les équipes et les étudiants ont tenu ensemble.':'Les comptes ont progressé, mais pas assez vite : les premières années pèsent le plus, chaque mesure prise tôt rapporte cinq fois.';
  lines.push(`<b>La leçon :</b> ${lesson}`);
  return `<div class="note" style="text-align:left"><div class="h">📘 Ce que cette partie raconte</div>${lines.map(l=>`<p style="margin:4px 0">${l}</p>`).join('')}</div>`;
}

// ── Grand final : une animation énorme selon l'issue du mandat ──
function finaleKind(statut){ if(statut==='objectif') return 'win'; if(statut==='equilibre') return 'demi'; if(statut==='manque') return 'manque';
  const w=String(S.over&&S.over.why||''); return /ligne de crédit|bilan/i.test(w)?'faillite':/Grève/i.test(w)?'greve':/Hémorragie|habilitation/i.test(w)?'exode':'revoque'; }
function finale(kind){
  if(RM()) return;
  const lr=S.lastResult, R=(a,b)=>a+Math.random()*(b-a), esc=x=>String(x).replace(/[<>&]/g,''), nm=esc(S.name||'Vous'), ec=esc(N.ecole);
  const count=(el,to,ms)=>{ if(!el) return; const t0=performance.now(); const st=t=>{ if(!el.isConnected) return; const p=Math.min(1,(t-t0)/ms); el.textContent=mE(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(st); }; requestAnimationFrame(st); };
  const fw=(d,n,delay,cols)=>{ for(let k=0;k<n;k++) setTimeout(()=>{ if(!d.isConnected) return; const b=document.createElement('div'); b.className='fw'; b.style.left=R(8,92)+'%'; b.style.top=R(6,55)+'%'; const c=cols[k%cols.length]; b.style.background=c; b.style.color=c; for(let q=0;q<22;q++){ const i=document.createElement('i'); i.style.setProperty('--a',(q*16.4)+'deg'); i.style.setProperty('--d',R(60,150)+'px'); b.appendChild(i);} d.appendChild(b); setTimeout(()=>b.remove(),1500); },delay+k*R(180,320)); };
  const cf=d=>{ confetti(); const c=document.body.querySelector(':scope>.confetti:last-of-type'); if(c) d.appendChild(c); };
  const quake=d=>{ d.classList.remove('quake'); void d.offsetWidth; d.classList.add('quake'); };
  const sub=(t,delay)=>`<div class="sub" style="animation-delay:${delay}s">${t}</div>`;
  const why=esc(S.over&&S.over.why||'');
  if(kind==='win'){
    sfxBox('fin',`<div class="rays2"></div><div class="stage" style="z-index:2"><div class="bigtro">🏆</div><div class="ttl" style="animation-delay:1.6s;color:#ffd76a;text-shadow:0 0 30px rgba(255,210,90,.7)">MANDAT ACCOMPLI</div><div class="who" style="animation-delay:2.1s">${nm} · ${ec}</div><div class="big" id="finR" style="animation-delay:2.5s;color:#9df0b8">+0,0 M€</div>${sub(`de résultat net fin 2030, pour ${tgt()} demandés. ${esc(N.president)} : « Je savais que vous le feriez. »`,3.2)}</div><div class="crowd">${'🙌👏🎉🥳👏🙌🎊👏🥳🙌'.match(/./gu).map((e,k)=>`<span style="animation-delay:${(k*0.07).toFixed(2)}s">${e}</span>`).join('')}</div>`,(MOB()?11000:9500),d=>{
      fw(d,16,900,['#ffd76a','#7ee0a0','#7fa3e6','#ff8a96','#b48be6','#fff']); setTimeout(()=>count(d.querySelector('#finR'),lr.res,1600),2500); [1600,2400,3400,4600].forEach(t=>setTimeout(()=>{ if(d.isConnected) cf(d); },t));
      for(let k=0;k<26;k++){ const r=document.createElement('span'); r.className='rain'; r.textContent=['⭐','🏆','💰','✨'][k%4]; r.style.left=R(0,96)+'%'; r.style.animationDelay=(1.8+R(0,3)).toFixed(2)+'s'; d.appendChild(r); } },null); }
  else if(kind==='demi'){
    sfxBox('fin',`<div class="stage" style="z-index:2"><div class="bottle">🍾</div><div class="ttl" style="animation-delay:1.8s;color:#e8c15a">Mandat honorable</div><div class="who" style="animation-delay:2.2s">${nm} · ${ec}</div><div class="big" id="finR" style="animation-delay:2.6s;color:#e8c15a">+0,0 M€</div>${sub(`de résultat net, pour ${tgt()} demandés. L'école est rentable ; ${esc(N.president)} lève son verre, sans trop sourire.`,3.2)}</div><span class="cork">🍾</span>`,(MOB()?10000:8500),d=>{
      setTimeout(()=>{ if(!d.isConnected) return; quake(d); for(let k=0;k<26;k++){ const f=document.createElement('span'); f.className='foam'; f.style.setProperty('--dx',R(-40,220)+'px'); f.style.setProperty('--dy',R(-260,40)+'px'); f.style.animationDelay=R(0,.4).toFixed(2)+'s'; d.appendChild(f);} cf(d); },1100);
      setTimeout(()=>count(d.querySelector('#finR'),lr.res,1400),2600); fw(d,5,2200,['#ffd76a','#e8c15a','#fff']); },null); }
  else if(kind==='manque'){
    const items=['🖼️','🪴','☕','📎','🏅','📚','🗂️','🖊️'];
    sfxBox('fin',`<div class="stage" style="z-index:2"><div class="box">${items.map((e,k)=>`<span class="item" style="left:${8+k*11}%;animation-delay:${(0.3+k*0.28).toFixed(2)}s">${e}</span>`).join('')}</div><div class="ttl" style="animation-delay:2.8s;color:#ff8a96;margin-top:26px">Mandat non renouvelé</div><div class="who" style="animation-delay:3.2s">${nm} · ${ec}</div><div class="big" id="finR" style="animation-delay:3.5s;color:#ff8a96">0,0 M€</div>${sub(`de résultat net fin 2030, loin des ${tgt()} demandés. On vous raccompagne gentiment jusqu'à l'ascenseur.`,4)}</div><div class="dim"></div>`,(MOB()?10500:9000),d=>{ setTimeout(()=>count(d.querySelector('#finR'),lr.res,1400),3500); },null); }
  else if(kind==='revoque'){
    sfxBox('fin',`<div class="stage" style="z-index:2"><div class="gavel">🔨</div><div><span class="stampbig">RÉVOQUÉ·E</span></div><div class="who" style="animation-delay:2.3s;margin-top:18px">${nm} · ${ec} · ${S.year}</div>${sub(why,2.8)}</div><div class="crack"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 48 L38 30 L41 12 L33 0 M50 48 L66 34 L74 18 L88 6 M50 48 L30 56 L12 52 L0 60 M50 48 L58 68 L54 84 L62 100 M50 48 L72 58 L90 70 L100 66"/></svg></div>`,(MOB()?10000:8500),d=>{ setTimeout(()=>{ if(d.isConnected){ quake(d); setTimeout(()=>quake(d),500);} },1150); },null); }
  else if(kind==='faillite'){
    const letters=[...ec].map((ch,k)=>`<span style="--r:${R(-160,160)|0}deg;animation-delay:${(1.6+R(0,1.4)).toFixed(2)}s">${ch===' '?'&nbsp;':ch}</span>`).join('');
    sfxBox('fin',`<div class="tape" style="top:7%;--r:-8deg;animation-delay:.3s"><span>LIQUIDATION</span></div><div class="tape" style="top:22%;--r:5deg;animation-delay:.7s"><span>DÉPÔT DE BILAN</span></div><div class="tape" style="top:86%;--r:-4deg;animation-delay:1.1s"><span>LIQUIDATION</span></div><div class="stage" style="z-index:2;margin-top:12vh"><div class="sign2">${letters}</div><div class="ttl" style="animation-delay:3.2s;color:#f2c600">La banque a fermé le robinet</div><div class="who" style="animation-delay:3.6s">${nm} · ${S.year}</div>${sub(why,4)}</div>`,(MOB()?10500:9000),d=>{ setTimeout(()=>{ if(d.isConnected) quake(d); },700); },null); }
  else if(kind==='greve'){
    sfxBox('fin',`<div class="stage" style="z-index:2"><div class="banner">✊ GRÈVE ILLIMITÉE ✊</div><div class="ttl" style="animation-delay:2.4s;color:#ff8a96;margin-top:30px">Remplacé·e</div><div class="who" style="animation-delay:2.8s">${nm} · ${ec} · ${S.year}</div>${sub(why,3.2)}</div><div class="march">${[...Array(22)].map((_,k)=>`<span style="animation-delay:${(k*0.18).toFixed(2)}s">${['✊','🪧','🙋','📣','🧑‍🏫','👩‍💼'][k%6]}</span>`).join('')}</div>`,(MOB()?10000:8500),d=>{ setTimeout(()=>{ if(d.isConnected) quake(d); },1000); },null); }
  else { // exode
    sfxBox('fin',`<div class="door2"></div>${[...Array(18)].map((_,k)=>`<span class="leaver" style="animation-delay:${(k*0.22).toFixed(2)}s;bottom:${(10+R(0,4)).toFixed(1)}vh">🎓</span>`).join('')}<div class="stage" style="z-index:2;margin-top:-18vh"><div class="ttl" style="animation-delay:1.2s;color:#ff8a96">Habilitation retirée</div><div class="who" style="animation-delay:1.6s">${nm} · ${ec} · ${S.year}</div>${sub(why,2)}</div>`,(MOB()?10000:8500),null,null); }
}
function renderFinal(){
  const lr=S.lastResult; let verdict,text,cls;
  const grown=!SC.growth||SC.caReq===false||lr.rev>=SC.caTarget;
  const statut=S.over.lost?'perdu':(lr.res>=SC.resTarget&&grown)?'objectif':lr.pct>=0?'equilibre':'manque';
  if(!S.over.posted){S.over.posted=true;postScore('partie',{statut});badgeFinal(statut); const fk=finaleKind(statut); setTimeout(()=>finale(fk),80);}
  if(S.over.lost){verdict="Fin de série";text=S.over.why;cls='bad';}
  else if(lr.res>=SC.resTarget&&grown){verdict="Objectif atteint";text=`Fin 2030, ${N.ecole} affiche ${mE(lr.res)} de résultat net, ${(lr.rev/1000).toFixed(1).replace('.',',')} M€ de chiffre d'affaires, ${fmt(S.students)} ${SC.unit} et ${fmt(S.staff)} salariés. Dix ans plus tard, les anciens élèves se souviennent ${S.g.etu>60?'d\'une école qui a tenu ses promesses.':'surtout des années de rigueur.'}`;cls='';}
  else if(lr.pct>=0){verdict="Demi-succès";text=lr.res>=SC.resTarget?`${N.ecole} tient ${mE(lr.res)} de résultat, mais le chiffre d'affaires (${(lr.rev/1000).toFixed(1).replace('.',',')} M€) reste loin des ${(SC.caTarget/1000).toFixed(0)} M€ demandés. Rentable, pas assez ambitieux : ${N.president} vous garde, et attend la suite.`:`${N.ecole} est rentable (${mE(lr.res)}) mais loin des ${tgt()} demandés. ${N.president} vous garde, sans cacher sa déception.`;cls='neu';}
  else{verdict="Objectif manqué";text=`Toujours en perte (${mE(lr.res)}) fin ${S.year}. ${N.president} ne renouvelle pas votre mandat : « Ce n'est pas de gaieté de cœur, mais le conseil ne peut pas faire autrement. »`;cls='bad';}
  // « Presque » : distance à l'objectif, record personnel sur l'école, coup qui a coûté le plus cher
  const att=lr.res/SC.resTarget, caAtt=SC.growth?lr.rev/SC.caTarget:null, attP=Math.round(att*100);
  let bests={}; try{bests=JSON.parse(localStorage.getItem('bde-best')||'{}');}catch(e){}
  const prevBest=bests[SC.id]; const newRec=prevBest==null||att>prevBest;
  if(newRec&&!S.over.bestSaved){bests[SC.id]=att; try{localStorage.setItem('bde-best',JSON.stringify(bests));}catch(e){}} S.over.bestSaved=true;
  const shownBest=newRec?att:prevBest;
  const worst=(S.log||[]).filter(x=>x.eff<0).sort((a,b)=>a.eff-b.eff)[0];
  const gaps=[]; if(lr.res<SC.resTarget) gaps.push('il manquait <b>'+mE(SC.resTarget-lr.res).slice(1)+'</b> de résultat net'); if(SC.growth&&SC.caReq!==false&&lr.rev<SC.caTarget) gaps.push('<b>'+((SC.caTarget-lr.rev)/1000).toFixed(1).replace('.',',')+' M€</b> de chiffre d\'affaires');
  const nearHtml=`<div class="note" style="text-align:left"><div class="h">🎯 ${statut==='objectif'?'Mandat rempli':attP>=85&&!S.over.lost?'Si près du but…':'Où vous en étiez'}</div>
    <p style="margin:4px 0;font-size:15px"><b style="font-size:22px;color:${att>=1?'var(--gold-hi)':att>=0.85?'var(--gold)':'var(--fg)'}">${attP} %</b> de l'objectif de résultat net${caAtt!=null?` · <b>${Math.round(caAtt*100)} %</b> du chiffre d'affaires cible`:''}${S.over.lost?` au moment de la révocation (${S.year})`:''}.</p>
    ${gaps.length?`<p style="margin:4px 0">${gaps.join(' et ')}.</p>`:''}
    <p style="margin:4px 0">${newRec?(prevBest==null?'🏁 Premier score enregistré sur cette école.':'🏆 <b>Nouveau record personnel</b> sur cette école (avant : '+Math.round(prevBest*100)+' %).'):'Votre record sur cette école : <b>'+Math.round(shownBest*100)+' %</b>.'}</p>
    ${worst&&statut!=='objectif'?`<p style="margin:4px 0">💥 Ce qui a coûté le plus cher : <b>${worst.n}</b> (${worst.y}, ${kE(worst.eff)}${worst.kind==='mesure'?'/an':''}).</p>`:''}</div>`;
  app().innerHTML=`<div class="center"><div class="panel wide">
    <div class="kicker" style="text-align:center">Fin ${S.year} · Générique de fin</div>
    <h1 class="serif title" style="color:${cls==='bad'?'var(--rose)':cls==='neu'?'var(--gold)':'var(--green)'}">${verdict}</h1>
    <p style="text-align:center;font-size:15px">${text}</p>
    ${histHtml()}
    <div class="tw" style="margin-top:20px"><table><tr><th>Indicateur</th><th>2025</th><th>Fin de série</th></tr>
    <tr><td>Résultat net</td><td class="num">${mE(SC.ca0*SC.start/100)}</td><td class="num">${mE(lr.res)} <span class="muted">(cible ${tgt()})</span></td></tr><tr><td>Chiffre d'affaires</td><td class="num">${(SC.ca0/1000).toFixed(1).replace('.',',')} M€</td><td class="num">${(lr.rev/1000).toFixed(1).replace('.',',')} M€${SC.growth?' <span class="muted">(cible '+(SC.caTarget/1000).toFixed(0)+')</span>':''}</td></tr><tr><td>Capital</td><td class="num">–</td><td class="num">${Math.round(S.g.ca)} pts</td></tr><tr><td>${SC.unit.charAt(0).toUpperCase()+SC.unit.slice(1)}</td><td class="num">${fmt(BASE.students)}</td><td class="num">${fmt(S.students)}</td></tr><tr><td>Salariés</td><td class="num">${BASE.staff}</td><td class="num">${fmt(S.staff)}</td></tr><tr><td>Prix de vente</td><td class="num">${fmt(BASE.price)} €</td><td class="num">${fmt(S.price)} €</td></tr><tr><td>Budget ${SC.mediaWord}</td><td class="num">${(BASE.marketing/1000).toFixed(1).replace('.',',')} M€</td><td class="num">${(mkTotal()/1000).toFixed(1).replace('.',',')} M€</td></tr><tr><td>Trésorerie</td><td class="num">${mE(BASE.cash)}</td><td class="num">${mE(S.cash)}</td></tr><tr><td>Mesures adoptées</td><td>–</td><td class="num">${S.active.length}</td></tr></table></div>
    ${nearHtml}
    ${bilanHtml()}
    ${(S.trophSession||[]).length?`<div class="note" style="text-align:left;border-color:var(--gold)"><div class="h">🏅 Trophées débloqués pendant cette partie</div>${[...new Set(S.trophSession)].map(id=>BADGES.find(b=>b.id===id)).filter(Boolean).map(b=>`<p style="margin:4px 0"><b>${b.ic} ${b.n}</b> <span class="muted">· ${b.d}</span></p>`).join('')}</div>`:''}
    <p class="hint">Mesures en vigueur : ${S.active.map(i=>MEASURES[i].n).join(' · ')||'aucune'}.</p>
    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap" id="b"></div></div></div>`;
  $('#b').appendChild(btn('↺ Rejouer la série',()=>{newGame(S.sc);S.screen='intro';render();}));
  $('#b').appendChild(btn('🏆 Hall of Fame',()=>{S.hofBack='final';S.screen='hof';render();},'sbtn'));
  $('#b').appendChild(btn('🏅 Galerie des trophées ('+BADGES.filter(b=>badges()[b.id]).length+'/'+BADGES.length+')',()=>{S.hofBack='final';S.screen='badges';render();},'sbtn'));
  $('#b').appendChild(btn('📣 Partager mon score',()=>shareScore(verdict),'sbtn'));
}
function shareScore(verdict){
  const lr=S.lastResult;
  const txt=`${S.name} · Le Jeu du DG (${N.ecole}) · ${verdict} : résultat net ${mE(lr.res)} et ${(lr.rev/1000).toFixed(1).replace('.',',')} M€ de CA fin ${S.year}, ${fmt(S.students)} ${SC.unit}, capital ${Math.round(S.g.ca)} pts. À vous de faire mieux : ecolesenligne.fr/lejeuduDG`;
  // image PNG
  const cv=document.createElement('canvas'); cv.width=1200; cv.height=630; const x=cv.getContext('2d');
  x.fillStyle='#0b1020'; x.fillRect(0,0,1200,630); x.strokeStyle='#c9a24a'; x.lineWidth=6; x.strokeRect(30,30,1140,570);
  x.fillStyle='#c9a24a'; x.font='bold 22px system-ui,sans-serif'; x.textAlign='center'; x.fillText((N.ecole+' · SAISONS 2026-2030').toUpperCase(),600,110);
  x.fillStyle='#f4f1e8'; x.font='900 64px Georgia,serif'; x.fillText('LE JEU DU DG',600,190);
  x.fillStyle='#eef2fb'; x.font='bold 40px system-ui,sans-serif'; x.fillText(S.name,600,280);
  x.fillStyle=lr.res>=SC.resTarget?'#7ee0a0':lr.pct>=0?'#e8c15a':'#ff6b7a'; x.font='900 96px system-ui,sans-serif'; x.fillText(mE(lr.res),600,400);
  x.fillStyle='#9aa4c8'; x.font='28px system-ui,sans-serif'; x.fillText(verdict+' · '+(lr.rev/1000).toFixed(1).replace('.',',')+' M€ de CA · '+fmt(S.students)+' '+SC.unit+' · capital '+Math.round(S.g.ca)+' pts',600,460);
  x.fillStyle='#c9a24a'; x.font='bold 26px system-ui,sans-serif'; x.fillText('ecolesenligne.fr/lejeuduDG',600,560);
  const url=cv.toDataURL('image/png');
  modal(`<h3>Partager mon score</h3><img src="${url}" alt="" style="width:100%;border-radius:8px;border:1px solid var(--line)"><textarea id="sh" readonly style="width:100%;height:84px;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px">${txt}</textarea><div class="mf"><button class="lnk" id="mc">Fermer</button><span style="display:flex;gap:8px"><a class="sbtn" href="${url}" download="le-jeu-du-dg-${S.name.replace(/\W+/g,'-')}.png" style="text-decoration:none">⬇ Image</a><button class="mbtn" id="cp">Copier le texte</button></span></div>`,'gold');
  document.getElementById('cp').onclick=()=>{const t=document.getElementById('sh'); t.select(); try{navigator.clipboard.writeText(txt).then(()=>{document.getElementById('cp').textContent='Copié ✓';}).catch(()=>{document.execCommand('copy');document.getElementById('cp').textContent='Copié ✓';});}catch(e){document.execCommand('copy');}};
}

// ---------- Démarrage ----------
function start(data){
  let loaded=null;
  if(data&&data.S) loaded=data.S;
  else { try{ const old=localStorage.getItem('bde-save'); if(old){ const o=JSON.parse(old); if(o&&o.sc!==undefined&&SCENARIOS[o.sc]){ const id=SCENARIOS[o.sc].id; if(!localStorage.getItem(SAVE_KEY(id))) localStorage.setItem(SAVE_KEY(id),old); localStorage.setItem('bde-last',id); } localStorage.removeItem('bde-save'); }
    const last=localStorage.getItem('bde-last'); if(last) loaded=readSave(last); }catch(e){} }
  applyScenario(loaded&&loaded.sc!==undefined?loaded.sc:0);
  if(loaded&&loaded.screen&&loaded.g&&loaded.used&&loaded.media&&loaded.sc!==undefined) S=loaded; else newGame(0);
  if(!S.pid){const t=S; newGame(); t.pid=S.pid; S=t;}
  if(S.screen==='title'||S.screen==='hof'||S.screen==='badges') S.screen=S.over?'final':'game';
  if(S.screen==='scenario'||S.screen==='profile') S.screen='intro';
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
try{applyZoom();}catch(e){}
</script>
