<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>À l'hôpital Velpo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Un seul univers visuel : nuit bleu pétrole dehors, hôpital menthe dedans, corail pour l'action. */
  --night:#10303b; --night-2:#18434f; --panel:#f7fbf9; --ink:#17323a; --muted:#5d7a80;
  --coral:#ff6b5e; --coral-ink:#7a1d15; --sun:#ffc94a; --mint:#8fd6b8; --line:#d5e5df;
  --good:#1f9d6b; --warn:#c77700; --bad:#d23b3b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px;background:var(--night-2);color:#eaf6f2}
#hud h1{font-family:var(--display);font-weight:800;font-size:18px;margin:0 6px 0 0;line-height:1;color:#fff;white-space:nowrap}
#hud h1 span{color:var(--coral)}
.stat{display:flex;align-items:baseline;gap:5px;background:rgba(255,255,255,.09);border-radius:999px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font-weight:700;font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.04em}
.stat.money{color:var(--sun)} .stat.neg{color:#ff9d94}
#speed{display:flex;gap:4px;margin-left:auto}
#speed button{width:36px;height:32px;border-radius:9px;background:rgba(255,255,255,.1);color:#fff;font-weight:800}
#speed button[aria-pressed="true"]{background:var(--coral)}
#ticker{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#0c252e;color:#d6ebe6;font-size:13.5px;min-height:34px}
#ticker b{flex:none;font-family:var(--display);font-size:12px;padding:1px 8px;border-radius:999px;background:var(--mint);color:#0d3a2c}
#ticker.warn b{background:var(--sun);color:#4a3200} #ticker.bad b{background:var(--coral);color:#fff} #ticker.ann b{background:#b9a7ee;color:#231650}
#ticker span{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:12px;right:64px;top:10px;pointer-events:none}
#hint div{display:inline-block;max-width:460px;background:rgba(247,251,249,.95);border-radius:12px;padding:7px 11px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#hint div::before{content:"Conseil";font-family:var(--display);color:var(--coral);margin-right:6px}
#zoom{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;gap:6px}
#ttsStop{flex:none;background:var(--coral);color:#fff;font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 10px}
#mute[aria-pressed="true"]{background:#cfdcd8;color:var(--muted)}
.btn.alt[aria-pressed="false"]{opacity:.6}
#zoom button{width:40px;height:40px;border-radius:12px;background:var(--panel);font-weight:800;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#card,#buildbar,#offer{position:absolute;left:12px;right:12px;bottom:10px;margin:auto;max-width:520px;background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25);display:none}
#card h3,#buildbar h3,#offer h3{font-family:var(--display);font-size:18px;margin:0 0 2px;line-height:1.15}
#card p,#buildbar p,#offer p{margin:2px 0 6px;color:var(--muted);font-size:13.5px;line-height:1.35}
#buildbar p.err{color:var(--bad);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--coral);color:#fff;font-weight:800;border-radius:11px;padding:9px 14px;box-shadow:0 3px 0 var(--coral-ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral-ink)}
.btn.alt{background:#e3efea;color:var(--ink);box-shadow:0 3px 0 #b9cfc7}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{position:absolute;right:8px;top:6px;width:34px;height:34px;border-radius:50%;font-size:20px;font-weight:800;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#dde9e5;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar.w i{background:var(--warn)} .bar.b i{background:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px;font-weight:700;margin:6px 0}
#nav{display:flex;background:var(--panel);border-top:3px solid var(--mint);padding-bottom:env(safe-area-inset-bottom,0)}
#nav button{flex:1;padding:10px 2px 9px;font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--muted);border-top:3px solid transparent;margin-top:-3px}
#nav button[aria-pressed="true"]{color:var(--coral);border-top-color:var(--coral)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35);display:none;flex-direction:column}
#sheet header{display:flex;align-items:center;padding:10px 14px 6px}
#sheet header h2{font-family:var(--display);font-size:20px;margin:0;flex:1}
#sheetBody{overflow-y:auto;padding:2px 14px 16px;display:grid;gap:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;display:grid;gap:4px}
.item h4{font-family:var(--display);font-size:16px;margin:0;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.item h4 em{font-style:normal;font-family:var(--body);font-weight:800;font-size:13.5px;color:var(--warn);white-space:nowrap}
.item p{margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 8px;background:#e3efea;color:var(--ink)}
.sec{font-family:var(--display);font-size:15px;color:var(--coral);margin:6px 0 -4px}
.log{font-size:13px;line-height:1.4;margin:0;padding:0;list-style:none;display:grid;gap:5px}
.log li{padding-left:10px;border-left:3px solid var(--mint)} .log li.warn{border-color:var(--sun)} .log li.bad{border-color:var(--coral)} .log li.ann{border-color:#b9a7ee;font-style:italic}
input[type=range]{width:100%;accent-color:var(--coral)}
#modal{position:absolute;inset:0;background:rgba(8,26,32,.72);display:none;align-items:center;justify-content:center;padding:16px}
#modal>div{background:var(--panel);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:100%;overflow:auto;box-shadow:0 6px 0 rgba(0,0,0,.3)}
#modal h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0 0 8px;text-wrap:balance}
#modal h2 span{color:var(--coral)}
#modal p{margin:0 0 10px;line-height:1.45}
#modal small{color:var(--muted);display:block;margin-top:10px;line-height:1.4}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:8px 14px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){#hud h1{display:none}.stat{padding:3px 8px;font-size:14px}#hint div{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="hud">
  <h1>Hôpital <span>Velpo</span></h1>
  <div class="stat money" id="sMoney"><small>Caisse</small><span>30 000 €</span></div>
  <div class="stat" id="sRep"><small>Réput.</small><span>500</span></div>
  <div class="stat" id="sCured"><small>Guéris</small><span>0/25</span></div>
  <div class="stat" id="sDate"><small>Jour</small><span>1</span></div>
  <div id="speed" role="group" aria-label="Vitesse du jeu">
    <button id="sp0" aria-label="Pause" aria-pressed="false">II</button>
    <button id="sp1" aria-label="Vitesse normale" aria-pressed="true">&#9654;</button>
    <button id="sp2" aria-label="Vitesse rapide" aria-pressed="false">&#9654;&#9654;</button>
  </div>
</div>
<div id="ticker"><b>Accueil</b><span id="tickText"></span><button id="ttsStop" style="display:none">Couper la voix</button></div>
<div id="stage">
  <canvas id="cv" aria-label="Plan de l'hôpital"></canvas>
  <div id="hint"><div id="hintText"></div></div>
  <div id="zoom"><button id="zIn" aria-label="Zoomer">+</button><button id="zOut" aria-label="Dézoomer">&minus;</button><button id="mute" aria-label="Couper ou remettre le son" aria-pressed="false">♪</button></div>
  <div id="card"></div>
  <div id="offer"></div>
  <div id="buildbar"></div>
  <div id="sheet"><header><h2 id="sheetTitle"></h2><button class="x" id="sheetClose" aria-label="Fermer" style="position:static">&times;</button></header><div id="sheetBody"></div></div>
  <div id="toast" role="status"></div>
  <div id="modal"><div id="modalBody"></div></div>
</div>
<nav id="nav">
  <button data-s="rooms" aria-pressed="false">Salles</button>
  <button data-s="objs" aria-pressed="false">Objets</button>
  <button data-s="team" aria-pressed="false">Équipe</button>
  <button data-s="manage" aria-pressed="false">Gestion</button>
</nav>

(function (root) {

  function hint(S) {

        h += '<div class="item"><h4>' + d.name + '<em>' + euro(d.cost) + '</em></h4><p>' + d.blurb + '</p><div class="row"><span class="tag">' + kind + '</span><span class="tag">' + who + '</span><button class="btn sm" style="margin-left:auto" data-b="room:' + k + '"' + (S.money < d.cost ? ' disabled' : '') + '>Placer</button></div></div>';
      }); h += '</div>';
    } else if (name === 'objs') {
      title = 'Objets de couloir'; h = '<div class="grid">';
      Object.keys(V.OBJS).forEach(function (k) { var d = V.OBJS[k]; h += '<div class="item"><h4>' + d.name + '<em>' + euro(d.cost) + '</em></h4><p>' + d.blurb + '</p><div class="row"><button class="btn sm" style="margin-left:auto" data-b="obj:' + k + '"' + (S.money < d.cost ? ' disabled' : '') + '>Placer</button></div></div>'; });
      h += '</div>';
    } else if (name === 'team') {
      title = 'Équipe'; var staff = S.people.filter(function (p) { return p.kind !== 'patient'; });
      h += '<div class="sec">En poste (' + staff.length + ')</div>';
      if (!staff.length) h += '<p style="margin:0;color:var(--muted)">Personne. L\'hôpital est très calme, et très inutile.</p>';
      h += '<div class="grid">'; staff.forEach(function (p) {
        var stt = { idle: 'Disponible', walk: 'En déplacement', work: 'Au travail', rest: 'En pause', fix: 'Répare', mop: 'Nettoie', away: 'En congrès' }[p.st] || '';
        h += '<div class="item"><h4>' + p.name + '<em>' + euro(p.wage) + '/mois</em></h4><div class="row"><span class="tag">' + V.STAFF[p.kind].name + '</span><span class="tag">' + stt + '</span></div><div class="kv"><span>Talent</span>' + bar(p.skill) + '<span></span><span>Fatigue</span>' + bar(p.fatigue, p.fatigue > 0.7 ? 'b' : p.fatigue > 0.4 ? 'w' : '') + '<span></span></div><div class="row"><button class="btn alt sm" style="margin-left:auto" data-b="fire:' + p.id + '">Renvoyer</button></div></div>';
      }); h += '</div>';
      ['doc', 'nurse', 'recep', 'handy'].forEach(function (k) {
        h += '<div class="sec">Candidats : ' + V.STAFF[k].name + '</div><div class="grid">';
        S.pool[k].forEach(function (c, i) { h += '<div class="item"><h4>' + c.name + '<em>' + euro(c.wage) + '/mois</em></h4><p>' + c.bio + '</p><div class="kv"><span>Talent</span>' + bar(c.skill) + '<span></span></div><div class="row"><button class="btn sm" style="margin-left:auto" data-b="hire:' + k + ':' + i + '">Embaucher</button></div></div>'; });
        h += '</div>';
      });
    } else {
      title = 'Gestion'; var G = V.GOALS;
      h += '<div class="item"><h4>Objectifs du niveau 1</h4><div class="kv"><span>Patients guéris</span>' + bar(S.cured / G.cured) + '<span>' + S.cured + '/' + G.cured + '</span><span>Réputation</span>' + bar(S.rep / G.rep) + '<span>' + Math.round(S.rep) + '/' + G.rep + '</span><span>Caisse</span>' + bar(S.money / G.money) + '<span>' + euro(Math.max(0, S.money)) + '</span></div><p>' + S.deaths + ' décès, ' + S.left + ' départs mécontents. Faillite à −15 000 €.</p></div>';
      h += '<div class="item"><h4>Tarifs<em id="pmv">' + Math.round(S.priceMult * 100) + ' %</em></h4><input type="range" id="pm" min="50" max="200" step="10" value="' + Math.round(S.priceMult * 100) + '" aria-label="Niveau des tarifs"><p>Au-dessus de 100 %, des patients refusent de payer et repartent. Une bonne réputation fait monter les prix toute seule.</p></div>';
      if (S.lastMonth) h += '<div class="item"><h4>Mois ' + S.lastMonth.n + '</h4><p>Recettes ' + euro(S.lastMonth.inc) + ' · dépenses ' + euro(S.lastMonth.exp) + '</p></div>';
      var known = V.DISEASES.filter(function (d) { return S.known[d.id]; });
      h += '<div class="sec">Maladies identifiées (' + known.length + '/' + V.DISEASES.length + ')</div><div class="grid">';
      known.forEach(function (d) { h += '<div class="item"><h4>' + d.name + '<em>' + euro(V.price(S, d.price)) + '</em></h4><p>' + d.desc + '</p><div class="row"><span class="tag">Soin : ' + V.ROOMS[d.cure].short + '</span></div></div>'; });
      h += '</div><div class="sec">Journal</div><ul class="log">';
      S.log.slice(-12).reverse().forEach(function (l) { h += '<li class="' + l.k + '">' + l.t + '</li>'; });
      h += '</ul><div class="item"><h4>Son</h4><div class="row"><button class="btn alt sm" data-b="opt:music" aria-pressed="' + opt.music + '">Musique : ' + (opt.music ? 'oui' : 'non') + '</button><button class="btn alt sm" data-b="opt:sfx" aria-pressed="' + opt.sfx + '">Bruitages : ' + (opt.sfx ? 'oui' : 'non') + '</button>' +
        (tts ? '<button class="btn alt sm" data-b="opt:voice" aria-pressed="' + opt.voice + '">Voix des annonces : ' + (opt.voice ? 'oui' : 'non') + '</button>' : '') + '</div><p>' + (tts ? 'Les annonces de l\'accueil sont lues à voix haute.' : (window.claude ? 'La lecture des annonces à voix haute n\'est pas proposée dans cette application ; elle fonctionne sur ordinateur, dans Chrome.' : 'La lecture des annonces à voix haute n\'est pas disponible sur cette version.')) + '</p></div><div class="item"><h4>Partie</h4><p>' + saveNote + '. Sauvegarde automatique chaque mois.</p><div class="row"><button class="btn sm" data-b="save">Sauvegarder</button><button class="btn alt sm" data-b="new">Nouvelle partie</button><button class="btn alt sm" data-b="credits">Crédits</button></div></div>';
    }
    $('sheetTitle').textContent = title; $('sheetBody').innerHTML = h; $('sheet').style.display = 'flex'; $('sheetBody').scrollTop = keep;
    var pm = $('pm'); if (pm) pm.oninput = function () { S.priceMult = pm.value / 100; $('pmv').textContent = pm.value + ' %'; };
  }
  $('sheetClose').onclick = closeSheet;
  $('nav').onclick = function (ev) { var s = ev.target.dataset.s; if (!s) return; if (sheet === s) closeSheet(); else openSheet(s); };
  $('sheetBody').onclick = function (ev) {
    var b = ev.target.getAttribute('data-b'); if (!b) return; var a = b.split(':');
    if (a[0] === 'room' || a[0] === 'obj') startBuild(a[0], a[1]);
    else if (a[0] === 'hire') { if (V.hire(S, a[1], +a[2])) { toast('Embauché'); openSheet('team'); } }
    else if (a[0] === 'fire') { V.fire(S, +a[1]); openSheet('team'); }
    else if (a[0] === 'save') { save(true); }
    else if (a[0] === 'opt') { opt[a[1]] = !opt[a[1]]; saveOpt(); openSheet('manage'); }
    else if (a[0] === 'new') confirmNew(); else if (a[0] === 'credits') credits();
  };
  $('ticker').onclick = function (ev) { if (ev.target.id === 'ttsStop') { stopVoice(); return; } openSheet('manage'); };
  $('mute').onclick = function () { audioInit(); opt.mute = !opt.mute; saveOpt(); };
  document.addEventListener('click', function (ev) { if (ev.target.closest && ev.target.closest('button')) { audioInit(); sfx('click'); } }, true);

  // fenêtres
  function modal(kind, html) { modalKind = kind; $('modalBody').innerHTML = html; $('modal').style.display = kind ? 'flex' : 'none'; }
  $('modal').onclick = function (ev) {
    var a = ev.target.getAttribute('data-m'); if (!a) return;
    if (a === 'new') { S = V.newGame(); afterLoad(); modal(null, ''); }
    else if (a === 'cont') { var b = bestSave(); try { S = JSON.parse(b.json); } catch (e) { S = V.newGame(); toast('Sauvegarde illisible : nouvelle partie'); } afterLoad(); modal(null, ''); }
    else if (a === 'free') { S.freePlay = true; modal(null, ''); setSpeed(lastSpeed); }
    else if (a === 'close') { modal(null, ''); setSpeed(lastSpeed); }
  };
  function afterLoad() { deselect(); build = null; buildBar(); closeSheet(); hideOffer(); shownLog = null; setSpeed(1); }
  function intro() {
    var b = bestSave();
    modal('intro', '<h2>À l\'hôpital <span>Velpo</span></h2><p>Vous dirigez un hôpital public flambant vide. Construisez des salles, recrutez une équipe plus ou moins compétente, et soignez l\'écranite aiguë, la réunionite chronique ou le syndrome de la Quête.</p><p><b>Objectifs :</b> 25 guérisons, 600 de réputation, 20 000 € en caisse.</p><div class="row">' +
      (b ? '<button class="btn" data-m="cont">Continuer (jour ' + (b.day + 1) + ')</button><button class="btn alt" data-m="new">Nouvelle partie</button>' : '<button class="btn" data-m="new">Ouvrir l\'hôpital</button>') +
      '</div><small>Prototype, niveau 1. Glissez pour déplacer le plan, touchez un patient ou une salle pour les détails. Le personnel rejoint seul les salles qui en ont besoin.</small>');
  }
  function confirmNew() { closeSheet(); setSpeed(0); modal('confirm', '<h2>Tout recommencer ?</h2><p>La partie en cours sera remplacée à la prochaine sauvegarde.</p><div class="row"><button class="btn" data-m="new">Nouvelle partie</button><button class="btn alt" data-m="close">Annuler</button></div>'); }
  function winModal() { setSpeed(0); save(); modal('win', '<h2>Niveau réussi</h2><p>' + S.cured + ' guérisons en ' + (Math.floor(S.day / 30) + 1) + ' mois, ' + S.deaths + ' décès « non imputables au service ». Le ministère vous adresse ses félicitations et une baisse de budget.</p><div class="row"><button class="btn" data-m="free">Continuer en mode libre</button><button class="btn alt" data-m="new">Nouvelle partie</button></div>'); }
  function loseModal() { setSpeed(0); try { localStorage.removeItem(LS); } catch (e) {} modal('lose', '<h2>Faillite</h2><p>La caisse est passée sous −15 000 €. L\'hôpital Velpo devient une salle de sport, puis un parking, puis un espace de coworking.</p><div class="row"><button class="btn" data-m="new">Réessayer</button></div>'); }
  function credits() { closeSheet(); setSpeed(0); modal('credits', '<h2>Crédits</h2><p>Jeu original : textes, dessins, bruitages et musique créés pour ce prototype, sans fichier externe.</p><p>Plusieurs règles de simulation (diagnostic, prix, efficacité des soins, fatigue, besoins des patients) sont adaptées de <b>CorsixTH</b>, © 2009-2026 Peter « Corsix » Cawley, Edvin « Lego3 » Linge et les contributeurs de CorsixTH, sous licence MIT. Le texte complet de la licence figure en tête du fichier sim.js.</p><p>Aucun graphisme, son, texte ou nom de maladie du jeu d\'origine n\'est utilisé.</p><div class="row"><button class="btn" data-m="close">Fermer</button></div>'); }

  /* ---------- pointeur ---------- */
  var ptrs = {}, drag = null, pinch = null;
  function pos(ev) { var r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  cv.addEventListener('pointerdown', function (ev) {
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    var p = pos(ev); ptrs[ev.pointerId] = p; var ids = Object.keys(ptrs);
    if (ids.length === 1) drag = { sx: p.x, sy: p.y, cx: cam.x, cy: cam.y, moved: false };
    else if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; if (drag) drag.moved = true; }
  });
  cv.addEventListener('pointermove', function (ev) {
    var p = pos(ev);
    if (!ptrs[ev.pointerId]) { if (build && ev.pointerType === 'mouse') { var t = toTile(p.x, p.y); moveGhost(t.x, t.y); } return; }
    ptrs[ev.pointerId] = p; var ids = Object.keys(ptrs);
    if (ids.length >= 2 && pinch) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch.d > 0) zoomBy(d / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); pinch.d = d; return;
    }
    if (drag) { var dx = p.x - drag.sx, dy = p.y - drag.sy; if (!drag.moved && Math.hypot(dx, dy) > 7) drag.moved = true; if (drag.moved && !pinch) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; } }
  });
  function endPtr(ev) {
    var p = ptrs[ev.pointerId]; delete ptrs[ev.pointerId]; var n = Object.keys(ptrs).length;
    if (n < 2) pinch = null;
    if (n === 0 && drag) { if (!drag.moved && p && ev.type === 'pointerup') tap(p.x, p.y); drag = null; }
    else if (n === 1 && drag) { var q = ptrs[Object.keys(ptrs)[0]]; drag = { sx: q.x, sy: q.y, cx: cam.x, cy: cam.y, moved: true }; }
  }
  cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('wheel', function (ev) { ev.preventDefault(); var p = pos(ev); zoomBy(ev.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y); }, { passive: false });
  function tap(sx, sy) {
    if (!S) return; var t = toTile(sx, sy);
    if (build) { moveGhost(t.x, t.y); return; }
    if (sheet) { closeSheet(); return; }
    var best = null, bd = 24 * Math.max(zoom, 0.8);
    S.people.forEach(function (p) { if (p.hidden) return; var c = P(p.x + 0.5, p.y + 0.5), d = Math.hypot(c[0] - sx, c[1] - 12 * zoom - sy); if (d < bd) { bd = d; best = p; } });
    if (best) { sel = { t: 'p', id: best.id }; card(); return; }
    if (t.x >= 0 && t.y >= 0 && t.x < V.W && t.y < V.H) {
      var o = S.occ[t.y][t.x];
      if (o > 0 && V.room(S, o)) { sel = { t: 'r', id: o }; card(); return; }
      if (o < 0) { sel = { t: 'o', id: -o }; card(); return; }
    }
    deselect();
  }
  window.addEventListener('keydown', function (ev) {
    if (ev.key === ' ') { ev.preventDefault(); setSpeed(speed ? 0 : lastSpeed); }
    else if (ev.key === 'Escape') { if (build) { ev.preventDefault(); build = null; buildBar(); } else if (sheet) { ev.preventDefault(); closeSheet(); } else if (sel) { ev.preventDefault(); deselect(); } }
    else if (ev.key === 'r' && build && build.kind === 'room') { build.rot = (build.rot + 1) % 4; moveGhost(build.x + 1, build.y + 1); }
  });

  /* ---------- boucle ---------- */
  var acc = 0, last = 0, lastSavedMonth = -1;
  function loop(ts) {
    requestAnimationFrame(loop); frame++;
    var dt = Math.min(100, ts - last || 16); last = ts;
    if (!S) return;
    if (speed && !modalKind) { acc += dt * 0.02 * speed; var n = 0; while (acc >= 1 && n < 10) { V.tick(S); acc -= 1; n++; } if (acc > 3) acc = 0; }
    var m = Math.floor(S.day / 30); if (m !== lastSavedMonth) { if (lastSavedMonth >= 0 && m > 0) save(); lastSavedMonth = m; }
    if (S.fx && S.fx.length) { S.fx.forEach(function (e) { sfx(e.n); if (e.v && floaters.length < 30) floaters.push({ x: e.x, y: e.y, v: e.v, t: 0 }); }); S.fx.length = 0; }
    draw(); if (frame % 12 === 0) hud();
  }
  window.addEventListener('resize', resize); if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
  document.addEventListener('visibilitychange', function () { if (document.hidden && S && S.day > 0) save(); if (AC) { if (document.hidden) AC.suspend(); else AC.resume(); } });
  applyOpt(); resize(); S = V.newGame(); hud(); intro(); requestAnimationFrame(loop);
})();

</script>
