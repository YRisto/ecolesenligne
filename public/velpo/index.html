<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>À l'hôpital Velpo</title>
<base href="/velpo/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Un monde de jouet : scène 3D pleine page, panneaux blancs épais et arrondis posés dessus, corail pour agir. */
  --ink:#17323a; --muted:#4f6b71; --panel:#ffffff; --soft:#eef6f3; --line:#d3e4dd; --night:#10303b;
  --teal:#1f8a80; --mint:#8fd6b8; --coral:#ff6b5e; --coral-d:#c2453a; --sun:#ffc94a; --good:#1f9d6b; --warn:#b86e00; --bad:#d23b3b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 4px 0 rgba(16,48,59,.22), 0 10px 24px rgba(16,48,59,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#a9dcd2;color:var(--ink);font-family:var(--body);font-size:17px;font-weight:700;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg{display:block}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#lab{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-size:15px;line-height:1;padding:5px 10px;border-radius:99px;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(16,48,59,.22);will-change:transform}
.lb.hv{background:var(--night);color:#fff;font-size:15.5px;z-index:3}
.lb.rw{background:var(--sun);color:#4a3200}.lb.rw.bad{background:var(--bad);color:#fff}.lb.rq{background:rgba(16,48,59,.88);color:#fff}
.lb.pb{font-size:14px;padding:4px 9px}.lb.pb.r{color:var(--bad)}.lb.pb.b{color:#1d6fa5}.lb.pb.w{color:#7a4bb5}.lb.pb.t{background:#fff8dc}.lb.pb.c{color:var(--muted)}
.ft{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:22px;color:var(--sun);text-shadow:0 2px 0 var(--night),0 0 6px rgba(16,48,59,.6);animation:ft 1.6s ease-out forwards;white-space:nowrap}
.ft.neg{color:#ffb1a8}.ft.ok{color:#b9f5d2}.ft.w{color:#fff}
@keyframes ft{from{opacity:1;margin-top:0}70%{opacity:1}to{opacity:0;margin-top:-64px}}

/* ---- barre du haut ---- */
#top{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;pointer-events:none}
#top>*{pointer-events:auto}
.pill{background:var(--panel);border-radius:18px;box-shadow:var(--shadow)}
#goals{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;text-align:left}
#goals .logo{width:40px;height:40px;border-radius:12px;background:var(--coral);display:grid;place-items:center;color:#fff;flex:none}
#goals b{font-family:var(--display);font-size:20px;line-height:1;display:block}
#goals small{font-size:14px;color:var(--muted);display:block;line-height:1.2}
#ticker{flex:1;min-width:0;max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:9px 14px;background:rgba(16,48,59,.9);color:#f2fbf8;border-radius:18px;box-shadow:var(--shadow);font-size:16.5px;line-height:1.3;text-align:left}
#ticker .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:#0d3a2c}
#ticker.warn .ic{background:var(--sun);color:#4a3200}#ticker.bad .ic{background:var(--coral);color:#fff}#ticker.ann .ic{background:#c7b8f5;color:#231650}
#ticker span{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#ttsStop{flex:none;background:var(--coral);color:#fff;border-radius:99px;padding:5px 12px;font-size:15px}
#stats{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#stats .row{display:flex;gap:8px;align-items:center}
.stat{display:flex;align-items:center;gap:7px;padding:7px 13px;font-family:var(--display);font-size:21px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat svg{color:var(--teal)}
.stat.money{background:var(--night);color:var(--sun);font-size:25px;padding:9px 16px}.stat.money svg{color:var(--sun)}.stat.money.neg{color:#ffb1a8}
#speed{display:flex;padding:4px;gap:4px}
#speed button{width:44px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--muted)}
#speed button[aria-pressed="true"]{background:var(--coral);color:#fff}

/* ---- menu principal ---- */
#menu{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;padding:8px}
#menu button{width:86px;padding:8px 2px 6px;border-radius:14px;display:grid;justify-items:center;gap:2px;font-family:var(--display);font-size:16px;line-height:1.1;color:var(--ink)}
#menu button svg{width:34px;height:34px;color:var(--teal)}
#menu button:hover{background:var(--soft)}
#menu button[aria-pressed="true"]{background:var(--coral);color:#fff}#menu button[aria-pressed="true"] svg{color:#fff}
#camctl{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:grid;gap:8px}
#camctl button{width:50px;height:50px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
#camctl button:active,#menu button:active,.btn:active{transform:translateY(2px)}
#camctl button[aria-pressed="true"]{background:#d9e6e1;color:var(--muted)}
#hint{position:absolute;left:12px;bottom:118px;max-width:min(430px,calc(100% - 90px));padding:10px 14px 10px 12px;display:flex;gap:10px;align-items:center;font-size:16.5px;line-height:1.3;pointer-events:none}
#hint .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:#0d3a2c}

/* ---- fiches du bas ---- */
#dock{position:absolute;left:496px;bottom:12px;width:min(640px,calc(100% - 496px - 76px));display:grid;gap:10px;pointer-events:none}
@media (max-width:1180px){#dock{left:12px;bottom:118px;width:min(620px,calc(100% - 88px))}}
#dock{grid-template-columns:minmax(0,1fr)}#dock .row{flex-wrap:wrap}
#dock>*{pointer-events:auto}
.card{position:relative;padding:14px 16px;display:none}
.card h3{font-family:var(--display);font-size:23px;line-height:1.1;margin:0 40px 2px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card p{margin:3px 0 8px;font-size:16.5px;line-height:1.35;color:var(--muted)}
.card p.err{color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--body);font-size:14.5px;font-weight:800;border-radius:99px;padding:3px 10px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.w{background:#ffe9b0;color:#5a3d00}.tag.b{background:#ffd9d5;color:#7a1d15}.tag.g{background:#cdf1dd;color:#0d4a31}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--coral);color:#fff;font-family:var(--display);font-size:18px;line-height:1;border-radius:13px;padding:11px 15px;box-shadow:0 3px 0 var(--coral-d)}
.btn svg{width:20px;height:20px}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:0 3px 0 #bcd2ca}
.btn.ok{background:var(--good);box-shadow:0 3px 0 #116846}
.btn.sm{font-size:16px;padding:8px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sq{padding:10px;min-width:44px;justify-content:center}
.x{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--soft)}
.bar{height:12px;border-radius:99px;background:#dbe8e3;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}.bar.w i{background:#e09a1f}.bar.b i{background:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:15.5px;margin:8px 0}
.steps{display:flex;gap:6px;margin:0 40px 8px 0;flex-wrap:wrap}
.steps span{font-size:14px;border-radius:99px;padding:3px 10px;background:var(--soft);color:var(--muted)}
.steps span.on{background:var(--teal);color:#fff}.steps span.done{background:#cdf1dd;color:#0d4a31}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 6px;touch-action:pan-x}
@media (min-width:761px){.chips{flex-wrap:wrap;overflow:visible}}
.btn.alt[aria-pressed="true"]{background:var(--teal);color:#fff}
.chip{flex:none;display:flex;align-items:center;gap:6px;border-radius:12px;padding:7px 11px;background:var(--soft);font-size:15px;line-height:1.1;text-align:left;border:2px solid transparent}
.chip small{display:block;color:var(--muted);font-size:13px}
.chip.need{background:#fff3cf;border-color:var(--sun)}.chip.done{background:#cdf1dd;color:#0d4a31}.chip.cur{border-color:var(--coral)}
#offer{border:3px solid var(--coral)}

/* ---- volets ---- */
#panel{position:absolute;left:12px;top:78px;bottom:118px;width:min(450px,calc(100% - 24px));display:none;flex-direction:column;overflow:hidden}
#panel header{display:flex;align-items:center;gap:10px;padding:12px 12px 8px 16px}
#panel header h2{font-family:var(--display);font-size:25px;line-height:1;margin:0;flex:1}
#panel .x{position:static}
#tabs{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;touch-action:pan-x}
#tabs button{flex:none;border-radius:99px;padding:6px 13px;background:var(--soft);font-size:15.5px}
#tabs button[aria-pressed="true"]{background:var(--teal);color:#fff}
#panelBody{overflow-y:auto;padding:2px 14px 16px;display:grid;gap:10px;align-content:start;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1}
.item{border:2px solid var(--line);border-radius:16px;padding:11px 13px;background:#fff;display:grid;gap:5px;text-align:left}
button.item:hover{border-color:var(--mint);background:#f7fcfa}
.item h4{font-family:var(--display);font-size:20px;line-height:1.15;margin:0;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.item h4 em{font-style:normal;font-family:var(--body);font-size:16px;color:var(--warn);white-space:nowrap}
.item p{margin:0;font-size:15.5px;line-height:1.38;color:var(--muted)}
.sec{font-family:var(--display);font-size:19px;color:var(--teal);margin:6px 0 -4px}
.log{font-size:15.5px;line-height:1.4;margin:0;padding:0;list-style:none;display:grid;gap:6px;color:var(--muted)}
.log li{padding-left:10px;border-left:4px solid var(--mint)}.log li.warn{border-color:var(--sun)}.log li.bad{border-color:var(--coral)}.log li.ann{border-color:#c7b8f5;font-style:italic}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15.5px;align-items:center}
kbd{font-family:var(--body);font-weight:800;font-size:14px;background:var(--soft);border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:1px 7px;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--coral);height:28px}
#toast{position:absolute;left:50%;top:132px;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:99px;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow)}
#modal{position:absolute;inset:0;background:rgba(8,26,32,.6);display:none;align-items:center;justify-content:center;padding:16px}
#modal>div{background:var(--panel);border-radius:24px;padding:22px;max-width:480px;width:100%;max-height:100%;overflow:auto;box-shadow:var(--shadow);touch-action:pan-y}
#modal h2{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;margin:0 0 10px;text-wrap:balance}
#modal h2 span{color:var(--coral)}
#modal p{margin:0 0 12px;line-height:1.45;font-size:17.5px;color:var(--muted)}
#modal p b{color:var(--ink)}
#loading{position:absolute;inset:0;background:var(--night);color:#fff;display:grid;place-items:center;text-align:center;padding:24px}
#loading h1{font-family:var(--display);font-size:38px;margin:0 0 6px;line-height:1}#loading h1 span{color:var(--coral)}
#loading p{margin:0 0 16px;color:#b9d6d0;font-size:17px}
#loading .bar{width:min(320px,70vw);margin:0 auto;height:14px;background:rgba(255,255,255,.15)}#loading .bar i{background:var(--coral);width:4%}

@media (max-width:760px){
  body{font-size:16.5px}
  #top{flex-wrap:wrap;gap:6px;padding:8px}
  #goals{order:1;padding:5px}#goals>span:last-child{display:none}#goals .logo{width:36px;height:36px}
  #stats{order:2;flex:1;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:6px}#stats .row{gap:6px}
  .stat{font-size:18px;padding:7px 9px;gap:5px}.stat.money{font-size:20px;padding:8px 11px}
  #speed button{width:40px;height:34px}
  #ticker{order:3;flex-basis:100%;font-size:15.5px;padding:7px 11px}
  #menu{left:8px;right:8px;bottom:8px;justify-content:space-between;padding:6px}
  #menu button{width:auto;flex:1;font-size:14.5px}#menu button svg{width:30px;height:30px}
  #camctl{right:8px;gap:6px;top:auto;bottom:calc(100px + var(--dockh,0px));transform:none}#camctl button{width:46px;height:46px}
  #camctl [data-a="cam:zi"],#camctl [data-a="cam:zo"]{display:none}
  #hint{left:8px;bottom:100px;max-width:calc(100% - 70px);font-size:15.5px}
  #dock{left:8px;bottom:100px;width:calc(100% - 16px)}
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:100px;max-height:66%}
  .card h3{font-size:21px}
  #toast{top:170px}
}
@media (max-width:420px){.stat .lbl{display:none}}
@media (prefers-reduced-motion:reduce){.ft{animation-duration:.01s}#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" tabindex="0" aria-label="Vue de l'hôpital en 3D"></canvas>
  <div id="lab"></div>
  <div id="top">
    <button id="goals" class="pill" aria-label="Objectifs du niveau"><span class="logo" id="logoIc"></span><span><b>Hôpital Velpo</b><small id="goalText">Niveau 1</small></span></button>
    <button id="ticker" aria-label="Dernière annonce, ouvrir le journal"><span class="ic" id="tickIc"></span><span id="tickText"></span></button>
    <div id="stats">
      <div class="row"><div class="stat pill money" id="sMoney"></div></div>
      <div class="row"><div class="stat pill" id="sRep" title="Réputation"></div><div class="stat pill" id="sCured" title="Patients guéris"></div></div>
      <div class="row"><div class="stat pill" id="sDate"></div><div id="speed" class="pill" role="group" aria-label="Vitesse du jeu"></div></div>
    </div>
  </div>
  <div id="hint" class="pill"><span class="av" id="hintIc"></span><span id="hintText"></span></div>
  <div id="camctl"></div>
  <div id="panel" class="pill"><header><h2 id="panelTitle"></h2><button class="x" id="panelClose" aria-label="Fermer"></button></header><div id="tabs"></div><div id="panelBody"></div></div>
  <div id="dock"><div id="offer" class="card pill"></div><div id="inspector" class="card pill"></div><div id="buildbar" class="card pill"></div></div>
  <nav id="menu" class="pill" aria-label="Menu principal"></nav>
  <div id="toast" role="status"></div>
  <div id="modal"><div id="modalBody"></div></div>
  <div id="loading"><div><h1>À l'hôpital <span>Velpo</span></h1><p id="loadText">Livraison du mobilier…</p><div class="bar"><i id="loadBar"></i></div></div></div>
</div>
<script src="models.js"></script>
<script src="game.js"></script>
</body>
</html>
