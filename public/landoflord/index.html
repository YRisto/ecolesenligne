<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Le Général déchu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c0a08;color:#e9dfc6;font-family:Georgia,"Times New Roman",serif;overscroll-behavior:none}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;padding:0}
img{image-rendering:pixelated;display:block}
#app{max-width:540px;margin:0 auto;padding:6px;display:grid;gap:6px;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"view view" "log log" "party party" "pad sys" "inv inv";align-content:start;min-height:100%;background:#3a2a1b var(--wood);background-size:192px;image-rendering:pixelated;border:solid #1c130b;border-width:0 3px}
#deco{display:none;grid-area:deco}#viewWrap{grid-area:view}#log{grid-area:log}#party{grid-area:party}#pad{grid-area:pad}#sys{grid-area:sys}#inv{grid-area:inv}
.pl{background:linear-gradient(#54422a,#2e2416);border:2px solid;border-color:#a8894a #2a1f10 #2a1f10 #a8894a;border-radius:3px;color:#f0cf74;position:relative;overflow:hidden}
.pl:active{border-color:#2a1f10 #a8894a #a8894a #2a1f10;filter:brightness(1.25)}
.pl:disabled{opacity:.35}
.inset{border:2px solid;border-color:#140d07 #7a6236 #7a6236 #140d07;background:rgba(10,7,4,.55)}
#viewWrap{position:relative;border:3px solid;border-color:#140d07 #8a6f3a #8a6f3a #140d07;background:#000}
#view{display:block;width:100%;aspect-ratio:16/10;image-rendering:pixelated;image-rendering:crisp-edges}
#viewWrap.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(4px,-3px)}40%{transform:translate(-4px,3px)}60%{transform:translate(3px,2px)}80%{transform:translate(-2px,-2px)}}
#lvlname{position:absolute;left:34px;right:34px;top:8px;text-align:center;font-variant:small-caps;letter-spacing:.12em;font-size:15px;color:#f3e3b0;text-shadow:0 1px 3px #000,0 0 8px #000;opacity:0;transition:opacity 1s;pointer-events:none}
#lvlname.on{opacity:1}
#gold{position:absolute;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 6px 2px;background:rgba(20,13,7,.78);border:solid #8a6f3a;border-width:2px 0 0 2px;font:bold 13px Verdana,sans-serif;color:#f0d27a;pointer-events:none}
#gold img{width:24px;height:24px}
#log{height:48px;background:#e2d5b1;color:#2a2116;border:2px solid;border-color:#140d07 #7a6236 #7a6236 #140d07;box-shadow:inset 0 0 10px rgba(90,60,20,.45);padding:3px 8px;font-size:12.5px;line-height:1.35;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6}#log div:last-child{opacity:1;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#party{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.card{display:grid;grid-template-columns:58px 8px 8px 40px minmax(0,1fr);gap:3px;height:68px;padding:3px;border:2px solid;border-color:#140d07 #7a6236 #7a6236 #140d07;background:rgba(10,7,4,.55)}
.card.empty{display:flex;align-items:center;justify-content:center;color:#8a7a5a;font-size:11px;font-style:italic}
.card.ko .pt img{filter:grayscale(1) brightness(.5)}
.card.hit{background:#5a1a12;border-color:#e0492f}
.pt{background:#000;border:1px solid #c9a24a;height:58px;width:58px}.pt img{width:56px;height:56px}
.vb{position:relative;background:#0a0806;border:1px solid #000;height:58px}
.vb i{position:absolute;left:0;right:0;bottom:0}.vb.hp i{background:linear-gradient(90deg,#d2463a,#8c241c)}.vb.sf i{background:linear-gradient(90deg,#5aa0b8,#2c5f74)}
.ab{display:grid;grid-template-rows:1fr 1fr;gap:3px;height:58px}
.ab img{width:22px;height:22px;margin:auto}
.ab i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.68)}
.spc.pl{background:linear-gradient(#2d4650,#182a31);border-color:#6fa3b3 #0f1c21 #0f1c21 #6fa3b3}
.nm{font-size:12px;line-height:1.25;overflow:hidden;align-self:center}.nm b{display:block;font-variant:small-caps;letter-spacing:.04em;font-size:13px;color:#f3e3b0;overflow:hidden;text-overflow:ellipsis}
.nm span{display:block;font:10px Verdana,sans-serif}.nm .h{color:#f08a7e}.nm .s{color:#8fc7da}
#pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:54px 54px;gap:4px}

#sys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#sys button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-variant:small-caps;letter-spacing:.05em}
#sys img{width:32px;height:32px}
#inv{display:flex;gap:3px;padding:4px;background:#4a271c;border:2px solid;border-color:#140d07 #7a6236 #7a6236 #140d07}
#inv .ar{width:34px;flex:none;font-size:16px}
.sl{flex:1 1 0;min-width:0;aspect-ratio:1;max-height:56px;background:#6b3a2a;border:2px solid;border-color:#3a1c12 #96604a #96604a #3a1c12;display:flex;align-items:center;justify-content:center}
.sl img{width:78%;max-width:40px}
.sl.on{background:#c9a24a;border-color:#fff1b0}
.sheet{position:fixed;inset:0;background:rgba(6,5,4,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.box{width:100%;max-width:540px;max-height:88vh;overflow:auto;background:#efe4c8;color:#2a2116;border-top:3px solid #c9a24a;border-radius:10px 10px 0 0;padding:14px 14px 18px;user-select:text;-webkit-user-select:text}
.box h2{margin:0 0 8px;font-variant:small-caps;letter-spacing:.06em;font-size:19px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box h2 small{font-size:13px;color:#7a5a12;font-variant:normal;letter-spacing:0}
.box h3{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#7a6a4a}
.box p{margin:6px 0;line-height:1.45;font-size:15px}
.box .dim{color:#8a7a5a;font-style:italic}
.box button{border:1px solid #8a7240;background:#fbf4de;border-radius:5px;padding:9px 10px;min-height:42px;font-size:14px;color:#2a2116}
.box button:disabled{opacity:.4}
.box button.main{background:#3b2f1c;color:#f3e3b0;border-color:#3b2f1c}
.list{display:flex;flex-direction:column;gap:5px}
.list button{display:flex;justify-content:flex-start;align-items:center;gap:10px;text-align:left}
.list button>span{flex:1}.list img{width:28px;height:28px;flex:none}
.list small{display:block;color:#6d5d3d;font-size:12px}
.list em{font-style:normal;color:#7a5a12;white-space:nowrap;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.row button{flex:1 1 auto}
.who{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.who img{width:64px;height:64px;border:2px solid #8a7240;background:#000}
.who b{font-variant:small-caps;letter-spacing:.08em;font-size:17px}
.who.narr b{color:#7a6a4a;font-style:italic;font-variant:normal;font-size:14px}
#dlgText{font-size:16px;line-height:1.5;min-height:72px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:14px}
.skill{margin:5px 0}.skill div:first-child{display:flex;justify-content:space-between;font-size:14px}
.bar{position:relative;height:8px;background:#cbbd96;border:1px solid #a8976a;border-radius:2px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#b9973f}
.eq{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0}
.eq img{width:32px;height:32px;background:#6b3a2a;border:1px solid #3a1c12;padding:2px;flex:none}.eq span{flex:1}
.eq button{min-height:34px;padding:4px 10px;font-size:13px}
#mapC{display:block;margin:0 auto;max-width:100%;image-rendering:pixelated;border:1px solid #a8976a;background:#d9cba3}
#title{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 30%,#3a2c17,#0c0a08 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#title[hidden]{display:none}
#title h1{font-variant:small-caps;letter-spacing:.14em;font-size:34px;margin:0;color:#f0d27a;text-shadow:0 2px 0 #5a4010}
#title .sub{font-style:italic;color:#bfae86;margin:10px 0 28px;max-width:340px;line-height:1.4}
#title button{width:240px;margin:6px;padding:14px;border:1px solid #c9a24a;background:#2a2217;border-radius:6px;font-size:17px;font-variant:small-caps;letter-spacing:.08em}
#title .keys{margin-top:26px;font:12px/1.5 Verdana,sans-serif;color:#7d7058;max-width:340px}
@media (min-width:900px) and (min-height:560px){
 #app{max-width:min(1100px,calc((100vh - 330px)*1.6 + 290px));grid-template-columns:250px minmax(0,1fr);grid-template-areas:"deco view" "deco log" "pad party" "sys inv";padding:12px;gap:8px;min-height:0;margin-top:10px;border-width:3px;border-radius:6px}
 #deco{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:14px;border:2px solid;border-color:#140d07 #7a6236 #7a6236 #140d07;background:rgba(10,7,4,.35)}
 #crest{width:144px;height:168px;image-rendering:pixelated}
 #decoT{font-variant:small-caps;letter-spacing:.14em;font-size:21px;color:#f0d27a;text-shadow:0 2px 0 #1c130b}
 #decoL{font-style:italic;color:#cdbb90;font-size:14px}
 #party{grid-template-columns:repeat(4,1fr)}
 .card{grid-template-columns:88px 9px 9px minmax(0,1fr);grid-template-rows:88px auto;height:auto}
 .pt{width:88px;height:88px}.pt img{width:86px;height:86px}.vb,.ab{height:88px}.ab img{width:30px;height:30px}
 .nm{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
 #pad{justify-self:center;align-self:center;grid-template-columns:repeat(3,64px);grid-template-rows:64px 64px}
 #sys{align-self:stretch;min-height:64px}#sys button{font-size:11px;gap:2px}#sys img{width:28px;height:28px}
 #log{font-size:14px;height:48px}
 .sheet{align-items:center}.box{border-radius:10px;border:3px solid #c9a24a}
}
#compass{position:absolute;left:0;top:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(20,13,7,.78);border:solid #8a6f3a;border-width:0 2px 2px 0;font:bold 15px Georgia,serif;color:#f0d27a;pointer-events:none}
#hand{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;background:rgba(20,13,7,.82);border:solid #c9a24a;border-width:2px 2px 0 0;font-size:12px;color:#f3e3b0;pointer-events:none;max-width:70%}
#hand[hidden],#pick[hidden]{display:none}#hand img{width:24px;height:24px}#hand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pick{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(20,13,7,.92);border:2px solid #6fa3b3;border-radius:4px;white-space:nowrap}
#pick span{font-size:13px;font-variant:small-caps;color:#bfe6f0;margin-right:4px}
#pick button{width:50px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#2d4650,#182a31);border-color:#6fa3b3 #0f1c21 #0f1c21 #6fa3b3;color:#e8f6fa}
#pick b{font:bold 15px Georgia,serif}#pick small{font:10px Verdana,sans-serif;color:#8fc7da}
#mini{display:none}
.sl{cursor:inherit;padding:0}
button:focus-visible{outline:2px solid #ffd866;outline-offset:1px}
kbd{display:inline-block;min-width:20px;text-align:center;font:bold 12px Verdana,sans-serif;background:#3b2f1c;color:#f3e3b0;border-radius:3px;padding:2px 4px;margin-right:6px}
.row.col{flex-direction:column}.row.col button{text-align:left}
#dlg{z-index:25}#modal{z-index:30}
#dlgImg{display:none;width:100%;aspect-ratio:2/1;image-rendering:pixelated;animation:kb 16s ease-out both;transform-origin:50% 60%}
#dlgImgW{display:none;overflow:hidden;border:3px solid;border-color:#140d07 #8a6f3a #8a6f3a #140d07;margin-bottom:10px;background:#000}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
#dlg.cine{background:#07060a;align-items:center}#dlg.cine #dlgImg,#dlg.cine #dlgImgW{display:block}
#dlg.cine .box{background:none;color:#e9dfc6;border:0;max-width:680px;max-height:100vh}
#dlg.cine .who b{color:#f0d27a}#dlg.cine .who.narr b{color:#9a8a68}
#dlg.cine #dlgText{min-height:118px;font-size:17px}
#dlg.cine .box button{background:#2a2217;color:#f3e3b0;border-color:#8a6f3a}#dlg.cine .box button.main{background:#4a3a1a;border-color:#c9a24a}
#titleBg{width:min(100%,560px);aspect-ratio:2/1;image-rendering:pixelated;border:3px solid;border-color:#140d07 #8a6f3a #8a6f3a #140d07;margin-bottom:22px}
#title{background:radial-gradient(ellipse at 50% 20%,#1c1a30,#07060a 70%)}
#title h1{text-shadow:0 2px 0 #1c130b,0 0 24px #000}#title .sub{color:#e0d2ac;text-shadow:0 1px 6px #000}
#title .keys{color:#b8a888;text-shadow:0 1px 4px #000}
@media (min-width:900px) and (min-height:560px){
 #mini{display:block;width:160px;image-rendering:pixelated;border:2px solid;border-color:#140d07 #7a6236 #7a6236 #140d07;background:#2a2014}
 #crest{width:96px;height:112px}
 #deco{gap:10px}
}
</style>
</head>
<body>
<div id="app">
 <div id="deco"><canvas id="crest" width="48" height="56"></canvas><div id="decoT">Le Général déchu</div><div id="decoL"></div><canvas id="mini" width="160" height="140"></canvas></div>
 <div id="viewWrap"><canvas id="view" width="400" height="250"></canvas><div id="lvlname"></div><div id="compass" title="Boussole">N</div><div id="hand" hidden></div><div id="pick" hidden></div><div id="gold"><img id="goldI" alt="écus"><span id="goldN"></span></div></div>
 <div id="log"></div>
 <div id="party"></div>
 <div id="pad">
  <button class="pl" data-mv="tl" aria-label="Tourner à gauche" title="Tourner à gauche (7, Q, ←)">↶</button><button class="pl" data-mv="f" aria-label="Avancer" title="Avancer (8, W, ↑)">▲</button><button class="pl" data-mv="tr" aria-label="Tourner à droite" title="Tourner à droite (9, E, →)">↷</button>
  <button class="pl" data-mv="l" aria-label="Pas à gauche" title="Pas à gauche (4, A)">◀</button><button class="pl" data-mv="b" aria-label="Reculer" title="Reculer (5, S, ↓)">▼</button><button class="pl" data-mv="r" aria-label="Pas à droite" title="Pas à droite (6, D)">▶</button>
 </div>
 <div id="sys">
  <button class="pl" id="bMenu" title="Chronique : journal, sauvegardes, réglages (Échap)"><img id="iMenu" alt=""><span>Chronique</span></button>
  <button class="pl" id="bRest" title="Repos (R)"><img id="iRest" alt=""><span>Repos</span></button>
  <button class="pl" id="bMap" title="Carte (M)"><img id="iMap" alt=""><span>Carte</span></button>
 </div>
 <div id="inv"></div>
</div>
<div id="dlg" class="sheet" hidden><div class="box"><div id="dlgImgW"><canvas id="dlgImg" width="400" height="200"></canvas></div><div class="who" id="dlgWho"></div><p id="dlgText"></p><div class="row" id="dlgBtns"></div></div></div>
<div id="modal" class="sheet" hidden><div class="box" id="modalBox"></div></div>
<div id="title">
 <canvas id="titleBg" width="400" height="200"></canvas>
 <h1>Le Général déchu</h1>
 <div class="sub">Chronique d'une trahison, d'une évasion<br>et d'un geôlier qui n'avait rien demandé.</div>
 <button id="tNew">Nouvelle partie</button>
 <button id="tCont" hidden>Continuer</button>
 <div class="keys">Souris, doigt ou clavier : tout se fait des trois façons. L'aide est dans la chronique (Échap).</div>
</div>
<script>
/*DATA*/
const ITEMS={
 louche:{n:"Louche de geôlier",k:'main',dmg:[1,3],spd:800,sk:'armes',p:1,d:"Sert la soupe et, à défaut, les coups. Dans les deux cas, on en redemande rarement."},
 tabouret:{n:"Pied de tabouret",k:'main',dmg:[2,5],spd:1000,sk:'armes',p:1,d:"Trois campagnes victorieuses pour en arriver là."},
 dague:{n:"Dague",k:'main',dmg:[2,6],spd:650,sk:'armes',p:14,d:"Courte, vive, discrète. Tout ce que Pépin n'est pas."},
 misericorde:{n:"Miséricorde de Castelroc",k:'main',dmg:[3,7],spd:600,sk:'armes',pierce:3,p:40,d:"Arme unique. Une lame fine qui trouve le défaut des armures. Oubliée dans une niche par un prisonnier optimiste."},
 epee_c:{n:"Épée courte",k:'main',dmg:[3,8],spd:1000,sk:'armes',p:30,d:"L'arme réglementaire des gardes. Réglementairement émoussée."},
 epee_l:{n:"Épée longue",k:'main',dmg:[5,11],spd:1200,sk:'armes',p:60,d:"Une lame de chevalier. Elle exige de la place et un peu de tenue."},
 estoc:{n:"Estoc",k:'main',dmg:[4,9],spd:1000,sk:'armes',pierce:4,p:75,d:"Tout en pointe. Perce les mailles comme une objection bien placée."},
 hache:{n:"Hache d'armes",k:'main',dmg:[6,14],spd:1650,sk:'armes',p:70,d:"Lente à lever, brève à convaincre."},
 pioche:{n:"Pioche de sape",k:'main',dmg:[4,10],spd:1400,sk:'armes',pierce:2,p:25,d:"Elle a fait tomber quatre remparts et un beau-frère."},
 lance:{n:"Lance",k:'main',dmg:[4,9],spd:1300,sk:'armes',reach:2,p:48,d:"Allonge de deux cases : on frappe par-dessus l'épaule d'un ami, ou avant que l'ennemi n'arrive."},
 baton:{n:"Bâton ferré",k:'main',dmg:[3,7],spd:1000,sk:'armes',p:12,d:"Le bâton d'un homme de paix, ferré aux deux bouts par un homme prudent."},
 fronde:{n:"Fronde",k:'main',dmg:[2,6],spd:1300,sk:'adresse',rng:4,p:16,d:"Frappe à distance. Les cailloux sont fournis par le royaume."},
 arbalete:{n:"Arbalète",k:'main',dmg:[5,12],spd:2100,sk:'adresse',rng:5,pierce:2,p:65,d:"Frappe loin et fort. Le rechargement laisse le temps de réfléchir à ses actes."},
 gambison:{n:"Gambison",k:'corps',prot:2,p:28,d:"Veste matelassée. Protège des coups et de l'hiver."},
 cuir:{n:"Cuir clouté",k:'corps',prot:3,p:45,d:"Souple, solide, et d'une odeur qui tient l'ennemi à distance."},
 mailles:{n:"Cotte de mailles",k:'corps',prot:5,p:95,d:"Vingt mille anneaux rivés à la main par quelqu'un de très patient."},
 casque:{n:"Casque à nasal",k:'appoint',prot:1,p:20,d:"Protège le crâne et donne l'air de savoir ce qu'on fait."},
 bouclier:{n:"Bouclier rond",k:'appoint',prot:2,p:34,d:"Une planche avec des ambitions."},
 ecu:{n:"Écu armorié",k:'appoint',prot:3,p:70,d:"Aux armes d'une famille éteinte. Elle n'avait pas d'écu assez grand."},
 pain:{n:"Pain de munition",k:'use',heal:8,p:3,d:"Rend quelques points de vie. Peut aussi servir de projectile."},
 herbes:{n:"Simples du jardin",k:'use',heal:15,p:7,d:"Herbes médicinales du monastère. Amères, donc efficaces."},
 onguent:{n:"Onguent",k:'use',heal:25,p:12,d:"Soigne les plaies. La recette est secrète, ce qui vaut sans doute mieux."},
 vin:{n:"Gourde de vin coupé",k:'use',sf:12,p:6,d:"Rend du souffle. Coupé à l'eau, précise l'étiquette, sans dire dans quelle proportion."},
 potfeu:{n:"Pot à feu",k:'throw',dmg:[12,20],p:20,d:"À lancer devant soi. Blesse tous les adversaires de la case visée."},
 poudre:{n:"Tonnelet de poudre",k:'key',p:0,d:"De quoi ouvrir un mur fissuré. À tenir loin de la pipe de Pépin."},
 lanterne:{n:"Lanterne à huile",k:'key',p:15,d:"Tant qu'elle est dans le sac, on y voit dans les galeries. Pépin la porte, c'est sa contribution."},
 cle_fer:{n:"Clé de fer",k:'key',p:0,d:"La clé du sergent. Elle ouvre la sortie des geôles."},
 cle_cuivre:{n:"Clé de cuivre",k:'key',p:0,d:"Prise au Borgne. Elle ouvre la grille du puits sud."},
 cle_crypte:{n:"Clé de la crypte",k:'key',p:0,d:"Prise au capitaine Hagen. Elle ouvre la poterne de la crypte."}
};

function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,c);return c;}
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const lg=(g,x0,y0,x1,y1,...st)=>{const q=g.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>q.addColorStop(i/(st.length-1),c));return q;};
const rg=(g,x,y,r,...st)=>{const q=g.createRadialGradient(x,y,0,x,y,r);st.forEach((c,i)=>q.addColorStop(i/(st.length-1),c));return q;};
function rr(g,x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill();}
function el(g,x,y,rx,ry,a0,a1){g.beginPath();g.ellipse(x,y,rx,ry,0,a0||0,a1==null?7:a1);g.fill();}
function poly(g,p){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill();}
function line(g,p,w,c){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.stroke();}
function speck(g,r,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=r()<.5?`rgba(0,0,0,${r()*a})`:`rgba(255,255,255,${r()*a*.5})`;g.fillRect(r()*w|0,r()*h|0,1+(r()*2|0),1+(r()*2|0));}}

 while(y<S){const h=o.rows[ri%o.rows.length];let x=-(r()*o.w[0]|0);
  while(x<S){const w=o.w[0]+(r()*(o.w[1]-o.w[0])|0),v=(r()-.5)*o.va,c=o.base.map(k=>Math.max(0,k+v|0));
   g.fillStyle=lg(g,0,y,0,y+h,`rgb(${c.map(k=>k+16)})`,`rgb(${c})`,`rgb(${c.map(k=>Math.max(0,k-18))})`);rr(g,x+1,y+1,w-2,h-2,2);
   g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x+3,y+1,w-6,1);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+3,y+h-2,w-6,1);
   if(r()<.25)line(g,[x+4+r()*(w-8),y+2,x+4+r()*(w-8),y+h*.6],.6,'rgba(0,0,0,.3)');x+=w;}
  y+=h;ri++;}
 speck(g,r,S,S,S*S/14,.3);}

 if(right){if(id)describe(id);return;}
 if(S.hand){if(id){S.bag[bi]=S.hand;S.hand=id;}else{S.bag.push(S.hand);S.hand=null;}sfx('drop');ui();}
 else if(id){S.hand=id;S.bag.splice(bi,1);sfx('pick');const it=ITEMS[id];log(`En main : <b>${it.n}</b> (${info(id)}). ${it.k==='throw'?'Cliquez la vue pour le lancer.':it.k==='key'?it.d:'Cliquez un portrait pour '+(it.k==='use'?'le donner.':"l'équiper.")}`);}}
function cycleHand(dir){if(paused())return;if(S.hand){dir>0?S.bag.push(S.hand):S.bag.unshift(S.hand);S.hand=null;}if(!S.bag.length){ui();return;}S.hand=dir>0?S.bag.shift():S.bag.pop();
 sfx('pick');log(`En main : <b>${ITEMS[S.hand].n}</b> (${info(S.hand)}). 1 à 4 pour le donner, Espace pour le lancer ou le poser, Échap pour le ranger.`);}
function stow(){if(S.hand){S.bag.push(S.hand);S.hand=null;sfx('drop');ui();}}
function tapPt(i){if(paused())return;const c=S.party[i];if(!c)return;if(!S.hand){openSheet(i);return;}const id=S.hand,it=ITEMS[id],n=CH[c.id].n;
 if(it.k==='main'||it.k==='corps'||it.k==='appoint'){const old=c.eq[it.k];c.eq[it.k]=id;S.hand=old||null;sfx('pick');log(`${n} s'équipe : ${it.n}.`);}
 else if(it.k==='use'){const b=best('savoir'),mul=1+(b?b.sk.savoir.l*.1:0);
  if(it.heal){if(c.hp>=c.hpM){log(`${n} se porte déjà comme un charme.`);return;}const h=Math.round(it.heal*mul);c.hp=Math.min(c.hpM,c.hp+h);if(b)gainXp(b,'savoir',5);S.hand=null;sfx('heal');log(`${n} récupère ${h} points de vie.`);}
  else{c.sf=Math.min(c.sfM,c.sf+it.sf);S.hand=null;sfx('heal');log(`${n} reprend son souffle.`);}}
 else log(`${n} n'en a pas l'usage.`);}
function tapView(){if(paused())return;closePick();if(S.hand){const it=ITEMS[S.hand],[x,y]=front(),c=cell(x,y);
  if(it.k==='throw'){throwPot();ui();return;}
  if(npcAt(x,y)||monAt(x,y)||'DLWXVvGS'.includes(c)){interact();return;}
  dropHand();return;}
 interact();}
function openPick(i){const c=S.party[i];if(!c||c.hp<=0||paused()||S.T<c.cs)return;const mx=spMax(c),k=CH[c.id];if(mx===1){special(i,1);return;}
 pickI=i;let h=`<span>${k.spN} de ${k.n}</span>`;for(let l=1;l<=3;l++)h+=`<button class="pl" data-lv="${l}" ${l>mx||c.sf<k.spC*l?'disabled':''} title="Palier ${l} (touche ${l})"><b>${'I'.repeat(l)}</b><small>${k.spC*l}</small></button>`;
 const p=$('pick');p.innerHTML=h;p.hidden=false;clearTimeout(pickT);pickT=setTimeout(closePick,5000);}
function closePick(){pickI=null;$('pick').hidden=true;}
function openSheet(i){sheetI=i;const c=S.party[i],k=CH[c.id],mx=spMax(c);
 let h=`<div class="who"><img src="${PORT[c.id].n}" alt=""><span><b>${k.full}</b><br><small>${k.role}</small></span></div>
 <div class="stat"><span>Vie : ${c.hp}/${c.hpM}</span><span>Souffle : ${c.sf}/${c.sfM}</span><span>Force : ${c.force}</span><span>Protection : ${prot(c)}</span></div><h3>Talents — ils progressent à l'usage</h3>`;
 for(const s of SKN){const v=c.sk[s];h+=`<div class="skill"><div><span>${SKL[s]}</span><b>niveau ${v.l}</b></div><div class="bar"><i style="width:${v.x/need(v.l)*100}%"></i></div></div>`;}
 h+='<h3>Équipement</h3>';for(const[sl,lb]of[['main','Arme'],['corps','Corps'],['appoint','Appoint']]){const id=c.eq[sl];
  h+=`<div class="eq"><img src="${id?ICON[id]:sl==='main'?ICON.fist:'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}" alt=""><span>${lb} : <b>${id?ITEMS[id].n:(sl==='main'?'Poings':'—')}</b>${id?'<br><small>'+info(id)+'</small>':''}</span>${id?`<button data-uneq="${i},${sl}">Retirer</button>`:''}</div>`;}
 h+=`<h3>Botte secrète : ${k.spN}</h3><p>${k.spD} Coût : ${k.spC} de souffle par palier. Palier maîtrisé : ${'I'.repeat(mx)} (le suivant vient avec le talent ${SKL[k.spS]}).</p>
 <div class="row">${S.party.length>1?`<button data-sheet="${(i+S.party.length-1)%S.party.length}">◀ Précédent</button><button data-sheet="${(i+1)%S.party.length}">Suivant ▶</button>`:''}<button class="main" data-close>Fermer</button></div>`;openModal(h);}
function openShop(id){shopId=id;stow();let h=`<h2>${NAMES[id]} <small>${S.gold} écus</small></h2><h3>Acheter</h3><div class="list">`;
 for(const it of SHOPS[id])h+=`<button data-buy="${it}" ${S.gold<ITEMS[it].p?'disabled':''}><img src="${ICON[it]}" alt=""><span><b>${ITEMS[it].n}</b><small>${info(it)}</small></span><em>${ITEMS[it].p} écus</em></button>`;
 h+='</div><h3>Vendre</h3><div class="list">';const sell=S.bag.map((b,i)=>[b,i]).filter(a=>ITEMS[a[0]].p>0);
 if(!sell.length)h+='<p class="dim">Rien qui intéresse le commerce.</p>';
 for(const[b,i]of sell)h+=`<button data-sell="${i}"><img src="${ICON[b]}" alt=""><span><b>${ITEMS[b].n}</b></span><em>+${Math.max(1,ITEMS[b].p>>1)} écus</em></button>`;
 h+='</div><div class="row"><button class="main" data-close>Fermer</button></div>';openModal(h);}
function paintMap(g,cs){g.clearRect(0,0,MW*cs,MH*cs);for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(!LS.seen[x+','+y])continue;const c=cell(x,y),X=x*cs,Y=y*cs;
  g.fillStyle='#VvWSDLGX'.includes(c)?'#5b4a3a':'#f3e9cf';g.fillRect(X,Y,cs,cs);
  const q=cs/6;if(c==='D'||c==='d'){g.fillStyle='#8a5a2b';g.fillRect(X+q,Y+q,cs-2*q,cs-2*q);}
  else if(c==='L'){g.fillStyle='#d2ae52';g.fillRect(X+q,Y+q,cs-2*q,cs-2*q);}
  else if(c==='G'||c==='g'){g.fillStyle=c==='G'?'#2d2b2a':'#9a958c';for(let k=1;k<4;k++)g.fillRect(X+k*cs/4-.5,Y+1,1.4,cs-2);}
  else if(c==='V'||c==='v'){g.fillStyle='#e8842c';g.beginPath();g.arc(X+cs/2,Y+cs/2,cs/4,0,7);g.fill();}
  else if(c==='W'){g.strokeStyle='#150d07';g.beginPath();g.moveTo(X+2,Y+2);g.lineTo(X+cs/2,Y+cs/2);g.lineTo(X+cs/3,Y+cs-2);g.stroke();}
  else if(c==='X'){g.fillStyle='#3f8a4c';g.fillRect(X+q,Y+q,cs-2*q,cs-2*q);}
  const n=npcAt(x,y);if(n){g.fillStyle='#3b5fa8';g.beginPath();g.arc(X+cs/2,Y+cs/2,cs/3.4,0,7);g.fill();}
  else if(itemsAt(x,y).length){g.fillStyle='#b9973f';g.fillRect(X+cs/2-1.5,Y+cs/2-1.5,3,3);}}
 g.save();g.translate(S.x*cs+cs/2,S.y*cs+cs/2);g.rotate(S.d*Math.PI/2);g.fillStyle='#b3261e';g.beginPath();g.moveTo(0,-cs*.42);g.lineTo(cs*.34,cs*.34);g.lineTo(-cs*.34,cs*.34);g.fill();g.restore();}
function miniMap(){if(!S||!LS)return;$('compass').textContent='NESO'[S.d];const m=$('mini');if(m.offsetParent){if(m.width!==MW*10){m.width=MW*10;m.height=MH*10;}paintMap(m.getContext('2d'),10);}}
function openMap(){const cs=18;openModal(`<h2>${LV.name}</h2><canvas id="mapC" width="${MW*cs}" height="${MH*cs}"></canvas><p class="dim">Brun : porte. Or : serrure. Barreaux : herse. Orange : levier. Bleu : quelqu'un à qui parler. Vert : sortie.</p><div class="row"><button class="main" data-close>Fermer</button></div>`);paintMap($('mapC').getContext('2d'),cs);}
function openMenu(){openModal(`<h2>Chronique de campagne</h2><div class="list"><button class="main" data-close><span>Reprendre</span></button><button data-m="journal"><span>Journal</span></button><button data-m="save"><span>Sauvegarder</span></button>
 <button data-m="load"><span>Charger</span></button><button data-m="opt"><span>Réglages</span></button><button data-m="help"><span>Aide et commandes</span></button><button data-m="quit"><span>Retour au titre</span></button></div>`);}
function slotList(mode){let h=`<h2>${mode==='save'?'Sauvegarder':'Charger'}</h2><div class="list">`;
 for(const s of(mode==='save'?['1','2','3']:['auto','1','2','3'])){const m=slotMeta(s),d=m?new Date(m.t):null;
  h+=`<button data-${mode}="${s}" ${mode==='load'&&!m?'disabled':''}><span><b>${s==='auto'?'Sauvegarde automatique':'Emplacement '+s}</b><small>${m?`${m.lv} · ${m.n} compagnon${m.n>1?'s':''} · ${DIFF[m.d||0].n} · ${d.toLocaleDateString('fr-FR')} ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`:'Vide'}</small></span></button>`;}
 return h+'</div><div class="row"><button class="main" data-close>Fermer</button></div>';}
function optModal(){openModal(`<h2>Réglages</h2><div class="list"><button data-m="mus"><span>Musique : <b>${PREF.mus?'oui':'non'}</b>${ONSITE?'':'<small>Disponible sur ecolesenligne.fr</small>'}</span></button><button data-m="sfx"><span>Bruitages : <b>${PREF.sfx?'oui':'non'}</b></span></button>
 <button data-m="full"><span>Plein écran</span></button></div><div class="row"><button class="main" data-close>Fermer</button></div>`);}
const HELP=`<h2>Aide et commandes</h2>
<h3>Souris ou doigt</h3><p><b>Vue</b> : cliquer ouvre une porte, actionne un levier, parle, ramasse l'objet posé devant vous, ou frappe l'adversaire qui vous fait face.</p>
<p><b>Sac</b> : cliquer un objet le prend en main (il suit le curseur). Cliquer ensuite un portrait pour l'équiper ou le donner, une case du sac pour le reposer ou l'échanger, la vue pour le lancer ou le poser au sol. Clic droit sur un objet : sa description.</p>
<p><b>Portraits</b> : la plaque du haut frappe, celle du bas ouvre la botte secrète et ses paliers I, II, III. Sans objet en main, cliquer le visage ouvre la fiche. Molette sur le sac : défilement.</p>
<h3>Clavier</h3><p><b>Déplacement</b> : pavé numérique comme les six flèches (7 8 9 / 4 5 6), ou flèches, ou W A S D avec Q et E pour tourner.</p>
<p><b>F1 à F4</b> (ou 1 à 4) : frapper. <b>F5 à F8</b> : botte secrète, puis 1, 2 ou 3 pour le palier. <b>Espace</b> : agir devant soi. <b>Tab</b> : prendre l'objet suivant en main, puis 1 à 4 pour le donner. <b>Échap</b> : ranger l'objet, ou ouvrir la chronique.</p>
<p><b>R</b> repos · <b>M</b> carte · <b>C</b> fiches · <b>J</b> journal. Dans les fenêtres : flèches et Entrée, Échap pour fermer.</p><div class="row"><button class="main" data-close>Fermer</button></div>`;
function showTitle(){$('title').hidden=false;$('tCont').hidden=!['auto','1','2','3'].some(slotMeta);}
function startNew(){openModal('<h2>Quelle campagne ?</h2><div class="list">'+DIFF.map((d,i)=>`<button data-diff="${i}"><span><b>${d.n}</b><small>${d.d}</small></span></button>`).join('')+'</div><div class="row"><button data-close>Annuler</button></div>');}

$('modal').addEventListener('click',e=>{const t=e.target.closest('button');if(!t){if(e.target===$('modal')&&S&&LS)closeModal();return;}const d=t.dataset;sfx('ui');
 if('close'in d){$('modal').hidden=true;if(S&&LS)ui();}
 else if(d.uneq){const[i,sl]=d.uneq.split(','),c=S.party[+i];S.bag.push(c.eq[sl]);c.eq[sl]=null;openSheet(+i);}
 else if(d.sheet)openSheet(+d.sheet);
 else if(d.buy){const it=ITEMS[d.buy];if(S.gold>=it.p){S.gold-=it.p;S.bag.push(d.buy);sfx('coin');log(`Acheté : ${it.n}.`);openShop(shopId);}}
 else if(d.sell){const id=S.bag[+d.sell];S.gold+=Math.max(1,ITEMS[id].p>>1);S.bag.splice(+d.sell,1);sfx('coin');log(`Vendu : ${ITEMS[id].n}.`);openShop(shopId);}
 else if(d.diff){$('modal').hidden=true;$('title').hidden=true;newGame(+d.diff);}
 else if(d.save){$('modal').hidden=true;log(save(d.save)?`La chronique est à jour : emplacement ${d.save}.`:"Impossible d'écrire la sauvegarde sur cet appareil.");}
 else if(d.load){if(load(d.load)){$('modal').hidden=true;$('title').hidden=true;log("Vous reprenez la route.");}}
 else if(d.m==='save')openModal(slotList('save'));else if(d.m==='load')openModal(slotList('load'));
 else if(d.m==='journal')openModal(`<h2>Journal</h2>${JOURNAL()}<div class="row"><button class="main" data-close>Fermer</button></div>`);
 else if(d.m==='help')openModal(HELP);else if(d.m==='opt')optModal();
 else if(d.m==='mus'){PREF.mus=PREF.mus?0:1;savePref();music();optModal();}
 else if(d.m==='sfx'){PREF.sfx=PREF.sfx?0:1;savePref();if(amb)amb.gain.value=PREF.sfx?.05:0;optModal();}
 else if(d.m==='full'){try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{});}catch(x){}}
 else if(d.m==='quit'){$('modal').hidden=true;save('auto');showTitle();}});
$('party').addEventListener('pointerdown',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.atk)attack(+d.atk);else if(d.spc)openPick(+d.spc);else if(d.pt)tapPt(+d.pt);});
$('pick').addEventListener('pointerdown',e=>{const t=e.target.closest('button');if(t&&!t.disabled&&pickI!=null){const i=pickI;closePick();special(i,+t.dataset.lv);}});
$('inv').addEventListener('pointerdown',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;
 if(d.slot)tapSlot(+d.slot,e.button===2);else if(d.inv){S.off=(S.off||0)+(+d.inv);drawInv();}});
$('inv').addEventListener('wheel',e=>{e.preventDefault();if(!S)return;S.off=(S.off||0)+(e.deltaY>0?1:-1);drawInv();},{passive:false});
$('app').addEventListener('contextmenu',e=>e.preventDefault());
const MV={f:()=>move(0),b:()=>move(2),l:()=>move(3),r:()=>move(1),tl:()=>turn(-1),tr:()=>turn(1)};
let holdT=0;const unhold=()=>{clearInterval(holdT);holdT=0;};
$('pad').addEventListener('pointerdown',e=>{const t=e.target.closest('button');if(!t)return;const f=MV[t.dataset.mv];f();unhold();holdT=setInterval(f,70);});
['pointerup','pointercancel','pointerleave','blur'].forEach(n=>addEventListener(n,unhold));$('pad').addEventListener('pointerleave',unhold);
$('view').addEventListener('pointerdown',e=>{if(e.button===2){stow();return;}tapView();});
$('bMenu').onclick=()=>{if(!paused())openMenu();};$('bMap').onclick=()=>{if(!paused())openMap();};$('bRest').onclick=rest;
addEventListener('resize',()=>{if(S&&LS)ui();});
const KEYS={ArrowUp:'f',KeyW:'f',Numpad8:'f',ArrowDown:'b',KeyS:'b',Numpad5:'b',Numpad2:'b',KeyA:'l',Numpad4:'l',KeyD:'r',Numpad6:'r',ArrowLeft:'tl',KeyQ:'tl',Numpad7:'tl',ArrowRight:'tr',KeyE:'tr',Numpad9:'tr'};
function focusMove(box,dir){const b=[...box.querySelectorAll('button:not(:disabled)')];if(!b.length)return;let i=b.indexOf(document.activeElement);i=i<0?0:(i+dir+b.length)%b.length;b[i].focus();}
addEventListener('keydown',e=>{const k=e.code;if(e.ctrlKey||e.metaKey||e.altKey)return;audioOn();
 if(!$('dlg').hidden){const bs=[...$('dlgBtns').querySelectorAll('button')];
  if(/^(Digit|Numpad)[1-9]$/.test(k)&&bs.length>1){const b=bs[+k.slice(-1)-1];if(b&&!b.disabled)b.click();e.preventDefault();}
  else if(k==='ArrowDown'||k==='ArrowRight'){focusMove($('dlgBtns'),1);e.preventDefault();}else if(k==='ArrowUp'||k==='ArrowLeft'){focusMove($('dlgBtns'),-1);e.preventDefault();}
  else if((k==='Space'||k==='Enter'||k==='NumpadEnter')&&!$('dlgBtns').contains(document.activeElement)){e.preventDefault();if(bs.length===1)bs[0].click();else if(bs[0])bs[0].focus();}
  return;}
 if(!$('modal').hidden){if(k==='Escape'){e.preventDefault();$('modal').hidden=true;if(S&&LS)ui();}
  else if(k==='ArrowDown'||k==='ArrowRight'){focusMove($('modalBox'),1);e.preventDefault();}else if(k==='ArrowUp'||k==='ArrowLeft'){focusMove($('modalBox'),-1);e.preventDefault();}
  return;}
 if(!$('title').hidden){if(k==='ArrowDown'||k==='ArrowUp'){focusMove($('title'),k==='ArrowDown'?1:-1);e.preventDefault();}return;}
 if(paused())return;
 const fk=/^F([1-8])$/.exec(k),dg=/^Digit([1-4])$/.exec(k);
 if(KEYS[k]){e.preventDefault();MV[KEYS[k]]();}
 else if(dg||fk){e.preventDefault();if(e.repeat)return;let n=+(dg||fk)[1];
  if(pickI!=null&&dg&&n<=3){const i=pickI;closePick();special(i,n);}
  else if(fk&&n>4)openPick(n-5);else if(dg&&e.shiftKey)openPick(n-1);
  else if(S.hand)tapPt(n-1);else attack(n-1);}
 else if(e.repeat)return;
 else if(k==='Space'||k==='Enter'||k==='NumpadEnter'||k==='Numpad0'){e.preventDefault();tapView();}
 else if(k==='Tab'){e.preventDefault();cycleHand(e.shiftKey?-1:1);}
 else if(k==='PageDown'||k==='BracketRight'){S.off=(S.off||0)+1;drawInv();}else if(k==='PageUp'||k==='BracketLeft'){S.off=(S.off||0)-1;drawInv();}
 else if(k==='KeyM')openMap();else if(k==='KeyR')rest();else if(k==='KeyC')openSheet(0);else if(k==='KeyJ')openModal(`<h2>Journal</h2>${JOURNAL()}<div class="row"><button class="main" data-close>Fermer</button></div>`);
 else if(k==='Escape'){if(pickI!=null)closePick();else if(S.hand)stow();else openMenu();}});
$('tNew').onclick=()=>{audioOn();music();startNew();};
$('tCont').onclick=()=>{audioOn();music();openModal(slotList('load'));};
addEventListener('pointerdown',()=>{audioOn();if(S)music();},{once:false,passive:true});

buildArt();buildIcons();showTitle();requestAnimationFrame(loop);
if(ONSITE){const l=document.createElement('link');l.rel='manifest';l.href='/landoflord/manifest.webmanifest';document.head.appendChild(l);if('serviceWorker'in navigator)navigator.serviceWorker.register('/landoflord/sw.js',{scope:'/landoflord'}).catch(()=>{});}
