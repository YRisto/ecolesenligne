/* ---------- état ---------- */
function mkChar(id){const c=CH[id];return{id,hp:c.hp,hpM:c.hp,sf:c.sf,sfM:c.sf,force:c.force,
 sk:{armes:{l:c.sk[0],x:0},adresse:{l:c.sk[1],x:0},savoir:{l:c.sk[2],x:0}},eq:{main:c.eq.main||null,corps:c.eq.corps||null,appoint:null},cd:0,cdD:1,cs:0};}
function initLevel(id){const L=LEVELS[id];return{g:L.map.slice(),mons:L.mons.map(m=>({t:m[0],x:m[1],y:m[2],hp:MON[m[0]].hp,next:0,aw:0})),
 items:L.items.map(a=>({id:a[0],x:a[1],y:a[2],q:a[3]||0})),seen:{},fired:{},gone:{}};}
function newGame(){S={lv:'',x:0,y:0,d:0,gold:6,bag:[],party:[mkChar('aldric'),mkChar('pepin')],L:{},flags:{},T:0,sfT:0};logs=[];enterLevel('geoles');}
function enterLevel(id){S.lv=id;if(!S.L[id])S.L[id]=initLevel(id);const st=LEVELS[id].start;S.x=st[0];S.y=st[1];S.d=st[2];bind();save();banner();fire('intro_'+id);}
function bind(){LV=LEVELS[S.lv];LS=S.L[S.lv];MH=LS.g.length;MW=LS.g[0].length;anim=null;computeDF();markSeen();drawParty();drawLog();}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);if(!s)return false;S=JSON.parse(s);bind();return true;}catch(e){return false;}}
function hasSave(){try{return!!localStorage.getItem(SAVE);}catch(e){return false;}}
function banner(){const e=$('lvlname');e.textContent=LV.name;$('decoL').textContent=LV.name;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3500);}

/* ---------- carte ---------- */
const cell=(x,y)=>(y<0||y>=MH||x<0||x>=MW)?'#':LS.g[y][x];
const pass=(x,y)=>{const c=cell(x,y);return c==='.'||c==='d';};
function setCell(x,y,c){LS.g[y]=LS.g[y].substring(0,x)+c+LS.g[y].substring(x+1);computeDF();markSeen();}
const monAt=(x,y)=>LS.mons.find(m=>m.hp>0&&m.x===x&&m.y===y);
const npcAt=(x,y)=>LV.npcs.find(n=>!LS.gone[n.id]&&n.x===x&&n.y===y);
const occupied=(x,y)=>!!(monAt(x,y)||npcAt(x,y)||(S.x===x&&S.y===y));
function computeDF(){df=new Array(MW*MH).fill(99);const q=[[S.x,S.y]];df[S.y*MW+S.x]=0;
 while(q.length){const[x,y]=q.shift(),d=df[y*MW+x];for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(pass(nx,ny)&&df[ny*MW+nx]>d+1){df[ny*MW+nx]=d+1;q.push([nx,ny]);}}}}
function markSeen(){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)LS.seen[(S.x+dx)+','+(S.y+dy)]=1;
 let x=S.x,y=S.y;for(let i=0;i<5;i++){x+=DX[S.d];y+=DY[S.d];const sd=(S.d+1)%4;LS.seen[x+','+y]=1;LS.seen[(x+DX[sd])+','+(y+DY[sd])]=1;LS.seen[(x-DX[sd])+','+(y-DY[sd])]=1;if(!pass(x,y))break;}}

function log(m){logs.push(m);if(logs.length>2)logs.shift();drawLog();}
function drawLog(){$('log').innerHTML=logs.map(m=>'<div>'+m+'</div>').join('');$('goldN').textContent=S?S.gold:'';drawInv();}
const NAMES={aldric:"Aldric",pepin:"Pépin",brune:"Brune",goupil:"Mère Goupil",anselme:"Maître Anselme",fulbert:"Maître Fulbert",sergent:"Sergent Brisemotte",borgne:"Le Borgne"};
let DQ=[],DEnd=null;
function say(lines,end){DQ=lines.slice();DEnd=end||null;nextLine();}
function nextLine(){
 if(!DQ.length){$('dlg').hidden=true;const e=DEnd;DEnd=null;if(e)e();return;}
 const l=DQ.shift(),w=$('dlgWho'),b=$('dlgBtns');$('dlg').hidden=false;
 if(l[0]){w.className='who';w.innerHTML=(PORT[l[0]]?`<img src="${PORT[l[0]]}" alt="">`:'')+`<b>${NAMES[l[0]]||l[0]}</b>`;}
 else{w.className='who narr';w.innerHTML='<b>Chronique</b>';}
 $('dlgText').textContent=l[1];b.innerHTML='';
 if(l[2]){l[2].forEach(ch=>{const bt=document.createElement('button');bt.textContent=ch[0];bt.onclick=()=>{ch[1]();nextLine();};b.appendChild(bt);});}
 else{const bt=document.createElement('button');bt.className='main';bt.textContent=DQ.length?'Suite':'Bien';bt.onclick=nextLine;b.appendChild(bt);}
}
const paused=()=>!S||!$('dlg').hidden||!$('modal').hidden||!$('title').hidden;

/* ---------- déplacement ---------- */
function startAnim(fx_,fy_,fa,tx,ty,ta,dur){anim={t0:performance.now(),dur,fx:fx_,fy:fy_,fa,tx,ty,ta};}
function turn(s){if(paused()||anim)return;const a=ANG[S.d];S.d=(S.d+s+4)%4;startAnim(S.x+.5,S.y+.5,a,S.x+.5,S.y+.5,a+s*Math.PI/2,150);markSeen();}
function move(rel){if(paused()||anim)return;const d=(S.d+rel)%4,nx=S.x+DX[d],ny=S.y+DY[d],c=cell(nx,ny);
 if(rel===0&&'DLXW'.includes(c)){interact();return;}
 if(!pass(nx,ny)||monAt(nx,ny)||npcAt(nx,ny))return;
 const ox=S.x,oy=S.y;S.x=nx;S.y=ny;startAnim(ox+.5,oy+.5,ANG[S.d],nx+.5,ny+.5,ANG[S.d],170);computeDF();markSeen();pickup();
 for(const t of LV.trig)if(t[0]===nx&&t[1]===ny)fire(t[2]);}
function pickup(){const here=LS.items.filter(i=>i.x===S.x&&i.y===S.y);if(!here.length)return;
 for(const it of here){if(it.id==='or'){S.gold+=it.q;log(`Vous ramassez ${it.q} écus.`);}else{S.bag.push(it.id);log(`Ramassé : ${ITEMS[it.id].n}.`);}}
 LS.items=LS.items.filter(i=>!(i.x===S.x&&i.y===S.y));drawLog();}
function has(id){return id&&S.bag.includes(id);}
function best(sk){let b=null;for(const c of S.party)if(c.hp>0&&(!b||c.sk[sk].l>b.sk[sk].l))b=c;return b;}
function interact(){if(paused())return;const x=S.x+DX[S.d],y=S.y+DY[S.d],n=npcAt(x,y);
 if(n){NPC[n.id]();return;}
 const c=cell(x,y);
 if(c==='D'){setCell(x,y,'d');log("La porte s'ouvre en grinçant.");}
 else if(c==='d'){if(monAt(x,y))return;setCell(x,y,'D');log("Vous refermez la porte.");}
 else if(c==='L')tryLock(x,y);
 else if(c==='W'){if(has('poudre')){S.bag.splice(S.bag.indexOf('poudre'),1);hand=null;setCell(x,y,'.');shake();const b=best('savoir');if(b)gainXp(b,'savoir',30);
   log("Le tonnelet fait son office. Le mur cesse d'en être un.");}else log("Un mur fissuré, qui sonne creux. Avec de la poudre, on s'entendrait.");}
 else if(c==='X')exitLevel();
 else if(c==='#')log(["Un mur. Il ne cédera pas à l'argumentation.","De la pierre, de la bonne.","Rien de particulier, sinon l'humidité."][rnd(0,2)]);
 else log("Rien à signaler.");}
function tryLock(x,y){const lk=LV.locks[x+','+y]||{diff:9};
 if(has(lk.key)){setCell(x,y,'d');log("La clé tourne. La voie est libre.");save();return;}
 if(lk.diff>5){log(lk.no||"Serrure massive. Il faut la clé.");return;}
 if(S.T<lockCd)return;lockCd=S.T+900;const c=best('adresse');if(!c)return;
 if(rnd(1,100)<=30+20*c.sk.adresse.l-15*lk.diff){setCell(x,y,'d');gainXp(c,'adresse',15);log(`${CH[c.id].n} crochète la serrure avec une épingle et beaucoup de commentaires.`);}
 else{gainXp(c,'adresse',4);log(`${CH[c.id].n} tripote la serrure. Elle résiste. Réessayez.`);}}
function shake(){const e=$('viewWrap');e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');}
function exitLevel(){
 if(S.lv==='geoles')say([[null,"Derrière la porte, un escalier, puis l'air froid de la nuit. Castelroc dort. Personne n'a encore recompté les prisonniers."],
  ['aldric',"On m'a volé une bataille. Je vais la reprendre, et il me faut mes lieutenants. Brune la Sapeuse d'abord : elle dirige une mine d'argent à Val-Griset."],
  ['pepin',"C'est loin ?"],['aldric',"Trois jours de marche."],['pepin',"En prison, au moins, on était assis."]],()=>enterLevel('mine'));
 else say([[null,"La mine de Val-Griset est libre, et Brune a retrouvé sa pioche de campagne. Trois lieutenants manquent encore à l'appel : un chirurgien acariâtre, un cavalier devenu brigand, une espionne à la cour."],
  ['pepin',"Et au bout, il y a une bataille. Je me disais aussi qu'il manquait quelque chose."],
  [null,"Fin du prototype. À suivre : le monastère fortifié de Frère Odon."]],()=>{save();$('tCont').hidden=false;$('title').hidden=false;});}

/* ---------- combat ---------- */
const wpn=c=>ITEMS[c.eq.main]||FIST;
const prot=c=>(c.eq.corps?ITEMS[c.eq.corps].prot:0)+(c.eq.appoint?ITEMS[c.eq.appoint].prot:0);
const need=l=>12*l*l;
function gainXp(c,sk,a){const s=c.sk[sk];s.x+=a;while(s.x>=need(s.l)){s.x-=need(s.l);s.l++;c.hpM+=sk==='armes'?4:2;c.sfM+=sk==='armes'?1:2;if(sk==='armes')c.force++;
 log(`<b>${CH[c.id].n} progresse en ${SKL[sk]} : niveau ${s.l}.</b>`);}drawParty();}
function target(r){let x=S.x,y=S.y;for(let i=1;i<=r;i++){x+=DX[S.d];y+=DY[S.d];if(!pass(x,y))return null;const m=monAt(x,y);if(m)return m;}return null;}
function floatT(t,col){fx.push({t,col:col||'#fff',t0:performance.now(),x:VW/2+rnd(-26,26)});}
function attack(i){const c=S.party[i];if(!c||c.hp<=0||paused()||S.T<c.cd)return;const w=wpn(c),m=target(w.rng||1);
 if(!m){c.cd=S.T+350;c.cdD=350;log(`${CH[c.id].n} frappe dans le vide, avec conviction.`);return;}
 c.cd=S.T+w.spd;c.cdD=w.spd;const mt=MON[m.t];
 if(rnd(1,100)>clamp(55+7*c.sk[w.sk].l-3*mt.def,15,95)){floatT('raté','#bbb');m.aw=1;return;}
 hurt(m,rnd(w.dmg[0],w.dmg[1])+(w.rng?c.sk.adresse.l:Math.floor(c.force/4)),c,w.sk);}
function special(i){const c=S.party[i];if(!c||c.hp<=0||paused()||S.T<c.cs)return;const k=CH[c.id];
 if(c.sf<k.spC){log(`${k.n} n'a plus assez de souffle.`);return;}
 const m=target(1);if(!m){log("Personne à portée.");return;}
 c.sf-=k.spC;c.cs=S.T+2500;const w=wpn(c),base=rnd(w.dmg[0],w.dmg[1])+Math.floor(c.force/4);
 if(c.id==='pepin'){m.stun=S.T+4500;floatT('étourdi','#8fd3e8');log(`Pépin fait un croc-en-jambe : ${MON[m.t].n} cherche le sol, et le trouve.`);gainXp(c,'adresse',8);m.aw=1;}
 else if(c.id==='brune'){log("Brune frappe là où le mur est faible. Les gens aussi ont des murs.");hurt(m,Math.round(base*1.5)+2,c,'savoir');}
 else{log("Aldric abat un coup de taille digne d'un manuel.");hurt(m,base*2,c,'armes');}
 drawParty();}
function hurt(m,dmg,c,sk){dmg=Math.max(1,dmg);m.hp-=dmg;m.flash=S.T+170;m.aw=1;floatT('-'+dmg,'#ffd23f');if(c)gainXp(c,sk,Math.min(dmg,m.hp+dmg));
 if(m.hp<=0){const mt=MON[m.t];log(mt.ko);const g=rnd(mt.gold[0],mt.gold[1]);if(g){S.gold+=g;log(`Vous récupérez ${g} écus.`);}
  if(mt.drop)LS.items.push({id:mt.drop,x:m.x,y:m.y,q:0});drawLog();}}
function throwPot(idx){let x=S.x,y=S.y,hit=[];for(let i=1;i<=3;i++){x+=DX[S.d];y+=DY[S.d];if(!pass(x,y))break;hit=LS.mons.filter(m=>m.hp>0&&m.x===x&&m.y===y);if(hit.length)break;}
 S.bag.splice(idx,1);shake();const b=best('savoir');if(!hit.length){log("Le pot à feu éclate plus loin. Très beau. Parfaitement inutile.");return;}
 const it=ITEMS.potfeu;log("Le pot à feu éclate au milieu de l'adversaire.");for(const m of hit)hurt(m,rnd(it.dmg[0],it.dmg[1])+(b?b.sk.savoir.l*2:0),b,'savoir');}
function tickMons(){for(const m of LS.mons){if(m.hp<=0)continue;const d=df[m.y*MW+m.x];
 if(!m.aw){if(d<=5){m.aw=1;m.next=S.T+500;}else continue;}
 if(S.T<m.next||(m.stun&&S.T<m.stun))continue;const mt=MON[m.t];
 if(d===1){monAttack(m,mt);m.next=S.T+mt.spd;}
 else if(d<99){for(let k=0;k<4;k++){const nx=m.x+DX[k],ny=m.y+DY[k];if(pass(nx,ny)&&df[ny*MW+nx]<d&&!occupied(nx,ny)){m.x=nx;m.y=ny;break;}}m.next=S.T+mt.mv;}
 else m.next=S.T+600;}}
function monAttack(m,mt){m.atkT=S.T;const al=S.party.filter(c=>c.hp>0);if(!al.length)return;const c=al[rnd(0,al.length-1)];
 if(rnd(1,100)>78){log(`${cap(mt.n)} manque ${CH[c.id].n}.`);return;}
 const dmg=Math.max(1,rnd(mt.atk[0],mt.atk[1])-Math.floor(prot(c)/2));c.hp=Math.max(0,c.hp-dmg);c.hitT=S.T;hurtT=performance.now();
 log(`${cap(mt.n)} frappe ${CH[c.id].n} : ${dmg}.`);if(c.hp<=0)log(`<b>${CH[c.id].n} est assommé${c.id==='brune'?'e':''}.</b>`);drawParty();
 if(S.party.every(p=>p.hp<=0))gameOver();}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function gameOver(){say([[null,"Toute la troupe est à terre. On vous ramène en cellule. Le sergent, bon prince, vous borde."]],()=>{if(!load())newGame();log("Vous reprenez au début du niveau.");});}
function rest(){if(paused())return;if(LS.mons.some(m=>m.hp>0&&m.aw&&df[m.y*MW+m.x]<8)){log("Impossible de se reposer : on vous cherche des noises.");return;}
 for(const c of S.party){c.hp=c.hp<=0?Math.ceil(c.hpM/2):c.hpM;c.sf=c.sfM;}S.T+=3000;drawParty();
 log(S.party.length>2?"La troupe se repose. Pépin ronfle le premier, par dévouement. Brune le réveille, par principe.":"La troupe se repose. Pépin ronfle le premier, par dévouement.");}

  g.fillStyle=c==='#'?'#5b4a3a':c==='W'?'#7a5a4a':'#f3e9cf';g.fillRect(x*cs,y*cs,cs,cs);
  if(c==='D'||c==='L'||c==='d'){g.fillStyle=c==='L'?'#b9973f':'#8a5a2b';g.fillRect(x*cs+3,y*cs+3,cs-6,cs-6);}

function openMenu(){openModal(`<h2>Chronique de campagne</h2><div class="list"><button class="main" data-close><span>Reprendre</span></button><button data-m="save"><span>Sauvegarder</span></button>

$('modal').addEventListener('click',e=>{const t=e.target.closest('button');if(!t){if(e.target===$('modal'))closeModal();return;}const d=t.dataset;

const G=$('view').getContext('2d');G.imageSmoothingEnabled=false;const zb=new Float32Array(VW);

function texFor(c,x,y,fl){const th=LV.theme;if(c==='D')return TX['door_'+th];if(c==='L')return TX['lock_'+th];if(c==='X')return TX['exit_'+th];if(c==='W')return TX.crack[th];

function render(ts){if(!S)return;let vx=S.x+.5,vy=S.y+.5,va=ANG[S.d];
 if(anim){let k=(ts-anim.t0)/anim.dur;if(k>=1)anim=null;else{k=Math.max(0,k);k=k*(2-k);vx=anim.fx+(anim.tx-anim.fx)*k;vy=anim.fy+(anim.ty-anim.fy)*k;va=anim.fa+(anim.ta-anim.fa)*k;}}
 const dX=Math.cos(va),dY=Math.sin(va),pX=-dY*PLANE,pY=dX*PLANE,fl=(ts/230|0)&1;
 G.drawImage(TX['bg_'+LV.theme],0,0);
 for(let x=0;x<VW;x++){const cam=2*x/VW-1,rx=dX+pX*cam,ry=dY+pY*cam;let mx=Math.floor(vx),my=Math.floor(vy);
  const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);let sx,sy,sdx,sdy,side=0,c='#';
  if(rx<0){sx=-1;sdx=(vx-mx)*ddx;}else{sx=1;sdx=(mx+1-vx)*ddx;}
  if(ry<0){sy=-1;sdy=(vy-my)*ddy;}else{sy=1;sdy=(my+1-vy)*ddy;}
  for(let i=0;i<40;i++){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0;}else{sdy+=ddy;my+=sy;side=1;}c=cell(mx,my);if(c!=='.'&&c!=='d')break;}
  const dist=Math.max(.05,side===0?sdx-ddx:sdy-ddy);zb[x]=dist;const h=HS/dist;let wx=side===0?vy+dist*ry:vx+dist*rx;wx-=Math.floor(wx);
  if((side===0&&rx<0)||(side===1&&ry>0))wx=1-wx;
  G.drawImage(texFor(c,mx,my,fl),Math.min(63,wx*64|0),0,1,64,x,(VH-h)/2,1,h);
  const sh=clamp(Math.round((dist/7+(side?.1:0))*20/.9),0,20);if(sh){G.fillStyle=SH[sh];G.fillRect(x,(VH-h)/2,1,h);}}
 const sp=[];
 for(const it of LS.items)sp.push([it.x+.5,it.y+.5,it.id==='or'?'or':'sac',.42,0]);
 for(const n of LV.npcs)if(!LS.gone[n.id])sp.push([n.x+.5,n.y+.5,n.spr,.84,0]);
 for(const m of LS.mons)if(m.hp>0){const mt=MON[m.t];sp.push([m.x+.5,m.y+.5,m.t,mt.sc*(m.atkT!=null&&S.T-m.atkT<180?1.12:1),m.flash&&S.T<m.flash?1:0]);}
 for(const s of sp)s[5]=(s[0]-vx)*(s[0]-vx)+(s[1]-vy)*(s[1]-vy);sp.sort((a,b)=>b[5]-a[5]);
 const inv=1/(pX*dY-dX*pY);
 for(const s of sp){const ax=s[0]-vx,ay=s[1]-vy,tX=inv*(dY*ax-dX*ay),tY=inv*(-pY*ax+pX*ay);if(tY<.25)continue;
  const wh=HS/tY,size=wh*s[3],top=VH/2+wh/2-size,left=VW/2*(1+tX/tY)-size/2,img=SPR[s[2]][s[4]?3:tY<2.6?0:tY<4.5?1:2];
  const x0=Math.max(0,Math.floor(left)),x1=Math.min(VW-1,Math.ceil(left+size)-1);let run=-1;
  for(let x=x0;x<=x1+1;x++){const vis=x<=x1&&zb[x]>tY;if(vis&&run<0)run=x;else if(!vis&&run>=0){
   const u0=clamp((run-left)/size*64,0,64),u1=clamp((x-left)/size*64,0,64);if(u1>u0)G.drawImage(img,u0,0,u1-u0,64,run,top,x-run,size);run=-1;}}}
 const now=performance.now();if(now-hurtT<220){G.fillStyle=`rgba(200,30,20,${.35*(1-(now-hurtT)/220)})`;G.fillRect(0,0,VW,VH);}
 G.font='bold 13px Verdana,sans-serif';G.textAlign='center';fx=fx.filter(f=>now-f.t0<750);
 for(const f of fx){const k=(now-f.t0)/750;G.fillStyle='#000';G.fillText(f.t,f.x+1,96-k*34+1);G.fillStyle=f.col;G.fillText(f.t,f.x,96-k*34);}
}

 if(S&&!paused()){S.T+=dt;tickMons();if(S.T-S.sfT>3000){S.sfT=S.T;let ch=false;for(const c of S.party)if(c.hp>0&&c.sf<c.sfM){c.sf++;ch=true;}if(ch)drawParty();}}
