<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kokolio — maquette de démonstration</title>
<meta name="robots" content="noindex">
<style>
/* Parti pris : le bleu du Centre Européen de Formation porte la pointeuse ; l'accueil et les en-têtes de blocs reprennent
   les tuiles carrées et les couleurs par domaine d'un portail RH (bleu : mon espace, vert : mon équipe, brique : RH). */
@font-face{font-family:"Bricolage Grotesque";src:url("/kokolio/fonts/bricolage-grotesque-latin-wght-normal.woff2") format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url("/kokolio/fonts/figtree-latin-wght-normal.woff2") format("woff2");font-weight:300 900;font-display:swap}
:root{
  --fond:#ffffff; --surface:#ffffff; --encre:#14171f; --discret:#586174; --trait:#d3d9e3;
  --accent:#0b4fd1; --accent-encre:#ffffff; --accent-doux:#e2ebfd;
  --bande:#ffffff; --bande-encre:#14171f; --bande-discret:#586174; --bande-trait:#d3d9e3;
  --hero:#0b4fd1; --hero-encre:#ffffff; --hero-discret:#c8d8fb; --hero-trait:rgba(255,255,255,.35);
  --f-bleu:#1c63d5; --f-bleu2:#17509f; --f-vert:#5f8a34; --f-vert2:#4a6d28; --f-brique:#b1502f; --f-brique2:#8b3d24; --f-nuit:#272b34;
  --ok:#1f6a35; --ok-doux:#dff2e4; --attente:#8a5200; --attente-doux:#fcefd5; --refus:#a8261c; --refus-doux:#fce5e2;
  --k-t:#cdebd4; --k-tt:#bfe4ee; --k-cp:#cbd8fa; --k-rtt:#e2d3f6; --k-am:#f8cbc4; --k-ab:#e8dfcb; --k-f:#f8e8a4; --k-we:#e6e9ef;
  --titre:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --corps:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --t-xs:.75rem; --t-s:.875rem; --t-l:1.2rem; --t-xl:1.6rem; --t-2xl:2.25rem;
  --ombre:0 1px 2px rgba(19,26,43,.07),0 8px 20px -12px rgba(19,26,43,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fond);color:var(--encre);font:400 1rem/1.5 var(--corps);padding-bottom:108px;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--titre);line-height:1.15}
h2{font-size:var(--t-xl);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:650}
.carte>h3:first-child,.eyebrow{font-family:var(--corps);font-size:var(--t-xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--discret)}
.carte>h3:first-child{background:var(--domaine,var(--f-bleu));color:#fff;margin:-18px -18px 4px;padding:10px 18px;border-radius:9px 9px 0 0}
main[data-espace="manager"]{--domaine:var(--f-vert2)} main[data-espace="rh"]{--domaine:var(--f-brique)} main[data-espace="admin"]{--domaine:var(--f-nuit)}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.discret{color:var(--discret);font-size:var(--t-s)}
strong{font-weight:650}

/* En-tête */
header.barre{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;background:var(--bande);color:var(--bande-encre);border-bottom:4px solid var(--accent)}
header.barre h1{font-size:1.6rem;font-weight:750;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
header.barre h1 small{font-family:var(--corps);font-size:var(--t-s);font-weight:500;letter-spacing:.02em;color:var(--bande-discret)}
header.barre .qui{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.05rem;font-weight:600}
header.barre .marque{display:flex;align-items:center;gap:14px}
.logo-h{height:52px;width:auto;display:block}
.logo-g{height:120px;width:auto;display:block;align-self:flex-start}
.carte>.logo-g{align-self:center}
.logo-p{height:64px;width:auto;display:block;margin:0 auto}
header.barre .pastille{font-size:var(--t-s);padding:4px 12px}
header.barre button{background:var(--accent);color:#fff;border-color:var(--accent);min-height:44px;padding:8px 18px;font-size:1.05rem;font-weight:650}
header.barre button.lien{border:0;background:none;color:var(--accent);padding:4px 2px;min-height:0}

main{max-width:1000px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
main.etroit{max-width:720px}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--ombre)}
.ligne{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.carte>.ligne>span:first-child{color:var(--discret)}
.carte>.ligne>.num{font-weight:650}
.pile{display:flex;flex-direction:column;gap:8px}
.grand{font-family:var(--titre);font-size:var(--t-2xl);font-weight:750;line-height:1.05;letter-spacing:-.02em}
.plus{color:var(--ok)} .moins{color:var(--refus)}

/* Boutons et champs */
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;border:1px solid var(--trait);background:var(--surface);padding:9px 14px;min-height:44px;font-weight:550}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.principal{background:var(--accent);color:var(--accent-encre);border-color:var(--accent);font-weight:650}
button.danger{color:var(--refus);border-color:color-mix(in srgb,var(--refus) 45%,var(--trait))}
a.bouton{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;text-decoration:none;border-radius:10px;background:var(--accent);color:var(--accent-encre);padding:11px 20px;min-height:46px;font-weight:650;font-size:1.05rem}
button.lien{border:0;background:none;padding:4px 2px;min-height:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
label{display:flex;flex-direction:column;gap:5px;font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--discret)}
label>*{color:var(--encre);font-size:1rem;font-weight:400;letter-spacing:0;text-transform:none}
label.coche{flex-direction:row;align-items:center;gap:6px;color:var(--encre);font-size:1rem;font-weight:400;letter-spacing:0;text-transform:none}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Bloc pointeuse */
.hero{background:var(--hero);color:var(--hero-encre);border-radius:14px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.hero .eyebrow{color:var(--hero-discret)}
.horloge{font-family:var(--titre);font-weight:800;font-size:clamp(4.2rem,24vw,6.5rem);line-height:.9;letter-spacing:-.04em}
.etat{align-self:center;display:inline-flex;align-items:center;gap:8px;font-size:var(--t-s);font-weight:600;color:var(--hero-discret)}
.etat::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--hero-discret)}
.etat.on{color:#d7ffe0}.etat.on::before{background:#6fe38d;box-shadow:0 0 0 4px rgba(87,210,122,.22)}
.hero button.geant{background:#fff;color:#0b3fa8;border:0;font-family:var(--titre);font-size:1.3rem;font-weight:750;padding:20px;min-height:76px;border-radius:10px;width:100%}
.hero button.geant:hover:not(:disabled){filter:brightness(1.06)}
.hero .grille2{text-align:left}
.hero label{color:var(--hero-discret)}
.hero select{background:transparent;color:var(--hero-encre);border-color:var(--hero-trait)}
.hero select option{color:#131a2b}
.hero .discret{color:var(--hero-discret)}
@media (prefers-reduced-motion:no-preference){.etat.on::before{animation:pouls 2.4s ease-in-out infinite}
  @keyframes pouls{50%{box-shadow:0 0 0 8px rgba(87,210,122,0)}} button{transition:border-color .15s,filter .15s}}

/* Chiffres clés */
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tuile{background:var(--surface);border:1px solid var(--trait);border-top:4px solid var(--domaine,var(--f-bleu));border-radius:8px;padding:14px;box-shadow:var(--ombre);display:flex;flex-direction:column;gap:2px;min-width:0}
.tuile>.discret:first-child{font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
main[data-espace="rh"] .tuile .v{color:var(--f-brique)}
.tuile .v{font-family:var(--titre);font-size:1.75rem;font-weight:750;letter-spacing:-.02em;line-height:1.15}

/* États */
.pastille{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:var(--t-xs);font-weight:700;white-space:nowrap;letter-spacing:.01em}
.p-ok{background:var(--ok-doux);color:var(--ok)}
.p-attente{background:var(--attente-doux);color:var(--attente)}
.p-refus{background:var(--refus-doux);color:var(--refus)}
.p-neutre{background:var(--accent-doux);color:var(--accent)}
.bandeau{border-left:4px solid var(--attente);background:var(--attente-doux);color:var(--encre);padding:12px 14px;border-radius:10px;font-size:var(--t-s)}
.bandeau strong{display:block;margin-bottom:2px}
.bandeau.refus{border-color:var(--refus);background:var(--refus-doux)}
.bandeau.info{border-color:var(--accent);background:var(--accent-doux)}

/* Listes de jours */
.jour{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--trait);align-items:baseline}
.jour:first-child{border-top:0;padding-top:2px}
.jour>div:nth-child(2){font-weight:650}
.jour .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.jour .actions button{min-height:38px;padding:6px 14px;font-size:var(--t-s)}
.jour .note{grid-column:1/-1}

/* Tableaux */
.table-zone{overflow-x:auto;margin:0 -6px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--trait);white-space:nowrap}
th{font-size:var(--t-xs);color:var(--discret);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
tbody tr:last-child td{border-bottom:0}
td.d,th.d{text-align:right} td.c,th.c{text-align:center}

/* Navigation */
nav.onglets{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:2px solid var(--trait);box-shadow:0 -6px 18px -12px rgba(19,26,43,.25);z-index:5;padding:0 4px}
nav.onglets button{flex:1;max-width:150px;border:0;border-radius:0;padding:9px 2px 10px;font-size:.95rem;font-weight:650;min-height:76px;background:none;color:var(--discret);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.onglets svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.onglets button[aria-current="page"]{color:var(--accent)}
nav.onglets button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.compte{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--refus);color:#fff;font-size:.7rem;font-weight:700;margin-left:4px}
nav.onglets .compte{position:absolute;top:5px;left:calc(50% + 6px);margin:0}
.sous{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sous button{white-space:nowrap;border-radius:999px;min-height:46px;padding:8px 18px;font-size:1.05rem}
.sous button[aria-current="page"]{background:var(--domaine,var(--encre));color:#fff;border-color:var(--domaine,var(--encre))}

/* Fenêtres */
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--encre);padding:20px;width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,14,25,.55)}
dialog form{display:flex;flex-direction:column;gap:14px}
dialog h2{font-size:var(--t-l)}
.heures-edit{display:flex;gap:8px;align-items:center}
#toast{position:fixed;left:16px;right:16px;bottom:120px;margin:auto;max-width:520px;background:var(--encre);color:var(--fond);padding:12px 16px;border-radius:12px;display:none;z-index:20;font-size:var(--t-s);font-weight:550;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}

/* Accueil */
.bienvenue h2{font-size:clamp(2rem,9vw,2.8rem);font-weight:800;letter-spacing:-.03em}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:560px}
button.mode{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;text-align:left;aspect-ratio:1;min-height:0;
  padding:14px;border:0;border-radius:6px;background:var(--f-bleu);color:#fff;font-weight:400;overflow:hidden}
button.mode:hover:not(:disabled){filter:brightness(1.08)}
button.mode svg{position:absolute;top:12px;left:12px;width:30%;height:30%;max-width:72px;max-height:72px;fill:none;stroke:#fff;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
button.mode strong{font-family:var(--titre);font-size:1.15rem;font-weight:700;line-height:1.1}
button.mode strong::after{content:"";display:block;width:34px;height:3px;border-radius:2px;background:rgba(255,255,255,.75);margin-top:7px}
button.mode span{font-size:var(--t-xs);color:rgba(255,255,255,.88);line-height:1.3}
button.mode.m-cadre{background:var(--f-bleu2)} button.mode.m-manager{background:var(--f-vert)} button.mode.m-rh{background:var(--f-brique)}
button.mode.m-admin{background:var(--f-nuit);grid-column:1/-1;aspect-ratio:auto;min-height:104px;padding-left:112px;justify-content:center}
button.mode.m-admin svg{top:50%;transform:translateY(-50%);width:70px;height:70px}
@media (min-width:700px){.modes{grid-template-columns:repeat(4,1fr);max-width:none}}
ul{margin:6px 0 12px;padding-left:20px} li{margin:3px 0}

/* Vue annuelle */
.annee{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px}
.moisbloc{background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--ombre)}
.moisbloc strong{font-family:var(--titre);font-size:1.05rem;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .ent{font-size:.66rem;font-weight:700;color:var(--discret);text-align:center}
.cal button{min-height:0;padding:2px 0;height:36px;border-radius:7px;border:1px solid transparent;font-size:.7rem;font-weight:500;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none}
.cal button b{font-size:.6rem;font-weight:800;letter-spacing:.02em}
.k-t{background:var(--k-t)!important} .k-tt{background:var(--k-tt)!important} .k-cp{background:var(--k-cp)!important} .k-rtt{background:var(--k-rtt)!important}
.k-am{background:var(--k-am)!important} .k-ab{background:var(--k-ab)!important} .k-f{background:var(--k-f)!important} .k-we{background:var(--k-we)!important;color:var(--discret)}
.cal button.k-an,.legende .k-an{border:2px solid var(--refus);color:var(--refus)}
.cal button.k-att,.legende .k-att,td.k-att{border:2px dashed var(--attente)}
.cal button.auj{outline:2px solid var(--encre);outline-offset:1px}
.legende{display:flex;flex-wrap:wrap;gap:6px}
.legende span{padding:4px 9px;border-radius:8px;font-size:var(--t-xs);font-weight:550;border:1px solid transparent}
.plan td button{min-height:46px;width:100%;padding:4px 6px;font-size:var(--t-xs);line-height:1.2}
@media (max-width:420px){.grille2{grid-template-columns:1fr 1fr}.tuiles{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<p style="margin:0;padding:8px 16px;background:#fcefd5;color:#5c3700;font:600 .9rem/1.4 system-ui,sans-serif;text-align:center">Maquette de démonstration (V4.3) : données fictives, rien n'est enregistré. <a href="/kokolio" style="color:#0b4fd1">Ouvrir Kokolio</a></p>
<header class="barre">
  <div class="marque"><span id="logo-h"></span><h1>Kokolio <small>Pointage et absences</small></h1></div>
  <div class="qui" id="qui"></div>
</header>
<main id="vue"><p class="discret">Chargement…</p></main>
<nav class="onglets" id="onglets" aria-label="Rubriques"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script src="/kokolio/demo/config.js"></script>
<script>
"use strict";
/* ================= Réglages et outils ================= */
const CFG = Object.assign({demo:true, rh:[], managerParDefaut:"", pauseMin:45, pauseSeuilH:6, cpParMois:2.08, forfaitJours:218, heuresAnnuelles:1607, teletravailMaxSemaine:2, cetMaxParAn:10,
  anciennete:[{ans:5,jours:1},{ans:10,jours:2},{ans:15,jours:3},{ans:20,jours:4}], alertes:{essai:30,cdd:60,visite:60}, toleranceRetardMin:10, notifications:false,
  motifs:["Congé payé","RTT","Arrêt maladie","Congé sans solde","Événement familial","Formation","Autre"],
  lieux:["Bureau","Télétravail","Déplacement"], activites:["Activité courante","Réunion","Formation","Rendez-vous extérieur"],
  modeles:[{nom:"Journée",debut:"09:00",fin:"17:00"},{nom:"Matin",debut:"07:00",fin:"14:00"},{nom:"Après-midi",debut:"13:00",fin:"20:00"},{nom:"Repos"}],
  silae:{heures:"HS-HN",absences:{"Congé payé":"AB-CP","RTT":"AB-RTT","Arrêt maladie":"AB-MAL","Congé sans solde":"AB-CSS","Événement familial":"AB-EVF","Formation":"AB-FORM","Autre":"AB-ABS"}}
}, window.POINTAGE_CONFIG||{});
const RH=(CFG.rh||[]).map(s=>String(s).toLowerCase());
const L_P="Pointages", L_A="Absences", L_S="Salaries", L_PL="Planning", L_C="Clotures", L_J="Journal";

function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat(Infinity)){
    if(c==null||c===false) continue;
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return e;
}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dateDe=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const plusJours=(s,n)=>{const d=dateDe(s);d.setDate(d.getDate()+n);return ymd(d)};
const toMin=s=>{const [a,b]=s.split(":").map(Number);return a*60+b};
const fmtMin=m=>{m=Math.round(m);return `${Math.floor(m/60)} h ${pad(m%60)}`};
const fmtEcart=m=>(m<0?"− ":"+ ")+fmtMin(Math.abs(m));
const today=()=>ymd(new Date());
const frJour=s=>dateDe(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const frCourt=s=>{const [y,m,d]=s.split("-");return `${d}/${m}/${y}`};
const frLong=d=>d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const frMois=m=>dateDe(m+"-01").toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
const decaleMois=(m,n)=>{const d=dateDe(m+"-01");d.setMonth(d.getMonth()+n);return ymd(d).slice(0,7)};
const finDuMois=m=>{const d=dateDe(m+"-01");return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))};
const lundiDe=s=>{const d=dateDe(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)};
const jsonDe=(s,def)=>{try{const v=JSON.parse(s||"");return v==null?def:v}catch(e){return def}};
function heuresDe(it){const a=jsonDe(it&&it.Heures,[]);return Array.isArray(a)?a.filter(x=>/^\d\d:\d\d$/.test(x)):[]}
function minutesDe(times, enCours){
  let t=0;
  for(let i=0;i+1<times.length;i+=2) t+=Math.max(0,toMin(times[i+1])-toMin(times[i]));
  if(enCours && times.length%2) t+=Math.max(0,toMin(hm(new Date()))-toMin(times[times.length-1]));
  return t;
}

    hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),
    mo=Math.floor((hh+l-7*m+114)/31),jo=((hh+l-7*m+114)%31)+1;
  const paques=ymd(new Date(y,mo-1,jo));

function heuresSemaine(f,j){ // cycle de plusieurs semaines, sinon horaire hebdomadaire de la fiche
  const d=det(f);

  }
  return +f.HeuresHebdo||35;
}
const theoJour=(f,j)=>forfait(f)||!estTravaille(f,j)?0:heuresSemaine(f,j)*60/joursTrav(f).size;
function anciennete(f){
  if(!f||!f.DateEntree) return null;
  const a=dateDe(f.DateEntree), b=new Date(); let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()-(b.getDate()<a.getDate()?1:0); if(m<0) m=0;
  return {ans:Math.floor(m/12),mois:m%12,total:m,texte:(Math.floor(m/12)?Math.floor(m/12)+" an"+(m>=24?"s":"")+" ":"")+(m%12)+" mois"};

}

/* Bilan d'une personne sur une période : heures, théorique, écart, anomalies, alertes légales */
function bilan(f, items, abs, debut, fin){
  const auj=today(), par={}; for(const it of items) par[it.Jour]=it;
  const r={trav:0,theo:0,ecart:0,jours:0,valides:0,attente:0,joursTheo:0,joursAbs:0,joursSubis:0,anomalies:[],alertes:[]};
  const semaines={}; let j=debut; const borne=fin<auj?fin:auj;
  while(j<=borne){
    const it=par[j], a=absLe(abs,j), times=it?heuresDe(it):[], ouvre=estTravaille(f,j);
    const complet=it&&times.length&&times.length%2===0;
    const m=it?minDe(it,f):0;
    if(it){r.trav+=m;r.jours++;if(it.Statut==="Valide")r.valides++;else r.attente++;
      const s=lundiDe(j);semaines[s]=(semaines[s]||0)+m;}
    if(ouvre){r.joursTheo++; if(a){const q=a.DemiJournee?0.5:1;r.joursAbs+=q;if(SUBIES(a.Motif))r.joursSubis+=q;}}
    if(j<auj||(j===auj&&complet)){
      const t=theoJour(f,j)*(a?(a.DemiJournee?0.5:0):1);
      r.theo+=t; r.ecart+=m-t;
    }
    if(j<auj&&ouvre&&!it&&!a) r.anomalies.push({jour:j,texte:"Aucun pointage ni absence"});
    if(it&&times.length%2===1&&j<auj) r.anomalies.push({jour:j,texte:"Départ non pointé"});
    if(it&&times.length){
      const mod=modeleLe(f.EmployeEmail,j);
      if(mod&&mod.debut){const ret=toMin(times[0])-toMin(mod.debut);if(ret>CFG.toleranceRetardMin) r.anomalies.push({jour:j,texte:"Retard de "+ret+" min (prévu "+mod.debut+")"});}
      if(m>600) r.alertes.push({jour:j,texte:"Plus de 10 h travaillées ("+fmtMin(m)+")"});
      const hier=par[plusJours(j,-1)], th=hier?heuresDe(hier):[];
      if(th.length&&th.length%2===0){const repos=1440-toMin(th[th.length-1])+toMin(times[0]);
        if(repos<660) r.alertes.push({jour:j,texte:"Repos de "+fmtMin(repos)+" seulement depuis la veille (minimum 11 h)"});}
    }
    j=plusJours(j,1);
  }
  for(const [s,m] of Object.entries(semaines)) if(m>2880) r.alertes.push({jour:s,texte:"Semaine de plus de 48 h ("+fmtMin(m)+")"});
  return r;
}

      "Content-Type":opt.type||"application/json",Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly"}});
    if(r.status===204||r.status===202) return null;
    const j=await r.json().catch(()=>null);
    if(!r.ok){
      const e=new Error(r.status===403?"Accès refusé. Demandez à être ajouté comme membre du site SharePoint.":
        (j&&j.error&&j.error.message)||("Erreur Microsoft "+r.status));
      e.status=r.status; throw e;
    }
    return j;
  }
  async function site(){
    if(!siteId) siteId=(await g(`/sites/${CFG.sharepointHost}:${CFG.sitePath}?$select=id`)).id;
    return siteId;
  }
  const q=s=>String(s).replace(/'/g,"''");
  return {
    demo:false,
    async start(){
      await charger("/kokolio/demo/msal-browser.min.js");
      pca=new msal.PublicClientApplication({
        auth:{clientId:CFG.clientId,authority:"https://login.microsoftonline.com/"+CFG.tenantId,redirectUri:location.origin+location.pathname},
        cache:{cacheLocation:"localStorage"}});
      await pca.initialize();
      const rep=await pca.handleRedirectPromise();
      compte=(rep&&rep.account)||pca.getActiveAccount()||pca.getAllAccounts()[0];
      if(!compte) return null;
      pca.setActiveAccount(compte);
      const moi={email:compte.username.toLowerCase(),name:compte.name||compte.username,managerEmail:""};
      try{
        const m=await g("/me/manager?$select=displayName,userPrincipalName");
        moi.managerEmail=(m.userPrincipalName||"").toLowerCase();
      }catch(e){ if(e.message==="redirection") throw e; }
      return moi;
    },
    async login(){await pca.loginRedirect({scopes:PORTEES})},
    async logout(){await pca.logoutRedirect({account:compte})},
    async query(list,f){
      const id=await site();
      const filtre=Object.entries(f||{}).map(([k,v])=>`fields/${k} eq '${q(v)}'`).join(" and ");
      let url=`/sites/${id}/lists/${list}/items?$expand=fields&$top=200`+(filtre?"&$filter="+encodeURIComponent(filtre):"");
      const out=[];
      while(url){const j=await g(url);for(const it of j.value) out.push({...it.fields,id:it.id});url=j["@odata.nextLink"]||null;}
      return out;
    },
    async add(list,fields){const id=await site();const it=await g(`/sites/${id}/lists/${list}/items`,{method:"POST",body:JSON.stringify({fields})});return {...it.fields,id:it.id}},
    async patch(list,idItem,fields){const id=await site();await g(`/sites/${id}/lists/${list}/items/${idItem}/fields`,{method:"PATCH",body:JSON.stringify(fields)})},
    async upload(file){
      const id=await site(); const nom=Date.now()+"-"+file.name.replace(/[^\w.\-]+/g,"_");
      const it=await g(`/sites/${id}/drive/root:/Justificatifs/${encodeURIComponent(nom)}:/content`,{method:"PUT",body:file,type:file.type||"application/octet-stream"});
      return {name:file.name,url:(it&&it.webUrl)||""};
    },
    async notify(a,sujet,texte){
      if(!CFG.notifications||!a) return "";
      await g("/me/sendMail",{method:"POST",body:JSON.stringify({message:{subject:sujet,body:{contentType:"Text",content:texte+"\n\n"+location.origin+location.pathname},
        toRecipients:[{emailAddress:{address:a}}]},saveToSentItems:false})});
      return "envoye";
    },
    async installer(){ // crée les listes manquantes ; réservé à un propriétaire du site
      const id=await site(); const P=["User.Read","Sites.Manage.All"];
      const txt=n=>({name:n,text:{},indexed:true}), long=n=>({name:n,text:{allowMultipleLines:true}}), nb=n=>({name:n,number:{}});
      const defs={
        [L_P]:[txt("EmployeEmail"),txt("EmployeNom"),txt("Jour"),txt("Mois"),long("Heures"),nb("Minutes"),txt("ManagerEmail"),txt("Statut"),txt("Corrige"),txt("Lieu"),txt("Activite"),long("Commentaire"),long("MotifRefus"),txt("ValidePar")],
        [L_A]:[txt("EmployeEmail"),txt("EmployeNom"),txt("Motif"),txt("Debut"),txt("Fin"),txt("DemiJournee"),nb("Jours"),long("Commentaire"),txt("ManagerEmail"),txt("Statut"),long("MotifRefus"),txt("ValidePar"),txt("JustificatifNom"),long("JustificatifUrl")],
        [L_S]:[txt("EmployeEmail"),txt("EmployeNom"),txt("Equipe"),txt("Contrat"),txt("DateEntree"),nb("HeuresHebdo"),txt("JoursTravailles"),nb("PauseMin"),nb("SoldeCP"),nb("SoldeRTT"),txt("Matricule"),txt("ManagerEmail"),txt("Delegue"),long("Details")],
        [L_PL]:[txt("EmployeEmail"),txt("ManagerEmail"),txt("Semaine"),long("Affectations")],
        [L_C]:[txt("Mois"),txt("Statut"),txt("CloturePar")],
        [L_J]:[txt("Date"),txt("Auteur"),txt("Action"),txt("Cible"),long("Detail")]
      };
      for(const [nom,columns] of Object.entries(defs)){
        try{await g(`/sites/${id}/lists/${nom}?$select=id`)}
        catch(e){ if(e.status!==404) throw e;
          await g(`/sites/${id}/lists`,{method:"POST",body:JSON.stringify({displayName:nom,columns,list:{template:"genericList"}})},P); }
      }
    }
  };
}

async function chargerEquipe(){
  const moi=S.moi.email;
  S.pour=[moi,...(await store.query(L_S,{Delegue:moi})).map(f=>f.EmployeEmail).filter(e=>e!==moi)];

      store.query(L_P,{ManagerEmail:m,Statut:"A valider"}),store.query(L_PL,{ManagerEmail:m})])));
    S.fiches=tout.flatMap(t=>t[0]).filter(f=>f.EmployeEmail!==moi);

async function demarrer(){
  try{S.moi=await store.start()}
  catch(e){ if(e.message==="redirection") return;
    pose(h("div",{class:"bandeau refus"},"Connexion Microsoft impossible : "+e.message)); return; }
  if(!S.moi){
    pose(h("div",{class:"carte",style:"text-align:center"},logo("logo-g"),h("h2",null,"Connectez-vous avec votre compte Microsoft"),
      h("p",{class:"discret"},"Utilisez votre compte professionnel habituel."),
      h("button",{class:"principal geant",onclick:ev=>agir(ev.currentTarget,()=>store.login())},"Se connecter avec Microsoft")));
    return;
  }
  S.estRH=RH.includes(S.moi.email); S.anQui=S.moi.email;
  enTete();
  try{
    const mesFiches=await store.query(L_S,{EmployeEmail:S.moi.email});
    S.fiche=mesFiches[0];
    if(!S.fiche) S.fiche=await store.add(L_S,ficheDefaut(S.moi.email,S.moi.name,S.moi.managerEmail||String(CFG.managerParDefaut||RH[0]||"").toLowerCase()));
    else if(S.moi.managerEmail&&S.fiche.ManagerEmail!==S.moi.managerEmail){await store.patch(L_S,S.fiche.id,{ManagerEmail:S.moi.managerEmail});S.fiche.ManagerEmail=S.moi.managerEmail;}
    S.moi.managerEmail=S.fiche.ManagerEmail||"";
    const m=today().slice(0,7), ml=lundiDe(today()).slice(0,7);
    [S.clotures,S.planMoi]=await Promise.all([store.query(L_C,{}),store.query(L_PL,{EmployeEmail:S.moi.email}),chargerMois(m),ml!==m?chargerMois(ml):null,chargerAbs()]);
    await chargerEquipe();
    if(forfait(S.fiche)||det(S.fiche).Organisation==="Annualisation"){const y=today().slice(0,4);
      const an=(await store.query(L_P,{EmployeEmail:S.moi.email})).filter(x=>x.Jour.slice(0,4)===y&&heuresDe(x).length);
      S.joursAn=an.length; S.cumul={min:an.reduce((t,x)=>t+minDe(x,S.fiche),0)};}
  }catch(e){
    if(e.message==="redirection") return;
    if(e.status===404&&!store.demo){ecranInstallation();return}
    pose(h("div",{class:"bandeau refus"},e.message)); return;
  }
  const memo=lireMode();
  if(memo&&modeDispo(memo).ok) entrer(memo); else afficher();
  setInterval(()=>{if(!S.accueil&&S.onglet==="pointer"&&!document.getElementById("dlg").open&&!["SELECT","INPUT"].includes(document.activeElement.tagName)) afficher()},30000);
}
function enTete(){

}

const CLE_MODE="pointage-mode";
function lireMode(){try{return sessionStorage.getItem(CLE_MODE)||""}catch(e){return ""}}

const MODES=[
  ["salarie","Salarié non cadre","Pointage arrivée et départ, compteur d'heures, congés et absences, vue annuelle."],
  ["cadre","Salarié cadre","Forfait jours : pointage, décompte des jours travaillés, repos légaux, congés."],

  ["rh","RH","Tous les salariés : fiches, soldes, clôture mensuelle, export Silae, journal."],

function modeDispo(m){
  if(store.demo) return {ok:true,note:m==="admin"?"":"Démonstration avec "+(demoConvient(m)?S.moi.name:store.gens.find(g=>g.email===store.roles[m]).name)};
  if(m==="salarie") return forfait(S.fiche)?{ok:false,note:"Votre fiche indique un forfait jours."}:{ok:true,note:""};
  if(m==="cadre") return forfait(S.fiche)?{ok:true,note:""}:{ok:false,note:"Votre fiche n'indique pas de forfait jours."};
  if(m==="manager") return S.estManager?{ok:true,note:""}:{ok:false,note:"Aucun salarié ne vous est rattaché."};
  return S.estRH?{ok:true,note:""}:{ok:false,note:"Réservé aux RH."};
}
const demoConvient=m=>m==="salarie"?!forfait(S.fiche):m==="cadre"?forfait(S.fiche):store.roles[m]===S.moi.email;
function entrer(m){
  if(store.demo&&m!=="admin"&&!demoConvient(m)){ecrireMode(m);store.changer(store.roles[m]);location.reload();return}
  ecrireMode(m); S.mode=m; S.accueil=false;
  S.onglet=m==="admin"?"admin":(m==="manager"||m==="rh")?"equipe":"pointer";
  if(m==="rh") S.sous="synthese"; if(m==="manager") S.sous="validation";
  afficher(); window.scrollTo(0,0);
}

function classer(f,jour,it,abs){
  const a=absLe(abs,jour), att=!a&&(absLe(abs,jour,["En attente"])||ttLe(abs,jour,["En attente"])), fer=ferieLe(jour), auj=today();
  if(a&&estTravaille(f,jour)){const [c,k]=codeAbs(a.Motif);return {code:a.DemiJournee?"½"+c:c,cls:k,texte:a.Motif+(a.DemiJournee?" ("+a.DemiJournee.toLowerCase()+")":""),cat:["CP","RTT","AM"].includes(c)?c:"AB"}}
  if(fer) return {code:"F",cls:"k-f",texte:"Férié : "+fer,cat:"F"};
  if(it){const tt=it.Lieu==="Télétravail";return {code:tt?"TT":"T",cls:tt?"k-tt":"k-t",texte:(tt?"Télétravail":"Travaillé")+" · "+paires(heuresDe(it))+" · "+fmtMin(minDe(it,f)),cat:tt?"TT":"T"}}
  if(!joursTrav(f).has(dateDe(jour).getDay())) return {code:"",cls:"k-we",texte:"Jour non travaillé",cat:""};
  if(att) return {code:"?",cls:"k-att",texte:att.Motif+" (demande en attente)",cat:"?"};
  if(jour<auj) return {code:"!",cls:"k-an",texte:"Aucun pointage ni absence",cat:"!"};
  if(ttLe(abs,jour)) return {code:"TT",cls:"k-tt",texte:"Télétravail prévu",cat:""};
  return {code:"",cls:"",texte:"À venir",cat:""};
}

      tuile("À régulariser",lignes.reduce((s,l)=>s+l.b.anomalies.length,0))),

        h("tbody",null,lignes.map(({f,b})=>h("tr",null,
          h("td",null,h("button",{class:"lien",onclick:()=>detailSalarie(f,b)},f.EmployeNom)),
          h("td",{class:"d num"},fmtMin(b.trav)),h("td",{class:"d num"},forfait(f)?"forfait":fmtMin(b.theo)),

        :h("p",{class:"discret"},"Aucun salarié rattaché."),

          ...S.synth.p.slice().sort((x,y)=>(x.EmployeNom+x.Jour).localeCompare(y.EmployeNom+y.Jour)).map(x=>[x.EmployeNom,ficheDe(x.EmployeEmail).Matricule||"",x.Jour,heuresDe(x).join(" "),dec(minDe(x,ficheDe(x.EmployeEmail))/60),x.Lieu||"",x.Activite||"",x.Statut,x.Corrige||"",x.Commentaire||""])])},"Pointages (CSV)"),
        h("button",{disabled:!S.synth.p.length,onclick:()=>{const t={};for(const x of S.synth.p){const k=x.EmployeNom+"|"+(x.Activite||"Non précisée");t[k]=(t[k]||0)+minDe(x,ficheDe(x.EmployeEmail));}
          csv("activites-"+m+".csv",[["Salarié","Activité","Heures (décimal)"],...Object.entries(t).sort().map(([k,v])=>[...k.split("|"),dec(v/60)])])}},"Temps par activité (CSV)"),
        h("button",{disabled:!absMois.length,onclick:()=>csv("absences-"+m+".csv",[["Salarié","Matricule","Motif","Début","Fin","Jours dans le mois","Validé par"],
          ...absMois.map(a=>[a.EmployeNom,ficheDe(a.EmployeEmail).Matricule||"",a.Motif,a.Debut,a.Fin,dec(joursAbsence(ficheDe(a.EmployeEmail),a,debut,fin)),a.ValidePar||""])])},"Absences (CSV)"),

function detailSalarie(f,b){

/* --- Effectifs et échéances --- */
function echeances(fiches){
  const auj=today(), A=CFG.alertes||{essai:30,cdd:60,visite:60}, out=[], dans=d=>Math.round((dateDe(d)-dateDe(auj))/864e5);
  for(const f of fiches){ const d=det(f); if(!estActif(f)) continue;
    if(d.FinPeriodeEssai){const n=dans(d.FinPeriodeEssai); if(n>=0&&n<=A.essai) out.push({f,date:d.FinPeriodeEssai,n,type:"Fin de période d'essai"})}
    if(d.DateFinContrat){const n=dans(d.DateFinContrat); if(n>=-30&&n<=A.cdd) out.push({f,date:d.DateFinContrat,n,type:"Fin de contrat ("+(d.TypeContrat||"CDD")+")"})}
    if(d.ProchaineVisite){const n=dans(d.ProchaineVisite); if(n<=A.visite) out.push({f,date:d.ProchaineVisite,n,type:"Visite médicale"})}
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function vueEffectifs(barre){
  const an=today().slice(0,4), tous=S.fiches.filter(f=>S.estRH||f.EmployeEmail!==S.moi.email), actifs=tous.filter(estActif), ech=echeances(tous);
  const par=(cle,def)=>{const m={};for(const f of actifs){const k=cle(f)||def;m[k]=(m[k]||0)+1}return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const etp=f=>forfait(f)?1:Math.min(1,(+f.HeuresHebdo||35)/35);
  const anc=actifs.map(anciennete).filter(Boolean), ancMoy=anc.length?anc.reduce((t,a)=>t+a.total,0)/anc.length:0;
  const entrees=tous.filter(f=>(f.DateEntree||"").slice(0,4)===an).length, sorties=tous.filter(f=>{const d=det(f).DateSortie;return d&&d.slice(0,4)===an&&d<today()}).length;
  const repart=(titre,liste)=>h("div",{class:"carte"},h("h3",null,titre),liste.map(([k,n])=>h("div",{class:"ligne"},h("span",null,k),h("span",{class:"num"},n+" · "+Math.round(n/actifs.length*100)+" %"))));
  const equipes={}; for(const f of actifs){const k=f.Equipe||"Sans équipe";equipes[k]=equipes[k]||{n:0,etp:0};equipes[k].n++;equipes[k].etp+=etp(f)}
  pose(barre,
    h("div",{class:"tuiles"},stat("Effectif",actifs.length,"salariés présents"),stat("Équivalent temps plein",dec(actifs.reduce((t,f)=>t+etp(f),0)),"base 35 h"),
      stat("Entrées "+an,entrees),stat("Sorties "+an,sorties),stat("Ancienneté moyenne",Math.floor(ancMoy/12)+" ans "+Math.round(ancMoy%12)+" mois"),stat("Échéances",ech.length,"à traiter")),
    h("div",{class:"carte"},h("h3",null,"Échéances à venir"),
      ech.length?h("div",null,ech.map(e=>h("div",{class:"jour"},
        h("div",null,h("strong",null,e.f.EmployeNom)," · "+e.type),
        h("div",null,h("span",{class:"pastille "+(e.n<0?"p-refus":e.n<=15?"p-attente":"p-neutre")},e.n<0?"En retard de "+(-e.n)+" j":e.n===0?"Aujourd'hui":"Dans "+e.n+" j")),
        h("div",{class:"discret note"},"Le "+frJour(e.date)+" "+e.date.slice(0,4)+(e.type.startsWith("Fin de période")&&det(e.f).EssaiRenouvele==="Oui"?" · période déjà renouvelée":"")),
        h("div",{class:"actions"},h("button",{onclick:()=>S.estRH?editerFiche(e.f):voirFiche(e.f)},S.estRH?"Ouvrir la fiche":"Voir la fiche")))))
      :h("p",{class:"discret"},"Aucune échéance dans les prochaines semaines."),
      h("p",{class:"discret"},"Périodes d'essai sous "+CFG.alertes.essai+" jours, fins de contrat sous "+CFG.alertes.cdd+" jours, visites médicales sous "+CFG.alertes.visite+" jours ou en retard.")),
    actifs.length?[repart("Par type de contrat",par(f=>det(f).TypeContrat,"CDI")),repart("Par catégorie",par(f=>det(f).Categorie,"Non renseignée")),
      h("div",{class:"carte"},h("h3",null,"Par équipe"),Object.entries(equipes).sort().map(([k,v])=>h("div",{class:"ligne"},h("span",null,k),h("span",{class:"num"},v.n+" salarié(s) · "+dec(v.etp)+" ETP"))))]:null);
}

/* --- Fiches salariés --- */
// Les clés précédées de * sont des colonnes de la liste ; les autres sont rangées dans la colonne Details.
const CHAMPS=[
  ["Identité",[["Civilite","Civilité","select",["","Mme","M."]],["DateNaissance","Date de naissance","date"],["Telephone","Téléphone","tel"],["EmailPerso","E-mail personnel","email"],["Adresse","Adresse","text"],["ContactUrgence","Personne à prévenir (nom et téléphone)","text"]]],
  ["Poste",[["Poste","Intitulé du poste","text"],["Categorie","Catégorie","select",["","Employé","Agent de maîtrise","Cadre"]],["*Equipe","Équipe","text"],["Etablissement","Établissement","text"],["*Matricule","Matricule de paie (Silae)","text"],["*ManagerEmail","Responsable (identifiant Microsoft)","email"]]],
  ["Contrat",[["TypeContrat","Type de contrat","select",["CDI","CDD","Alternance","Stage","Intérim"]],["*DateEntree","Date d'entrée","date"],["FinPeriodeEssai","Fin de la période d'essai","date"],["EssaiRenouvele","Période d'essai renouvelée","select",["Non","Oui"]],["DateFinContrat","Fin de contrat (CDD, alternance, stage)","date"],["MotifCDD","Motif du CDD","text"],["DateSortie","Date de sortie","date"],["MotifSortie","Motif de sortie","text"]]],
  ["Temps de travail",[["*Contrat","Régime","select",["Horaire","Temps partiel","Forfait jours"]],["*HeuresHebdo","Heures par semaine (moyenne)","number"],["*PauseMin","Pause déduite (min)","number"],["Organisation","Organisation du temps","select",["Hebdomadaire","Cycle","Annualisation"]],["CycleHeures","Cycle : heures de chaque semaine (ex. 39/31)","text"],["CycleDebut","Cycle : lundi de départ","date"],["HeuresAnnuelles","Annualisation : heures par an","number"],["TeletravailMax","Télétravail : jours maximum par semaine","number"]]],
  ["Congés",[["*SoldeCP","Report de CP au 1er janvier (j)","number"],["*SoldeRTT","Droits RTT de l'année (j)","number"],["SoldeCET","Solde initial du CET (j)","number"]]],
  ["Santé au travail",[["TypeSuivi","Suivi médical","select",["Simple","Renforcé","Adapté"]],["DerniereVisite","Dernière visite médicale","date"],["ProchaineVisite","Prochaine visite médicale","date"]]]];
const valeurFiche=(f,cle)=>{const v=cle[0]==="*"?f[cle.slice(1)]:det(f)[cle];return v==null?"":v};
const JOURS_SEM=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
function voirFiche(f){
  const anc=anciennete(f), set=joursTrav(f);
  ouvrir("Fiche de "+f.EmployeNom,h("div",{class:"pile"},
    anc?h("p",{class:"discret"},"Ancienneté : "+anc.texte+(joursAnciennete(f)?" · "+joursAnciennete(f)+" j de congé d'ancienneté":"")):null,
    CHAMPS.map(([titre,liste])=>h("div",{class:"pile"},h("p",{class:"eyebrow"},titre),
      liste.map(([cle,lab,type])=>{let v=valeurFiche(f,cle); if(v===""||v===0&&type!=="number") return null; if(type==="date") v=frCourt(String(v));
        return h("div",{class:"ligne"},h("span",{class:"discret"},lab),h("span",{class:"num"},v))}),
      titre==="Temps de travail"?h("div",{class:"ligne"},h("span",{class:"discret"},"Jours travaillés"),h("span",null,JOURS_SEM.filter((n,i)=>set.has((i+1)%7)).join(", "))):null)),
    h("p",{class:"discret"},"Pour corriger une information, adressez-vous aux RH.")));
}
function vueSalaries(barre){
  const liste=S.fiches.filter(f=>S.estRH||f.EmployeEmail!==S.moi.email);
  pose(barre,h("div",{class:"carte"},
    h("p",{class:"discret"},S.estRH?"Touchez un nom pour compléter ou modifier sa fiche. Une fiche se crée à la première connexion du salarié.":"Touchez un nom pour consulter sa fiche (modifiable par les RH)."),
    liste.length?h("div",{class:"table-zone"},h("table",{style:"min-width:980px"},
      h("thead",null,h("tr",null,h("th",null,"Salarié"),h("th",null,"Poste"),h("th",null,"Équipe"),h("th",null,"Contrat"),h("th",null,"Régime"),h("th",{class:"d"},"H/sem."),h("th",null,"Entrée"),h("th",null,"Ancienneté"),h("th",{class:"d"},"CP"),h("th",{class:"d"},"RTT"),h("th",{class:"d"},"CET"))),
      h("tbody",null,liste.map(f=>{const s=soldes(f,S.absEquipe.filter(a=>a.EmployeEmail===f.EmployeEmail)), d=det(f), anc=anciennete(f);
        return h("tr",null,h("td",null,h("button",{class:"lien",onclick:()=>S.estRH?editerFiche(f):voirFiche(f)},f.EmployeNom),estActif(f)?null:h("span",{class:"pastille p-neutre",style:"margin-left:6px"},"Sorti")),
          h("td",null,d.Poste||"—"),h("td",null,f.Equipe||"—"),h("td",null,d.TypeContrat||"CDI"),h("td",null,f.Contrat||"—"),
          h("td",{class:"d num"},forfait(f)?"—":f.HeuresHebdo),h("td",{class:"num"},f.DateEntree?frCourt(f.DateEntree):"—"),h("td",null,anc?anc.texte:"—"),
          h("td",{class:"d num"},s.cpReste),h("td",{class:"d num"},s.rttDroit?s.rttReste:"—"),h("td",{class:"d num"},s.cet||"—"))})))):h("p",{class:"discret"},"Aucune fiche.")));
}
function editerFiche(f){
  const champs={}, set=joursTrav(f);
  const coches=JOURS_SEM.map((n,i)=>{const v=(i+1)%7;return [v,h("input",{type:"checkbox",id:"f-j"+v,checked:set.has(v)}),n]});
  const corps=h("div",{class:"pile"},CHAMPS.map(([titre,liste])=>h("div",{class:"pile"},h("p",{class:"eyebrow",style:"margin-top:6px"},titre),
    liste.map(([cle,lab,type,opts])=>{const id="f-"+cle.replace("*",""), v=valeurFiche(f,cle);
      const i=type==="select"?h("select",{id},opts.map(o=>h("option",{value:o,selected:String(v)===o},o||"—"))):h("input",{id,type,value:v,step:type==="number"?"0.5":null});
      champs[cle]=[i,type]; return h("label",null,lab,i)}),
    titre==="Temps de travail"?h("div",null,h("div",{class:"discret"},"Jours travaillés"),h("div",{class:"ligne",style:"justify-content:flex-start"},coches.map(([v,c,n])=>h("label",{class:"coche"},c,n)))):null)));
  ouvrir("Fiche de "+f.EmployeNom,corps,"Enregistrer",async()=>{
    const jt=coches.filter(([v,c])=>c.checked).map(([v])=>v); if(!jt.length) throw new Error("Cochez au moins un jour travaillé.");
    const cols={JoursTravailles:jt.join(",")}, d={...det(f)};
    for(const [cle,[i,type]] of Object.entries(champs)){ let v=i.value.trim(); if(type==="number") v=v===""?"":+v.replace(",",".");
      if(cle[0]==="*"){const k=cle.slice(1); cols[k]=type==="number"?(v===""?0:v):(k==="ManagerEmail"?v.toLowerCase():v)} else if(v===""||v==null) delete d[cle]; else d[cle]=v; }
    if(!cols.HeuresHebdo) cols.HeuresHebdo=35;
    if(d.DateFinContrat&&cols.DateEntree&&d.DateFinContrat<cols.DateEntree) throw new Error("La fin de contrat précède la date d'entrée.");
    cols.Details=JSON.stringify(d);
    await store.patch(L_S,f.id,cols); Object.assign(f,cols); if(f.EmployeEmail===S.moi.email) Object.assign(S.fiche,cols);
    await journal("Modification de fiche",f.EmployeNom,"Fiche mise à jour");
    S.synth=null; afficher(); toast("Fiche enregistrée.");
  });
}

/* --- Journal --- */
function vueJournal(barre){
  if(!S.journal){
    pose(barre,h("p",{class:"discret"},"Chargement…"));
    store.query(L_J,{}).then(j=>{S.journal=j.sort((a,b)=>String(b.Date).localeCompare(String(a.Date))).slice(0,200);if(S.onglet==="equipe"&&S.sous==="journal") afficher()})

  }
  pose(barre,h("div",{class:"carte"},h("p",{class:"discret"},"Les 200 dernières actions : validations, refus, corrections, fiches, clôtures."),
    S.journal.length?h("div",null,S.journal.map(j=>h("div",{class:"jour"},
      h("div",null,h("strong",null,j.Action)," · "+(j.Cible||"")),
      h("div",{class:"num discret"},new Date(j.Date).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})),
