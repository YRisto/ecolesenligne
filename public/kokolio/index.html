<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<style>
/* Mise en page : une colonne façon feuille de présence, navigation en bas sur téléphone. */
:root{
  --fond:#f2f4f1; --surface:#ffffff; --encre:#17212b; --discret:#5b6672; --trait:#d9dfdc;
  --accent:#0c6b5d; --accent-encre:#ffffff; --accent-doux:#e0efec;
  --ok:#256b2c; --ok-doux:#e2f1e3; --attente:#8a5200; --attente-doux:#fbeed6; --refus:#a8261c; --refus-doux:#fbe4e1;
  --k-t:#cfe8d2; --k-tt:#bfe3ea; --k-cp:#c9d8f7; --k-rtt:#e0d0f3; --k-am:#f6c9c2; --k-ab:#e6dcc8; --k-f:#f7e7a6; --k-we:#e9ecea;
  --corps:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --chiffres:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fond:#11171b; --surface:#1a2228; --encre:#e8edeb; --discret:#9aa6ad; --trait:#2d3940;
    --accent:#4fbfaa; --accent-encre:#06221d; --accent-doux:#17332f;
    --ok:#7fce86; --ok-doux:#173220; --attente:#f0b65a; --attente-doux:#3a2a0e; --refus:#f08a80; --refus-doux:#3d1a17;
    --k-t:#1f4a29; --k-tt:#17474f; --k-cp:#253c6e; --k-rtt:#43306a; --k-am:#6a2a24; --k-ab:#4d4330; --k-f:#5c4f12; --k-we:#232c32;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fond:#11171b; --surface:#1a2228; --encre:#e8edeb; --discret:#9aa6ad; --trait:#2d3940;
  --accent:#4fbfaa; --accent-encre:#06221d; --accent-doux:#17332f;
  --ok:#7fce86; --ok-doux:#173220; --attente:#f0b65a; --attente-doux:#3a2a0e; --refus:#f08a80; --refus-doux:#3d1a17;
  --k-t:#1f4a29; --k-tt:#17474f; --k-cp:#253c6e; --k-rtt:#43306a; --k-am:#6a2a24; --k-ab:#4d4330; --k-f:#5c4f12; --k-we:#232c32;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fond);color:var(--encre);font:16px/1.45 var(--corps);padding-bottom:84px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:1.05rem;font-weight:700;letter-spacing:.01em}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0}
.num{font-family:var(--chiffres);font-variant-numeric:tabular-nums}
.discret{color:var(--discret);font-size:.9rem}
header.barre{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--trait)}
header.barre .qui{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}

main{max-width:980px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
main.etroit{max-width:760px}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ligne{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pile{display:flex;flex-direction:column;gap:8px}
.grand{font-size:2.4rem;font-weight:700;line-height:1.1}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:8px;border:1px solid var(--trait);background:var(--surface);padding:9px 14px;min-height:42px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.principal{background:var(--accent);color:var(--accent-encre);border-color:var(--accent);font-weight:600}
button.geant{width:100%;font-size:1.2rem;padding:20px;min-height:72px}
button.danger{color:var(--refus);border-color:var(--refus)}
button.lien{border:0;background:none;padding:4px 2px;min-height:0;color:var(--accent);text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--trait);border-radius:8px;padding:9px 10px;min-height:42px}
input[type=checkbox]{width:auto;min-height:0}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--discret)}
label>*{color:var(--encre);font-size:1rem}
label.coche{flex-direction:row;align-items:center;gap:6px;color:var(--encre)}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.jour{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--trait)}

.bandeau{border-left:4px solid var(--attente);background:var(--attente-doux);color:var(--encre);padding:10px 12px;border-radius:6px;font-size:.92rem}
.bandeau.refus{border-color:var(--refus);background:var(--refus-doux)}
.bandeau.info{border-color:var(--accent);background:var(--accent-doux)}
.table-zone{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--trait);white-space:nowrap}
th{font-size:.8rem;color:var(--discret);font-weight:600}
td.d,th.d{text-align:right}
td.c,th.c{text-align:center}
.plus{color:var(--ok)} .moins{color:var(--refus)}
nav.onglets{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--trait);z-index:5}
nav.onglets button{flex:1;border:0;border-radius:0;border-top:3px solid transparent;padding:12px 2px;font-size:.82rem;min-height:60px;background:none}
nav.onglets button[aria-current="page"]{border-top-color:var(--accent);color:var(--accent);font-weight:700}
.compte{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--refus);color:#fff;font-size:.72rem;margin-left:4px}
.sous{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sous button{white-space:nowrap;border-radius:999px;min-height:38px;padding:6px 14px}
.sous button[aria-current="page"]{background:var(--accent);color:var(--accent-encre);border-color:var(--accent);font-weight:600}
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tuile{background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:12px}
.tuile .v{font-size:1.7rem;font-weight:700}
dialog{border:1px solid var(--trait);border-radius:12px;background:var(--surface);color:var(--encre);padding:18px;width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;gap:12px}
.heures-edit{display:flex;gap:8px;align-items:center}
#toast{position:fixed;left:16px;right:16px;bottom:96px;margin:auto;max-width:520px;background:var(--encre);color:var(--fond);padding:12px 14px;border-radius:8px;display:none;z-index:20}
/* Vue annuelle */
.annee{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.moisbloc{background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .ent{font-size:.68rem;color:var(--discret);text-align:center}
.cal button{min-height:0;padding:2px 0;height:34px;border-radius:5px;border:1px solid transparent;font-size:.68rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none}
.cal button b{font-size:.62rem;font-weight:700}
.k-t{background:var(--k-t)!important} .k-tt{background:var(--k-tt)!important} .k-cp{background:var(--k-cp)!important} .k-rtt{background:var(--k-rtt)!important}
.k-am{background:var(--k-am)!important} .k-ab{background:var(--k-ab)!important} .k-f{background:var(--k-f)!important} .k-we{background:var(--k-we)!important;color:var(--discret)}
.cal button.k-an,.legende .k-an{border:2px solid var(--refus);color:var(--refus)}
.cal button.k-att,.legende .k-att,td.k-att{border:2px dashed var(--attente)}
.cal button.auj{outline:2px solid var(--encre);outline-offset:1px}

.legende span{padding:3px 8px;border-radius:6px;font-size:.8rem;border:1px solid transparent}
.plan td button{min-height:44px;width:100%;padding:4px 6px;font-size:.8rem;line-height:1.2}
@media (max-width:420px){.grille2{grid-template-columns:1fr}.grand{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s}}

<body>
<header class="barre">
  <h1>Pointage et absences</h1>
  <div class="qui" id="qui"></div>
</header>
<main id="vue"><p class="discret">Chargement…</p></main>
<nav class="onglets" id="onglets" aria-label="Rubriques"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script src="/kokolio/config.js"></script>
<script>
"use strict";
/* ================= Réglages et outils ================= */
const CFG = Object.assign({demo:true, rh:[], managerParDefaut:"", pauseMin:45, pauseSeuilH:6, cpParMois:2.08, toleranceRetardMin:10, notifications:false,
  motifs:["Congé payé","RTT","Arrêt maladie","Congé sans solde","Événement familial","Formation","Autre"],
  lieux:["Bureau","Télétravail","Déplacement"], activites:["Activité courante","Réunion","Formation","Rendez-vous extérieur"],
  modeles:[{nom:"Journée",debut:"09:00",fin:"17:00"},{nom:"Matin",debut:"07:00",fin:"14:00"},{nom:"Après-midi",debut:"13:00",fin:"20:00"},{nom:"Repos"}],
  silae:{heures:"HS-HN",absences:{"Congé payé":"AB-CP","RTT":"AB-RTT","Arrêt maladie":"AB-MAL","Congé sans solde":"AB-CSS","Événement familial":"AB-EVF","Formation":"AB-FORM","Autre":"AB-ABS"}}
}, window.POINTAGE_CONFIG||{});
const RH=(CFG.rh||[]).map(s=>String(s).toLowerCase());
const L_P="Pointages", L_A="Absences", L_S="Salaries", L_PL="Planning", L_C="Clotures", L_J="Journal";

function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat(Infinity)){
    if(c==null||c===false) continue;
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return e;
}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dateDe=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const plusJours=(s,n)=>{const d=dateDe(s);d.setDate(d.getDate()+n);return ymd(d)};
const toMin=s=>{const [a,b]=s.split(":").map(Number);return a*60+b};
const fmtMin=m=>{m=Math.round(m);return `${Math.floor(m/60)} h ${pad(m%60)}`};
const fmtEcart=m=>(m<0?"− ":"+ ")+fmtMin(Math.abs(m));
const today=()=>ymd(new Date());
const frJour=s=>dateDe(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const frCourt=s=>{const [y,m,d]=s.split("-");return `${d}/${m}/${y}`};
const frLong=d=>d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const frMois=m=>dateDe(m+"-01").toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
const decaleMois=(m,n)=>{const d=dateDe(m+"-01");d.setMonth(d.getMonth()+n);return ymd(d).slice(0,7)};
const finDuMois=m=>{const d=dateDe(m+"-01");return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))};
const lundiDe=s=>{const d=dateDe(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)};
const jsonDe=(s,def)=>{try{const v=JSON.parse(s||"");return v==null?def:v}catch(e){return def}};
function heuresDe(it){const a=jsonDe(it&&it.Heures,[]);return Array.isArray(a)?a.filter(x=>/^\d\d:\d\d$/.test(x)):[]}
function minutesDe(times, enCours){
  let t=0;
  for(let i=0;i+1<times.length;i+=2) t+=Math.max(0,toMin(times[i+1])-toMin(times[i]));
  if(enCours && times.length%2) t+=Math.max(0,toMin(hm(new Date()))-toMin(times[times.length-1]));
  return t;
}
function paires(times){const out=[];for(let i=0;i<times.length;i+=2) out.push(times[i]+" → "+(times[i+1]||"…"));return out.join("  ·  ")}

/* Jours fériés français (métropole) */
const cacheFeries={};
function feries(y){
  if(cacheFeries[y]) return cacheFeries[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),
    mo=Math.floor((hh+l-7*m+114)/31),jo=((hh+l-7*m+114)%31)+1;
  const paques=ymd(new Date(y,mo-1,jo));
  const map={[y+"-01-01"]:"Jour de l'an",[plusJours(paques,1)]:"Lundi de Pâques",[y+"-05-01"]:"Fête du travail",[y+"-05-08"]:"Victoire 1945",
    [plusJours(paques,39)]:"Ascension",[plusJours(paques,50)]:"Lundi de Pentecôte",[y+"-07-14"]:"Fête nationale",[y+"-08-15"]:"Assomption",
    [y+"-11-01"]:"Toussaint",[y+"-11-11"]:"Armistice",[y+"-12-25"]:"Noël"};
  return cacheFeries[y]=map;
}
const ferieLe=j=>feries(+j.slice(0,4))[j]||"";

/* Fiche salarié : horaire théorique */
function ficheDefaut(email,nom,manager){return {Title:nom,EmployeEmail:email,EmployeNom:nom,Equipe:"",Contrat:"Horaire",DateEntree:"",HeuresHebdo:35,
  JoursTravailles:"1,2,3,4,5",PauseMin:CFG.pauseMin,SoldeCP:0,SoldeRTT:0,Matricule:"",ManagerEmail:manager||"",Delegue:""}}
const joursTrav=f=>new Set(String((f&&f.JoursTravailles)||"1,2,3,4,5").split(",").map(Number));
const estTravaille=(f,j)=>joursTrav(f).has(dateDe(j).getDay())&&!ferieLe(j);
const forfait=f=>f&&f.Contrat==="Forfait jours";
const theoJour=(f,j)=>forfait(f)||!estTravaille(f,j)?0:(+f.HeuresHebdo||35)*60/joursTrav(f).size;
const pauseDe=f=>f&&f.PauseMin!==""&&f.PauseMin!=null?+f.PauseMin:CFG.pauseMin;
function netMin(times,f,enCours){
  const brut=minutesDe(times,enCours);
  return times.length===2&&brut>CFG.pauseSeuilH*60?Math.max(0,brut-pauseDe(f)):brut;
}
const minDe=(it,f)=>f?netMin(heuresDe(it),f,it.Jour===today()):(+it.Minutes||0);
const absLe=(liste,j,statuts)=>liste.find(a=>(statuts||["Valide"]).includes(a.Statut)&&a.Debut<=j&&a.Fin>=j);
function joursAbsence(f,a,min,max){
  if(a.DemiJournee) return (!min||a.Debut>=min)&&(!max||a.Debut<=max)&&estTravaille(f,a.Debut)?0.5:0;
  let j=min&&min>a.Debut?min:a.Debut; const fin=max&&max<a.Fin?max:a.Fin; let n=0;
  while(j<=fin){if(estTravaille(f,j)) n++; j=plusJours(j,1);}
  return n;
}
const CODE_ABS={"Congé payé":["CP","k-cp"],"RTT":["RTT","k-rtt"],"Arrêt maladie":["AM","k-am"],"Maladie":["AM","k-am"]};
const codeAbs=m=>CODE_ABS[m]||["AB","k-ab"];
const SUBIES=m=>!["Congé payé","RTT","Formation"].includes(m);

/* Bilan d'une personne sur une période : heures, théorique, écart, anomalies, alertes légales */
function bilan(f, items, abs, debut, fin){
  const auj=today(), par={}; for(const it of items) par[it.Jour]=it;
  const r={trav:0,theo:0,ecart:0,jours:0,valides:0,attente:0,joursTheo:0,joursAbs:0,joursSubis:0,anomalies:[],alertes:[]};
  const semaines={}; let j=debut; const borne=fin<auj?fin:auj;
  while(j<=borne){
    const it=par[j], a=absLe(abs,j), times=it?heuresDe(it):[], ouvre=estTravaille(f,j);
    const complet=it&&times.length&&times.length%2===0;
    const m=it?minDe(it,f):0;
    if(it){r.trav+=m;r.jours++;if(it.Statut==="Valide")r.valides++;else r.attente++;
      const s=lundiDe(j);semaines[s]=(semaines[s]||0)+m;}
    if(ouvre){r.joursTheo++; if(a){const q=a.DemiJournee?0.5:1;r.joursAbs+=q;if(SUBIES(a.Motif))r.joursSubis+=q;}}
    if(j<auj||(j===auj&&complet)){
      const t=theoJour(f,j)*(a?(a.DemiJournee?0.5:0):1);
      r.theo+=t; r.ecart+=m-t;
    }
    if(j<auj&&ouvre&&!it&&!a) r.anomalies.push({jour:j,texte:"Aucun pointage ni absence"});
    if(it&&times.length%2===1&&j<auj) r.anomalies.push({jour:j,texte:"Départ non pointé"});
    if(it&&times.length){
      const mod=modeleLe(f.EmployeEmail,j);
      if(mod&&mod.debut){const ret=toMin(times[0])-toMin(mod.debut);if(ret>CFG.toleranceRetardMin) r.anomalies.push({jour:j,texte:"Retard de "+ret+" min (prévu "+mod.debut+")"});}
      if(m>600) r.alertes.push({jour:j,texte:"Plus de 10 h travaillées ("+fmtMin(m)+")"});
      const hier=par[plusJours(j,-1)], th=hier?heuresDe(hier):[];
      if(th.length&&th.length%2===0){const repos=1440-toMin(th[th.length-1])+toMin(times[0]);
        if(repos<660) r.alertes.push({jour:j,texte:"Repos de "+fmtMin(repos)+" seulement depuis la veille (minimum 11 h)"});}
    }
    j=plusJours(j,1);
  }
  for(const [s,m] of Object.entries(semaines)) if(m>2880) r.alertes.push({jour:s,texte:"Semaine de plus de 48 h ("+fmtMin(m)+")"});
  return r;
}

let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",5000)}
async function agir(btn, fn){
  if(btn) btn.disabled=true;
  try{await fn()}catch(e){if(e&&e.message!=="redirection") toast(e.message||"Une erreur est survenue. Réessayez.")}
  finally{if(btn) btn.disabled=false}
}
function pastille(statut){
  const map={"Valide":["Validé","p-ok"],"A valider":["À valider","p-attente"],"En attente":["En attente","p-attente"],
    "Refuse":["Refusé","p-refus"],"Annule":["Annulé","p-neutre"]};
  const [txt,cls]=map[statut]||[statut||"—","p-neutre"];
  return h("span",{class:"pastille "+cls},txt);
}
function ouvrir(titre, corps, libelleOk, surOk){
  const dlg=document.getElementById("dlg");
  dlg.replaceChildren();
  const err=h("p",{class:"bandeau refus",hidden:true});
  const ok=libelleOk?h("button",{class:"principal",type:"submit"},libelleOk):null;
  const form=h("form",{method:"dialog",onsubmit:async ev=>{
    ev.preventDefault(); if(!ok) return; ok.disabled=true; err.hidden=true;
    try{await surOk(); dlg.close()}catch(e){err.textContent=e.message||"Erreur";err.hidden=false}
    finally{ok.disabled=false}
  }}, h("h2",null,titre), corps, err,
    h("div",{class:"ligne"}, h("button",{type:"button",onclick:()=>dlg.close()},ok?"Annuler":"Fermer"), ok));
  dlg.append(form); dlg.showModal();
}

/* ================= Stockage : démonstration ================= */
function magasinDemo(){
  const CLE="pointage-demo-v2";
  const G=[["camille.martin@demo.fr","Camille Martin","julien.bernard@demo.fr","Admissions",35,"1,2,3,4,5","0012"],
    ["thomas.petit@demo.fr","Thomas Petit","julien.bernard@demo.fr","Admissions",35,"1,2,3,4,5","0027"],

/* ================= Stockage : Microsoft 365 ================= */
function magasinMicrosoft(){
  const BASE="https://graph.microsoft.com/v1.0";
  const PORTEES=["User.Read","User.Read.All","Sites.ReadWrite.All"].concat(CFG.notifications?["Mail.Send"]:[]);
  let pca, compte, siteId;
  function charger(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error("Fichier msal-browser.min.js introuvable à côté de index.html."));document.head.append(s)})}
  async function jeton(portees){
    try{return (await pca.acquireTokenSilent({scopes:portees,account:compte})).accessToken}
    catch(e){await pca.acquireTokenRedirect({scopes:portees,account:compte});throw new Error("redirection")}
  }
  async function g(chemin,opt,portees){
    const t=await jeton(portees||PORTEES); opt=opt||{};
    const r=await fetch(chemin.startsWith("http")?chemin:BASE+chemin,{method:opt.method,body:opt.body,headers:{Authorization:"Bearer "+t,
      "Content-Type":opt.type||"application/json",Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly"}});
    if(r.status===204||r.status===202) return null;
    const j=await r.json().catch(()=>null);
    if(!r.ok){
      const e=new Error(r.status===403?"Accès refusé. Demandez à être ajouté comme membre du site SharePoint.":
        (j&&j.error&&j.error.message)||("Erreur Microsoft "+r.status));
      e.status=r.status; throw e;
    }
    return j;
  }
  async function site(){
    if(!siteId) siteId=(await g(`/sites/${CFG.sharepointHost}:${CFG.sitePath}?$select=id`)).id;
    return siteId;
  }
  const q=s=>String(s).replace(/'/g,"''");
  return {
    demo:false,
    async start(){
      await charger("/kokolio/msal-browser.min.js");
      pca=new msal.PublicClientApplication({
        auth:{clientId:CFG.clientId,authority:"https://login.microsoftonline.com/"+CFG.tenantId,redirectUri:location.origin+location.pathname},
        cache:{cacheLocation:"localStorage"}});
      await pca.initialize();
      const rep=await pca.handleRedirectPromise();
      compte=(rep&&rep.account)||pca.getActiveAccount()||pca.getAllAccounts()[0];
      if(!compte) return null;
      pca.setActiveAccount(compte);
      const moi={email:compte.username.toLowerCase(),name:compte.name||compte.username,managerEmail:""};
      try{
        const m=await g("/me/manager?$select=displayName,userPrincipalName");
        moi.managerEmail=(m.userPrincipalName||"").toLowerCase();
      }catch(e){ if(e.message==="redirection") throw e; }
      return moi;
    },
    async login(){await pca.loginRedirect({scopes:PORTEES})},
    async logout(){await pca.logoutRedirect({account:compte})},
    async query(list,f){
      const id=await site();
      const filtre=Object.entries(f||{}).map(([k,v])=>`fields/${k} eq '${q(v)}'`).join(" and ");
      let url=`/sites/${id}/lists/${list}/items?$expand=fields&$top=200`+(filtre?"&$filter="+encodeURIComponent(filtre):"");
      const out=[];
      while(url){const j=await g(url);for(const it of j.value) out.push({...it.fields,id:it.id});url=j["@odata.nextLink"]||null;}
      return out;
    },
    async add(list,fields){const id=await site();const it=await g(`/sites/${id}/lists/${list}/items`,{method:"POST",body:JSON.stringify({fields})});return {...it.fields,id:it.id}},
    async patch(list,idItem,fields){const id=await site();await g(`/sites/${id}/lists/${list}/items/${idItem}/fields`,{method:"PATCH",body:JSON.stringify(fields)})},
    async upload(file){
      const id=await site(); const nom=Date.now()+"-"+file.name.replace(/[^\w.\-]+/g,"_");
      const it=await g(`/sites/${id}/drive/root:/Justificatifs/${encodeURIComponent(nom)}:/content`,{method:"PUT",body:file,type:file.type||"application/octet-stream"});
      return {name:file.name,url:(it&&it.webUrl)||""};
    },
    async notify(a,sujet,texte){
      if(!CFG.notifications||!a) return "";
      await g("/me/sendMail",{method:"POST",body:JSON.stringify({message:{subject:sujet,body:{contentType:"Text",content:texte+"\n\n"+location.origin+location.pathname},
        toRecipients:[{emailAddress:{address:a}}]},saveToSentItems:false})});
      return "envoye";
    },
    async installer(){ // crée les listes manquantes ; réservé à un propriétaire du site
      const id=await site(); const P=["User.Read","Sites.Manage.All"];
      const txt=n=>({name:n,text:{},indexed:true}), long=n=>({name:n,text:{allowMultipleLines:true}}), nb=n=>({name:n,number:{}});
      const defs={
        [L_P]:[txt("EmployeEmail"),txt("EmployeNom"),txt("Jour"),txt("Mois"),long("Heures"),nb("Minutes"),txt("ManagerEmail"),txt("Statut"),txt("Corrige"),txt("Lieu"),txt("Activite"),long("Commentaire"),long("MotifRefus"),txt("ValidePar")],
        [L_A]:[txt("EmployeEmail"),txt("EmployeNom"),txt("Motif"),txt("Debut"),txt("Fin"),txt("DemiJournee"),nb("Jours"),long("Commentaire"),txt("ManagerEmail"),txt("Statut"),long("MotifRefus"),txt("ValidePar"),txt("JustificatifNom"),long("JustificatifUrl")],
        [L_S]:[txt("EmployeEmail"),txt("EmployeNom"),txt("Equipe"),txt("Contrat"),txt("DateEntree"),nb("HeuresHebdo"),txt("JoursTravailles"),nb("PauseMin"),nb("SoldeCP"),nb("SoldeRTT"),txt("Matricule"),txt("ManagerEmail"),txt("Delegue")],
        [L_PL]:[txt("EmployeEmail"),txt("ManagerEmail"),txt("Semaine"),long("Affectations")],
        [L_C]:[txt("Mois"),txt("Statut"),txt("CloturePar")],
        [L_J]:[txt("Date"),txt("Auteur"),txt("Action"),txt("Cible"),long("Detail")]
      };
      for(const [nom,columns] of Object.entries(defs)){
        try{await g(`/sites/${id}/lists/${nom}?$select=id`)}
        catch(e){ if(e.status!==404) throw e;
          await g(`/sites/${id}/lists`,{method:"POST",body:JSON.stringify({displayName:nom,columns,list:{template:"genericList"}})},P); }
      }
    }
  };
}

function classer(f,jour,it,abs){
  const a=absLe(abs,jour), att=!a&&absLe(abs,jour,["En attente"]), fer=ferieLe(jour), auj=today();
  if(a&&estTravaille(f,jour)){const [c,k]=codeAbs(a.Motif);return {code:a.DemiJournee?"½"+c:c,cls:k,texte:a.Motif+(a.DemiJournee?" ("+a.DemiJournee.toLowerCase()+")":""),cat:c}}
  if(fer) return {code:"F",cls:"k-f",texte:"Férié : "+fer,cat:"F"};
  if(it){const tt=it.Lieu==="Télétravail";return {code:tt?"TT":"T",cls:tt?"k-tt":"k-t",texte:(tt?"Télétravail":"Travaillé")+" · "+paires(heuresDe(it))+" · "+fmtMin(minDe(it,f)),cat:tt?"TT":"T"}}
  if(!joursTrav(f).has(dateDe(jour).getDay())) return {code:"",cls:"k-we",texte:"Jour non travaillé",cat:""};
  if(att) return {code:"?",cls:"k-att",texte:att.Motif+" (demande en attente)",cat:"?"};
  if(jour<auj) return {code:"!",cls:"k-an",texte:"Aucun pointage ni absence",cat:"!"};

}

  const item=e=>S.plan.find(p=>p.EmployeEmail===e&&p.Semaine===lun);

    const it=item(f.EmployeEmail), champs={Affectations:JSON.stringify(aff)};
    if(it){await store.patch(L_PL,it.id,champs);it.Affectations=champs.Affectations}
    else S.plan.push(await store.add(L_PL,{Title:f.EmployeEmail+" "+lun,EmployeEmail:f.EmployeEmail,ManagerEmail:f.ManagerEmail,Semaine:lun,...champs}));

        h("thead",null,h("tr",null,h("th",null,"Salarié"),jours.map(j=>h("th",{class:"c"},dateDe(j).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"}))))),

  const [lMg,mg]=ch("ManagerEmail","Responsable (identifiant Microsoft)",{type:"email"});

  const set=joursTrav(f), coches=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map((n,i)=>{const v=(i+1)%7;return [v,h("input",{type:"checkbox",id:"f-j"+v,checked:set.has(v)}),n]});
  ouvrir("Fiche de "+f.EmployeNom,h("div",{class:"pile"},
    h("div",{class:"grille2"},lEq,lMa),h("div",{class:"grille2"},h("label",null,"Contrat",contrat),lEn),h("div",{class:"grille2"},lHe,lPa),
    h("div",null,h("div",{class:"discret"},"Jours travaillés"),h("div",{class:"ligne",style:"justify-content:flex-start"},coches.map(([v,c,n])=>h("label",{class:"coche"},c,n)))),
    h("div",{class:"grille2"},lCp,lRt),lMg),"Enregistrer",async()=>{
      const jt=coches.filter(([v,c])=>c.checked).map(([v])=>v); if(!jt.length) throw new Error("Cochez au moins un jour travaillé.");
      const champs={Equipe:eq.value.trim(),Matricule:ma.value.trim(),DateEntree:en.value,Contrat:contrat.value,HeuresHebdo:+he.value||35,PauseMin:+pa.value||0,
        JoursTravailles:jt.join(","),SoldeCP:+cp.value||0,SoldeRTT:+rt.value||0,ManagerEmail:mg.value.trim().toLowerCase()};
      await store.patch(L_S,f.id,champs); Object.assign(f,champs); if(f.EmployeEmail===S.moi.email) Object.assign(S.fiche,champs);
      await journal("Modification de fiche",f.EmployeNom,Object.entries(champs).map(([k,v])=>k+"="+v).join(" ; "));
      S.synth=null; afficher(); toast("Fiche enregistrée.");
    });
}

/* --- Journal --- */
function vueJournal(barre){
  if(!S.journal){
    pose(barre,h("p",{class:"discret"},"Chargement…"));
    store.query(L_J,{}).then(j=>{S.journal=j.sort((a,b)=>String(b.Date).localeCompare(String(a.Date))).slice(0,200);if(S.onglet==="equipe"&&S.sous==="journal") afficher()})
      .catch(e=>pose(barre,h("div",{class:"bandeau refus"},e.message)));
    return;
  }
  pose(barre,h("div",{class:"carte"},h("p",{class:"discret"},"Les 200 dernières actions : validations, refus, corrections, fiches, clôtures."),
    S.journal.length?h("div",null,S.journal.map(j=>h("div",{class:"jour"},
      h("div",null,h("strong",null,j.Action)," · "+(j.Cible||"")),
      h("div",{class:"num discret"},new Date(j.Date).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})),
      h("div",{class:"discret note"},"Par "+j.Auteur+(j.Detail?" · "+j.Detail:""))))):h("p",{class:"discret"},"Journal vide.")));
}

demarrer();
</script>
